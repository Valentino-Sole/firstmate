<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><title>W035 · Aschestreuer / Funkenwanderung</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#B6DDD0"/></marker><marker id="goldarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#D6AD64"/></marker></defs><rect width="1200" height="660" fill="#10262C"/><g font-family="Segoe UI,Arial,sans-serif" fill="#F1E3C8"><text x="32" y="42" font-size="27" font-weight="700">W035 · Aschestreuer / Funkenwanderung</text><text x="32" y="74" font-size="17" fill="#AEC0B9">Technisches Effekt-Storyboard · schematisch, nicht maßstäblich · kein Spriteatlas</text><rect x="24" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="39" y="123" font-size="18" fill="#D6AD64">1 · AUSLÖSER</text><g transform="translate(29 128)"><circle cx="48" cy="88" r="20" fill="#D6AD64"/><circle cx="280" cy="88" r="17" fill="#E87768"/><path d="M78 88H252" stroke="#B6DDD0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/></g><text x="39" y="298" font-size="13">first_burning_primary_target_per_activation</text><rect x="414" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="429" y="123" font-size="18" fill="#D6AD64">2 · SICHTBARE WIRKUNG</text><g transform="translate(419 128)"><circle cx="48" cy="105" r="20" fill="#D6AD64"/><circle cx="280" cy="87" r="17" fill="#E87768"/><circle cx="327" cy="120" r="14" fill="#E87768" opacity=".6"/><path d="M55 105H264" stroke="#B6DDD0" stroke-width="5" marker-end="url(#arrow)"/><circle cx="324" cy="38" r="14" fill="#E87768"/><path d="M281 84L322 39M281 91L324 117" stroke="#BD9DC1" stroke-width="4" stroke-dasharray="7 5"/></g><text x="429" y="298" font-size="13">Funkenwanderung</text><rect x="804" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="819" y="123" font-size="18" fill="#D6AD64">3 · AUFLÖSUNG</text><g transform="translate(809 128)"><circle cx="160" cy="80" r="43" fill="none" stroke="#657571" stroke-width="4"/><path d="M160 44V80L186 91" fill="none" stroke="#B6DDD0" stroke-width="5"/><text x="224" y="87" font-size="20">kein Folgetrigger</text></g><text x="819" y="298" font-size="13">Grenzen und Dauer gemäß Regel unten</text><text x="32" y="352" font-size="19">REGEL</text><text x="32" y="377" font-size="19">Pro Aktivierung beim ersten Haupttreffer auf ein bereits brennendes Ziel: Entzünde bis zu drei nächste</text><text x="32" y="402" font-size="19">andere Gegner innerhalb 120 Einheiten für 2 s mit vier Ticks je 0,1 D des Aschestreuers. Die Quelle</text><text x="32" y="427" font-size="19">selbst erhält keinen neuen Brand. Gibt es kein brennendes Hauptziel, keine Ausbreitung.</text><text x="32" y="452" font-size="19">SICHTBARER EFFEKT</text><text x="32" y="477" font-size="19">Bis zu drei goldene Aschefunken springen in klaren Bögen zu Nachbarn; Flugspuren sind rein dekorativ und</text><text x="32" y="502" font-size="19">verursachen keine Streifentreffer.</text><text x="32" y="640" font-size="15" fill="#AEC0B9">Goldkreis = Knorz · Korallkreis = Gegner · Mint = Heldeneffekt · verbindliche Maße: JSON + Regeltext</text></g></svg>