<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><title>W032 · Sekundendorn / Fällige Sekunde</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#B6DDD0"/></marker><marker id="goldarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#D6AD64"/></marker></defs><rect width="1200" height="660" fill="#10262C"/><g font-family="Segoe UI,Arial,sans-serif" fill="#F1E3C8"><text x="32" y="42" font-size="27" font-weight="700">W032 · Sekundendorn / Fällige Sekunde</text><text x="32" y="74" font-size="17" fill="#AEC0B9">Technisches Effekt-Storyboard · schematisch, nicht maßstäblich · kein Spriteatlas</text><rect x="24" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="39" y="123" font-size="18" fill="#D6AD64">1 · AUSLÖSER</text><g transform="translate(29 128)"><circle cx="48" cy="88" r="20" fill="#D6AD64"/><circle cx="280" cy="88" r="17" fill="#E87768"/><path d="M78 88H252" stroke="#B6DDD0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/></g><text x="39" y="298" font-size="13">primary_hit</text><rect x="414" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="429" y="123" font-size="18" fill="#D6AD64">2 · SICHTBARE WIRKUNG</text><g transform="translate(419 128)"><circle cx="48" cy="105" r="20" fill="#D6AD64"/><circle cx="280" cy="87" r="17" fill="#E87768"/><circle cx="327" cy="120" r="14" fill="#E87768" opacity=".6"/><path d="M55 105H264" stroke="#B6DDD0" stroke-width="5" marker-end="url(#arrow)"/><path d="M280 17V37L293 44" fill="none" stroke="#D6AD64" stroke-width="5" stroke-linecap="round"/></g><text x="429" y="298" font-size="13">Fällige Sekunde</text><rect x="804" y="95" width="377" height="223" rx="14" fill="#19373D" stroke="#657571"/><text x="819" y="123" font-size="18" fill="#D6AD64">3 · AUFLÖSUNG</text><g transform="translate(809 128)"><circle cx="160" cy="80" r="43" fill="none" stroke="#657571" stroke-width="4"/><path d="M160 44V80L186 91" fill="none" stroke="#B6DDD0" stroke-width="5"/><text x="224" y="87" font-size="20">kein Folgetrigger</text></g><text x="819" y="298" font-size="13">Grenzen und Dauer gemäß Regel unten</text><text x="32" y="352" font-size="19">REGEL</text><text x="32" y="377" font-size="19">Setze eine 2-s-Zeitmarke. Nach Ablauf erleidet das noch lebende Ziel einmal 0,75 D, beim Setzen</text><text x="32" y="402" font-size="19">gespeichert. Solange diese Instanz dort eine Marke hat, weitere Treffer ohne Erneuerung ignorieren. Tod</text><text x="32" y="427" font-size="19">entfernt die Marke ohne Flächeneffekt. Andere Instanzen dürfen eigene Marken setzen.</text><text x="32" y="452" font-size="19">SICHTBARER EFFEKT</text><text x="32" y="477" font-size="19">Ein halbkreisförmiges Uhrzeichen schließt sich über 2 s; beim Schließen ein kurzer gerader Lichtstich.</text><text x="32" y="640" font-size="15" fill="#AEC0B9">Goldkreis = Knorz · Korallkreis = Gegner · Mint = Heldeneffekt · verbindliche Maße: JSON + Regeltext</text></g></svg>