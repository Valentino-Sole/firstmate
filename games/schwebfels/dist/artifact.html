        tent.rotation.y = PI / 4 + PI;
        room.add(tent);
      } else if (tier === 3) {
        const wall = new T.Mesh(new T.CylinderGeometry(4.2, 4.2, 4.2, 18, 1, true, PI * 0.5, PI), tiled("stone", "#5e5a54", 6, 2, { side: T.DoubleSide }));
        wall.position.y = 2.1;
        room.add(wall);
        const win = new T.Mesh(new T.PlaneGeometry(1.0, 1.8), new T.MeshBasicMaterial({ color: col("#3a5a9a") }));
        win.position.set(0, 2.5, -4.1);
        room.add(win);
        room.add(R.haloSprite("#8fb8ff", 2.5, 0.4, [0, 2.5, -3.9]));
      } else {
        const wm = tier === 1 ? tiled("stone", "#6a665e", 3, 2) : tiled("wood", "#4a3424", 4, 2);
        room.add(mesh(G.box(6.0, 3.6, 0.3), wm, { p: [0, 1.8, -2.9] }));
        room.add(mesh(G.box(0.3, 3.6, 5.2), wm, { p: [-3.0, 1.8, -0.4] }));
        if (tier === 2) for (const x of [-2.0, 0, 2.0]) room.add(mesh(G.box(0.25, 3.6, 0.3), pm("wood", "#2a1e16"), { p: [x, 1.8, -2.7] }));
        const win = mesh(G.box(0.9, 0.8, 0.1), new T.MeshLambertMaterial({ color: col("#1a2a4a"), emissive: col("#3a5a9a"), emissiveIntensity: 0.6 }), { p: [1.6, 2.2, -2.72] });
        room.add(win);
      }
      // Teppich
      if (tier >= 1) {
        const RM = SB.data.REALMS[state.realm] || SB.data.REALMS.albion;
        room.add(mesh(G.box(2.4, 0.02, 1.6), pm("cloth", RM.dark), { p: [0, 0.01, 0.2] }));
      }
      for (const f of SB.data.FURNITURE) {
        const lvl = state.furn[f.id];
        if (lvl == null || lvl < 0) continue;
        const sp = HOME_SPOTS[f.id];
        const obj = furniture(f.id, Math.min(lvl, f.levels.length - 1), state.realm, state.hero);
        obj.position.set(sp[0], 0, sp[1]);
        obj.rotation.y = sp[2];
        room.add(obj);
        const bb = new T.Box3().setFromObject(obj);
        const hit = new T.Mesh(new T.BoxGeometry(...bb.getSize(new T.Vector3()).toArray().map((v) => v + 0.2)), new T.MeshBasicMaterial({ visible: false }));
        hit.position.copy(bb.getCenter(new T.Vector3()));
        hit.userData.fid = f.id;
        room.add(hit);
        pickables.push(hit);
      }
      room.traverse((o) => {
        if (o.isMesh) o.receiveShadow = true;
      });
      scene.add(room);
    }
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    const canvas = renderer.domElement;
    let rot = 0;
    let goalRot = 0;
    let dragX = null;
    let moved = 0;
    canvas.addEventListener("pointerdown", (e) => {
      dragX = e.clientX;
      moved = 0;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (dragX == null) return;
      moved += Math.abs(e.clientX - dragX);
      goalRot = Math.max(-0.7, Math.min(0.7, goalRot + (e.clientX - dragX) * 0.006));
      dragX = e.clientX;
    });
    canvas.addEventListener("pointerup", (e) => {
      dragX = null;
      if (moved > 6 || !opts.onPick) return;
      const rect = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects(pickables, false);
      if (hits.length) opts.onPick(hits[0].object.userData.fid);
    });
    let raf = 0;
    let last = performance.now();
    function resize() {
      const w = Math.max(1, el.clientWidth);
      const h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      camera.fov = w / h < 1 ? 55 : 38;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      const t = now / 1000;
      rot += (goalRot - rot) * Math.min(1, dt * 6);
      const d = 9.5;
      camera.position.set(Math.sin(rot + 0.35) * d, 4.6, Math.cos(rot + 0.35) * d);
      camera.lookAt(0, 0.9, -0.3);
      key.intensity = 26 + Math.sin(t * 9) * 2 + Math.random() * 2;
      if (room)
        room.traverse((o) => {
          if (o.userData.flick) o.scale.y = 1 + Math.sin(t * 13 + o.userData.flick) * 0.15;
        });
      if (hero) hero.update(dt);
      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);
    return {
      update(s) {
        state = Object.assign({}, state, s);
        build();
        if (s.hero) {
          if (hero) scene.remove(hero.obj);
          hero = R.buildHero(s.hero);
          hero.obj.position.set(0.2, 0, 0.6);
          hero.obj.rotation.y = 0.3;
          scene.add(hero.obj);
        }
      },
      cheer() {
        if (hero) hero.play("victory", 1.2);
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        killRenderer(renderer);
      },
    };
  };

  /* ---------- Portraits ---------- */
  let snapR = null;
  let snapScene = null;
  let snapCam = null;
  const snapCache = new Map();
  R.snapshot = function (desc, size, bust) {
    if (!R.ready()) return null;
    init();
    size = size || 160;
    const key = JSON.stringify(desc) + "|" + size + "|" + (bust ? 1 : 0);
    if (snapCache.has(key)) return snapCache.get(key);
    try {
      if (!snapR) {
        snapR = makeRenderer(null, { alpha: true, preserve: true, maxDpr: 1, exposure: 1.15 });
        snapScene = new T.Scene();
        snapScene.add(new T.HemisphereLight("#e6ecff", "#3a3028", 1.3));
        const k = new T.DirectionalLight("#fff0d8", 2.4);
        k.position.set(3, 5, 5);
        snapScene.add(k);
        const r2 = new T.DirectionalLight("#8fb8ff", 1.5);
        r2.position.set(-4, 3, -3);
        snapScene.add(r2);
        snapCam = new T.PerspectiveCamera(30, 1, 0.1, 100);
      }
      snapR.setSize(size, size, false);
      const model = R.buildFighter(desc);
      model.update(0.016);
      model.obj.rotation.y = desc.kind === "monster" ? 0.5 : 0.3;
      snapScene.add(model.obj);
      const box3 = new T.Box3().setFromObject(model.obj);
      const c = box3.getCenter(new T.Vector3());
      const sz = box3.getSize(new T.Vector3());
      let span = Math.max(sz.y, sz.x * 0.9);
      if (bust) {
        span = Math.max(sz.y * 0.42, 0.9);
        c.y = (model.headY || box3.max.y - span * 0.5) - span * 0.12;
      }
      const dist = (span / (2 * Math.tan((30 * PI) / 360))) * 1.1;
      snapCam.position.set(c.x, c.y + span * 0.06, c.z + dist + sz.z * 0.3);
      snapCam.lookAt(c.x, c.y, c.z);
      snapR.setClearColor(0x000000, 0);
      snapR.render(snapScene, snapCam);
      const url = snapR.domElement.toDataURL("image/png");
      snapScene.remove(model.obj);
      snapCache.set(key, url);
      if (snapCache.size > 400) snapCache.delete(snapCache.keys().next().value);
      return url;
    } catch (e) {
      console.warn("Portrait fehlgeschlagen", e);
      return null;
    }
  };

  /* ---------- Kampfbuehne ---------- */
  const SPECIAL_FX = {
    schildbrecher: { color: "#ffd27a", kind: "shock" },
    kehlschnitt: { color: "#ff3a3a", kind: "slash" },
    pfeilhagel: { color: "#ffe9b0", kind: "arrows" },
    sonnenlanze: { color: "#ffd27a", kind: "beam" },
    blutrausch: { color: "#ff3a2a", kind: "aura" },
    giftklinge: { color: "#7fff5a", kind: "slash" },
    frostpfeil: { color: "#9fe3ff", kind: "arrow" },
    runensturm: { color: "#9fd8ff", kind: "orbs" },
    lebenssaft: { color: "#7fffb0", kind: "roots" },
    schattentanz: { color: "#b48cff", kind: "smoke" },
    mondpfeil: { color: "#e6ecff", kind: "arrow" },
    wurzelgriff: { color: "#7fffb0", kind: "roots" },
    zermalmen: { color: "#ffb050", kind: "shock" },
    raserei: { color: "#ff5a3d", kind: "aura" },
    fluch: { color: "#c47bff", kind: "orbs" },
  };
  const SETTINGS = {
    quest: { t: 0.71, grass: "#3a5038", grass2: "#4e5a36", dirt: "#5a4c3c", rock: "#5a5650", props: "forest" },
    arena: { t: 0.6, grass: "#6a5e48", grass2: "#7a6a50", dirt: "#7a6a50", rock: "#6a645a", props: "arena" },
    dungeon: { t: 0.0, grass: "#2e2a36", grass2: "#3a3444", dirt: "#2a2630", rock: "#2a2633", props: "cave" },
    story: { t: 0.92, grass: "#34483a", grass2: "#44503a", dirt: "#4a4438", rock: "#55524c", props: "stones" },
  };
  R.createBattle = function (el, opts) {
    init();
    opts = opts || {};
    const renderer = makeRenderer(el, { maxDpr: 2, exposure: 1.15 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(36, 1, 0.1, 500);
    const setting = SETTINGS[opts.setting] ? opts.setting : "quest";
    const S = SETTINGS[setting];
    const rng = R.rng(setting.length * 17 + 3);
    const sky = skyDome();
    scene.add(sky);
    scene.fog = new T.Fog("#22283a", 22, 90);
    const hemi = new T.HemisphereLight("#d8e2ee", "#3a3028", 1);
    scene.add(hemi);
    const sun = new T.DirectionalLight("#ffe9c8", 2);
    sun.position.set(4, 9, 6);
    scene.add(sun);
    const front = new T.DirectionalLight("#fff4e6", setting === "dungeon" ? 0.9 : 1.1);
    front.position.set(0, 4, 12);
    scene.add(front);
    const N = nightMats();
    const info = R.dayInfo(setting === "dungeon" ? 0.02 : opts.dayTime != null ? opts.dayTime : S.t);
    const P = palette(info);
    if (setting === "dungeon") {
      const tint = col(opts.tint || "#8f7cff");
      sky.userData.recolor(col("#05040a"), tint.clone().multiplyScalar(0.18), col("#020205"));
      scene.fog.color.copy(tint.clone().multiplyScalar(0.12));
      hemi.color.copy(tint.clone().lerp(col("#ffffff"), 0.5));
      hemi.groundColor.set("#0a0810");
      hemi.intensity = 0.55;
      sun.color.copy(tint.clone().lerp(col("#ffffff"), 0.4));
      sun.intensity = 0.9;
    } else {
      sky.userData.recolor(P.top, P.bot, col("#0a0d18").lerp(P.fog, 0.4));
      scene.fog.color.copy(P.fog);
      hemi.color.copy(P.hemiSky);
      hemi.groundColor.copy(P.hemiGround);
      hemi.intensity = P.hemiI + 0.25;
      sun.color.copy(P.sun);
      sun.intensity = P.sunI + 0.3;
    }
    N.win.emissiveIntensity = 0.3 + info.night;
    const stars = starField(rng, 500);
    stars.material.opacity = setting === "dungeon" ? 0 : Math.max(0, info.night - 0.2);
    scene.add(stars);
    const aur = aurora();
    scene.add(aur);
    if (setting !== "dungeon") {
      const sea = cloudSea(-16, 260);
      sea.material.color.copy(P.bot);
      scene.add(sea);
    }
    const stage = island(8, 7, rng, { grass: S.grass, grass2: S.grass2, dirt: S.dirt, rock: S.rock, plaza: [0, 0.4, 6], hills: 0.6, vineGlow: setting === "dungeon" ? opts.tint || "#8f7cff" : "#7fffc8" });
    scene.add(stage);
    const flickers = [];
    const extras = [];
    if (S.props === "arena") {
      const wall = new T.CylinderGeometry(9, 9.4, 2.6, 40, 1, true, PI * 0.42, PI * 1.16);
      scene.add(mesh(wall, tiled("stone", "#6a645a", 8, 1, { side: T.DoubleSide, flatShading: true }), { p: [0, 1.3, 0] }));
      const realms = ["albion", "midgard", "hibernia"];
      for (let i = 0; i < 3; i++) {
        const x = -6 + i * 6;
        const RM = SB.data.REALMS[realms[i]];
        const p = grp([x, 0, -6.5]);
        p.add(mesh(G.cyl(0.1, 0.12, 6, 6), pm("metal", "#2a2a30"), { p: [0, 3, 0] }));
        const bn = new T.Mesh(new T.PlaneGeometry(1.4, 2.4, 1, 6), R.crestMat(realms[i], RM.color, RM.trim));
        bn.position.set(0.75, 4.6, 0);
        p.add(bn);
        extras.push(bn);
        scene.add(p);
      }
      for (const x of [-7, 7]) {
        const br = grp([x, 0, -2]);
        br.add(mesh(G.cyl(0.1, 0.14, 1.6, 6), pm("metal", "#2a2a30"), { p: [0, 0.8, 0] }));
        br.add(mesh(G.cyl(0.45, 0.22, 0.4, 8), pm("metal", "#2a2a30"), { p: [0, 1.7, 0] }));
        const f = fire(N, 1.3);
        f.position.y = 1.85;
        br.add(f);
        const pl = new T.PointLight("#ff9a3d", 14, 12, 1.6);
        pl.position.set(0, 2.4, 0.5);
        br.add(pl);
        flickers.push(pl);
        scene.add(br);
      }
    } else if (S.props === "cave") {
      const tint = opts.tint || "#8f7cff";
      for (const x of [-6, 6]) {
        const p = grp([x, 0, -3.5]);
        p.add(mesh(G.box(1.0, 5.5, 1.0), pm("stone", "#2e2a38", { flat: true }), { p: [0, 2.75, 0] }));
        p.add(mesh(G.cyl(0.3, 0.2, 0.3, 6), pm("metal", "#2a2a30"), { p: [0, 4.2, 0.6] }));
        const f = fire(N, 0.9);
        f.position.set(0, 4.35, 0.6);
        p.add(f);
        const pl = new T.PointLight("#ff9a3d", 14, 14, 1.5);
        pl.position.set(0, 4.6, 1);
        p.add(pl);
        flickers.push(pl);
        scene.add(p);
      }
      for (let i = 0; i < 8; i++) {
        const c = crystals(rng, tint);
        c.position.set(-7 + rng() * 14, 0, -2.5 - rng() * 3.5);
        c.scale.setScalar(1 + rng());
        scene.add(c);
      }
      for (let i = 0; i < 10; i++) scene.add(mesh(G.cone(0.5 + rng() * 0.6, 3 + rng() * 4, 6), pm("stone", "#26222e", { flat: true }), { p: [-10 + rng() * 20, 10 + rng() * 2, -5 - rng() * 6], r: [PI, 0, 0] }));
    } else if (S.props === "stones") {
      for (let i = 0; i < 7; i++) {
        const a = PI * 0.15 + (i / 6) * PI * 0.7;
        const s = standingStone(rng, 2.4 + rng(), ["#e8c35a", "#9fd8ff", "#7fffb0"][i % 3]);
        s.position.set(-Math.cos(a) * 7.2, 0, -Math.sin(a) * 5.5);
        s.rotation.y = a;
        scene.add(s);
      }
    } else {
      for (let i = 0; i < 7; i++) {
        const tr = i % 3 === 0 ? pine(rng) : gnarledTree(rng);
        tr.position.set(-7 + i * 2.3 + rng(), 0, -4 - rng() * 2);
        scene.add(tr);
      }
      for (let i = 0; i < 6; i++) {
        const s = i % 2 ? shrooms(rng) : rock(rng);
        s.position.set(-6 + rng() * 12, 0.05, -1.5 - rng() * 2.5);
        scene.add(s);
      }
    }
    const flies = fireflies(rng, 50, 8, 0.4, 3.5, setting === "dungeon" ? opts.tint || "#c47bff" : "#d9ff8a");
    scene.add(flies);
    const wisps = mistWisps(rng, 8, 9, 0.2);
    scene.add(wisps);

    // Kaempfer
    const overlay = document.createElement("div");
    overlay.className = "battle-fx";
    el.appendChild(overlay);
    const portrait = el.clientWidth < el.clientHeight;
    const sep = portrait ? 2.5 : 2.8;
    function makeFighter(desc, i) {
      const m = R.buildFighter(desc);
      const side = i === 0 ? -1 : 1;
      const home = new T.Vector3(side * sep, 0, 0.4);
      m.obj.position.copy(home);
      m.obj.rotation.y = side < 0 ? PI / 2 - 0.5 : -PI / 2 + 0.5;
      const box3 = new T.Box3().setFromObject(m.obj);
      const hgt = box3.max.y - box3.min.y;
      if (hgt > 3.8) {
        const s = 3.8 / hgt;
        m.obj.scale.multiplyScalar(s);
        m.headY *= s;
      }
      const sh = new T.Mesh(new T.CircleGeometry(1, 24), basic("#000000", 0.3));
      sh.rotation.x = -PI / 2;
      sh.position.set(home.x, 0.03, home.z);
      sh.scale.setScalar(desc.kind === "monster" && (desc.arch === "drache" || desc.arch === "golem" || desc.arch === "troll" || desc.arch === "spinne") ? 1.5 : 0.9);
      scene.add(sh);
      scene.add(m.obj);
      return { m, home, side, shadow: sh, desc };
    }
    const F = [makeFighter(opts.left, 0), makeFighter(opts.right, 1)];

    let speed = 1;
    let w = 1;
    let h = 1;
    let shake = 0;
    let zoom = 0;
    const camBase = new T.Vector3(0, 2.7, 9.0);
    const lookY = 1.45;
    const tweens = [];
    function resize() {
      w = Math.max(1, el.clientWidth);
      h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      camera.fov = w / h < 1 ? 50 : 36;
      const halfW = sep + (portrait ? 1.2 : 1.7);
      const tanH = Math.tan((camera.fov * PI) / 360) * camera.aspect;
      camBase.z = Math.max(9.0, halfW / tanH);
      camBase.y = 2.7 + (camBase.z - 9) * 0.1;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();
    let raf = 0;
    let last = performance.now();
    const fx = [];
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      const t = now / 1000;
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        tw.t += dt * speed;
        const u = Math.max(0, Math.min(1, tw.t / tw.dur));
        tw.fn(u);
        if (u >= 1) {
          tweens.splice(i, 1);
          tw.res();
        }
      }
      for (const f of F) {
        f.m.speed = speed;
        f.m.update(dt * speed);
        f.shadow.position.x = f.m.obj.position.x;
        if (f.aura) f.aura.position.copy(f.m.obj.position);
        if (f.poisonFx) {
          f.poisonFx.position.set(f.m.obj.position.x, (f.m.headY || 1.8) + 0.2, f.m.obj.position.z);
          f.poisonFx.rotation.y += dt * 2;
        }
      }
      for (const c of flickers) c.intensity = 12 + Math.sin(t * 13 + c.position.x) * 2 + Math.random() * 2;
      for (const e of extras) e.rotation.y = Math.sin(t * 2 + e.position.x) * 0.2;
      scene.traverse((o) => {
        if (o.userData.flick) o.scale.y = 1 + Math.sin(t * 13 + o.userData.flick) * 0.15;
      });
      flies.userData.update(t, setting === "dungeon" ? 0.9 : 0.3 + 0.6 * info.night);
      wisps.userData.update(dt, scene.fog.color, 0.12);
      aur.userData.update(t, setting === "dungeon" ? 0 : smooth(0.5, 0.95, info.night) * 0.7);
      camera.position.copy(camBase);
      camera.position.z -= zoom * 1.6;
      camera.position.y -= zoom * 0.3;
      zoom = Math.max(0, zoom - dt * 1.2);
      if (shake > 0) {
        shake -= dt;
        camera.position.x += (Math.random() - 0.5) * 0.28;
        camera.position.y += (Math.random() - 0.5) * 0.28;
      }
      camera.lookAt(0, lookY, 0);
      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);

    const tween = (dur, fn) => new Promise((res) => tweens.push({ t: 0, dur, fn, res }));
    const wait = (dur) => tween(dur, () => {});
    const tmp = new T.Vector3();
    function screenPos(f, yOff) {
      tmp.set(f.m.obj.position.x, (f.m.headY || 1.8) + (yOff || 0.3), f.m.obj.position.z);
      tmp.project(camera);
      return { x: (tmp.x * 0.5 + 0.5) * w, y: (-tmp.y * 0.5 + 0.5) * h };
    }
    function floatText(f, text, cls) {
      const p = screenPos(f, 0.35);
      const d = document.createElement("div");
      d.className = "fx-text " + (cls || "");
      d.textContent = text;
      d.style.left = p.x + (Math.random() - 0.5) * 30 + "px";
      d.style.top = p.y + "px";
      d.style.animationDuration = 1.1 / Math.sqrt(speed) + "s";
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 1400);
    }
    function banner(text, side) {
      const d = document.createElement("div");
      d.className = "fx-banner " + (side < 0 ? "left" : "right");
      d.textContent = text;
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 1300 / speed + 200);
    }
    function spark(color, size) {
      const s = new T.Sprite(new T.SpriteMaterial({ map: dot(), color: col(color), transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
      s.scale.setScalar(size || 0.3);
      return s;
    }
    function burst(pos, color, n, spread, up) {
      const parts = [];
      for (let i = 0; i < n; i++) {
        const p = spark(color, 0.2 + Math.random() * 0.25);
        p.position.copy(pos);
        p.userData.v = new T.Vector3((Math.random() - 0.5) * spread, (up || 0) + Math.random() * spread, (Math.random() - 0.5) * spread);
        scene.add(p);
        parts.push(p);
      }
      tween(0.55, (u) => {
        for (const p of parts) {
          p.position.addScaledVector(p.userData.v, 0.03);
          p.userData.v.y -= up ? 0 : 0.08;
          p.material.opacity = 1 - u;
        }
        if (u >= 1) parts.forEach((p) => scene.remove(p));
      });
    }
    function rising(f, color, n) {
      const parts = [];
      for (let i = 0; i < n; i++) {
        const p = spark(color, 0.18 + Math.random() * 0.2);
        p.position.set(f.m.obj.position.x + (Math.random() - 0.5) * 1.0, Math.random() * 0.6, f.m.obj.position.z + (Math.random() - 0.5) * 1.0);
        p.userData.v = 1.5 + Math.random() * 1.5;
        scene.add(p);
        parts.push(p);
      }
      return tween(0.9, (u) => {
        for (const p of parts) {
          p.position.y += p.userData.v * 0.02;
          p.material.opacity = Math.sin(u * PI);
        }
        if (u >= 1) parts.forEach((p) => scene.remove(p));
      });
    }
    function ring(f, color, big) {
      const r = new T.Mesh(G.torus(0.6, 0.06, PI * 2, 6, 40), glow(color, 0.85).clone());
      r.rotation.x = PI / 2;
      r.position.set(f.m.obj.position.x, 0.12, f.m.obj.position.z);
      scene.add(r);
      return tween(big ? 0.6 : 0.45, (u) => {
        r.scale.setScalar(1 + u * (big ? 5 : 3));
        r.material.opacity = 0.85 * (1 - u);
        if (u >= 1) scene.remove(r);
      });
    }
    function slash(f, color, flip) {
      const arc = new T.Mesh(G.torus(0.9, 0.05, PI * 0.9, 4, 24), new T.MeshBasicMaterial({ color: col(color), transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
      arc.position.set(f.m.obj.position.x, (f.m.headY || 1.8) * 0.6, f.m.obj.position.z + 0.6);
      arc.rotation.set(0, 0, flip ? 2.4 : -0.6);
      scene.add(arc);
      return tween(0.25, (u) => {
        arc.rotation.z += (flip ? -1 : 1) * 0.12;
        arc.material.opacity = 1 - u;
        arc.scale.setScalar(0.8 + u * 0.5);
        if (u >= 1) scene.remove(arc);
      });
    }
    function roots(f, color) {
      const g = grp([f.m.obj.position.x, 0, f.m.obj.position.z]);
      const rm = pm("bark", "#4a3a2a");
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * PI * 2;
        const r = mesh(G.cone(0.1, 1.4, 5), rm, { p: [Math.cos(a) * 0.6, 0, Math.sin(a) * 0.6], r: [Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5] });
        g.add(r);
      }
      g.add(R.haloSprite(color, 2.5, 0.6, [0, 0.4, 0]));
      g.scale.set(1, 0.01, 1);
      scene.add(g);
      return tween(0.9, (u) => {
        g.scale.y = u < 0.3 ? u / 0.3 : u > 0.75 ? (1 - u) / 0.25 : 1;
        if (u >= 1) scene.remove(g);
      });
    }
    function beam(A, Bf, color) {
      const from = new T.Vector3(A.m.obj.position.x, (A.m.headY || 1.8) * 0.75, A.m.obj.position.z);
      const to = new T.Vector3(Bf.m.obj.position.x, (Bf.m.headY || 1.8) * 0.6, Bf.m.obj.position.z);
      const len = from.distanceTo(to);
      const bm = new T.Mesh(G.cyl(0.12, 0.12, 1, 10, true), new T.MeshBasicMaterial({ color: col(color), transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
      bm.position.copy(from).lerp(to, 0.5);
      bm.scale.set(1, len, 1);
      bm.lookAt(to);
      bm.rotateX(PI / 2);
      scene.add(bm);
      return tween(0.4, (u) => {
        bm.scale.x = bm.scale.z = 1 + Math.sin(u * PI) * 1.5;
        bm.material.opacity = Math.sin(u * PI);
        if (u >= 1) scene.remove(bm);
      });
    }
    function setAura(f, color) {
      if (f.aura) scene.remove(f.aura);
      f.aura = null;
      if (!color) return;
      const a = grp();
      a.add(R.haloSprite(color, 3.4, 0.35, [0, 1.2, 0]));
      a.add(mesh(G.torus(0.8, 0.03, PI * 2, 4, 40), glow(color, 0.6), { p: [0, 0.08, 0], r: [PI / 2, 0, 0] }));
      scene.add(a);
      f.aura = a;
    }
    function setPoison(f, on) {
      if (f.poisonFx) scene.remove(f.poisonFx);
      f.poisonFx = null;
      if (!on) return;
      const g = grp();
      for (let i = 0; i < 4; i++) {
        const s = spark("#7fff5a", 0.18);
        const a = (i / 4) * PI * 2;
        s.position.set(Math.cos(a) * 0.35, Math.sin(i) * 0.1, Math.sin(a) * 0.35);
        g.add(s);
      }
      scene.add(g);
      f.poisonFx = g;
    }
    function stunStars(f) {
      const s = grp();
      for (let i = 0; i < 3; i++) s.add(mesh(G.octa(0.1), emis("#ffe45a", 1.3), { p: [Math.cos((i * PI * 2) / 3) * 0.45, 0, Math.sin((i * PI * 2) / 3) * 0.45] }));
      s.add(R.haloSprite("#ffe45a", 0.8, 0.4));
      s.position.set(f.m.obj.position.x, (f.m.headY || 1.8) + 0.35, f.m.obj.position.z);
      scene.add(s);
      f.stars = s;
      tween(99, (u) => (s.rotation.y = u * 300));
    }
    function clearStars(f) {
      if (f.stars) {
        scene.remove(f.stars);
        f.stars = null;
      }
    }
    async function projectile(A, Bf, kind, color) {
      const start = new T.Vector3(A.m.obj.position.x + A.side * -0.6, (A.m.headY || 1.8) * 0.68, A.m.obj.position.z);
      const end = new T.Vector3(Bf.m.obj.position.x, (Bf.m.headY || 1.8) * 0.6, Bf.m.obj.position.z);
      let obj;
      if (kind === "arrow" || kind === "spear") {
        obj = grp();
        const L = kind === "spear" ? 1.6 : 1.0;
        obj.add(mesh(G.cyl(0.022, 0.022, L, 5), pm("wood", "#c9b89a"), { r: [0, 0, PI / 2] }));
        obj.add(mesh(G.cone(0.06, 0.2, 5), pm("metal", "#c8ced6"), { p: [L / 2 + 0.08, 0, 0], r: [0, 0, -PI / 2] }));
        obj.add(spark(color, 0.6));
        if (A.side > 0) obj.rotation.y = PI;
      } else {
        obj = grp();
        obj.add(mesh(G.sph(kind === "star" ? 0.3 : 0.18, 12, 10), new T.MeshBasicMaterial({ color: col("#ffffff") })));
        obj.add(spark(color, kind === "star" ? 1.6 : 1.0));
      }
      obj.position.copy(start);
      scene.add(obj);
      const trail = [];
      await tween(kind === "arrow" ? 0.26 : 0.36, (u) => {
        obj.position.lerpVectors(start, end, u);
        obj.position.y += Math.sin(u * PI) * (kind === "arrow" || kind === "spear" ? 0.5 : 0.3);
        if (Math.random() < 0.7) {
          const p = spark(color, kind === "arrow" ? 0.15 : 0.35);
          p.position.copy(obj.position);
          scene.add(p);
          trail.push(p);
        }
        trail.forEach((p) => (p.material.opacity *= 0.88));
      });
      scene.remove(obj);
      trail.forEach((p) => scene.remove(p));
      burst(end, color, kind === "star" ? 18 : 9, kind === "star" ? 3 : 1.6);
    }
    const hp = [opts.hp ? opts.hp[0] : 1, opts.hp ? opts.hp[1] : 1];
    const report = (side, ev, idx) => {
      if (opts.onImpact) opts.onImpact(side, hp[side], ev, idx);
    };
    async function impact(ev, A, Bf, hit, idx) {
      const def = 1 - ev.a;
      if (hit.res === "evade") {
        const dx = Bf.side * 0.7;
        Bf.m.play("evade", 0.4);
        tween(0.4, (u) => (Bf.m.obj.position.x = Bf.home.x + Math.sin(u * PI) * dx));
        floatText(Bf, "Ausgewichen!", "evade");
        if (opts.sfx) opts.sfx("evade");
      } else if (hit.res === "block") {
        Bf.m.play("block", 0.4);
        burst(new T.Vector3(Bf.m.obj.position.x - Bf.side * 0.6, 1.4, Bf.m.obj.position.z), "#ffe27a", 12, 2);
        floatText(Bf, "Geblockt!", "block");
        if (opts.sfx) opts.sfx("block");
      } else {
        hp[def] = Math.max(0, hp[def] - hit.dmg);
        Bf.m.play("hit", 0.35);
        Bf.m.flash(0.08);
        tween(0.3, (u) => (Bf.m.obj.position.x = Bf.home.x + Bf.side * Math.sin(u * PI) * (hit.res === "crit" ? 0.6 : 0.3)));
        floatText(Bf, SB.util.fmt(hit.dmg), hit.res === "crit" ? "crit" : "dmg");
        if (hit.res === "crit") {
          shake = 0.25;
          zoom = Math.max(zoom, 0.6);
          floatText(Bf, "Kritisch!", "critlabel");
        }
        burst(new T.Vector3(Bf.m.obj.position.x, (Bf.m.headY || 1.8) * 0.6, Bf.m.obj.position.z), hit.res === "crit" ? "#ffb13b" : "#ffe8d0", hit.res === "crit" ? 16 : 8, 1.8);
        if (opts.sfx) opts.sfx(hit.res === "crit" ? "crit" : "hit");
      }
      report(def, ev, idx);
    }

    async function play(ev) {
      const A = F[ev.a];
      const Bf = F[1 - ev.a];
      if (ev.kind === "dot") {
        hp[ev.a] = ev.hp ? ev.hp[ev.a] : Math.max(0, hp[ev.a] - ev.dmg);
        A.m.play("hit", 0.35);
        rising(A, "#7fff5a", 8);
        floatText(A, "-" + SB.util.fmt(ev.dmg), "poison");
        if (opts.sfx) opts.sfx("poison");
        report(ev.a, ev, 0);
        if (ev.hp && ev.hp[ev.a] <= 0) setPoison(A, false);
        await wait(0.55);
        return;
      }
      if (ev.kind === "stun") {
        floatText(A, "Betäubt!", "stun");
        A.m.play("hit", 0.4);
        await wait(0.7);
        clearStars(A);
        return;
      }
      const special = ev.kind === "special";
      const SFX = special ? SPECIAL_FX[ev.sp] || { color: A.m.projColor || "#ffd25a", kind: "shock" } : null;
      if (special) {
        banner(ev.spName || "Spezialangriff", A.side);
        ring(A, SFX.color, true);
        rising(A, SFX.color, 14);
        zoom = 0.5;
        if (opts.sfx) opts.sfx("special");
        if (SFX.kind === "aura") setAura(A, SFX.color);
        await wait(0.4);
      }
      const isHero = A.desc.kind !== "monster";
      const wb = A.m.weaponBase;
      const bowLike = isHero && (wb === "bogen" || wb === "armbrust" || wb === "speer");
      const spell = (isHero && A.m.arch === "magier") || (!isHero && A.m.ranged);
      if (bowLike || spell) {
        for (let i = 0; i < ev.hits.length; i++) {
          A.m.play(bowLike ? "shoot" : "cast", 0.5);
          await wait(bowLike ? 0.3 : 0.3);
          if (opts.sfx) opts.sfx(bowLike ? "bow" : "spell");
          if (special && SFX.kind === "beam") {
            await beam(A, Bf, SFX.color);
          } else if (special && SFX.kind === "roots") {
            roots(Bf, SFX.color);
            await wait(0.35);
          } else {
            const kind = bowLike ? (wb === "speer" ? "spear" : "arrow") : special && SFX.kind === "orbs" ? "star" : "orb";
            await projectile(A, Bf, kind, special ? SFX.color : A.m.projColor || "#c47bff");
          }
          await impact(ev, A, Bf, ev.hits[i], i);
          await wait(ev.hits.length > 1 ? 0.1 : 0.28);
        }
      } else {
        const target = Bf.home.x - Bf.side * (Bf.desc.kind === "monster" ? 1.9 : 1.5);
        const from = A.home.x;
        if (special && SFX.kind === "smoke") {
          burst(A.m.obj.position.clone().setY(1), SFX.color, 16, 1.5, 0.5);
          A.m.obj.visible = false;
          await wait(0.15);
          A.m.obj.position.x = target;
          A.m.obj.visible = true;
          burst(A.m.obj.position.clone().setY(1), SFX.color, 16, 1.5, 0.5);
        } else {
          A.m.play(special && ev.sp === "zermalmen" ? "special" : "walk", 0.3);
          await tween(0.26, (u) => (A.m.obj.position.x = from + (target - from) * u));
        }
        for (let i = 0; i < ev.hits.length; i++) {
          A.m.play(special && i === 0 ? "special" : "attack", special ? 0.5 : 0.42);
          if (opts.sfx) opts.sfx("swing");
          await wait(0.22);
          if (special && (SFX.kind === "slash" || SFX.kind === "aura")) slash(Bf, SFX.color, i % 2);
          else if (special && SFX.kind === "shock") {
            ring(Bf, SFX.color, true);
            shake = 0.3;
          } else if (special && SFX.kind === "roots") roots(Bf, SFX.color);
          else slash(Bf, "#ffffff", i % 2);
          await impact(ev, A, Bf, ev.hits[i], i);
          await wait(0.16);
        }
        await tween(0.26, (u) => (A.m.obj.position.x = target + (from - target) * u));
      }
      if (ev.heal) {
        hp[ev.a] = ev.hp ? ev.hp[ev.a] : hp[ev.a] + ev.heal;
        rising(A, "#7fffb0", 16);
        floatText(A, "+" + SB.util.fmt(ev.heal), "heal");
        if (opts.sfx) opts.sfx("heal");
        report(ev.a, ev, -1);
      }
      if (ev.poison) {
        floatText(Bf, "Vergiftet!", "poison");
        setPoison(Bf, true);
      }
      if (ev.dodge) floatText(A, "Im Schatten", "evade");
      if (ev.stun) {
        floatText(Bf, "Betäubt!", "stun");
        stunStars(Bf);
      }
      if (ev.hp) {
        hp[0] = ev.hp[0];
        hp[1] = ev.hp[1];
      }
      await wait(0.15);
    }

    const api = {
      _F: F,
      play,
      setSpeed(s) {
        speed = s;
      },
      // Naechster Gegner einer Mehrfach-Begegnung
      async nextFoe(desc, foeHp, heroHp) {
        const old = F[1];
        clearStars(old);
        setAura(old, null);
        setPoison(old, false);
        setPoison(F[0], false);
        setAura(F[0], null);
        await tween(0.35, (u) => {
          old.m.obj.position.y = -u * 0.6;
          old.m.obj.scale.setScalar(Math.max(0.01, 1 - u));
        });
        scene.remove(old.m.obj);
        scene.remove(old.shadow);
        const nf = makeFighter(desc, 1);
        F[1] = nf;
        hp[1] = foeHp || 1;
        const tx = nf.home.x;
        nf.m.obj.position.x = tx + 6;
        nf.m.play("walk", 0.7);
        await tween(0.7, (u) => (nf.m.obj.position.x = tx + 6 * (1 - u)));
        nf.m.play("idle");
        F[0].m.play("idle");
        ring(nf, "#ffffff");
        if (heroHp != null && heroHp > hp[0]) {
          floatText(F[0], "+" + SB.util.fmt(Math.round(heroHp - hp[0])), "heal");
          rising(F[0], "#7fffb0", 10);
        }
        if (heroHp != null) hp[0] = heroHp;
      },
      async finish(winner) {
        const W = F[winner];
        const L = F[1 - winner];
        clearStars(L);
        setPoison(L, false);
        setAura(L, null);
        L.m.play("defeat", 0.9);
        if (opts.sfx) opts.sfx("ko");
        await wait(0.6);
        W.m.play("victory", 1.4);
        burst(new T.Vector3(W.m.obj.position.x, 2.2, W.m.obj.position.z), "#ffd25a", 24, 3);
        await wait(1.2);
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        overlay.remove();
        killRenderer(renderer);
      },
    };
    R._lastBattle = api;
    return api;
  };
})();

</script>
<script>/* src/ui-core.js */
/* Helden von Schwebfels - Oberflaechen-Kern: Menueleiste, Kopfleiste, Panels, Vergleich, Tooltips, Hinweise, Zeitgeber, Musik. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const E = SB.engine;
  const U = SB.util;
  const I = SB.icons;
  const UI = (SB.ui = SB.ui || {});

  UI.S = null;
  UI.hub = null;
  UI.use3d = false;
  UI.panelId = null;
  UI.inBattle = false;
  UI.tabs = {};
  UI.qty = 1;
  UI.ACTIONS = {};
  UI.PANELS = {};
  const $ = (sel, root) => (root || document).querySelector(sel);
  UI.$ = $;
  const esc = U.esc;

  /* ---------- Portraits ---------- */
  UI.NPC_LOOK = {
    hulda: { race: "albier", realm: "albion", gender: "w", cls: "lichtweber", look: { skin: "#e8b896", hair: "#a8432a", hairStyle: 1, eyes: "#4f7a3a", tattoo: "keine" }, gear: { ruestung: { base: "robe", tint: "#6a4a3a", style: 0 } } },
    brumm: { race: "kreidezwerg", realm: "albion", gender: "m", cls: "schildritter", look: { skin: "#b98b6c", hair: "#9b3d24", hairStyle: 4, beard: 3, eyes: "#3a2a1e", scar: "auge" }, gear: { ruestung: { base: "harnisch", tint: "#5a4a3a", style: 0 }, handschuhe: { base: "handschuhe", tint: "#4a3a30" } } },
    zinnober: { race: "sidhe", realm: "hibernia", gender: "w", cls: "dornenrufer", look: { skin: "#d6cfe6", hair: "#c7a6e0", hairStyle: 2, eyes: "#7fffb0", tattoo: "mond", tattooColor: "#b48cff" }, gear: { helm: { base: "hut", tint: "#5a2f6f", rarity: "episch", style: 1 }, ruestung: { base: "robe", tint: "#3a2f5a", style: 1 } } },
    funzel: { race: "nordmann", realm: "midgard", gender: "m", cls: "wolfsjaeger", look: { skin: "#dcae8c", hair: "#efe6d2", hairStyle: 4, beard: 2, eyes: "#3f6fa8" }, gear: { helm: { base: "kappe", tint: "#7a7470", style: 2 }, ruestung: { base: "wams", tint: "#4a3424" } } },
    krawall: { race: "trollblut", realm: "midgard", gender: "w", cls: "sturmhuene", look: { skin: "#8a6a8a", hair: "#1f1f24", hairStyle: 3, eyes: "#ffb13b", tattoo: "kriegsbemalung", tattooColor: "#a82424", horns: 0 }, gear: { ruestung: { base: "harnisch", tint: "#5a5f6a", style: 2 }, umhang: { base: "umhang", tint: "#8a2a2a", style: 1 } } },
    hufnagel: { race: "moorling", realm: "hibernia", gender: "w", cls: "mondschuetze", look: { skin: "#a9b98f", hair: "#4f6a3c", hairStyle: 1, eyes: "#4f7a3a", tattoo: "dornen", tattooColor: "#2f5fd0" }, gear: { ruestung: { base: "wams", tint: "#5a3d2a" } } },
    ottilie: { race: "albier", realm: "albion", gender: "w", cls: "schildritter", look: { skin: "#c99470", hair: "#2b1d16", hairStyle: 5, eyes: "#3f6fa8", tattoo: "runen", tattooColor: "#e8e2d6", scar: "wange" }, gear: { ruestung: { base: "harnisch", tint: "#9aa4ad", style: 1 }, umhang: { base: "umhang", tint: "#b8322e" } } },
    seherin: { race: "sidhe", realm: "hibernia", gender: "w", cls: "dornenrufer", look: { skin: "#e6dccc", hair: "#f2f2f2", hairStyle: 2, eyes: "#7fffb0", tattoo: "linien", tattooColor: "#4fffb0" }, gear: { helm: { base: "hut", tint: "#2a2a44", style: 0 }, ruestung: { base: "robe", tint: "#3a3a5a", style: 1 } } },
  };
  UI.heroDesc = (S) => ({ kind: "hero", race: S.race, cls: S.cls, realm: S.realm, gender: S.gender, look: S.look, gear: E.gearVisual(S.equip) });
  UI.fighterDesc = function (f) {
    if (f.kind === "monster") return { kind: "monster", arch: f.arch, color: f.color, accent: f.accent, boss: !!f.boss, final: !!f.final };
    return { kind: "hero", race: f.race, cls: f.cls, realm: f.realm, gender: f.gender, look: f.look, gear: f.gear };
  };
  UI.monDesc = (m, boss, final) => ({ kind: "monster", arch: m.arch, color: m.color, accent: m.accent, boss: !!boss, final: !!final });
  UI.portrait = function (desc, size, bust) {
    const url = UI.use3d ? SB.R3D.snapshot(desc, size || 128, bust) : null;
    if (url) return '<img alt="" src="' + url + '">';
    return I.silhouette(desc.kind === "monster" ? desc.color : desc.gear && desc.gear.ruestung ? desc.gear.ruestung.tint : "#7f8a96", desc.kind);
  };
  UI.npcPortrait = (id) => (UI.NPC_LOOK[id] ? UI.portrait(Object.assign({ kind: "hero" }, UI.NPC_LOOK[id]), 128, true) : "");
  UI.heroPortrait = (S) => UI.portrait(UI.heroDesc(S), 128, true);

  /* ---------- Speichern ---------- */
  let saveTimer = 0;
  UI.save = function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => SB.store.save(UI.S), 300);
  };
  UI.saveNow = function () {
    clearTimeout(saveTimer);
    SB.store.save(UI.S);
  };

  /* ---------- Formatierung ---------- */
  UI.gold = (n) => '<span class="num">' + U.fmt(n) + "</span> " + I.ui("gold");
  UI.perlen = (n) => '<span class="num">' + U.fmt(n) + "</span> " + I.ui("perle");
  UI.gauge = function (val, max) {
    const pct = Math.max(0, Math.min(1, val / max));
    const a = Math.PI * (1 - pct);
    const cx = 20;
    const cy = 23;
    const ex = (cx + Math.cos(a) * 13).toFixed(2);
    const ey = (cy - Math.sin(a) * 13).toFixed(2);
    const nx = (cx + Math.cos(a) * 11).toFixed(2);
    const ny = (cy - Math.sin(a) * 11).toFixed(2);
    const col = pct < 0.15 ? "#e0644f" : pct < 0.4 ? "#e8c35a" : "#6fd0a8";
    return (
      '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#0c0a10" stroke="#a8823a" stroke-width="2"/>' +
      '<path d="M7 23 A13 13 0 0 1 33 23" fill="none" stroke="#2a2633" stroke-width="4" stroke-linecap="round"/>' +
      (pct > 0.005 ? '<path d="M7 23 A13 13 0 0 1 ' + ex + " " + ey + '" fill="none" stroke="' + col + '" stroke-width="4" stroke-linecap="round"/>' : "") +
      '<path d="M20 23 L' + nx + " " + ny + '" stroke="#efe6d2" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="23" r="2.6" fill="#c9a441" stroke="#14101a" stroke-width="1"/>' +
      '<text x="20" y="35.5" text-anchor="middle" font-size="7" font-weight="800" fill="#efe6d2" font-family="sans-serif">' + Math.floor(val) + "</text></svg>"
    );
  };
  // Erfahrung klar darstellen
  UI.xpInfo = function (S) {
    const need = E.xpNeed(S.level);
    return { need, have: S.xp, rest: Math.max(0, need - S.xp), pct: Math.min(100, (S.xp / need) * 100) };
  };
  UI.xpBlock = function (S) {
    const x = UI.xpInfo(S);
    return (
      '<div class="xpblock"><div class="xprow"><span class="lv">Stufe ' + S.level + '</span><span class="muted">Erfahrung</span><span class="spacer"></span><span class="lv next">Stufe ' + (S.level + 1) + "</span></div>" +
      '<div class="xpbig"><i style="width:' + x.pct.toFixed(1) + '%"></i><span class="num">' + U.fmt(x.have) + " / " + U.fmt(x.need) + " EP (" + Math.floor(x.pct) + " %)</span></div>" +
      '<div class="xprest">Noch <b class="num">' + U.fmt(x.rest) + " EP</b> bis Stufe " + (S.level + 1) + "</div></div>"
    );
  };

  /* ---------- Toasts ---------- */
  UI.toast = function (text, kind, icon) {
    const box = $("#toasts");
    if (!box) return;
    const t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.innerHTML = (icon ? I.ui(icon) : "") + "<span></span>";
    t.querySelector("span").textContent = text;
    box.appendChild(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => {
      t.classList.add("out");
      setTimeout(() => t.remove(), 400);
    }, 3800);
  };
  SB.bus.on("toast", (p) => UI.toast(p.text, p.kind === "info" ? "" : p.kind));
  SB.bus.on("levelup", (p) => {
    UI.toast("Stufe " + p.level + " erreicht! Eine Wolkenperle als Belohnung.", "gold", "xp");
    SB.audio.play("levelup");
    if (UI.hub) UI.hub.cheer();
  });
  SB.bus.on("achievement", (a) => {
    UI.toast("Abzeichen „" + a.name + "“: +" + a.perlen + (a.perlen === 1 ? " Wolkenperle" : " Wolkenperlen"), "gold", "abzeichen");
    SB.audio.play("chime");
  });
  SB.bus.on("remote", () => {
    if (UI.panelId === "arena" || UI.panelId === "ruhmeshalle" || UI.panelId === "gildenhalle") UI.renderPanel();
  });

  /* ---------- Gegenstaende und Vergleich ---------- */
  UI.itemRef = function (ref) {
    const S = UI.S;
    const p = String(ref).split(":");
    if (p[0] === "inv") return S.inv[+p[1]];
    if (p[0] === "eq") return S.equip[p[1]];
    if (p[0] === "shop") return S.shops[p[1]] && S.shops[p[1]].items[+p[2]];
    if (p[0] === "offer") return S.quest.offers[+p[1]] && S.quest.offers[+p[1]].item;
    if (p[0] === "tmp") return UI.tmpItems[+p[1]];
    return null;
  };
  UI.tmpItems = [];
  UI.tmpRef = function (item) {
    UI.tmpItems.push(item);
    if (UI.tmpItems.length > 40) UI.tmpItems.shift();
    return "tmp:" + (UI.tmpItems.length - 1);
  };
  UI.slotName = (it) => D.SLOT_INFO[it.slot].name;
  UI.isUpgrade = function (it) {
    const S = UI.S;
    if (!it || !E.canEquip(S, it)) return false;
    return E.itemScore(it, S.cls) > E.itemScore(S.equip[it.slot], S.cls) * 1.001;
  };
  const archName = (a) => (a && D.ARCHETYPES[a] ? D.ARCHETYPES[a].name : "");
  const itemLines = (it) => {
    const lines = [];
    if (it.min) lines.push(["schaden", "Schaden", U.fmt(it.min) + " bis " + U.fmt(it.max)]);
    if (it.armor) lines.push(["ruestung", "Rüstung", U.fmt(it.armor)]);
    for (const a of D.ATTRS) if (it.stats[a]) lines.push([a, D.ATTR_INFO[a].name, "+" + U.fmt(it.stats[a])]);
    return lines;
  };
  // Auswirkung auf die Heldenwerte, wenn der Gegenstand angelegt wuerde
  function heroDeltas(it) {
    const S = UI.S;
    const pv = E.previewEquip(S, it);
    const b = pv.before;
    const a = pv.after;
    return [
      ["konstitution", "Lebenspunkte", b.hp, a.hp, U.fmt],
      ["schaden", "Ø Schaden", (b.dmgMin + b.dmgMax) / 2, (a.dmgMin + a.dmgMax) / 2, (v) => U.fmt(Math.round(v))],
      ["ruestung", "Schadensminderung", b.reduction * 100, a.reduction * 100, (v) => Math.round(v) + " %"],
      ["glueck", "Kritisch", b.crit * 100, a.crit * 100, (v) => Math.round(v) + " %"],
    ];
  }
  const sign = (d, fmt) => (d > 0 ? "+" : d < 0 ? "−" : "±") + fmt(Math.abs(d));
  UI.itemCard = function (it, opts) {
    opts = opts || {};
    const S = UI.S;
    const R = D.RARITIES[it.rarity];
    let cmp = "";
    const can = S && E.canEquip(S, it);
    const cur = S && S.equip[it.slot];
    if (opts.compare !== false && S && can && cur !== it) {
      const rows = heroDeltas(it)
        .map(([ic, n, b, a, fmt]) => {
          const d = a - b;
          if (Math.abs(d) < 0.5) return "";
          return "<li><span>" + I.ui(ic) + " " + n + '</span><b class="' + (d > 0 ? "delta-up" : "delta-down") + '">' + sign(d, fmt) + "</b></li>";
        })
        .join("");
      cmp = '<div class="cmp"><div class="muted">' + (cur ? "Statt „" + esc(cur.name) + "“ angelegt:" : "Freier Platz, angelegt:") + "</div><ul>" + (rows || "<li><span>gleichwertig</span></li>") + "</ul></div>";
    } else if (opts.compare !== false && S && !can) {
      cmp = '<div class="cmp delta-down">Nur für ' + esc(archName(it.arch)) + "-Klassen</div>";
    }
    return (
      '<div class="itemcard"><h4 class="t-' + it.rarity + '">' + esc(it.name) + '</h4><div class="kind">' + R.name + " · " + UI.slotName(it) + " · Stufe " + it.level + (it.arch ? " · " + archName(it.arch) : "") + "</div><ul>" +
      itemLines(it).map((l) => "<li><span>" + I.ui(l[0]) + " " + l[1] + '</span><b class="num">' + l[2] + "</b></li>").join("") +
      "</ul>" + cmp + (opts.price ? '<div class="cmp">' + opts.price + "</div>" : "") + "</div>"
    );
  };
  // Ausfuehrlicher Vergleich fuer den Dialog: angelegt gegen neu, Wert fuer Wert
  UI.compareTable = function (it) {
    const S = UI.S;
    if (!E.canEquip(S, it)) return "";
    const cur = S.equip[it.slot];
    if (cur === it) return "";
    const rowsItem = [];
    const val = (x, k) => (k === "dmg" ? (x && x.min ? (x.min + x.max) / 2 : 0) : k === "armor" ? (x && x.armor) || 0 : (x && x.stats[k]) || 0);
    const keys = [];
    if (it.min || (cur && cur.min)) keys.push(["dmg", "schaden", "Ø Waffenschaden"]);
    if (it.armor || (cur && cur.armor)) keys.push(["armor", "ruestung", "Rüstung"]);
    for (const a of D.ATTRS) if ((it.stats[a] || 0) + ((cur && cur.stats[a]) || 0) > 0) keys.push([a, a, D.ATTR_INFO[a].name]);
    for (const [k, ic, n] of keys) {
      const a = val(cur, k);
      const b = val(it, k);
      const d = Math.round(b - a);
      rowsItem.push("<tr><td>" + I.ui(ic) + " " + n + '</td><td class="num">' + U.fmt(Math.round(a)) + '</td><td class="num">' + U.fmt(Math.round(b)) + '</td><td class="num ' + (d > 0 ? "delta-up" : d < 0 ? "delta-down" : "") + '">' + (d ? sign(d, U.fmt) : "±0") + "</td></tr>");
    }
    const rowsHero = heroDeltas(it).map(([ic, n, a, b, fmt]) => {
      const d = b - a;
      return "<tr><td>" + I.ui(ic) + " " + n + '</td><td class="num">' + fmt(a) + '</td><td class="num">' + fmt(b) + '</td><td class="num ' + (d > 0.5 ? "delta-up" : d < -0.5 ? "delta-down" : "") + '">' + (Math.abs(d) >= 0.5 ? sign(d, fmt) : "±0") + "</td></tr>";
    });
    return (
      '<table class="cmptable"><thead><tr><th>Gegenstand</th><th>' + (cur ? "Angelegt" : "Leer") + "</th><th>Neu</th><th>Unterschied</th></tr></thead><tbody>" + rowsItem.join("") +
      '<tr class="sep"><th colspan="4">Deine Werte danach</th></tr>' + rowsHero.join("") + "</tbody></table>"
    );
  };
  UI.slotHtml = function (it, ref, extra) {
    extra = extra || {};
    if (!it) return '<div class="slot empty">' + (extra.emptyIcon ? I.ui(extra.emptyIcon) : "") + (extra.label ? '<span class="slot-name">' + extra.label + "</span>" : "") + "</div>";
    const blocked = UI.S && !E.canEquip(UI.S, it);
    return (
      '<button type="button" class="slot r-' + it.rarity + (blocked ? " blocked" : "") + '" data-item="' + ref + '" data-act="' + (extra.act || "itemInfo") + '" data-ref="' + ref + '" aria-label="' + esc(it.name) + '">' +
      I.item(it) + (extra.upgrade && UI.isUpgrade(it) ? '<span class="up">' + I.ui("pfeil") + "</span>" : "") + (extra.price ? '<span class="price">' + extra.price + "</span>" : "") + "</button>"
    );
  };

  /* Tooltip fuer Maus-Bedienung */
  let tip = null;
  function placeTip(ev) {
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    let x = ev.clientX + 16;
    let y = ev.clientY + 16;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 16;
    if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = y + "px";
  }
  document.addEventListener("pointerover", (ev) => {
    if (ev.pointerType !== "mouse") return;
    const el = ev.target.closest && ev.target.closest("[data-item]");
    if (!el || !UI.S) return;
    const it = UI.itemRef(el.dataset.item);
    if (!it) return;
    tip = tip || $("#tip");
    if (!tip) return;
    tip.innerHTML = UI.itemCard(it);
    tip.style.borderColor = D.RARITIES[it.rarity].color;
    tip.hidden = false;
    placeTip(ev);
  });
  document.addEventListener("pointermove", (ev) => {
    if (tip && !tip.hidden) placeTip(ev);
  });
  document.addEventListener("pointerout", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-item]");
    if (el && tip) tip.hidden = true;
  });
  UI.hideTip = () => tip && (tip.hidden = true);

  /* ---------- Dialoge ---------- */
  UI.dialog = function (html, opts) {
    opts = opts || {};
    const m = $("#modal");
    m.innerHTML = '<div class="dialog ' + (opts.cls || "") + '" role="dialog" aria-modal="true">' + html + "</div>";
    m.hidden = false;
    UI.hideTip();
    const first = m.querySelector("[data-autofocus]") || m.querySelector("button");
    if (first) setTimeout(() => first.focus(), 30);
    return m.firstChild;
  };
  UI.closeDialog = function () {
    const m = $("#modal");
    m.hidden = true;
    m.innerHTML = "";
    delete m.dataset.locked;
  };
  UI.ACTIONS.closeDialog = () => UI.closeDialog();

  UI.ACTIONS.itemInfo = function (el) {
    const S = UI.S;
    const ref = el.dataset.ref;
    const it = UI.itemRef(ref);
    if (!it) return;
    const [kind, a, b] = ref.split(":");
    let actions = "";
    let price = "";
    if (kind === "inv") {
      if (E.canEquip(S, it)) actions += '<button class="btn" data-act="equip" data-i="' + a + '">Anlegen</button>';
      actions += '<button class="btn ghost" data-act="sell" data-i="' + a + '">Verkaufen für ' + UI.gold(E.sellPrice(it)) + "</button>";
    } else if (kind === "eq") {
      actions += '<button class="btn ghost" data-act="unequip" data-slot="' + a + '">Ablegen</button>';
    } else if (kind === "shop") {
      price = "Preis: " + UI.gold(it.value);
      actions += '<button class="btn" data-act="buy" data-shop="' + a + '" data-i="' + b + '"' + (S.gold < it.value ? " disabled" : "") + ">Kaufen</button>";
    }
    UI.dialog(UI.itemCard(it, { price, compare: false }) + UI.compareTable(it) + (E.canEquip(S, it) ? "" : '<p class="delta-down">Nur für ' + esc(archName(it.arch)) + "-Klassen.</p>") + '<div class="actions"><button class="btn ghost" data-act="closeDialog">Schließen</button>' + actions + "</div>", { cls: "wide" });
  };

  /* ---------- Menueleiste (links am Desktop, unten am Handy) ---------- */
  const MENU = [
    ["held", "held", "Charakter"],
    ["taverne", "taverne", "Taverne"],
    ["steinkreis", "steinkreis", "Chronik"],
    ["arena", "arena", "Arena"],
    ["leuchtturm", "leuchtturm", "Wache"],
    ["tiefen", "tiefen", "Dungeons"],
    ["schmiede", "schmiede", "Schmiede"],
    ["arkanum", "arkanum", "Kuriositäten"],
    ["stall", "stall", "Stall"],
    ["ruhmeshalle", "ruhm", "Rangliste"],
    ["gildenhalle", "gilde", "Gilde"],
    ["heim", "heim", "Heim"],
    ["brunnen", "brunnen", "Brunnen"],
  ];
  UI.MENU = MENU;
  let lastPortraitKey = "";
  UI.renderTop = function () {
    const S = UI.S;
    const top = $("#topbar");
    if (!top) return;
    const x = UI.xpInfo(S);
    const en = E.energy(S);
    const key = JSON.stringify(UI.heroDesc(S));
    if (!top.dataset.built) {
      top.innerHTML =
        '<button class="me-chip" data-act="open" data-id="held" aria-label="Dein Charakter"><span class="porthole" id="mePortrait"></span><span class="me-meta"><span class="me-name"></span><span class="me-sub"></span></span></button>' +
        '<button class="xpwrap" data-act="open" data-id="held" aria-label="Erfahrung"><span class="xpbar"><i></i><span class="xptext num"></span></span></button>' +
        '<div class="res"><span class="chip" title="Gold" id="resGold"></span><span class="chip" title="Wolkenperlen" id="resPerl"></span><span class="gauge" title="Tatendrang" id="resEnergy"></span><span class="chip hon" title="Ehre" id="resHonor"></span>' +
        '<span class="chip daychip" id="resDay" title="Tageszeit"></span>' +
        '<button class="iconbtn" data-act="toggleMusic" id="musicBtn" aria-label="Musik an oder aus"></button><button class="iconbtn" data-act="toggleSound" id="soundBtn" aria-label="Klangeffekte an oder aus"></button><button class="iconbtn" data-act="open" data-id="einstellungen" aria-label="Einstellungen">' + I.ui("einstellungen") + "</button></div>";
      top.dataset.built = "1";
    }
    if (key !== lastPortraitKey) {
      lastPortraitKey = key;
      $("#mePortrait").innerHTML = UI.heroPortrait(S);
      if (UI.hub) UI.hub.setHero(UI.heroDesc(S));
    }
    top.querySelector(".me-name").innerHTML = I.realm(S.realm) + " " + esc(S.name) + (S.guild ? ' <span class="gtag">[' + esc(S.guild.tag) + "]</span>" : "");
    top.querySelector(".me-sub").textContent = "Stufe " + S.level + " · " + D.CLASSES[S.cls].name;
    top.querySelector(".xpbar i").style.width = x.pct.toFixed(1) + "%";
    top.querySelector(".xptext").textContent = innerWidth <= 520 ? U.fmtShort(x.rest) + " EP bis " + (S.level + 1) : "Stufe " + S.level + " · " + U.fmt(x.have) + " / " + U.fmt(x.need) + " EP · noch " + U.fmt(x.rest) + " bis Stufe " + (S.level + 1);
    $("#resGold").innerHTML = I.ui("gold") + '<span class="num">' + U.fmtShort(S.gold) + "</span>";
    $("#resPerl").innerHTML = I.ui("perle") + '<span class="num">' + U.fmt(S.perlen) + "</span>";
    $("#resEnergy").innerHTML = UI.gauge(en, E.energyMax(S)) + "<span><small>Tatendrang</small>" + Math.floor(en) + "</span>";
    $("#resHonor").innerHTML = I.ui("ehre") + '<span class="num">' + U.fmt(S.honor) + "</span>";
    const t = SB.R3D.dayTime(S.settings.dayCycle || "zyklus");
    const lbl = SB.R3D.dayLabel(t);
    $("#resDay").innerHTML = I.ui(lbl === "Nacht" || lbl === "Abenddämmerung" ? "mond" : "sonne") + "<span>" + lbl + "</span>";
    $("#soundBtn").innerHTML = I.ui(S.settings.sound ? "ton" : "stumm");
    $("#musicBtn").innerHTML = I.ui("musik");
    $("#musicBtn").classList.toggle("off", S.settings.music === false);
  };

  UI.badges = function () {
    const S = UI.S;
    const now = E.now();
    const b = {};
    const a = S.quest.active;
    if (a && a.end <= now) b.taverne = "!";
    else if (!E.busy(S, now) && S.quest.offers.some((o) => E.energy(S, now) >= o.energy)) b.taverne = S.quest.offers.some((o) => o.rare) ? "★" : "3";
    if (S.guard && S.guard.end <= now) b.leuchtturm = "✓";
    if (!E.busy(S, now) && S.arena.next <= now) b.arena = "!";
    if (S.daily.wellFree > 0) b.brunnen = "1";
    if (!E.busy(S, now) && S.story.next <= now && E.storyChapters(S).some((c) => c.available)) b.steinkreis = "!";
    if (!E.busy(S, now) && S.dungeons.next <= now) {
      for (let d = 0; d < D.DUNGEONS.length; d++) {
        const st = E.dungeonState(S, d);
        if (st.unlocked && !st.done) {
          b.tiefen = "!";
          break;
        }
      }
    }
    const C = D.CLASSES[S.cls];
    if (S.gold >= E.attrCost(S.bought[C.main]) || S.inv.some((it) => UI.isUpgrade(it))) b.held = "+";
    if (!S.guild) b.gildenhalle = "?";
    return b;
  };
  UI.renderDock = function () {
    const dock = $("#dock");
    if (!dock) return;
    const b = UI.badges();
    dock.innerHTML =
      '<div class="side-logo">Schwebfels<small>Die Freistatt der drei Reiche</small></div>' +
      MENU.map(([id, ic, label]) => '<button class="dock-btn' + (UI.panelId === id ? " active" : "") + '" data-act="open" data-id="' + id + '">' + I.ui(ic) + "<span>" + label + "</span>" + (b[id] ? '<span class="badge">' + b[id] + "</span>" : "") + "</button>").join("");
    if (UI.hub) UI.hub.setBadges(b);
    UI.renderFallbackStage(b);
  };
  UI.renderFallbackStage = function (b) {
    const fb = $(".stage-fallback .fb-grid");
    if (!fb) return;
    fb.innerHTML = D.BUILDINGS.map((bd) => {
      const ic = (MENU.find((d) => d[0] === bd.id) || [0, "held"])[1];
      return '<button data-act="open" data-id="' + bd.id + '">' + I.ui(ic) + "<b>" + esc(bd.name) + "</b>" + (b[bd.id] ? '<span class="tag">' + b[bd.id] + "</span>" : "") + "</button>";
    }).join("");
  };

  /* Aktivitaetsanzeige */
  UI.renderActivity = function () {
    const S = UI.S;
    const box = $("#activity");
    if (!box) return;
    const now = E.now();
    let html = "";
    let target = null;
    let done = false;
    if (S.quest.active) {
      const a = S.quest.active;
      done = a.end <= now;
      const pct = done ? 100 : ((now - a.start) / (a.end - a.start)) * 100;
      target = "taverne";
      html = I.ui(done ? "arena" : "uhr") + '<div class="act-text"><div class="act-title">' + (done ? "Auftrag erledigt: Der Kampf wartet!" : esc(a.offer.title)) + '</div><div class="progress"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' + (done ? '<span class="btn small">Kämpfen</span>' : '<b class="num" data-until="' + a.end + '"></b>');
    } else if (S.guard) {
      const g = S.guard;
      done = g.end <= now;
      const pct = done ? 100 : ((now - g.start) / (g.end - g.start)) * 100;
      target = "leuchtturm";
      html = I.ui("leuchtturm") + '<div class="act-text"><div class="act-title">' + (done ? "Wache beendet: Lohn abholen" : "Wache am Turm") + '</div><div class="progress"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' + (done ? '<span class="btn small">Abholen</span>' : '<b class="num" data-until="' + g.end + '"></b>');
    }
    box.hidden = !html || (UI.panelId && UI.panelId === target);
    box.innerHTML = html;
    box.dataset.act = "open";
    box.dataset.id = target || "";
    box.classList.toggle("done-pulse", done);
    UI.updateTimers();
  };

  UI.updateTimers = function () {
    const now = E.now();
    document.querySelectorAll("[data-until]").forEach((el) => {
      const ms = +el.dataset.until - now;
      el.textContent = ms > 0 ? U.fmtTime(ms) : el.dataset.doneText || "fertig";
    });
  };

  /* ---------- Musik je Ort ---------- */
  const PANEL_MUSIC = { taverne: "taverne", heim: "heim", steinkreis: "chronik", tiefen: "tiefe", gildenhalle: "taverne" };
  UI.updateMusic = function () {
    const S = UI.S;
    if (!S) return;
    let ctx;
    if (UI.inBattle) ctx = "kampf";
    else if (UI.panelId && PANEL_MUSIC[UI.panelId]) ctx = PANEL_MUSIC[UI.panelId];
    else {
      const info = SB.R3D.dayInfo(SB.R3D.dayTime(S.settings.dayCycle || "zyklus"));
      ctx = info.night > 0.55 ? "nacht" : "tag";
    }
    SB.audio.music(ctx);
  };

  /* ---------- Panels ---------- */
  UI.openPanel = function (id) {
    if (!UI.PANELS[id]) return;
    SB.audio.unlock();
    SB.audio.play("page");
    UI.panelId = id;
    document.body.classList.add("panel-open");
    const P = $("#panel");
    P.hidden = false;
    P.dataset.id = id;
    UI.renderPanel(true);
    if (UI.hub) {
      UI.hub.focus(id === "einstellungen" || id === "held" ? null : id);
      const wide = innerWidth > 860;
      UI.hub.setInset(wide ? P.offsetWidth + 24 : 0);
      if (!wide) UI.hub.pause();
    }
    UI.renderDock();
    UI.renderActivity();
    UI.checkHint();
    UI.updateMusic();
  };
  UI.closePanel = function () {
    const def = UI.PANELS[UI.panelId];
    if (def && def.close) def.close();
    UI.panelId = null;
    document.body.classList.remove("panel-open");
    const P = $("#panel");
    P.hidden = true;
    P.innerHTML = "";
    UI.detachHeroView();
    if (UI.hub) {
      UI.hub.focus(null);
      UI.hub.setInset(0);
      UI.hub.resume();
    }
    UI.renderDock();
    UI.renderActivity();
    UI.checkHint();
    UI.updateMusic();
  };
  UI.ACTIONS.open = (el) => {
    const id = el.dataset.id;
    if (!id) return;
    if (UI.panelId === id && !el.closest("#activity")) UI.closePanel();
    else {
      if (UI.panelId && UI.PANELS[UI.panelId].close) UI.PANELS[UI.panelId].close();
      UI.openPanel(id);
    }
  };
  UI.ACTIONS.closePanel = () => UI.closePanel();

  UI.renderPanel = function (fresh) {
    const id = UI.panelId;
    if (!id) return;
    const P = $("#panel");
    const def = UI.PANELS[id];
    const body = P.querySelector(".panel-body");
    const scroll = body && !fresh ? body.scrollTop : 0;
    let head = def.head ? def.head() : null;
    if (!head) {
      const bd = D.BUILDINGS.find((b) => b.id === id);
      const npc = bd && bd.npc ? D.NPCS[bd.npc] : null;
      head = { title: def.title || (bd ? bd.name : ""), role: npc ? npc.name + ", " + npc.role : def.role || "", portrait: bd && bd.npc ? UI.npcPortrait(bd.npc) : def.portrait ? def.portrait() : "" };
    }
    UI.detachHeroView();
    if (def.beforeRender) def.beforeRender(P);
    P.innerHTML =
      '<div class="panel-head">' + (head.portrait ? '<span class="porthole">' + head.portrait + "</span>" : "") + '<div><h2>' + esc(head.title) + '</h2><div class="role">' + esc(head.role) + '</div></div><button class="iconbtn close" data-act="closePanel" aria-label="Schließen">' + I.ui("schliessen") + '</button></div><div class="panel-body">' + def.render() + "</div>";
    if (def.after) def.after(P);
    const nb = P.querySelector(".panel-body");
    if (nb) nb.scrollTop = scroll;
    UI.updateTimers();
  };

  /* Persistente 3D-Heldenansicht, die Neuzeichnungen ueberlebt */
  let heroView = null;
  let heroViewEl = null;
  let heroViewKey = "";
  UI.attachHeroView = function (slot, desc, caption) {
    if (!slot) return;
    if (!UI.use3d) {
      slot.innerHTML = '<div class="hv-fallback">' + I.silhouette(desc.gear && desc.gear.ruestung ? desc.gear.ruestung.tint : "#7f8a96", desc.kind) + "</div>";
      return;
    }
    if (!heroViewEl) {
      heroViewEl = document.createElement("div");
      heroViewEl.style.cssText = "position:absolute;inset:0";
    }
    slot.appendChild(heroViewEl);
    if (caption) {
      const c = document.createElement("div");
      c.className = "hv-caption";
      c.innerHTML = caption;
      slot.appendChild(c);
    }
    if (!heroView) {
      heroView = SB.R3D.createHeroView(heroViewEl);
      heroViewKey = "";
    }
    const k = JSON.stringify(desc);
    if (k !== heroViewKey) {
      const celebrate = !!heroViewKey;
      heroViewKey = k;
      heroView.set(desc, celebrate);
    }
  };
  UI.detachHeroView = function () {
    if (heroViewEl && heroViewEl.parentNode) heroViewEl.parentNode.removeChild(heroViewEl);
  };
  UI.disposeHeroView = function () {
    if (heroView) heroView.dispose();
    heroView = null;
    heroViewEl = null;
    heroViewKey = "";
  };

  /* ---------- Hinweise von Hueterin Ottilie ---------- */
  const TUT = [
    { when: () => true, text: (S) => "Willkommen in der Freistatt, " + S.name + ". Ich bin Ottilie und hüte den Frieden auf Schwebfels. In der Taverne „Zur Schiefen Krähe“ warten deine ersten Aufträge.", btn: "Zur Taverne", act: () => UI.openPanel("taverne"), panel: "taverne" },
    { when: () => UI.panelId === "taverne" && !UI.S.quest.active, text: () => "Jeder Auftrag kostet Tatendrang, der sich mit der Zeit auffüllt. Achte auf die Siegchance. Seltene Hordenaufträge schicken dir mehrere Gegner nacheinander.", btn: "Verstanden" },
    { when: () => UI.S.stats.quests >= 1 && !UI.S.quest.active, text: () => "Gut gemacht! Gold steckst du am besten in deine Attribute. Im Charakterbogen siehst du auch genau, wie viel Erfahrung dir bis zur nächsten Stufe fehlt.", btn: "Zum Charakter", act: () => UI.openPanel("held"), panel: "held" },
    { when: () => UI.S.stats.quests >= 3, text: () => "In der Schmiede und bei Madame Zinnober gibt es bessere Ausrüstung. Fährst du mit der Maus über einen Gegenstand, siehst du sofort, wie sich deine Werte verändern würden.", btn: "Verstanden" },
    { when: () => UI.S.level >= 3, text: () => "Im Steinkreis erzählt die Seherin die Chronik deines Reiches und deiner Klasse. Jedes Kapitel bringt seltene Beute.", btn: "Zum Steinkreis", act: () => UI.openPanel("steinkreis"), panel: "steinkreis" },
    { when: () => UI.S.level >= 5, text: () => "Im Ring der Reiche kämpfst du gegen Helden aus den anderen Reichen. Ehre bringt dich in der Rangliste nach oben, für dich und für dein Reich.", btn: "Leinen los" },
    { when: () => UI.S.level >= 10, text: () => "Stufe 10! Das Tor zur Tiefe hat sich geöffnet. Dort warten Bosse mit seltener und epischer Beute.", btn: "Ab in die Tiefe", act: () => UI.openPanel("tiefen"), panel: "tiefen" },
  ];
  UI.checkHint = function () {
    const S = UI.S;
    const box = $("#hint");
    if (!box || !S) return;
    let step = TUT[S.tut];
    while (step && step.panel && step.panel === UI.panelId && step.when()) {
      S.tut++;
      step = TUT[S.tut];
    }
    if (!step || !step.when() || UI.inBattle) {
      box.hidden = true;
      return;
    }
    if (box.dataset.step === String(S.tut) && !box.hidden) return;
    box.dataset.step = String(S.tut);
    box.innerHTML = '<span class="porthole">' + UI.npcPortrait("ottilie") + '</span><div><p></p><button class="btn small" data-act="hintNext">' + step.btn + '</button> <button class="btn small ghost" data-act="hintSkip">Keine Tipps mehr</button></div>';
    box.querySelector("p").textContent = step.text(S);
    box.hidden = false;
  };
  UI.ACTIONS.hintNext = function () {
    const step = TUT[UI.S.tut];
    UI.S.tut++;
    $("#hint").hidden = true;
    UI.save();
    if (step && step.act) step.act();
    UI.checkHint();
  };
  UI.ACTIONS.hintSkip = function () {
    UI.S.tut = TUT.length;
    $("#hint").hidden = true;
    UI.save();
  };

  /* ---------- Gesamtaktualisierung ---------- */
  UI.refresh = function (opts) {
    opts = opts || {};
    UI.renderTop();
    UI.renderDock();
    UI.renderActivity();
    if (UI.panelId && opts.panel !== false) UI.renderPanel();
    if (UI.hub) UI.hub.setHome(UI.S.house.tier, UI.S.realm);
    UI.checkHint();
    UI.save();
  };

  /* Sekundentakt: Zeitgeber, Zustandswechsel */
  let lastState = "";
  let musicTimer = 0;
  UI.tick = function () {
    const S = UI.S;
    if (!S) return;
    const now = E.now();
    E.tick(S, now);
    const qDone = !!(S.quest.active && S.quest.active.end <= now);
    const gDone = !!(S.guard && S.guard.end <= now);
    const aReady = S.arena.next <= now;
    const dReady = S.dungeons.next <= now;
    const sReady = S.story.next <= now;
    const st = [qDone, gDone, aReady, dReady, sReady, Math.floor(E.energy(S, now)), S.daily.day].join("|");
    if (st !== lastState) {
      const prev = lastState.split("|");
      if (lastState) {
        if (qDone && prev[0] === "false") {
          UI.toast("Auftrag erledigt! Der Kampf wartet in der Taverne.", "good", "arena");
          SB.audio.play("quest");
        }
        if (gDone && prev[1] === "false") UI.toast("Deine Wache ist vorbei. Funzel hat deinen Lohn bereit.", "good", "leuchtturm");
      }
      lastState = st;
      UI.renderTop();
      UI.renderDock();
      UI.renderActivity();
      if (UI.panelId && (prev[0] !== String(qDone) || prev[1] !== String(gDone) || prev[2] !== String(aReady) || prev[3] !== String(dReady) || prev[4] !== String(sReady) || prev[6] !== S.daily.day)) UI.renderPanel();
    } else {
      UI.renderTop();
      const box = $("#activity");
      if (box && !box.hidden) {
        const a = S.quest.active || S.guard;
        const bar = box.querySelector(".progress i");
        if (a && bar) bar.style.width = Math.min(100, ((now - a.start) / (a.end - a.start)) * 100).toFixed(1) + "%";
      }
    }
    UI.updateTimers();
    if (++musicTimer >= 5) {
      musicTimer = 0;
      UI.updateMusic();
    }
  };

  /* Klick-Verteilung ueber data-act */
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = UI.ACTIONS[el.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    SB.audio.unlock();
    try {
      fn(el, ev);
    } catch (e) {
      console.error(e);
      UI.toast("Da ist etwas schiefgelaufen: " + e.message, "bad");
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (UI.inBattle) return;
    if (!$("#modal").hidden && !$("#modal").dataset.locked) UI.closeDialog();
    else if (UI.panelId) UI.closePanel();
  });
  document.addEventListener("click", (ev) => {
    if (ev.target && ev.target.id === "modal" && !ev.target.dataset.locked) UI.closeDialog();
  });

  UI.ACTIONS.toggleSound = function () {
    UI.S.settings.sound = !UI.S.settings.sound;
    SB.audio.setSfx(UI.S.settings.sound);
    UI.renderTop();
    if (UI.panelId === "einstellungen") UI.renderPanel();
    UI.save();
  };
  UI.ACTIONS.toggleMusic = function () {
    UI.S.settings.music = UI.S.settings.music === false;
    SB.audio.setMusic(UI.S.settings.music);
    UI.updateMusic();
    UI.renderTop();
    if (UI.panelId === "einstellungen") UI.renderPanel();
    UI.save();
  };
})();

</script>
<script>/* src/ui-panels.js */
/* Helden von Schwebfels - Panels der Orte und ihre Aktionen. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const E = SB.engine;
  const U = SB.util;
  const I = SB.icons;
  const UI = SB.ui;
  const A = UI.ACTIONS;
  const P = UI.PANELS;
  const esc = U.esc;
  const S = () => UI.S;

  const LINES = {
    hulda: ["Setz dich, Held. Die Aufträge hängen am Brett, der Met steht hinter mir.", "In der Krähe ist jedes Reich willkommen. Prügeleien bitte draußen, die Stühle sind neu.", "Manche Aufträge sind selten. Dann kommen die Biester gleich in Horden. Nimm einen zweiten Krug mit."],
    brumm: ["Hrmpf. Fass nichts an, was noch glüht.", "Gute Klinge, guter Preis. Billige Klinge, kurzes Leben.", "Ich schmiede seit dreihundert Jahren. Die ersten zweihundert waren Übung."],
    zinnober: ["Ah, ein Kunde! Oder ein Dieb? Bei dir bin ich mir noch nicht sicher.", "Alles hier ist magisch. Außer dem Staub. Wobei, der vielleicht auch.", "Dieser Ring gehörte einer Feenkönigin. Sagt zumindest der Ring."],
    krawall: ["Willkommen im Ring der Reiche! Hier kämpft Albion gegen Midgard gegen Hibernia, und alle gegen den Sand in den Stiefeln.", "Jeder Sieg bringt Ehre, dir und deinem Reich. Jede Niederlage bringt Geschichten.", "Hier drin gibt es keinen Frieden der Freistatt. Nur Regeln. Ein paar."],
    funzel: ["Das Feuer muss brennen. Immer. Ich mach das seit vierzig Jahren und habe nie geblinzelt.", "Wache halten ist einfach: Du schaust in den Nebel, der Nebel schaut zurück.", "Zahle pro Schicht. Pünktlich. Meistens."],
    hufnagel: ["Pass auf, wo du hintrittst. Der Greif ist sauber, die Hirsche nicht.", "Mit einem Reittier bist du schneller am Auftrag und schneller wieder in der Taverne.", "Der Greif beißt nur Leute, die er nicht mag. Er mag niemanden."],
    seherin: ["Die Steine erinnern sich an alles. Sie warten nur darauf, dass jemand zuhört.", "Jedes Reich hat seine Geschichte. Und jeder Held schreibt ein Stück davon.", "Unter den Splittern regt sich etwas. Die Chronik ist noch nicht zu Ende geschrieben."],
  };
  const line = (npc) => {
    const arr = LINES[npc];
    return arr[Math.floor((Date.now() / 60000) % arr.length)];
  };
  const say = (npc) => '<div class="say">' + esc(line(npc)) + "</div>";
  const chanceCls = (c) => (c >= 0.8 ? "good" : c >= 0.5 ? "ok" : "bad");
  const chanceTxt = (c) => '<span class="chance ' + chanceCls(c) + '">Siegchance ' + Math.round(c * 100) + " %</span>";
  const pips = (n) => '<span class="pips">' + [1, 2, 3].map((i) => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";
  const busyNote = () => {
    const b = E.busy(S());
    if (!b) return "";
    return '<div class="say">' + (b.what === "quest" ? "Du bist gerade auf einem Auftrag unterwegs." : "Du hältst gerade Wache am Turm.") + "</div>";
  };
  const estCache = new Map();
  function estimate(hero, foes, key) {
    const k = key + "|" + JSON.stringify(hero.attrs) + hero.wMin + "|" + hero.wMax + "|" + hero.armor + "|" + hero.prof.block;
    if (estCache.has(k)) return estCache.get(k);
    const v = E.estimateWin(hero, foes, 30, key);
    estCache.set(k, v);
    if (estCache.size > 200) estCache.delete(estCache.keys().next().value);
    return v;
  }
  function done(res) {
    if (res && res.ok === false && res.msg) {
      UI.toast(res.msg, "bad");
      return false;
    }
    return res && res.ok !== false;
  }
  const realmChip = (realm) => '<span class="realmchip r-' + realm + '">' + I.realm(realm) + " " + esc(D.REALMS[realm].name) + "</span>";
  const guildTag = (g) => (g ? ' <span class="gtag">[' + esc(g.tag) + "]</span>" : "");

  /* ================= Taverne ================= */
  P.taverne = {
    render() {
      const s = S();
      const now = E.now();
      const en = E.energy(s, now);
      const max = E.energyMax(s);
      let h = say("hulda");
      h +=
        '<div class="row" style="margin-bottom:12px"><span class="gauge" style="padding-right:12px">' + UI.gauge(en, max) + "<span><small>Tatendrang</small>" + Math.floor(en) + " / " + max + "</span></span>" +
        (en < max ? '<span class="muted">+1 in <b class="num" data-until="' + (now + E.nextEnergyIn(s, now)) + '"></b></span>' : "") +
        '<span class="spacer"></span><button class="btn small" data-act="brew"' + (s.daily.brews >= E.C.BREW_MAX ? " disabled" : "") + ">Nebelmet +" + E.C.BREW_ENERGY + " · 1 " + I.ui("perle") + "</button></div>" +
        '<div class="muted" style="font-size:12.5px;margin:-6px 0 10px">Heute noch ' + (E.C.BREW_MAX - s.daily.brews) + " Krüge Nebelmet erhältlich.</div>";
      if (s.guard) return h + busyNote();
      const a = s.quest.active;
      if (a) {
        const o = a.offer;
        const mon = E.questMonster(o);
        const fin = a.end <= now;
        h +=
          '<div class="quest' + (o.rare ? " rare" : "") + '"><div class="mon">' + UI.portrait(UI.monDesc(mon, o.rare), 128) + "</div><div><h3>" + esc(o.title) + "</h3><p>" + esc(o.text) + "</p>" +
          '<div class="progress"><i style="width:' + (fin ? 100 : (((now - a.start) / (a.end - a.start)) * 100).toFixed(1)) + '%"></i></div>' +
          '<div class="foot">' +
          (fin
            ? '<button class="btn big done-pulse" data-act="questFight">' + (o.rare ? "Die Horde stellen" : "Kampf gegen " + esc(mon.name)) + "</button>"
            : '<span>Unterwegs nach ' + esc(o.place) + ': <b class="num" data-until="' + a.end + '"></b></span><span class="spacer"></span><button class="btn small" data-act="questSkip">Sofort ankommen · 1 ' + I.ui("perle") + "</button>") +
          "</div></div></div>";
        return h;
      }
      const hero = E.heroFighter(s, now);
      h += '<div class="quests">';
      s.quest.offers.forEach((o, i) => {
        const mon = E.questMonster(o);
        const c = estimate(hero, E.questFoes(o, hero), o.id);
        const dur = E.questDuration(s, o);
        const waves = o.rare
          ? '<div class="waves"><span class="tag rare">Seltener Auftrag</span> ' + o.waves.length + " Gegner nacheinander, ohne Pause:" + '<div class="wavepics">' + o.waves.map((w, k) => '<span class="wp' + (w.boss ? " boss" : "") + '" title="' + esc(E.monById(w.monster).name) + '">' + UI.portrait(UI.monDesc(E.monById(w.monster), w.boss), 96) + "<i>" + (k + 1) + "</i></span>").join("") + "</div></div>"
          : "";
        h +=
          '<div class="quest' + (o.rare ? " rare" : "") + '"><div class="mon" title="' + esc(mon.name) + '">' + UI.portrait(UI.monDesc(mon, o.rare), 128) + "</div><div><h3>" + esc(o.title) + "</h3><p>" + esc(o.text) + "</p>" + waves +
          '<div class="meta">' + pips(o.diff) + "<span>" + E.DIFF[o.diff].name + "</span><span>" + I.ui("uhr") + " " + U.fmtTime(dur) + "</span><span>" + I.ui("tatendrang") + " " + o.energy + "</span>" + chanceTxt(c) + "</div>" +
          '<div class="rewards"><span>' + I.ui("xp") + ' <span class="num">' + U.fmt(o.xp) + " EP</span></span><span>" + UI.gold(o.gold) + "</span>" +
          (o.perle ? "<span>" + UI.perlen(o.perle) + "</span>" : "") +
          (o.item ? '<button type="button" class="mini-item r-' + o.item.rarity + '" data-item="offer:' + i + '" data-act="itemInfo" data-ref="offer:' + i + '" aria-label="' + esc(o.item.name) + '">' + I.item(o.item) + "</button>" : "") +
          '</div><div class="foot"><span class="muted">Ziel: ' + esc(o.place) + " · " + (o.rare ? "Anführer" : "Gegner") + ": " + esc(mon.name) + " (Stufe " + o.mlevel + ')</span><span class="spacer"></span><button class="btn" data-act="questStart" data-i="' + i + '"' + (en < o.energy ? " disabled" : "") + ">Aufbrechen</button></div></div></div>";
      });
      h += "</div>";
      if (en < 6) h += '<div class="say" style="margin-top:12px">Dein Tatendrang ist erschöpft. Ein Krug Nebelmet hilft, oder du hältst so lange Wache am Turm.</div>';
      return h;
    },
  };
  A.brew = () => {
    if (!done(E.buyBrew(S()))) return;
    SB.audio.play("coin");
    UI.toast("Hulda schenkt dir einen Nebelmet ein. Skål!", "good", "taverne");
    UI.refresh();
  };
  A.questStart = (el) => {
    if (!done(E.startQuest(S(), +el.dataset.i))) return;
    SB.audio.play("quest");
    UI.refresh();
  };
  A.questSkip = () => {
    if (!done(E.skipQuest(S()))) return;
    UI.refresh();
  };
  A.questFight = async () => {
    const s = S();
    const fight = E.questFight(s);
    if (!fight) return;
    const offer = fight.offer;
    const rew = E.resolveQuest(s, fight);
    UI.saveNow();
    await UI.runBattle(fight, { setting: "quest", title: offer.title, rewards: rew, rare: offer.rare });
    UI.refresh();
  };

  /* ================= Laeden ================= */
  function shopPanel(shop, npc) {
    return {
      render() {
        const s = S();
        const sh = s.shops[shop];
        const now = E.now();
        let h = say(npc);
        h += '<div class="row"><span class="muted">Neue Ware in <b class="num" data-until="' + (sh.ts + E.C.SHOP_REFRESH) + '"></b></span><span class="spacer"></span><button class="btn small ghost" data-act="reroll" data-shop="' + shop + '">Sofort neue Ware · 1 ' + I.ui("perle") + "</button></div>";
        h += '<div class="section-title">Angebot</div><div class="grid6 shop">';
        sh.items.forEach((it, i) => {
          h += it ? UI.slotHtml(it, "shop:" + shop + ":" + i, { upgrade: true, price: '<span class="num">' + U.fmtShort(it.value) + "</span> " + I.ui("gold") }) : '<div class="slot empty"><span class="slot-name">verkauft</span></div>';
        });
        h += "</div>";
        if (shop === "arkanum") {
          h += '<div class="section-title">Tränke</div><div class="cards">';
          for (const p of D.POTIONS) {
            const c = E.potionCost(s, p);
            const active = s.buffs.find((b) => b.id === p.id && b.until > now);
            h +=
              '<div class="card"><div class="pic">' + I.potion(p.color) + "</div><div><h4>" + esc(p.name) + '</h4><div class="muted" style="font-size:13px">' + esc(p.desc) + "</div>" +
              (active ? '<div style="font-size:12.5px">Wirkt noch <b class="num" data-until="' + active.until + '"></b></div>' : "") +
