  function airship() {
    const s = grp();
    s.add(mesh(g.sph(1, 18, 12), toon("#e8d6b0"), { p: [0, 1.6, 0], s: [2.4, 1.0, 1.0] }));
    for (let i = -1; i <= 1; i++) s.add(mesh(g.torus(1.0, 0.05, Math.PI * 2, 4, 24), toon("#c0392b"), { p: [i * 0.8, 1.6, 0], r: [0, Math.PI / 2, 0], s: [1, 1 - Math.abs(i) * 0.2, 1 - Math.abs(i) * 0.2], ol: 0 }));
    s.add(mesh(g.box(1.8, 0.4, 0.7), toon("#8a5a35"), { p: [0, 0.1, 0] }));
    for (const x of [-0.6, 0.6]) s.add(mesh(g.cyl(0.03, 0.03, 1.0, 4), toon("#5a3d2a"), { p: [x, 0.8, 0], ol: 0 }));
    const prop = grp([-1.1, 0.15, 0]);
    for (let i = 0; i < 3; i++) {
      const blade = grp([0, 0, 0], [(i * Math.PI * 2) / 3, 0, 0]);
      blade.add(mesh(g.box(0.04, 0.5, 0.12), toon("#5a3d2a"), { p: [0, 0.25, 0], ol: 0 }));
      prop.add(blade);
    }
    s.add(prop);
    s.add(mesh(g.cone(0.4, 0.6, 3), toon("#c0392b", { ds: true }), { p: [2.4, 1.6, 0], r: [0, 0, -Math.PI / 2], s: [1, 1, 0.1] }));
    s.userData.prop = prop;
    return s;
  }

  function islandMesh(radius, height, rng, grass, rock) {
    const isl = grp();
    const top = new T.CylinderGeometry(radius, radius * 0.94, 1.2, 40, 1);
    const pos = top.attributes.position;
    const seed = rng() * 10;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const a = Math.atan2(z, x);
      const k = 1 + 0.05 * Math.sin(3 * a + seed) + 0.03 * Math.sin(7 * a + seed * 2);
      pos.setX(i, x * k);
      pos.setZ(i, z * k);
    }
    top.computeVertexNormals();
    const tm = new T.Mesh(top, toon(grass));
    tm.position.y = -0.6;
    tm.receiveShadow = true;
    isl.add(tm);
    const under = new T.ConeGeometry(radius * 0.97, height, 24, 5);
    const up = under.attributes.position;
    for (let i = 0; i < up.count; i++) {
      const y = up.getY(i);
      const f = 1 + (rng() - 0.5) * 0.18 * (1 - Math.abs(y / height));
      up.setX(i, up.getX(i) * f);
      up.setZ(i, up.getZ(i) * f);
    }
    under.computeVertexNormals();
    const um = new T.Mesh(under, toon(rock, { flat: true }));
    um.rotation.x = Math.PI;
    um.position.y = -1.2 - height / 2;
    isl.add(um);
    const band = new T.Mesh(new T.CylinderGeometry(radius * 0.95, radius * 0.9, 0.6, 40, 1), toon("#8a6a4e", { flat: true }));
    band.position.y = -1.35;
    isl.add(band);
    return isl;
  }

  /* ---------- Insel-Hub ---------- */
  const LAYOUT = {
    taverne: [-5.6, 1.2],
    schmiede: [-6.4, -4.4],
    arkanum: [-1.6, -7.2],
    ruhmeshalle: [3.8, -6.6],
    arena: [7.2, -1.8],
    leuchtturm: [9.6, 4.6],
    stall: [4.8, 4.6],
    heim: [-2.4, 5.6],
    brunnen: [0.6, 0.4],
    tiefen: [-10.2, -0.6],
  };
  const LABEL_H = { taverne: 4.7, schmiede: 4.0, arkanum: 8.5, ruhmeshalle: 4.6, arena: 2.6, leuchtturm: 7.4, stall: 3.8, heim: 3.5, brunnen: 3.0, tiefen: 4.4 };

  R.createHub = function (el, opts) {
    init();
    opts = opts || {};
    const quality = opts.quality || "hoch";
    const renderer = makeRenderer(el, { shadows: quality === "hoch", maxDpr: quality === "hoch" ? 1.75 : 1.25 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(40, 1, 0.5, 600);
    const rng = SB.util.rng(42);
    const sky = skyDome("#5fb0ff", "#dff3ff");
    scene.add(sky);
    scene.fog = new T.Fog("#dff3ff", 60, 170);
    const hemi = new T.HemisphereLight("#e8f4ff", "#7a6a4e", 1.25);
    scene.add(hemi);
    const sun = new T.DirectionalLight("#fff4dc", 2.4);
    sun.position.set(14, 24, 10);
    if (quality === "hoch") {
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const sc = sun.shadow.camera;
      sc.left = -17;
      sc.right = 17;
      sc.top = 17;
      sc.bottom = -17;
      sc.near = 1;
      sc.far = 70;
      sun.shadow.bias = -0.0008;
      sun.shadow.normalBias = 0.03;
    }
    scene.add(sun);
    const amb = new T.AmbientLight("#ffffff", 0.25);
    scene.add(amb);

    // Sterne
    const starGeo = new T.BufferGeometry();
    const sp = [];
    for (let i = 0; i < 500; i++) {
      const u = rng() * Math.PI * 2;
      const v = rng() * 0.9 + 0.05;
      sp.push(Math.cos(u) * Math.sin(v * Math.PI * 0.5) * 180, Math.cos(v * Math.PI * 0.5) * 180, Math.sin(u) * Math.sin(v * Math.PI * 0.5) * 180);
    }
    starGeo.setAttribute("position", new T.Float32BufferAttribute(sp, 3));
    const starMat = new T.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: true, transparent: true, opacity: 0, fog: false });
    scene.add(new T.Points(starGeo, starMat));

    const world = grp();
    scene.add(world);
    world.add(islandMesh(13, 11, rng, "#8cc663", "#8a7058"));
    // Platz und Wege
    const sand = toon("#e6d3a3");
    const plaza = mesh(g.cyl(3.2, 3.2, 0.06, 28), sand, { p: [0.4, 0.03, 0.6], ol: 0, shadow: false });
    plaza.receiveShadow = true;
    world.add(plaza);
    for (const id in LAYOUT) {
      const [x, z] = LAYOUT[id];
      const len = Math.hypot(x, z);
      const path = mesh(g.box(1.0, 0.05, 1), sand, { ol: 0, shadow: false });
      path.scale.z = len;
      path.position.set(x / 2, 0.025, z / 2);
      path.rotation.y = Math.atan2(x, z);
      path.receiveShadow = true;
      world.add(path);
    }
    // Gebaeude
    const buildings = {};
    const pickables = [];
    const anim = { smoke: [], flags: [], rotor: null, beam: null, portal: null, runes: null, float: null, water: null, swing: null, crowd: [], donkey: null, homeFlag: null };
    for (const id in LAYOUT) {
      const [x, z] = LAYOUT[id];
      const bg = B[id](rng);
      bg.position.set(x, 0, z);
      bg.rotation.y = Math.atan2(0 - x, 9 - z);
      bg.userData.bid = id;
      world.add(bg);
      buildings[id] = bg;
      const bb = new T.Box3().setFromObject(bg);
      const size = bb.getSize(new T.Vector3());
      const center = bb.getCenter(new T.Vector3());
      const hit = new T.Mesh(new T.BoxGeometry(size.x + 0.4, size.y + 0.4, size.z + 0.4), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      hit.position.copy(center);
      hit.userData.bid = id;
      scene.add(hit);
      pickables.push(hit);
      const u = bg.userData;
      if (u.smoke) anim.smoke.push({ b: bg, p: u.smoke, parts: [] });
      if (u.flags) anim.flags.push(...u.flags);
      if (u.rotor) anim.rotor = u.rotor;
      if (u.beam) anim.beam = u.beam;
      if (u.portal) anim.portal = u.portal;
      if (u.runes) anim.runes = u.runes;
      if (u.float) anim.float = u.float;
      if (u.water) anim.water = u.water;
      if (u.swing) anim.swing = u.swing;
      if (u.donkey) anim.donkey = u.donkey;
      if (u.flag) anim.homeFlag = u.flag;
      bg.traverse((o) => {
        if (o.userData.bounce !== undefined) anim.crowd.push(o);
      });
    }
    // Rauch
    for (const s of anim.smoke) {
      for (let i = 0; i < 7; i++) {
        const m = new T.MeshToonMaterial({ color: new T.Color("#d8d8de"), gradientMap: null, transparent: true, opacity: 0.7, depthWrite: false });
        const puff = new T.Mesh(g.sph(0.3, 8, 6), m);
        puff.userData.t = i / 7;
        s.b.add(puff);
        s.parts.push(puff);
      }
    }
    // Baeume, Steine, Laternen
    const blocked = Object.values(LAYOUT).concat([[0.4, 0.6]]);
    let placed = 0;
    for (let tries = 0; tries < 400 && placed < 34; tries++) {
      const a = rng() * Math.PI * 2;
      const r = 3.5 + rng() * 8.6;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (blocked.some(([bx, bz]) => Math.hypot(bx - x, bz - z) < 3.0)) continue;
      if (Math.abs(Math.atan2(x, z)) < 0.2 && z > 0) continue;
      const tr = tree(rng, rng() < 0.45 ? 0 : 1);
      tr.position.set(x, 0, z);
      world.add(tr);
      blocked.push([x, z]);
      placed++;
    }
    for (let i = 0; i < 14; i++) {
      const a = rng() * Math.PI * 2;
      const r = 4 + rng() * 8.5;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (blocked.some(([bx, bz]) => Math.hypot(bx - x, bz - z) < 1.5)) continue;
      world.add(mesh(g.dodeca(0.3 + rng() * 0.3), toon("#9aa0a6", { flat: true }), { p: [x, 0.15, z], r: [rng(), rng(), rng()] }));
    }
    const lampMat = toon("#ffe7a3", { e: "#ffcf5a", ei: 0.4 });
    const lamps = [];
    for (const id of ["taverne", "arena", "heim", "stall", "arkanum", "ruhmeshalle"]) {
      const [x, z] = LAYOUT[id];
      const lx = x * 0.5 + 0.8;
      const lz = z * 0.5;
      world.add(mesh(g.cyl(0.05, 0.06, 1.6, 6), toon("#3a3346"), { p: [lx, 0.8, lz] }));
      const bulb = mesh(g.sph(0.16, 10, 8), lampMat, { p: [lx, 1.7, lz] });
      world.add(bulb);
      lamps.push(bulb);
    }
    for (let i = 0; i < 40; i++) {
      const a = rng() * Math.PI * 2;
      const r = 3.4 + rng() * 9;
      const c = ["#ff6f91", "#ffd25a", "#ffffff", "#9f8cff", "#ff9a3d"][i % 5];
      world.add(mesh(g.sph(0.08, 6, 6), toon(c), { p: [Math.cos(a) * r, 0.1, Math.sin(a) * r], ol: 0, shadow: false }));
    }
    // Hafen und Luftschiff
    const dock = grp([7.8, 0, -8.6], [0, -0.75, 0]);
    for (let i = 0; i < 6; i++) dock.add(mesh(g.box(1.4, 0.12, 0.45), toon("#8a5a35"), { p: [0, 0.05, -i * 0.5] }));
    for (const x of [-0.65, 0.65]) for (let i = 0; i < 3; i++) dock.add(mesh(g.cyl(0.07, 0.07, 1.2, 6), toon("#6b4a2f"), { p: [x, 0.2, -i * 1.2] }));
    world.add(dock);
    const ship = airship();
    ship.position.set(10.5, 1.2, -12.5);
    ship.rotation.y = 0.6;
    world.add(ship);
    // Nebeninseln
    const islets = [];
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + 0.6;
      const isl = grp([Math.cos(a) * (21 + i * 2), -3 + i * 1.5, Math.sin(a) * (21 + i * 2)]);
      isl.add(islandMesh(2.2 + rng() * 1.2, 3 + rng() * 2, rng, "#8cc663", "#8a7058"));
      const tr = tree(rng, i % 2);
      isl.add(tr);
      islets.push({ g: isl, ph: rng() * 6, y: isl.position.y });
      scene.add(isl);
    }
    // Wolken
    const clouds = [];
    for (let i = 0; i < 18; i++) {
      const c = cloud(rng, 1.4 + rng() * 1.8, 0.92);
      const r = 17 + rng() * 26;
      const a = rng() * Math.PI * 2;
      const y = -12 + rng() * 22;
      c.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
      clouds.push({ c, a, r, y, sp: 0.01 + rng() * 0.02 });
      scene.add(c);
    }
    // Voegel
    const birds = [];
    for (let i = 0; i < 5; i++) {
      const b = grp();
      for (const s of [1, -1]) {
        const w = mesh(g.box(0.5, 0.04, 0.14), toon("#2a2633"), { p: [0.22 * s, 0, 0], r: [0, 0, 0.3 * s], ol: 0 });
        b.add(w);
      }
      birds.push({ b, ph: rng() * 6, r: 9 + rng() * 8, h: 10 + rng() * 4, sp: 0.2 + rng() * 0.2 });
      scene.add(b);
    }

    // Held und Dorfbewohner
    let heroModel = null;
    const villagers = [];
    const villagerSpots = [[-3.4, 2.2, 0.8], [5.3, 1.4, -1.2], [-3.4, -3.6, 0.4]];
    const vr = SB.util.rng(7);
    for (const [x, z, ry] of villagerSpots) {
      const races = Object.keys(SB.data.RACES);
      const race = races[Math.floor(vr() * races.length)];
      const R0 = SB.data.RACES[race];
      const v = R.buildHero({ race, cls: "klinge", gender: vr() < 0.5 ? "m" : "w", look: { skin: R0.skins[Math.floor(vr() * 4)], hair: R0.hairs[Math.floor(vr() * 5)], hairStyle: Math.floor(vr() * 5), beard: Math.floor(vr() * 4) }, gear: {} });
      v.obj.position.set(x, 0, z);
      v.obj.rotation.y = ry;
      v.obj.scale.multiplyScalar(0.7);
      world.add(v.obj);
      villagers.push(v);
    }

    // Kamera
    const cam = { az: 0.05, pol: 0.98, rad: 34, target: new T.Vector3(0, 0.5, 0) };
    const goal = { az: 0.05, pol: 0.98, rad: 34, target: new T.Vector3(0, 0.5, 0) };
    let inset = 0;
    function updateCamera() {
      const s = Math.sin(cam.pol);
      camera.position.set(cam.target.x + cam.rad * s * Math.sin(cam.az), cam.target.y + cam.rad * Math.cos(cam.pol), cam.target.z + cam.rad * s * Math.cos(cam.az));
      camera.lookAt(cam.target);
    }

    // Beschriftungen
    const labelLayer = document.createElement("div");
    labelLayer.className = "hub-labels";
    el.appendChild(labelLayer);
    const labels = {};
    for (const bdef of SB.data.BUILDINGS) {
      const d = document.createElement("button");
      d.type = "button";
      d.className = "hub-label";
      d.dataset.bid = bdef.id;
      d.innerHTML = '<span class="hl-name"></span><span class="hl-badge" hidden></span>';
      d.querySelector(".hl-name").textContent = bdef.short;
      d.addEventListener("click", (e) => {
        e.stopPropagation();
        if (opts.onPick) opts.onPick(bdef.id);
      });
      labelLayer.appendChild(d);
      labels[bdef.id] = d;
    }
    const tmpV = new T.Vector3();
    function updateLabels(w, h) {
      for (const id in labels) {
        const bg = buildings[id];
        if (!bg) continue;
        tmpV.set(bg.position.x, LABEL_H[id] || 4, bg.position.z);
        tmpV.project(camera);
        const lab = labels[id];
        if (tmpV.z > 1) {
          lab.style.opacity = "0";
          continue;
        }
        lab.style.opacity = "";
        lab.style.transform = "translate(" + ((tmpV.x * 0.5 + 0.5) * w).toFixed(1) + "px," + ((-tmpV.y * 0.5 + 0.5) * h).toFixed(1) + "px) translate(-50%,-100%)";
      }
    }

    // Eingabe
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    let hover = null;
    let drag = null;
    const canvas = renderer.domElement;
    function pick(ev) {
      const rect = canvas.getBoundingClientRect();
      ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects(pickables, false);
      return hits.length ? hits[0].object.userData.bid : null;
    }
    function setHover(id) {
      if (hover === id) return;
      if (hover && labels[hover]) labels[hover].classList.remove("hover");
      hover = id;
      if (id && labels[id]) labels[id].classList.add("hover");
      canvas.style.cursor = id ? "pointer" : "grab";
      if (opts.onHover) opts.onHover(id);
    }
    const pointers = new Map();
    let pinchStart = 0;
    canvas.addEventListener("pointerdown", (ev) => {
      canvas.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
        drag = null;
      } else drag = { x: ev.clientX, y: ev.clientY, moved: 0, az: goal.az, pol: goal.pol };
    });
    canvas.addEventListener("pointermove", (ev) => {
      if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchStart) goal.rad = Math.max(18, Math.min(44, goal.rad * (pinchStart / d)));
        pinchStart = d;
        return;
      }
      if (drag) {
        const dx = ev.clientX - drag.x;
        const dy = ev.clientY - drag.y;
        drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
        goal.az = drag.az - dx * 0.006;
        goal.pol = Math.max(0.55, Math.min(1.25, drag.pol - dy * 0.004));
        if (drag.moved > 6) canvas.style.cursor = "grabbing";
      } else if (ev.pointerType === "mouse") setHover(pick(ev));
    });
    const endPointer = (ev) => {
      pointers.delete(ev.pointerId);
      if (drag && drag.moved < 6) {
        const id = pick(ev);
        if (id && opts.onPick) opts.onPick(id);
      }
      drag = null;
      pinchStart = 0;
      canvas.style.cursor = hover ? "pointer" : "grab";
    };
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", (ev) => {
      pointers.delete(ev.pointerId);
      drag = null;
    });
    canvas.addEventListener("pointerleave", () => setHover(null));
    canvas.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        goal.rad = Math.max(18, Math.min(44, goal.rad * (1 + Math.sign(ev.deltaY) * 0.08)));
      },
      { passive: false }
    );

    // Tageszeit
    function applyDaytime() {
      const d = new Date();
      const hrs = d.getHours() + d.getMinutes() / 60;
      const ss = (a, b, x) => Math.max(0, Math.min(1, (x - a) / (b - a)));
      const day = ss(5.5, 7.5, hrs) * (1 - ss(19, 21, hrs));
      const dusk = Math.max(0, 1 - Math.abs(hrs - 20) / 1.3) + Math.max(0, 1 - Math.abs(hrs - 6.5) / 1.2);
      const night = 1 - day;
      const lerp = (a, b, t) => "#" + new T.Color(a).lerp(new T.Color(b), t).getHexString();
      let top = lerp("#1b2350", "#5fb0ff", day);
      let bot = lerp("#3a3f78", "#dff3ff", day);
      if (dusk > 0) {
        bot = lerp(bot, "#ffb38a", Math.min(0.7, dusk));
        top = lerp(top, "#6a6fb8", Math.min(0.4, dusk));
      }
      sky.userData.recolor(top, bot);
      scene.fog.color.set(bot);
      hemi.intensity = 0.55 + 0.75 * day;
      sun.intensity = 0.6 + 1.9 * day;
      sun.color.set(day > 0.5 ? "#fff4dc" : "#9fb7ff");
      starMat.opacity = Math.max(0, night - 0.2);
      lampMat.emissiveIntensity = 0.4 + 1.4 * night;
      return night;
    }
    let night = applyDaytime();
    let dayTimer = 0;

    let running = true;
    let raf = 0;
    let last = performance.now();
    let w = 1;
    let h = 1;
    function resize() {
      w = Math.max(1, el.clientWidth);
      h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      if (inset > 0) camera.setViewOffset(w + inset, h, inset, 0, w, h);
      else camera.clearViewOffset();
      camera.updateProjectionMatrix();
      goal.rad = Math.max(goal.rad, w < 640 ? 40 : 30);
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();

    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!running || document.hidden) {
        last = now;
        return;
      }
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      const t = now / 1000;
      const k = 1 - Math.pow(0.0015, dt);
      cam.az += (goal.az - cam.az) * k;
      cam.pol += (goal.pol - cam.pol) * k;
      cam.rad += (goal.rad - cam.rad) * k;
      cam.target.lerp(goal.target, k);
      updateCamera();
      // Animationen
      for (const s of anim.smoke) {
        for (const p of s.parts) {
          p.userData.t = (p.userData.t + dt * 0.18) % 1;
          const u = p.userData.t;
          p.position.set(s.p[0] + Math.sin(u * 6 + t) * 0.2, s.p[1] + u * 2.6, s.p[2]);
          p.scale.setScalar(0.4 + u * 1.4);
          p.material.opacity = 0.75 * (1 - u);
        }
      }
      for (const f of anim.flags) f.rotation.y = Math.sin(t * 3 + f.position.x) * 0.35;
      if (anim.rotor) anim.rotor.rotation.z += dt * 1.2;
      if (anim.beam) {
        anim.beam.rotation.y += dt * 0.8;
        anim.beam.children[0].material.opacity = 0.05 + 0.18 * night;
      }
      if (anim.portal) anim.portal.rotation.z -= dt * 1.4;
      if (anim.runes)
        anim.runes.forEach((r, i) => {
          const a = t * 0.8 + (i * Math.PI) / 2;
          r.position.set(Math.cos(a) * 1.9, 2.0 + Math.sin(t * 2 + i) * 0.3, Math.sin(a) * 0.8 + 0.4);
          r.rotation.y = -a;
        });
      if (anim.float) {
        anim.float.position.y = 7.6 + Math.sin(t * 1.5) * 0.25;
        anim.float.rotation.y += dt;
      }
      if (anim.water) anim.water.emissiveIntensity = 0.35 + Math.sin(t * 2) * 0.12;
      if (anim.swing) anim.swing.rotation.x = Math.sin(t * 1.7) * 0.12;
      if (anim.donkey) anim.donkey.rotation.y = Math.sin(t * 0.4) * 0.6;
      if (anim.homeFlag) anim.homeFlag.rotation.y = Math.sin(t * 3) * 0.3;
      for (const c of anim.crowd) c.position.y = 1.5 + Math.max(0, Math.sin(t * 6 + c.userData.bounce)) * 0.15;
      ship.position.y = 1.2 + Math.sin(t * 0.8) * 0.25;
      ship.userData.prop.rotation.x += dt * 8;
      for (const is of islets) is.g.position.y = is.y + Math.sin(t * 0.5 + is.ph) * 0.4;
      for (const cl of clouds) {
        cl.a += dt * cl.sp;
        cl.c.position.set(Math.cos(cl.a) * cl.r, cl.y, Math.sin(cl.a) * cl.r);
      }
      for (const bd of birds) {
        const a = t * bd.sp + bd.ph;
        bd.b.position.set(Math.cos(a) * bd.r, bd.h + Math.sin(t + bd.ph) * 0.6, Math.sin(a) * bd.r);
        bd.b.rotation.y = -a;
        bd.b.children.forEach((w, i) => (w.rotation.z = (i ? -1 : 1) * (0.3 + Math.sin(t * 9 + bd.ph) * 0.4)));
      }
      for (const id in buildings) {
        const b = buildings[id];
        const target = id === hover ? 1.06 : 1;
        const s = b.scale.x + (target - b.scale.x) * Math.min(1, dt * 10);
        b.scale.setScalar(s);
      }
      if (heroModel) heroModel.update(dt);
      for (const v of villagers) v.update(dt);
      dayTimer += dt;
      if (dayTimer > 30) {
        dayTimer = 0;
        night = applyDaytime();
      }
      renderer.render(scene, camera);
      updateLabels(w, h);
    }
    raf = requestAnimationFrame(frame);

    return {
      setHero(desc) {
        if (heroModel) world.remove(heroModel.obj);
        heroModel = R.buildHero(desc);
        heroModel.obj.position.set(2.2, 0, 2.6);
        heroModel.obj.rotation.y = 0.2;
        heroModel.obj.scale.multiplyScalar(0.95);
        world.add(heroModel.obj);
      },
      cheer() {
        if (heroModel) heroModel.play("victory", 1.2);
      },
      setBadges(map) {
        for (const id in labels) {
          const b = labels[id].querySelector(".hl-badge");
          const v = map && map[id];
          b.hidden = !v;
          b.textContent = v || "";
          labels[id].classList.toggle("ready", !!v);
        }
      },
      focus(id) {
        if (id && buildings[id]) {
          const p = buildings[id].position;
          goal.target.set(p.x * 0.85, 1.0, p.z * 0.85);
          goal.rad = 20;
          goal.az = Math.atan2(p.x, p.z + 12) * 0.6;
          goal.pol = 0.95;
        } else {
          goal.target.set(0, 0.5, 0);
          goal.rad = w < 640 ? 40 : 34;
          goal.pol = 0.98;
        }
      },
      setInset(px) {
        inset = Math.max(0, Math.round(px || 0));
        resize();
      },
      pause() {
        running = false;
      },
      resume() {
        running = true;
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        labelLayer.remove();
        killRenderer(renderer);
      },
    };
  };

  /* ---------- Heldenansicht ---------- */
  R.createHeroView = function (el, opts) {
    init();
    opts = opts || {};
    const renderer = makeRenderer(el, { alpha: true, maxDpr: 2 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(30, 1, 0.1, 100);
    const dist = opts.distance || 7.2;
    camera.position.set(0, 1.55 + (dist - 7.2) * 0.08, dist);
    camera.lookAt(0, opts.lookY || 1.15, 0);
    scene.add(new T.HemisphereLight("#f4f8ff", "#6a5a4a", 1.4));
    const key = new T.DirectionalLight("#fff2dc", 2.2);
    key.position.set(3, 5, 4);
    scene.add(key);
    const rim = new T.DirectionalLight("#9fc9ff", 1.2);
    rim.position.set(-4, 3, -3);
    scene.add(rim);
    const ped = grp();
    ped.add(mesh(g.cyl(1.1, 1.25, 0.3, 28), toon("#3a4a5a"), { p: [0, -0.15, 0] }));
    ped.add(mesh(g.torus(1.12, 0.05, Math.PI * 2, 6, 40), toon("#d9a441"), { p: [0, 0, 0], r: [Math.PI / 2, 0, 0], ol: 0 }));
    scene.add(ped);
    let model = null;
    let rotY = 0.35;
    let goalY = 0.35;
    let dragX = null;
    const canvas = renderer.domElement;
    canvas.addEventListener("pointerdown", (e) => {
      dragX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (dragX == null) return;
      goalY += (e.clientX - dragX) * 0.012;
      dragX = e.clientX;
    });
    canvas.addEventListener("pointerup", () => (dragX = null));
    canvas.addEventListener("pointercancel", () => (dragX = null));
    let raf = 0;
    let last = performance.now();
    function resize() {
      const w = Math.max(1, el.clientWidth);
      const h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      rotY += (goalY - rotY) * Math.min(1, dt * 8);
      if (model) {
        model.obj.rotation.y = rotY;
        model.update(dt);
      }
      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);
    return {
      set(desc, celebrate) {
        if (model) scene.remove(model.obj);
        model = R.buildFighter(desc);
        scene.add(model.obj);
        const box3 = new T.Box3().setFromObject(model.obj);
        const hgt = box3.max.y - box3.min.y;
        const s = hgt > 2.6 ? 2.6 / hgt : 1;
        model.obj.scale.multiplyScalar(s);
        if (celebrate) model.play("victory", 1.1);
      },
      play(name, dur) {
        if (model) model.play(name, dur);
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        killRenderer(renderer);
      },
    };
  };

  /* ---------- Portraits ---------- */
  let snapR = null;
  let snapScene = null;
  let snapCam = null;
  const snapCache = new Map();
  R.snapshot = function (desc, size, bust) {
    if (!R.ready()) return null;
    init();
    size = size || 160;
    const key = JSON.stringify(desc) + "|" + size + "|" + (bust ? 1 : 0);
    if (snapCache.has(key)) return snapCache.get(key);
    try {
      if (!snapR) {
        snapR = makeRenderer(null, { alpha: true, preserve: true, maxDpr: 1 });
        snapScene = new T.Scene();
        snapScene.add(new T.HemisphereLight("#f4f8ff", "#6a5a4a", 1.5));
        const k = new T.DirectionalLight("#fff2dc", 2.2);
        k.position.set(3, 5, 5);
        snapScene.add(k);
        snapCam = new T.PerspectiveCamera(30, 1, 0.1, 100);
      }
      snapR.setSize(size, size, false);
      const model = R.buildFighter(desc);
      model.update(0.016);
      model.obj.rotation.y = desc.kind === "monster" ? 0.5 : 0.35;
      snapScene.add(model.obj);
      const box3 = new T.Box3().setFromObject(model.obj);
      const c = box3.getCenter(new T.Vector3());
      const sz = box3.getSize(new T.Vector3());
      let span = Math.max(sz.y, sz.x * 0.9);
      if (bust) {
        span = Math.max(sz.y * 0.5, sz.x * 0.7);
        c.y = box3.max.y - span * 0.52;
      }
      const dist = (span / (2 * Math.tan((30 * Math.PI) / 360))) * 1.12;
      snapCam.position.set(c.x, c.y + span * 0.08, c.z + dist + sz.z * 0.5);
      snapCam.lookAt(c.x, c.y, c.z);
      snapR.setClearColor(0x000000, 0);
      snapR.render(snapScene, snapCam);
      const url = snapR.domElement.toDataURL("image/png");
      snapScene.remove(model.obj);
      snapCache.set(key, url);
      return url;
    } catch (e) {
      console.warn("Portrait fehlgeschlagen", e);
      return null;
    }
  };

  /* ---------- Kampfbuehne ---------- */
  R.createBattle = function (el, opts) {
    init();
    const renderer = makeRenderer(el, { maxDpr: 2 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(36, 1, 0.1, 400);
    const setting = opts.setting || "quest";
    const themes = {
      quest: { top: "#6fb6ff", bottom: "#e6f6ff", ground: "#8cc663", rock: "#8a7058", fog: "#e6f6ff", hemi: 1.3, sun: 2.3 },
      arena: { top: "#ff9a6a", bottom: "#ffe2b8", ground: "#e8d29a", rock: "#9a8a6a", fog: "#ffe2b8", hemi: 1.25, sun: 2.3 },
      dungeon: { top: "#140f24", bottom: "#3b2a5a", ground: "#4a4558", rock: "#2a2633", fog: "#2a1f40", hemi: 0.7, sun: 1.0 },
    };
    const th = Object.assign({}, themes[setting] || themes.quest);
    if (opts.tint && setting === "dungeon") th.bottom = new T.Color(opts.tint).multiplyScalar(0.45).getHexString().replace(/^/, "#");
    scene.add(skyDome(th.top, th.bottom));
    scene.fog = new T.Fog(th.fog, 25, 90);
    scene.add(new T.HemisphereLight("#f0f6ff", "#5a4a3a", th.hemi));
    const sun = new T.DirectionalLight(setting === "dungeon" ? "#b9a6ff" : "#fff2dc", th.sun);
    sun.position.set(4, 9, 6);
    scene.add(sun);
    const rng = SB.util.rng(setting.length * 17 + 3);
    const stage = islandMesh(7, 6, rng, th.ground, th.rock);
    scene.add(stage);
    const flickers = [];
    if (setting === "arena") {
      const wall = new T.CylinderGeometry(9, 9.4, 2.4, 40, 1, true, Math.PI * 0.42, Math.PI * 1.16);
      scene.add(mesh(wall, toon("#c9b89a", { ds: true, flat: true }), { p: [0, 1.2, 0], ol: 0 }));
      for (let i = 0; i < 70; i++) {
        const a = Math.PI * 0.5 + (i / 70) * Math.PI;
        const row = i % 2;
        const c = ["#e0644f", "#4fa9ff", "#ffd25a", "#74d86f", "#c47bff", "#f2cba8", "#ffffff"][i % 7];
        const s = mesh(g.sph(0.28, 8, 6), toon(c), { p: [Math.sin(a) * (9.3 + row * 0.8), 2.6 + row * 0.6, Math.cos(a) * (9.3 + row * 0.8)], ol: 0 });
        s.userData.bounce = rng() * 6;
        scene.add(s);
        flickers.push(s);
      }
      for (const x of [-6, 6]) {
        const p = grp([x, 0, -5.5]);
        p.add(mesh(g.cyl(0.1, 0.1, 5, 6), toon("#6b4a2f"), { p: [0, 2.5, 0] }));
        p.add(mesh(g.box(1.4, 0.9, 0.04), toon(x < 0 ? "#c0392b" : "#2f6fbf", { ds: true }), { p: [0.72, 4.4, 0] }));
        scene.add(p);
      }
    } else if (setting === "dungeon") {
      for (const x of [-5.5, 5.5]) {
        const p = grp([x, 0, -3.5]);
        p.add(mesh(g.box(0.9, 5, 0.9), toon("#3a3346", { flat: true }), { p: [0, 2.5, 0] }));
        p.add(mesh(g.cone(0.25, 0.6, 6), toon("#ff9a3d", { e: "#ff7a1a", ei: 1.5 }), { p: [0, 5.3, 0.5], ol: 0 }));
        const pl = new T.PointLight("#ff9a3d", 12, 14, 1.5);
        pl.position.set(0, 5.4, 0.8);
        p.add(pl);
        flickers.push(pl);
        scene.add(p);
      }
      for (let i = 0; i < 6; i++) scene.add(mesh(g.octa(0.3 + rng() * 0.4), toon(opts.tint || "#c47bff", { e: opts.tint || "#c47bff", ei: 0.8 }), { p: [-6 + rng() * 12, 0.3, -2 - rng() * 3], r: [rng(), rng(), rng()] }));
    } else {
      for (let i = 0; i < 5; i++) {
        const tr = tree(rng, i % 2);
        tr.position.set(-5.5 + i * 2.7 + rng(), 0, -3.5 - rng() * 1.5);
        scene.add(tr);
      }
    }
    const clouds = [];
    for (let i = 0; i < 10; i++) {
      const c = cloud(rng, 2 + rng() * 2, setting === "dungeon" ? 0.25 : 0.95);
      c.position.set(-40 + rng() * 80, -8 + rng() * 14, -30 - rng() * 30);
      scene.add(c);
      clouds.push(c);
    }

    // Kaempfer
    const overlay = document.createElement("div");
    overlay.className = "battle-fx";
    el.appendChild(overlay);
    const portrait = el.clientWidth < el.clientHeight;
    const sep = portrait ? 2.5 : 2.7;
    const F = [opts.left, opts.right].map((desc, i) => {
      const m = R.buildFighter(desc);
      const side = i === 0 ? -1 : 1;
      const home = new T.Vector3(side * sep, 0, 0.4);
      m.obj.position.copy(home);
      m.obj.rotation.y = side < 0 ? Math.PI / 2 - 0.55 : -Math.PI / 2 + 0.55;
      const box3 = new T.Box3().setFromObject(m.obj);
      const hgt = box3.max.y - box3.min.y;
      if (hgt > 3.6) {
        const s = 3.6 / hgt;
        m.obj.scale.multiplyScalar(s);
        m.headY *= s;
      }
      const sh = new T.Mesh(new T.CircleGeometry(1, 24), basic("#000000", 0.25));
      sh.rotation.x = -Math.PI / 2;
      sh.position.set(home.x, 0.02, home.z);
      sh.scale.setScalar(desc.kind === "monster" && (desc.arch === "drache" || desc.arch === "golem") ? 1.4 : 0.9);
      scene.add(sh);
      scene.add(m.obj);
      return { m, home, side, shadow: sh, desc };
    });

    let speed = 1;
    let w = 1;
    let h = 1;
    let shake = 0;
    const camBase = new T.Vector3(0, 2.7, 9.0);
    const lookY = 1.45;
    const tweens = [];
    function resize() {
      w = Math.max(1, el.clientWidth);
      h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      camera.fov = w / h < 1 ? 50 : 36;
      // Beide Kaempfer muessen in die Breite passen
      const halfW = sep + (portrait ? 1.15 : 1.6);
      const tanH = Math.tan((camera.fov * Math.PI) / 360) * camera.aspect;
      camBase.z = Math.max(9.0, halfW / tanH);
      camBase.y = 2.7 + (camBase.z - 9) * 0.1;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();
    let raf = 0;
    let last = performance.now();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      const t = now / 1000;
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        tw.t += dt * speed;
        const u = Math.min(1, tw.t / tw.dur);
        tw.fn(u);
        if (u >= 1) {
          tweens.splice(i, 1);
          tw.res();
        }
      }
      for (const f of F) {
        f.m.speed = speed;
        f.m.update(dt * speed);
        f.shadow.position.x = f.m.obj.position.x;
      }
      for (const c of flickers) {
        if (c.isLight) c.intensity = 10 + Math.sin(t * 13 + c.position.x) * 2 + Math.random() * 2;
        else c.position.y = 2.6 + Math.max(0, Math.sin(t * 7 + c.userData.bounce)) * 0.25 + (c.position.y > 3 ? 0.6 : 0);
      }
      for (const c of clouds) c.position.x += dt * 0.4;
      camera.position.copy(camBase);
      if (shake > 0) {
        shake -= dt;
        camera.position.x += (Math.random() - 0.5) * 0.25;
        camera.position.y += (Math.random() - 0.5) * 0.25;
      }
      camera.lookAt(0, lookY, 0);
      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);

    const tween = (dur, fn) => new Promise((res) => tweens.push({ t: 0, dur, fn, res }));
    const wait = (dur) => tween(dur, () => {});
    const tmp = new T.Vector3();
    function screenPos(f, yOff) {
      tmp.set(f.m.obj.position.x, (f.m.headY || 1.8) + (yOff || 0.3), f.m.obj.position.z);
      tmp.project(camera);
      return { x: (tmp.x * 0.5 + 0.5) * w, y: (-tmp.y * 0.5 + 0.5) * h };
    }
    function floatText(f, text, cls) {
      const p = screenPos(f, 0.35);
      const d = document.createElement("div");
      d.className = "fx-text " + (cls || "");
      d.textContent = text;
      d.style.left = p.x + (Math.random() - 0.5) * 30 + "px";
      d.style.top = p.y + "px";
      d.style.animationDuration = 1.1 / Math.sqrt(speed) + "s";
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 1400);
    }
    function banner(text, side) {
      const d = document.createElement("div");
      d.className = "fx-banner " + (side < 0 ? "left" : "right");
      d.textContent = text;
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 1300 / speed + 200);
    }
    function burst(pos, color, n, spread) {
      const parts = [];
      for (let i = 0; i < n; i++) {
        const p = new T.Mesh(g.sph(0.08, 6, 4), glow(color, 0.9));
        p.position.copy(pos);
        p.userData.v = new T.Vector3((Math.random() - 0.5) * spread, Math.random() * spread, (Math.random() - 0.5) * spread);
        scene.add(p);
        parts.push(p);
      }
      tween(0.5, (u) => {
        for (const p of parts) {
          p.position.addScaledVector(p.userData.v, 0.03);
          p.userData.v.y -= 0.08;
          p.scale.setScalar(1 - u);
        }
        if (u >= 1) parts.forEach((p) => scene.remove(p));
      });
    }
    function ring(f, color) {
      const r = new T.Mesh(g.torus(0.6, 0.08, Math.PI * 2, 6, 32), glow(color, 0.85));
      r.rotation.x = Math.PI / 2;
      r.position.set(f.m.obj.position.x, 0.15, f.m.obj.position.z);
      scene.add(r);
      return tween(0.45, (u) => {
        r.scale.setScalar(1 + u * 3);
        r.material.opacity = 0.85 * (1 - u);
        if (u >= 1) {
          scene.remove(r);
          r.material.opacity = 0.85;
        }
      });
    }
    function stunStars(f) {
      const s = grp();
      for (let i = 0; i < 3; i++) s.add(mesh(g.octa(0.1), toon("#ffe45a", { e: "#ffe45a", ei: 1 }), { p: [Math.cos((i * Math.PI * 2) / 3) * 0.45, 0, Math.sin((i * Math.PI * 2) / 3) * 0.45], ol: 0 }));
      s.position.set(f.m.obj.position.x, (f.m.headY || 1.8) + 0.35, f.m.obj.position.z);
      scene.add(s);
      f.stars = s;
      tween(99, (u) => (s.rotation.y = u * 300));
    }
    function clearStars(f) {
      if (f.stars) {
        scene.remove(f.stars);
        f.stars = null;
      }
    }
    async function projectile(A, Bf, kind, color) {
      const start = new T.Vector3(A.m.obj.position.x + A.side * -0.6, (A.m.headY || 1.8) * 0.65, A.m.obj.position.z);
      const end = new T.Vector3(Bf.m.obj.position.x, (Bf.m.headY || 1.8) * 0.6, Bf.m.obj.position.z);
      let obj;
      if (kind === "arrow") {
        obj = grp();
        obj.add(mesh(g.cyl(0.025, 0.025, 1.0, 5), toon("#c9b89a"), { r: [0, 0, Math.PI / 2], ol: 0 }));
        obj.add(mesh(g.cone(0.07, 0.2, 5), toon("#c8ced6"), { p: [0.55, 0, 0], r: [0, 0, -Math.PI / 2], ol: 0 }));
        if (A.side > 0) obj.rotation.y = Math.PI;
      } else {
        obj = grp();
        obj.add(mesh(g.sph(kind === "star" ? 0.38 : 0.22, 12, 10), toon(color, { e: color, ei: 1.5 }), { ol: 0 }));
        obj.add(mesh(g.sph(kind === "star" ? 0.7 : 0.42, 12, 10), glow(color, 0.45), { ol: 0 }));
      }
      obj.position.copy(start);
      scene.add(obj);
      const trail = [];
      await tween(kind === "arrow" ? 0.28 : 0.38, (u) => {
        obj.position.lerpVectors(start, end, u);
        obj.position.y += Math.sin(u * Math.PI) * (kind === "arrow" ? 0.5 : 0.3);
        if (kind !== "arrow" && Math.random() < 0.6) {
          const p = new T.Mesh(g.sph(0.1, 6, 4), glow(color, 0.6));
          p.position.copy(obj.position);
          scene.add(p);
          trail.push(p);
        }
        trail.forEach((p) => p.scale.multiplyScalar(0.9));
      });
      scene.remove(obj);
      trail.forEach((p) => scene.remove(p));
      burst(end, color, kind === "star" ? 18 : 8, kind === "star" ? 3 : 1.6);
    }
    const hp = [opts.hp ? opts.hp[0] : 1, opts.hp ? opts.hp[1] : 1];
    async function impact(ev, A, Bf, hit, idx) {
      const def = 1 - ev.a;
      if (hit.res === "evade") {
        const dx = -Bf.side * -0.0 + Bf.side * 0.6;
        Bf.m.play("evade", 0.4);
        tween(0.4, (u) => (Bf.m.obj.position.x = Bf.home.x + Math.sin(u * Math.PI) * dx));
        floatText(Bf, "Ausgewichen!", "evade");
        if (opts.sfx) opts.sfx("evade");
      } else if (hit.res === "block") {
        Bf.m.play("block", 0.4);
        burst(new T.Vector3(Bf.m.obj.position.x - Bf.side * 0.6, 1.4, Bf.m.obj.position.z), "#ffe27a", 10, 2);
        floatText(Bf, "Geblockt!", "block");
        if (opts.sfx) opts.sfx("block");
      } else {
        hp[def] = Math.max(0, hp[def] - hit.dmg);
        Bf.m.play("hit", 0.35);
        Bf.m.flash(0.09);
        tween(0.3, (u) => (Bf.m.obj.position.x = Bf.home.x + Bf.side * Math.sin(u * Math.PI) * (hit.res === "crit" ? 0.6 : 0.3)));
        floatText(Bf, SB.util.fmt(hit.dmg), hit.res === "crit" ? "crit" : "dmg");
        if (hit.res === "crit") {
          shake = 0.25;
          floatText(Bf, "Kritisch!", "critlabel");
        }
        burst(new T.Vector3(Bf.m.obj.position.x, (Bf.m.headY || 1.8) * 0.6, Bf.m.obj.position.z), hit.res === "crit" ? "#ffb13b" : "#ffffff", hit.res === "crit" ? 14 : 7, 1.8);
        if (opts.sfx) opts.sfx(hit.res === "crit" ? "crit" : "hit");
      }
      if (opts.onImpact) opts.onImpact(def, hp[def], ev, idx);
    }

    async function play(ev) {
      const A = F[ev.a];
      const Bf = F[1 - ev.a];
      if (ev.kind === "stun") {
        floatText(A, "Betäubt!", "stun");
        A.m.play("hit", 0.4);
        await wait(0.7);
        clearStars(A);
        return;
      }
      const special = ev.kind === "special";
      if (special) {
        banner(ev.spName || "Spezialangriff", A.side);
        ring(A, A.m.projColor || "#ffd25a");
        if (opts.sfx) opts.sfx("special");
        await wait(0.35);
      }
      const isHero = A.desc.kind !== "monster";
      const bowLike = isHero && (A.m.weaponBase === "bogen" || A.m.weaponBase === "armbrust");
      const spell = (isHero && A.desc.cls === "rune") || (!isHero && A.m.ranged);
      if (bowLike || spell) {
        for (let i = 0; i < ev.hits.length; i++) {
          A.m.play(bowLike ? "shoot" : "cast", 0.5);
          await wait(bowLike ? 0.28 : 0.3);
          if (opts.sfx) opts.sfx(bowLike ? "bow" : "spell");
          const kind = bowLike ? "arrow" : ev.sp === "sternenbruch" ? "star" : "orb";
          await projectile(A, Bf, kind, A.m.projColor || "#c47bff");
          await impact(ev, A, Bf, ev.hits[i], i);
          await wait(ev.hits.length > 1 ? 0.12 : 0.3);
        }
      } else {
        const target = Bf.home.x - Bf.side * (Bf.desc.kind === "monster" ? 1.8 : 1.4);
        const from = A.home.x;
        if (special && ev.sp === "zermalmen") A.m.play("special", 0.6);
        else A.m.play("walk", 0.3);
        await tween(0.26, (u) => (A.m.obj.position.x = from + (target - from) * u));
        for (let i = 0; i < ev.hits.length; i++) {
          A.m.play("attack", 0.42);
          if (opts.sfx) opts.sfx("swing");
          await wait(0.22);
          await impact(ev, A, Bf, ev.hits[i], i);
          await wait(0.18);
        }
        await tween(0.26, (u) => (A.m.obj.position.x = target + (from - target) * u));
      }
      if (ev.stun) {
        floatText(Bf, "Betäubt!", "stun");
        stunStars(Bf);
      }
      await wait(0.15);
    }

    return {
      play,
      setSpeed(s) {
        speed = s;
      },
      async finish(winner) {
        const W = F[winner];
        const L = F[1 - winner];
        clearStars(L);
        L.m.play("defeat", 0.9);
        if (opts.sfx) opts.sfx("ko");
        await wait(0.6);
        W.m.play("victory", 1.4);
        burst(new T.Vector3(W.m.obj.position.x, 2.2, W.m.obj.position.z), "#ffd25a", 22, 3);
        await wait(1.2);
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        overlay.remove();
        killRenderer(renderer);
      },
    };
  };
})();

</script>
<script>/* src/ui-core.js */
/* Helden von Schwebfels - Oberflaechen-Kern: Leisten, Panels, Tooltips, Hinweise, Zeitgeber. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const E = SB.engine;
  const U = SB.util;
  const I = SB.icons;
  const UI = (SB.ui = SB.ui || {});

  UI.S = null;
  UI.hub = null;
  UI.use3d = false;
  UI.panelId = null;
  UI.tabs = {};
  UI.qty = 1;
  UI.ACTIONS = {};
  UI.PANELS = {};
  const $ = (sel, root) => (root || document).querySelector(sel);
  UI.$ = $;
  const esc = U.esc;

  /* ---------- Portraits ---------- */
  UI.NPC_LOOK = {
    hulda: { race: "wolkling", gender: "w", cls: "rune", look: { skin: "#e8b48f", hair: "#c9532f", hairStyle: 3, beard: 0 }, gear: { ruestung: { base: "robe", tint: "#e9dcc0", style: 0 } } },
    brumm: { race: "steinbart", gender: "m", cls: "klinge", look: { skin: "#c99878", hair: "#9b3d24", hairStyle: 4, beard: 2 }, gear: { ruestung: { base: "harnisch", tint: "#5a4a3a", style: 0 }, handschuhe: { base: "handschuhe", tint: "#4a3a30" } } },
    zinnober: { race: "nebelalb", gender: "w", cls: "rune", look: { skin: "#e9e0f2", hair: "#c7a6e0", hairStyle: 2, beard: 0 }, gear: { helm: { base: "hut", tint: "#8f3f8f", rarity: "episch" }, ruestung: { base: "robe", tint: "#5b3fa8", style: 1 } } },
    funzel: { race: "wolkling", gender: "m", cls: "wind", look: { skin: "#e8b48f", hair: "#e8e2d6", hairStyle: 4, beard: 3 }, gear: { helm: { base: "kappe", tint: "#ffcf3a" }, ruestung: { base: "wams", tint: "#ffcf3a" } } },
    krawall: { race: "hornvolk", gender: "w", cls: "klinge", look: { skin: "#8f5c8c", hair: "#1f1f24", hairStyle: 2, beard: 0 }, gear: { helm: { base: "helm", tint: "#c9a441", style: 2 }, ruestung: { base: "harnisch", tint: "#c0392b", style: 1 }, umhang: { base: "umhang", tint: "#c9a441" } } },
    hufnagel: { race: "moosling", gender: "w", cls: "wind", look: { skin: "#a9c98f", hair: "#6aa84f", hairStyle: 3, beard: 0 }, gear: { ruestung: { base: "wams", tint: "#8a5a35" } } },
    ottilie: { race: "wolkling", gender: "w", cls: "klinge", look: { skin: "#dba27a", hair: "#3b2a20", hairStyle: 2, beard: 0 }, gear: { helm: { base: "kappe", tint: "#2f4f8f" }, ruestung: { base: "harnisch", tint: "#2f4f8f", style: 2 }, umhang: { base: "umhang", tint: "#c0392b" } } },
  };
  UI.heroDesc = (S) => ({ kind: "hero", race: S.race, cls: S.cls, gender: S.gender, look: S.look, gear: E.gearVisual(S.equip) });
  UI.fighterDesc = function (f) {
    if (f.kind === "monster") return { kind: "monster", arch: f.arch, color: f.color, accent: f.accent, boss: !!f.boss, final: !!f.final };
    return { kind: "hero", race: f.race, cls: f.cls, gender: f.gender, look: f.look, gear: f.gear };
  };
  UI.monDesc = (m, boss, final) => ({ kind: "monster", arch: m.arch, color: m.color, accent: m.accent, boss: !!boss, final: !!final });
  UI.portrait = function (desc, size, bust) {
    const url = UI.use3d ? SB.R3D.snapshot(desc, size || 128, bust) : null;
    if (url) return '<img alt="" src="' + url + '">';
    return I.silhouette(desc.kind === "monster" ? desc.color : desc.gear && desc.gear.ruestung ? desc.gear.ruestung.tint : "#7f8a96", desc.kind);
  };
  UI.npcPortrait = (id) => (UI.NPC_LOOK[id] ? UI.portrait(Object.assign({ kind: "hero" }, UI.NPC_LOOK[id]), 128, true) : "");
  UI.heroPortrait = (S) => UI.portrait(UI.heroDesc(S), 128, true);

  /* ---------- Speichern ---------- */
  let saveTimer = 0;
  UI.save = function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => SB.store.save(UI.S), 300);
  };
  UI.saveNow = function () {
    clearTimeout(saveTimer);
    SB.store.save(UI.S);
  };

  /* ---------- Formatierung ---------- */
  UI.gold = (n) => '<span class="num">' + U.fmt(n) + "</span> " + I.ui("gold");
  UI.perlen = (n) => '<span class="num">' + U.fmt(n) + "</span> " + I.ui("perle");
  UI.gauge = function (val, max) {
    const pct = Math.max(0, Math.min(1, val / max));
    const a = Math.PI * (1 - pct);
    const cx = 20;
    const cy = 23;
    const ex = (cx + Math.cos(a) * 13).toFixed(2);
    const ey = (cy - Math.sin(a) * 13).toFixed(2);
    const nx = (cx + Math.cos(a) * 11).toFixed(2);
    const ny = (cy - Math.sin(a) * 11).toFixed(2);
    const col = pct < 0.15 ? "#ff7a59" : pct < 0.4 ? "#f3d08a" : "#52d1b4";
    let ticks = "";
    for (let i = 0; i <= 4; i++) {
      const t = Math.PI * (1 - i / 4);
      ticks += '<path d="M' + (cx + Math.cos(t) * 15.5).toFixed(1) + " " + (cy - Math.sin(t) * 15.5).toFixed(1) + " L" + (cx + Math.cos(t) * 17.5).toFixed(1) + " " + (cy - Math.sin(t) * 17.5).toFixed(1) + '" stroke="#dcaa4a" stroke-width="1.3"/>';
    }
    return (
      '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#0a141b" stroke="#dcaa4a" stroke-width="2"/>' +
      ticks +
      '<path d="M7 23 A13 13 0 0 1 33 23" fill="none" stroke="#24414d" stroke-width="4" stroke-linecap="round"/>' +
      (pct > 0.005 ? '<path d="M7 23 A13 13 0 0 1 ' + ex + " " + ey + '" fill="none" stroke="' + col + '" stroke-width="4" stroke-linecap="round"/>' : "") +
      '<path d="M20 23 L' + nx + " " + ny + '" stroke="#f3ead6" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="23" r="2.6" fill="#dcaa4a" stroke="#1c1626" stroke-width="1"/>' +
      '<text x="20" y="35.5" text-anchor="middle" font-size="7" font-weight="800" fill="#f3ead6" font-family="sans-serif">' + Math.floor(val) + "</text></svg>"
    );
  };

  /* ---------- Toasts ---------- */
  UI.toast = function (text, kind, icon) {
    const box = $("#toasts");
    if (!box) return;
    const t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.innerHTML = (icon ? I.ui(icon) : "") + "<span></span>";
    t.querySelector("span").textContent = text;
    box.appendChild(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => {
      t.classList.add("out");
      setTimeout(() => t.remove(), 400);
    }, 3800);
  };
  SB.bus.on("toast", (p) => UI.toast(p.text, p.kind === "info" ? "" : p.kind));
  SB.bus.on("levelup", (p) => {
    UI.toast("Stufe " + p.level + " erreicht! Eine Wolkenperle als Belohnung.", "gold", "xp");
    SB.audio.play("levelup");
    if (UI.hub) UI.hub.cheer();
  });
  SB.bus.on("achievement", (a) => {
    UI.toast("Abzeichen „" + a.name + "“: +" + a.perlen + (a.perlen === 1 ? " Wolkenperle" : " Wolkenperlen"), "gold", "abzeichen");
  });
  SB.bus.on("remote", () => {
    if (UI.panelId === "arena" || UI.panelId === "ruhmeshalle") UI.renderPanel();
  });

  /* ---------- Gegenstands-Karten ---------- */
  UI.itemRef = function (ref) {
    const S = UI.S;
    const p = String(ref).split(":");
    if (p[0] === "inv") return S.inv[+p[1]];
    if (p[0] === "eq") return S.equip[p[1]];
    if (p[0] === "shop") return S.shops[p[1]] && S.shops[p[1]].items[+p[2]];
    if (p[0] === "offer") return S.quest.offers[+p[1]] && S.quest.offers[+p[1]].item;
    if (p[0] === "tmp") return UI.tmpItems[+p[1]];
    return null;
  };
  UI.tmpItems = [];
  UI.tmpRef = function (item) {
    UI.tmpItems.push(item);
    if (UI.tmpItems.length > 40) UI.tmpItems.shift();
    return "tmp:" + (UI.tmpItems.length - 1);
  };
  UI.slotName = (it) => D.SLOT_INFO[it.slot].name;
  UI.isUpgrade = function (it) {
    const S = UI.S;
    if (!it || !E.canEquip(S, it)) return false;
    return E.itemScore(it, S.cls) > E.itemScore(S.equip[it.slot], S.cls) * 1.001;
  };
  UI.itemCard = function (it, opts) {
    opts = opts || {};
    const S = UI.S;
    const R = D.RARITIES[it.rarity];
    const lines = [];
    if (it.min) lines.push(["schaden", "Schaden", U.fmt(it.min) + " bis " + U.fmt(it.max)]);
    if (it.armor) lines.push(["ruestung", "Rüstung", U.fmt(it.armor)]);
    for (const a of D.ATTRS) if (it.stats[a]) lines.push([a, D.ATTR_INFO[a].name, "+" + U.fmt(it.stats[a])]);
    let cmp = "";
    const cur = S && S.equip[it.slot];
    if (opts.compare !== false && cur && cur !== it && E.canEquip(S, it)) {
      const parts = [];
      const diff = (label, a, b) => {
        const d = Math.round(a - b);
        if (d) parts.push('<span class="' + (d > 0 ? "delta-up" : "delta-down") + '">' + (d > 0 ? "+" : "") + U.fmt(d) + " " + label + "</span>");
      };
      if (it.min || cur.min) diff("Ø Schaden", ((it.min || 0) + (it.max || 0)) / 2, ((cur.min || 0) + (cur.max || 0)) / 2);
      if (it.armor || cur.armor) diff("Rüstung", it.armor || 0, cur.armor || 0);
      for (const a of D.ATTRS) diff(D.ATTR_INFO[a].name, it.stats[a] || 0, cur.stats[a] || 0);
      cmp = '<div class="cmp"><div class="muted">Im Vergleich zu „' + esc(cur.name) + "“:</div>" + (parts.length ? parts.join(", ") : "gleichwertig") + "</div>";
    } else if (opts.compare !== false && it.cls && S && it.cls !== S.cls) {
      cmp = '<div class="cmp delta-down">Nur für ' + esc(D.CLASSES[it.cls].name) + "</div>";
    }
    return (
      '<div class="itemcard"><h4 class="t-' + it.rarity + '">' + esc(it.name) + '</h4><div class="kind">' + R.name + " · " + UI.slotName(it) + " · Stufe " + it.level + (it.cls ? " · " + D.CLASSES[it.cls].name : "") + "</div><ul>" +
      lines.map((l) => "<li><span>" + I.ui(l[0]) + " " + l[1] + '</span><b class="num">' + l[2] + "</b></li>").join("") +
      "</ul>" + cmp + (opts.price ? '<div class="cmp">' + opts.price + "</div>" : "") + "</div>"
    );
  };
  UI.slotHtml = function (it, ref, extra) {
    extra = extra || {};
    if (!it) return '<div class="slot empty">' + (extra.emptyIcon ? I.ui(extra.emptyIcon) : "") + (extra.label ? '<span class="slot-name">' + extra.label + "</span>" : "") + "</div>";
    return (
      '<button type="button" class="slot r-' + it.rarity + '" data-item="' + ref + '" data-act="' + (extra.act || "itemInfo") + '" data-ref="' + ref + '" aria-label="' + esc(it.name) + '">' +
      I.item(it) + (extra.upgrade && UI.isUpgrade(it) ? '<span class="up">' + I.ui("pfeil") + "</span>" : "") + (extra.price ? '<span class="price">' + extra.price + "</span>" : "") + "</button>"
    );
  };

  /* Tooltip fuer Maus-Bedienung */
  let tip = null;
  function placeTip(ev) {
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    let x = ev.clientX + 16;
    let y = ev.clientY + 16;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 16;
    if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = y + "px";
  }
  document.addEventListener("pointerover", (ev) => {
    if (ev.pointerType !== "mouse") return;
    const el = ev.target.closest && ev.target.closest("[data-item]");
    if (!el || !UI.S) return;
    const it = UI.itemRef(el.dataset.item);
    if (!it) return;
    tip = tip || $("#tip");
    if (!tip) return;
    tip.innerHTML = UI.itemCard(it);
    tip.style.borderColor = D.RARITIES[it.rarity].color;
    tip.hidden = false;
    placeTip(ev);
  });
  document.addEventListener("pointermove", (ev) => {
    if (tip && !tip.hidden) placeTip(ev);
  });
  document.addEventListener("pointerout", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-item]");
    if (el && tip) tip.hidden = true;
  });
  UI.hideTip = () => tip && (tip.hidden = true);

  /* ---------- Dialoge ---------- */
  UI.dialog = function (html, opts) {
    opts = opts || {};
    const m = $("#modal");
    m.innerHTML = '<div class="dialog ' + (opts.cls || "") + '" role="dialog" aria-modal="true">' + html + "</div>";
    m.hidden = false;
    UI.hideTip();
    const first = m.querySelector("[data-autofocus]") || m.querySelector("button");
    if (first) setTimeout(() => first.focus(), 30);
    return m.firstChild;
  };
  UI.closeDialog = function () {
    const m = $("#modal");
    m.hidden = true;
    m.innerHTML = "";
  };
  UI.ACTIONS.closeDialog = () => UI.closeDialog();

  UI.ACTIONS.itemInfo = function (el) {
    const S = UI.S;
    const ref = el.dataset.ref;
    const it = UI.itemRef(ref);
    if (!it) return;
    const [kind, a, b] = ref.split(":");
    let actions = "";
    let price = "";
    if (kind === "inv") {
      if (E.canEquip(S, it)) actions += '<button class="btn" data-act="equip" data-i="' + a + '">Anlegen</button>';
      actions += '<button class="btn ghost" data-act="sell" data-i="' + a + '">Verkaufen für ' + UI.gold(E.sellPrice(it)) + "</button>";
    } else if (kind === "eq") {
      actions += '<button class="btn ghost" data-act="unequip" data-slot="' + a + '">Ablegen</button>';
    } else if (kind === "shop") {
      price = "Preis: " + UI.gold(it.value);
      actions += '<button class="btn" data-act="buy" data-shop="' + a + '" data-i="' + b + '"' + (S.gold < it.value ? " disabled" : "") + ">Kaufen</button>";
    }
    UI.dialog(UI.itemCard(it, { price }) + '<div class="actions"><button class="btn ghost" data-act="closeDialog">Schließen</button>' + actions + "</div>");
  };

  /* ---------- Kopfleiste und Dock ---------- */
  const DOCK = [
    ["heim", "held", "Held"],
    ["taverne", "taverne", "Taverne"],
    ["schmiede", "schmiede", "Schmiede"],
    ["arkanum", "arkanum", "Kurios."],
    ["arena", "arena", "Arena"],
    ["leuchtturm", "leuchtturm", "Wache"],
    ["tiefen", "tiefen", "Dungeons"],
    ["stall", "stall", "Stall"],
    ["ruhmeshalle", "ruhm", "Ruhm"],
    ["brunnen", "brunnen", "Brunnen"],
  ];
  let lastPortraitKey = "";
  UI.renderTop = function () {
    const S = UI.S;
    const top = $("#topbar");
    if (!top) return;
    const need = E.xpNeed(S.level);
    const en = E.energy(S);
    const key = JSON.stringify(UI.heroDesc(S));
    if (!top.dataset.built) {
      top.innerHTML =
        '<div class="logo">Schwebfels</div>' +
        '<button class="me-chip" data-act="open" data-id="heim" aria-label="Dein Held"><span class="porthole" id="mePortrait"></span><span class="me-meta"><span class="me-name"></span><span class="me-sub"></span><span class="xpbar"><i></i></span></span></button>' +
        '<div class="res"><span class="chip" title="Gold" id="resGold"></span><span class="chip" title="Wolkenperlen" id="resPerl"></span><span class="gauge" title="Tatendrang" id="resEnergy"></span><span class="chip hon" title="Ehre" id="resHonor"></span>' +
        '<button class="iconbtn" data-act="toggleSound" id="soundBtn" aria-label="Ton an oder aus"></button><button class="iconbtn" data-act="open" data-id="einstellungen" aria-label="Einstellungen">' + I.ui("einstellungen") + "</button></div>";
      top.dataset.built = "1";
    }
    if (key !== lastPortraitKey) {
      lastPortraitKey = key;
      $("#mePortrait").innerHTML = UI.heroPortrait(S);
      if (UI.hub) UI.hub.setHero(UI.heroDesc(S));
    }
    top.querySelector(".me-name").textContent = S.name;
    top.querySelector(".me-sub").textContent = innerWidth <= 520 ? "Stufe " + S.level : "Stufe " + S.level + " · " + D.CLASSES[S.cls].name;
    top.querySelector(".xpbar i").style.width = Math.min(100, (S.xp / need) * 100).toFixed(1) + "%";
    top.querySelector(".xpbar").title = U.fmt(S.xp) + " / " + U.fmt(need) + " Erfahrung";
    $("#resGold").innerHTML = I.ui("gold") + '<span class="num">' + U.fmtShort(S.gold) + "</span>";
    $("#resPerl").innerHTML = I.ui("perle") + '<span class="num">' + U.fmt(S.perlen) + "</span>";
    $("#resEnergy").innerHTML = UI.gauge(en, E.C.ENERGY_MAX) + "<span><small>Tatendrang</small>" + Math.floor(en) + "</span>";
    $("#resHonor").innerHTML = I.ui("ehre") + '<span class="num">' + U.fmt(S.honor) + "</span>";
    $("#soundBtn").innerHTML = I.ui(S.settings.sound ? "ton" : "stumm");
  };

  UI.badges = function () {
    const S = UI.S;
    const now = E.now();
    const b = {};
    const a = S.quest.active;
    if (a && a.end <= now) b.taverne = "!";
    else if (!E.busy(S, now) && S.quest.offers.some((o) => E.energy(S, now) >= o.energy)) b.taverne = "3";
    if (S.guard && S.guard.end <= now) b.leuchtturm = "✓";
    if (!E.busy(S, now) && S.arena.next <= now) b.arena = "!";
    if (S.daily.wellFree > 0) b.brunnen = "1";
    if (!E.busy(S, now) && S.dungeons.next <= now) {
      for (let d = 0; d < D.DUNGEONS.length; d++) {
        const st = E.dungeonState(S, d);
        if (st.unlocked && !st.done) {
          b.tiefen = "!";
          break;
        }
      }
    }
    const C = D.CLASSES[S.cls];
    if (S.gold >= E.attrCost(S.bought[C.main]) || S.inv.some((it) => UI.isUpgrade(it))) b.heim = "+";
    return b;
  };
  UI.renderDock = function () {
    const dock = $("#dock");
    if (!dock) return;
    const b = UI.badges();
    dock.innerHTML = DOCK.map(
      ([id, ic, label]) =>
        '<button class="dock-btn' + (UI.panelId === id ? " active" : "") + '" data-act="open" data-id="' + id + '">' + I.ui(ic) + "<span>" + label + "</span>" + (b[id] ? '<span class="badge">' + b[id] + "</span>" : "") + "</button>"
    ).join("");
    if (UI.hub) UI.hub.setBadges(b);
    UI.renderFallbackStage(b);
  };
  UI.renderFallbackStage = function (b) {
    const fb = $(".stage-fallback .fb-grid");
    if (!fb) return;
    fb.innerHTML = D.BUILDINGS.map((bd) => {
      const ic = (DOCK.find((d) => d[0] === bd.id) || [0, "held"])[1];
      return '<button data-act="open" data-id="' + bd.id + '">' + I.ui(ic) + "<b>" + esc(bd.name) + "</b>" + (b[bd.id] ? '<span class="tag">' + b[bd.id] + "</span>" : "") + "</button>";
    }).join("");
  };

  /* Aktivitaetsanzeige ueber dem Dock */
  UI.renderActivity = function () {
    const S = UI.S;
    const box = $("#activity");
    if (!box) return;
    const now = E.now();
    let html = "";
    let target = null;
    let done = false;
    if (S.quest.active) {
      const a = S.quest.active;
      done = a.end <= now;
      const pct = done ? 100 : ((now - a.start) / (a.end - a.start)) * 100;
      target = "taverne";
      html = I.ui(done ? "arena" : "uhr") + '<div class="act-text"><div class="act-title">' + (done ? "Auftrag erledigt: Der Kampf wartet!" : esc(a.offer.title)) + '</div><div class="progress"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' + (done ? '<span class="btn small">Kämpfen</span>' : '<b class="num" data-until="' + a.end + '"></b>');
    } else if (S.guard) {
      const g = S.guard;
      done = g.end <= now;
      const pct = done ? 100 : ((now - g.start) / (g.end - g.start)) * 100;
      target = "leuchtturm";
      html = I.ui("leuchtturm") + '<div class="act-text"><div class="act-title">' + (done ? "Wache beendet: Lohn abholen" : "Wache am Leuchtturm") + '</div><div class="progress"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' + (done ? '<span class="btn small">Abholen</span>' : '<b class="num" data-until="' + g.end + '"></b>');
    }
    box.hidden = !html || (UI.panelId && UI.panelId === target);
    box.innerHTML = html;
    box.dataset.act = "open";
    box.dataset.id = target || "";
    box.classList.toggle("done-pulse", done);
    UI.updateTimers();
  };

  UI.updateTimers = function () {
    const now = E.now();
    document.querySelectorAll("[data-until]").forEach((el) => {
      const ms = +el.dataset.until - now;
      el.textContent = ms > 0 ? U.fmtTime(ms) : el.dataset.doneText || "fertig";
    });
  };

  /* ---------- Panels ---------- */
  UI.openPanel = function (id) {
    if (!UI.PANELS[id]) return;
    SB.audio.unlock();
    SB.audio.play("click");
    UI.panelId = id;
    document.body.classList.add("panel-open");
    const P = $("#panel");
    P.hidden = false;
    P.dataset.id = id;
    UI.renderPanel(true);
    if (UI.hub) {
      UI.hub.focus(id === "einstellungen" ? null : id);
      const wide = innerWidth > 860;
      UI.hub.setInset(wide ? P.offsetWidth + 24 : 0);
      if (!wide) UI.hub.pause();
    }
    UI.renderDock();
    UI.renderActivity();
    UI.checkHint();
  };
  UI.closePanel = function () {
    UI.panelId = null;
    document.body.classList.remove("panel-open");
    const P = $("#panel");
    P.hidden = true;
    P.innerHTML = "";
    UI.detachHeroView();
    if (UI.hub) {
      UI.hub.focus(null);
      UI.hub.setInset(0);
      UI.hub.resume();
    }
    UI.renderDock();
    UI.renderActivity();
    UI.checkHint();
  };
  UI.ACTIONS.open = (el) => {
    const id = el.dataset.id;
    if (!id) return;
    if (UI.panelId === id && !el.closest("#activity")) UI.closePanel();
    else UI.openPanel(id);
  };
  UI.ACTIONS.closePanel = () => UI.closePanel();

  UI.renderPanel = function (fresh) {
    const id = UI.panelId;
    if (!id) return;
    const P = $("#panel");
    const def = UI.PANELS[id];
    const body = P.querySelector(".panel-body");
    const scroll = body && !fresh ? body.scrollTop : 0;
    let head = def.head ? def.head() : null;
    if (!head) {
      const bd = D.BUILDINGS.find((b) => b.id === id);
      const npc = bd && bd.npc ? D.NPCS[bd.npc] : null;
      head = { title: def.title || (bd ? bd.name : ""), role: npc ? npc.name + ", " + npc.role : def.role || "", portrait: bd && bd.npc ? UI.npcPortrait(bd.npc) : def.portrait ? def.portrait() : "" };
    }
    UI.detachHeroView();
    P.innerHTML =
      '<div class="panel-head">' + (head.portrait ? '<span class="porthole">' + head.portrait + "</span>" : "") + '<div><h2>' + esc(head.title) + '</h2><div class="role">' + esc(head.role) + '</div></div><button class="iconbtn close" data-act="closePanel" aria-label="Schließen">' + I.ui("schliessen") + '</button></div><div class="panel-body">' + def.render() + "</div>";
    if (def.after) def.after(P);
    const nb = P.querySelector(".panel-body");
    if (nb) nb.scrollTop = scroll;
    UI.updateTimers();
  };

  /* Persistente 3D-Heldenansicht, die Neuzeichnungen ueberlebt */
  let heroView = null;
  let heroViewEl = null;
  let heroViewKey = "";
  UI.attachHeroView = function (slot, desc, caption) {
    if (!slot) return;
    if (!UI.use3d) {
      slot.innerHTML = '<div class="hv-fallback">' + I.silhouette(desc.gear && desc.gear.ruestung ? desc.gear.ruestung.tint : "#7f8a96", desc.kind) + "</div>";
      return;
    }
    if (!heroViewEl) {
      heroViewEl = document.createElement("div");
      heroViewEl.style.cssText = "position:absolute;inset:0";
    }
    slot.appendChild(heroViewEl);
    if (caption) {
      const c = document.createElement("div");
      c.className = "hv-caption";
      c.innerHTML = caption;
      slot.appendChild(c);
    }
    if (!heroView) {
      heroView = SB.R3D.createHeroView(heroViewEl);
      heroViewKey = "";
    }
    const k = JSON.stringify(desc);
    if (k !== heroViewKey) {
      const celebrate = !!heroViewKey;
      heroViewKey = k;
      heroView.set(desc, celebrate);
    }
  };
  UI.detachHeroView = function () {
    if (heroViewEl && heroViewEl.parentNode) heroViewEl.parentNode.removeChild(heroViewEl);
  };
  UI.disposeHeroView = function () {
    if (heroView) heroView.dispose();
    heroView = null;
    heroViewEl = null;
    heroViewKey = "";
  };

  /* ---------- Hinweise von Kaept'n Ottilie ---------- */
  const TUT = [
    { when: () => true, text: (S) => "Willkommen an Bord, " + S.name + "! Ich bin Käpt'n Ottilie, Hafenmeisterin von Schwebfels. In der Taverne „Zur Schiefen Möwe“ warten deine ersten Aufträge.", btn: "Zur Taverne", act: () => UI.openPanel("taverne"), panel: "taverne" },
    { when: () => UI.panelId === "taverne" && !UI.S.quest.active, text: () => "Jeder Auftrag kostet Tatendrang, der sich mit der Zeit wieder auffüllt. Achte auf die Siegchance: Gemütliche Aufträge sind sicher, halsbrecherische bringen mehr Beute.", btn: "Verstanden" },
    { when: () => UI.S.stats.quests >= 1 && !UI.S.quest.active, text: () => "Gut gemacht! Gold steckst du am besten in deine Attribute. Klick oben auf dein Portrait oder unten auf „Held“.", btn: "Zum Quartier", act: () => UI.openPanel("heim"), panel: "heim" },
    { when: () => UI.S.stats.quests >= 3, text: () => "Brumms Schmiede und Zinnobers Kuriositäten verkaufen bessere Ausrüstung. Ein grüner Pfeil zeigt dir, was besser ist als dein jetziger Kram.", btn: "Verstanden" },
    { when: () => UI.S.level >= 3, text: () => "Kein Tatendrang mehr? Wache am Leuchtturm bringt Gold, in der Arena gibt es Ehre, und der Wunschbrunnen schenkt dir jeden Tag einen Wurf.", btn: "Leinen los!" },
    { when: () => UI.S.level >= 10, text: () => "Stufe 10! Das Tor zur Tiefe hat sich geöffnet. Dort warten Bosse mit seltener und epischer Beute.", btn: "Ab in die Tiefe", act: () => UI.openPanel("tiefen"), panel: "tiefen" },
  ];
  UI.checkHint = function () {
    const S = UI.S;
    const box = $("#hint");
    if (!box || !S) return;
    let step = TUT[S.tut];
    while (step && step.panel && step.panel === UI.panelId && step.when()) {
      S.tut++;
      step = TUT[S.tut];
    }
    if (!step || !step.when() || !$("#battle").hidden) {
      box.hidden = true;
      return;
    }
    if (box.dataset.step === String(S.tut) && !box.hidden) return;
    box.dataset.step = String(S.tut);
    box.innerHTML = '<span class="porthole">' + UI.npcPortrait("ottilie") + '</span><div><p></p><button class="btn small" data-act="hintNext">' + step.btn + '</button> <button class="btn small ghost" data-act="hintSkip">Keine Tipps mehr</button></div>';
    box.querySelector("p").textContent = step.text(S);
    box.hidden = false;
  };
  UI.ACTIONS.hintNext = function () {
    const step = TUT[UI.S.tut];
    UI.S.tut++;
    $("#hint").hidden = true;
    UI.save();
    if (step && step.act) step.act();
    UI.checkHint();
  };
  UI.ACTIONS.hintSkip = function () {
    UI.S.tut = TUT.length;
    $("#hint").hidden = true;
    UI.save();
  };

  /* ---------- Gesamtaktualisierung ---------- */
  UI.refresh = function (opts) {
    opts = opts || {};
    UI.renderTop();
    UI.renderDock();
    UI.renderActivity();
    if (UI.panelId && opts.panel !== false) UI.renderPanel();
    UI.checkHint();
    UI.save();
  };

  /* Sekundentakt: Zeitgeber, Zustandswechsel */
  let lastState = "";
  UI.tick = function () {
    const S = UI.S;
    if (!S) return;
    const now = E.now();
    E.tick(S, now);
    const qDone = !!(S.quest.active && S.quest.active.end <= now);
    const gDone = !!(S.guard && S.guard.end <= now);
    const aReady = S.arena.next <= now;
    const dReady = S.dungeons.next <= now;
    const st = [qDone, gDone, aReady, dReady, Math.floor(E.energy(S, now))].join("|");
    if (st !== lastState) {
      const prev = lastState.split("|");
      if (lastState) {
        if (qDone && prev[0] === "false") {
          UI.toast("Auftrag erledigt! Der Kampf wartet in der Taverne.", "good", "arena");
          SB.audio.play("coin");
        }
        if (gDone && prev[1] === "false") UI.toast("Deine Wache ist vorbei. Funzel hat deinen Lohn bereit.", "good", "leuchtturm");
      }
      lastState = st;
      UI.renderTop();
      UI.renderDock();
      UI.renderActivity();
      if (UI.panelId && (prev[0] !== String(qDone) || prev[1] !== String(gDone) || prev[2] !== String(aReady) || prev[3] !== String(dReady))) UI.renderPanel();
    } else {
      UI.renderTop();
      const box = $("#activity");
      if (box && !box.hidden) {
        const a = S.quest.active || S.guard;
        const bar = box.querySelector(".progress i");
        if (a && bar) bar.style.width = Math.min(100, ((now - a.start) / (a.end - a.start)) * 100).toFixed(1) + "%";
      }
    }
    UI.updateTimers();
  };

  /* Klick-Verteilung ueber data-act */
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = UI.ACTIONS[el.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    SB.audio.unlock();
    try {
      fn(el, ev);
    } catch (e) {
      console.error(e);
      UI.toast("Da ist etwas schiefgelaufen: " + e.message, "bad");
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (!$("#battle") || !$("#battle").hidden) return;
    if (!$("#modal").hidden) UI.closeDialog();
    else if (UI.panelId) UI.closePanel();
  });
  document.addEventListener("click", (ev) => {
    if (ev.target && ev.target.id === "modal" && !ev.target.dataset.locked) UI.closeDialog();
  });

  UI.ACTIONS.toggleSound = function () {
    UI.S.settings.sound = !UI.S.settings.sound;
    SB.audio.enabled = UI.S.settings.sound;
    UI.renderTop();
    UI.save();
  };
})();

</script>
<script>/* src/ui-panels.js */
/* Helden von Schwebfels - Panels der Gebaeude und ihre Aktionen. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const E = SB.engine;
  const U = SB.util;
  const I = SB.icons;
  const UI = SB.ui;
  const A = UI.ACTIONS;
  const P = UI.PANELS;
  const esc = U.esc;
  const S = () => UI.S;

  const LINES = {
    hulda: ["Setz dich, Held. Die Aufträge hängen am Brett, das Bier steht hinter mir.", "Wer mit leerem Magen kämpft, kämpft halb so gut. Sagt meine Oma. Die hat nie gekämpft.", "Drei Aufträge, drei Abenteuer. Und alle drei schlecht bezahlt, aber ehrlich."],
    brumm: ["Hrmpf. Fass nichts an, was noch glüht.", "Gute Klinge, guter Preis. Billige Klinge, kurzes Leben.", "Ich schmiede seit dreihundert Jahren. Die ersten zweihundert waren Übung."],
    zinnober: ["Ah, ein Kunde! Oder ein Dieb? Bei dir bin ich mir noch nicht sicher.", "Alles hier ist magisch. Außer dem Staub. Wobei, der vielleicht auch.", "Dieser Ring hat einem König gehört. Oder einem Koch. Die Handschrift war schlecht."],
    krawall: ["WILLKOMMEN IN DER WOLKENARENA! Ich rufe immer so. Ich kann nicht anders.", "Das Publikum will Blut sehen. Oder wenigstens blaue Flecken.", "Ehre gewinnt man hier im Dutzend. Verlieren geht schneller."],
    funzel: ["Das Licht muss brennen. Immer. Ich mach das seit vierzig Jahren und habe nie geblinzelt.", "Wache halten ist einfach: Du schaust raus, die Wolken schauen rein.", "Zahle pro Schicht. Pünktlich. Meistens."],
    hufnagel: ["Pass auf, wo du hintrittst. Wolkenesel sind sauber, die Ziegen nicht.", "Mit einem Reittier bist du schneller am Auftrag und schneller wieder in der Taverne.", "Der Greif beißt nur Leute, die er nicht mag. Er mag niemanden."],
  };
  const line = (npc) => {
    const arr = LINES[npc];
    return arr[Math.floor((Date.now() / 60000) % arr.length)];
  };
  const say = (npc) => '<div class="say">' + esc(line(npc)) + "</div>";
  const chanceCls = (c) => (c >= 0.8 ? "good" : c >= 0.5 ? "ok" : "bad");
  const chanceTxt = (c) => '<span class="chance ' + chanceCls(c) + '">Siegchance ' + Math.round(c * 100) + " %</span>";
  const pips = (n) => '<span class="pips">' + [1, 2, 3].map((i) => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";
  const busyNote = () => {
    const b = E.busy(S());
    if (!b) return "";
    return '<div class="say">' + (b.what === "quest" ? "Du bist gerade auf einem Auftrag unterwegs." : "Du schiebst gerade Wache am Leuchtturm.") + "</div>";
  };
  const estCache = new Map();
  function estimate(hero, foe, key) {
    const k = key + "|" + JSON.stringify(hero.attrs) + hero.wMin + "|" + hero.wMax + "|" + hero.armor + "|" + hero.prof.block;
    if (estCache.has(k)) return estCache.get(k);
    const v = E.estimateWin(hero, foe, 40, key);
    estCache.set(k, v);
    if (estCache.size > 200) estCache.delete(estCache.keys().next().value);
    return v;
  }
  function done(res) {
    if (res && res.ok === false && res.msg) {
      UI.toast(res.msg, "bad");
      return false;
    }
    return true;
  }

  /* ================= Taverne ================= */
  P.taverne = {
    render() {
      const s = S();
      const now = E.now();
      const en = E.energy(s, now);
      let h = say("hulda");
      h +=
        '<div class="row" style="margin-bottom:12px"><span class="gauge" style="padding-right:12px">' + UI.gauge(en, E.C.ENERGY_MAX) + "<span><small>Tatendrang</small>" + Math.floor(en) + " / " + E.C.ENERGY_MAX + "</span></span>" +

      const busy = E.busy(s, now);
