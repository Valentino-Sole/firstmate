      g.add(mesh(torus(0.24, 0.008, PI * 2, 4, 30), glow(c, 0.8), { r: [PI / 2.3, 0, 0] }));
      g.add(haloSprite(c, 0.6, 0.8, [0, 0, 0]));
    }
    return g;
  }
  R.buildWeapon = buildWeapon;
  R.buildOffhand = buildOffhand;
  R.shapeOf = shapeOf;
  R.rng = rng;
  R.hash = hash;

  /* ---------- Helden ---------- */
  const OLD_RACE = { wolkling: "albier", steinbart: "kreidezwerg", hornvolk: "trollblut", nebelalb: "sidhe", moosling: "moorling" };
  const OLD_CLS = { klinge: "schildritter", wind: "mondschuetze", rune: "runenwirker" };

  // Kopf mit leicht geformtem Kiefer (verformte Kugel)
  function headGeo(jaw, chin, long) {
    return geo("head" + jaw + "|" + chin + "|" + long, () => {
      const gg = new T.SphereGeometry(0.2, 32, 24);
      const p = gg.attributes.position;
      for (let i = 0; i < p.count; i++) {
        let x = p.getX(i);
        let y = p.getY(i);
        let z = p.getZ(i);
        const ny = y / 0.2;
        y *= long;
        if (ny < 0) {
          const k = -ny;
          x *= 1 - 0.22 * k * k * (2 - jaw);
          z += Math.max(0, z / 0.2) * 0.03 * k * chin;
          y -= 0.025 * k * k * chin;
        }
        if (z < 0) z *= 1.05;
        // Gesicht vorne leicht abflachen
        if (z > 0.12 && Math.abs(ny) < 0.6) z -= (z - 0.12) * 0.25;
        p.setXYZ(i, x, y, z);
      }
      gg.computeVertexNormals();
      return gg;
    });
  }

  R.buildHero = function (desc) {
    const D = SB.data;
    const raceId = D.RACES[desc.race] ? desc.race : OLD_RACE[desc.race] || "albier";
    const race = D.RACES[raceId];
    const clsId = D.CLASSES[desc.cls] ? desc.cls : OLD_CLS[desc.cls] || "schildritter";
    const C = D.CLASSES[clsId];
    const arch = C.arch;
    const realmArg = desc.realmDef || realmOf(desc.realm || C.realm || race.realm);
    const RM = realmData(realmArg);
    const realm = desc.realmDef ? desc.realmDef.style || "midgard" : realmArg;
    const look = Object.assign({ skin: race.skins[0], hair: race.hairs[0], hairStyle: 0, beard: 0, eyes: "#3a2a1e", tattoo: "keine", tattooColor: "#2f5fd0", scar: "keine", horns: 0 }, desc.look || {});
    const gear = desc.gear || {};
    const fem = desc.gender === "w";
    const undead = !!desc.undead;
    const h = race.height;
    const w = race.width * (fem ? 0.9 : 1);
    const bulk = (race.bulk || 1) * (fem ? 0.88 : 1);
    const tcol = D.TATTOO_COLORS.find((t) => t.c === look.tattooColor) || { c: look.tattooColor || "#2f5fd0" };
    const eyeInfo = D.EYES.find((e) => e.c === look.eyes) || {};
    const skinM = pmat("skin", look.skin);
    const armor = gear.ruestung;
    const mat = D.ARCHETYPES[arch].material;
    const root = grp();
    const body = grp();
    root.add(body);
    const parts = { root, body };

    const armorC = armor ? armor.tint || RM.metal : null;
    const realmCloth = RM.color;
    const pantsC = arch === "krieger" ? shade(RM.dark, 1.3) : arch === "magier" ? shade(armorC || realmCloth, 0.55) : "#4a3a2c";
    const bootC = gear.stiefel ? gear.stiefel.tint || "#4a3424" : "#3e2e22";
    const plate = mat === "platte" && !!armor;
    const metalM = pmat("metal", plate ? armorC : RM.metal);
    const trimM = pmat("metal", RM.trim, { sh: 70 });

    /* Beine: Oberschenkel, Knie, Unterschenkel, Fuss */
    const hipY = 0.95 * h;
    const thighL = 0.44 * h;
    const shinL = 0.42 * h;
    for (const side of [1, -1]) {
      const leg = grp([0.15 * w * side, hipY, 0]);
      const thighM = plate ? pmat("cloth", pantsC) : pmat(arch === "magier" ? "cloth" : "leather", pantsC);
      leg.add(mesh(capsule(0.1 * bulk, thighL * 0.75), thighM, { p: [0, -thighL / 2, 0] }));
      const knee = grp([0, -thighL, 0]);
      leg.add(knee);
      knee.add(mesh(capsule(0.085 * bulk, shinL * 0.7), thighM, { p: [0, -shinL / 2, 0] }));
      // Stiefel
      const bm = arch === "krieger" && gear.stiefel ? pmat("metal", shade(armorC || RM.metal, 0.95)) : pmat("leather", bootC);
      knee.add(mesh(cyl(0.1 * bulk, 0.095 * bulk, shinL * 0.62, 12), bm, { p: [0, -shinL * 0.62, 0] }));
      knee.add(mesh(cyl(0.12 * bulk, 0.105 * bulk, 0.07, 12), arch === "krieger" ? trimM : pmat("fur", "#8a7a66"), { p: [0, -shinL * 0.32, 0] }));
      const foot = grp([0, -shinL, 0]);
      knee.add(foot);
      foot.add(mesh(box(0.15 * bulk, 0.1, 0.3), bm, { p: [0, -0.02, 0.06] }));
      foot.add(mesh(sph(0.08 * bulk, 10, 8), bm, { p: [0, -0.02, 0.2], s: [1, 0.7, 1] }));
      if (arch === "krieger") {
        knee.add(mesh(sph(0.075 * bulk, 10, 8), metalM, { p: [0, 0.0, 0.07], s: [1, 1, 0.8] }));
        leg.add(mesh(capsule(0.105 * bulk, thighL * 0.45), metalM, { p: [0, -thighL * 0.55, 0.02], s: [1.05, 1, 1.05] }));
      }
      body.add(leg);
      parts[side > 0 ? "legL" : "legR"] = leg;
      parts[side > 0 ? "kneeL" : "kneeR"] = knee;
    }

    /* Rumpf */
    const torso = grp([0, hipY, 0]);
    body.add(torso);
    parts.torso = torso;
    const chestY = 0.44 * h;
    const shY = 0.6 * h;
    const tw = w * (0.92 + 0.08 * bulk);
    const shirtC = arch === "krieger" ? "#5a4a3a" : arch === "magier" ? armorC || realmCloth : armor ? armor.tint || "#5a3d2a" : "#7a6a55";
    // Becken und Bauch
    torso.add(mesh(sph(0.2, 16, 12), pmat(arch === "magier" ? "cloth" : "leather", pantsC), { p: [0, 0.04, 0], s: [1.2 * tw, 0.75, 0.95] }));
    torso.add(mesh(cyl(0.21 * tw, 0.19 * tw, 0.3 * h, 16), pmat(arch === "magier" ? "cloth" : "leather", shirtC), { p: [0, 0.2 * h, 0], s: [1, 1, 0.82] }));
    // Brustkorb (heroisch breit)
    const chestM = plate ? metalM : arch === "magier" ? pmat("cloth", shirtC) : pmat("leather", shirtC);
    torso.add(mesh(sph(0.27, 20, 14), chestM, { p: [0, chestY, 0.0], s: [1.28 * tw, 0.92 * h, 0.82] }));
    if (fem && !plate) torso.add(mesh(sph(0.12, 12, 10), chestM, { p: [0, chestY - 0.02, 0.13], s: [1.6 * tw, 0.75, 0.75] }));
    // Guertel mit Schnalle
    torso.add(mesh(torus(0.215 * tw, 0.035, PI * 2, 6, 24), pmat("leather", "#3a281c"), { p: [0, 0.1, 0], r: [PI / 2, 0, 0], s: [1, 0.82, 1] }));
    torso.add(mesh(box(0.11, 0.08, 0.04), trimM, { p: [0, 0.1, 0.18] }));
    parts.chest = torso;

    if (arch === "krieger") {
      if (plate) {
        // Brustplatte, Bauchschienen, Waffenrock mit Wappen
        torso.add(mesh(sph(0.25, 18, 12, 0), metalM, { p: [0, chestY + 0.02, 0.06], s: [1.18 * tw, 0.86 * h, 0.7] }));
        for (let i = 0; i < 3; i++) torso.add(mesh(cyl(0.205 * tw - i * 0.005, 0.2 * tw - i * 0.005, 0.065, 16), metalM, { p: [0, 0.3 * h - i * 0.07, 0.01], s: [1, 1, 0.85] }));
        torso.add(mesh(box(0.06, 0.24 * h, 0.03), trimM, { p: [0, chestY + 0.02, 0.24] }));
        if (armor.style === 1) torso.add(mesh(octa(0.06), emis(RM.accent, 0.6), { p: [0, chestY + 0.08, 0.26], s: [1, 1.3, 0.5] }));
        if (armor.style === 2) for (const s of [-1, 1]) torso.add(mesh(cone(0.04, 0.16, 6), trimM, { p: [s * 0.16 * tw, chestY + 0.06, 0.18], r: [1.2, 0, 0] }));
      }
      const tab = new T.Mesh(new T.PlaneGeometry(0.3 * tw, 0.46 * h), crestMat(realmOf(realmArg), RM.color, RM.trim));
      tab.position.set(0, -0.14 * h, 0.2);
      tab.rotation.x = -0.08;
      tab.castShadow = true;
      torso.add(tab);
      parts.tabard = tab;
      // Plattenschurz
      for (const s of [-1, 1]) torso.add(mesh(box(0.18 * tw, 0.22 * h, 0.04), metalM, { p: [s * 0.16 * tw, -0.06, 0.1], r: [-0.12, 0, s * 0.14] }));
    } else if (arch === "schurke") {
      // Lederwams mit gekreuzten Riemen, Schaerpe
      const strapM = pmat("leather", "#2a1e18");
      for (const s of [-1, 1]) torso.add(mesh(box(0.05, 0.6 * h, 0.03), strapM, { p: [0, chestY - 0.02, 0.2], r: [0, 0, s * 0.62] }));
      torso.add(mesh(sph(0.04, 8, 6), trimM, { p: [0, chestY - 0.02, 0.23] }));
      torso.add(mesh(box(0.42 * tw, 0.1, 0.03), pmat("cloth", RM.color), { p: [0, 0.06, 0.16], r: [-0.1, 0, 0.1] }));
      torso.add(mesh(box(0.1, 0.42 * h, 0.02), pmat("cloth", RM.color), { p: [0.12, -0.16, 0.17], r: [-0.08, 0, -0.08] }));
      for (const s of [-1, 1]) torso.add(mesh(box(0.1, 0.1, 0.06), pmat("leather", "#4a3424"), { p: [s * 0.2 * tw, 0.06, 0.12] }));
    } else if (arch === "jaeger") {
      // Wams mit Fellkragen
      torso.add(mesh(torus(0.2 * tw, 0.07, PI * 2, 8, 20), pmat("fur", realm === "midgard" ? "#d9d2c5" : "#7a6248"), { p: [0, shY + 0.02, 0], r: [PI / 2, 0, 0], s: [1, 0.85, 1] }));
      torso.add(mesh(box(0.05, 0.6 * h, 0.03), pmat("leather", "#2a1e18"), { p: [0, chestY - 0.02, 0.2], r: [0, 0, 0.62] }));
      torso.add(mesh(cyl(0.22 * tw, 0.3 * tw, 0.32 * h, 16, true), pmat("leather", shade(shirtC, 0.85), { ds: true }), { p: [0, -0.12 * h, 0], s: [1, 1, 0.85] }));
    } else {
      // Robe: langer Rock bis zum Boden, hoher Kragen, Schaerpe
      const robeC = armorC || realmCloth;
      const robeM = pmat("cloth", robeC, { ds: true });
      torso.add(mesh(lathe("robe", [[0.2, 0.18], [0.24, 0], [0.3, -0.35], [0.36, -0.7], [0.4, -0.9]], 20), robeM, { s: [tw, h, 0.85] }));
      torso.add(mesh(torus(0.4 * tw, 0.02, PI * 2, 4, 30), trimM, { p: [0, -0.9 * h, 0], r: [PI / 2, 0, 0], s: [1, 0.85, 1] }));
      torso.add(mesh(box(0.12, 0.85 * h, 0.02), pmat("cloth", RM.accent === "#cfe3ff" ? "#2a3a5a" : shade(RM.color, 0.8)), { p: [0, -0.42 * h, 0.32], r: [-0.4, 0, 0] }));
      torso.add(mesh(cyl(0.2 * tw, 0.24 * tw, 0.16, 16, true), pmat("cloth", shade(robeC, 0.8), { ds: true }), { p: [0, shY + 0.1, -0.03], s: [1, 1, 0.9] }));
      if (armor && armor.style !== 0) for (let i = 0; i < 3; i++) torso.add(mesh(octa(0.03), emis(RM.accent, 0.8), { p: [0, chestY + 0.1 - i * 0.12, 0.23] }));
    }

    /* Umhang */
    if (gear.umhang) {
      const cc = gear.umhang.tint || RM.color;
      const cg = new T.PlaneGeometry(0.62 * tw, 1.12 * h, 5, 10);
      cg.translate(0, -0.56 * h, 0);
      const capeMesh = new T.Mesh(cg, pmat("cloth", cc, { ds: true }));
      capeMesh.position.set(0, shY + 0.02, -0.22);
      capeMesh.rotation.x = 0.1;
      capeMesh.castShadow = true;
      capeMesh.userData.cape = cg.attributes.position.array.slice(0);
      torso.add(capeMesh);
      parts.cape = capeMesh;
      torso.add(mesh(torus(0.22 * tw, 0.045, PI, 6, 14), pmat(gear.umhang.style === 1 ? "fur" : "cloth", gear.umhang.style === 1 ? "#8a7a66" : shade(cc, 0.75)), { p: [0, shY + 0.02, -0.06], r: [PI / 2 - 0.2, 0, 0] }));
      for (const s of [-1, 1]) torso.add(mesh(sph(0.04, 8, 6), trimM, { p: [s * 0.18 * tw, shY, 0.12] }));
    }

    /* Hals und Kopf */
    const HR = 0.2;
    const head = grp([0, shY + 0.21, 0.02]);
    torso.add(head);
    parts.head = head;
    torso.add(mesh(cyl(0.075 * bulk + 0.02, 0.09 * bulk + 0.02, 0.16, 10), skinM, { p: [0, shY + 0.06, 0.01] }));
    const jaw = raceId === "trollblut" ? 1.6 : raceId === "kreidezwerg" || raceId === "nordmann" ? 1.3 : raceId === "sidhe" ? 0.6 : raceId === "moorling" ? 1.4 : 1.0;
    const chin = fem ? 0.5 : raceId === "trollblut" ? 1.8 : 1.1;
    const long = raceId === "sidhe" ? 1.1 : raceId === "moorling" ? 0.95 : 1.04;
    const faceM = faceTex({ skin: look.skin, eyes: look.eyes, eyeGlow: !!eyeInfo.glow || undead, brow: shade(look.hair, 0.8), tattoo: look.tattoo, tc: tcol.c, tglow: !!tcol.glow, scar: look.scar, fem, undead, race: raceId });
    const headM = mesh(headGeo(jaw, chin, long), faceM, { s: [(raceId === "kreidezwerg" ? 1.08 : 1) * (raceId === "moorling" ? 1.08 : 1), 1, 1] });
    head.add(headM);
    // Nase, Brauenwulst
    const nose = raceId === "trollblut" ? [0.05, 0.1] : raceId === "moorling" ? [0.04, 0.06] : raceId === "sidhe" ? [0.025, 0.07] : [0.032, 0.08];
    head.add(mesh(cone(nose[0], nose[1], 6), skinM, { p: [0, -0.02, HR * 0.98], r: [1.35, 0, 0], s: [1, 1, 0.7] }));
    for (const s of [-1, 1]) head.add(mesh(sph(0.05, 10, 6), skinM, { p: [s * 0.06, 0.045, 0.165], s: [1.3, 0.35, 0.5], r: [0, 0, s * 0.18] }));
    if (glowEyes(eyeInfo, undead)) for (const s of [-1, 1]) head.add(haloSprite(look.eyes || "#9fe3ff", 0.16, 0.7, [s * 0.066, 0.012, HR * 1.0]));
    // Ohren
    for (const side of [1, -1]) {
      const ex = HR * 0.95 * side * (raceId === "kreidezwerg" ? 1.08 : 1);
      if (race.ears === "elf") head.add(mesh(cone(0.05, 0.34, 6), skinM, { p: [ex, 0.03, -0.02], r: [0.35, 0, -side * 1.15], s: [1, 1, 0.4] }));
      else if (race.ears === "long") head.add(mesh(cone(0.055, 0.22, 6), skinM, { p: [ex, 0.02, -0.01], r: [0.2, 0, -side * 1.35], s: [1, 1, 0.45] }));
      else if (race.ears === "leaf") head.add(mesh(ext("leaf", SH.leaf, 0.01, 0.004), skinM, { p: [ex + side * 0.07, 0.04, -0.02], r: [0.2, side * 0.4, -side * 1.1], s: 0.2 }));
      else head.add(mesh(sph(0.045, 8, 8), skinM, { p: [ex, 0, 0], s: [0.5, 1, 0.8] }));
    }
    // Hauer und Hoerner (Trollblut)
    if (race.tusks) for (const s of [-1, 1]) head.add(mesh(cone(0.022, 0.1, 6), pmat("bone", "#efe6d2"), { p: [s * 0.07, -0.12, HR * 0.78], r: [-0.25, 0, s * 0.25] }));
    if (race.horns) {
      const hm = pmat("bone", "#d9cdb4");
      const hv = look.horns | 0;
      for (const s of [-1, 1]) {
        const hp =
          hv === 1
            ? [[0, 0, 0], [0.03 * s, 0.1, -0.01], [0.04 * s, 0.22, -0.04], [0.02 * s, 0.32, -0.08]]
            : hv === 2
              ? [[0, 0, 0], [0.06 * s, 0.05, -0.08], [0.1 * s, 0.06, -0.2], [0.12 * s, 0.02, -0.3]]
              : [[0, 0, 0], [0.1 * s, 0.08, -0.04], [0.18 * s, 0.02, -0.04], [0.19 * s, -0.08, 0.03], [0.14 * s, -0.12, 0.08]];
        head.add(mesh(tube("horn" + hv + s, hp, 0.032, 14, 7), hm, { p: [s * 0.1, 0.14, 0] }));
      }
    }

    /* Haare und Bart */
    const hairM = pmat("hair", look.hair);
    const hs = look.hairStyle | 0;
    const helmOn = !!gear.helm;
    const hoodOn = helmOn && (gear.helm.base === "maske" || gear.helm.base === "kappe" || (gear.helm.base === "hut" && (gear.helm.style | 0) === 0));
    if (raceId === "moorling" && !helmOn) {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * PI * 2;
        head.add(mesh(ico(0.07, 0), pmat("fur", look.hair), { p: [Math.cos(a) * 0.1, 0.16, Math.sin(a) * 0.1 - 0.03], s: [1, 0.8, 1] }));
      }
      head.add(mesh(ext("leaf", SH.leaf, 0.006, 0.003), pmat("plain", "#5f8a3a", { ds: true }), { p: [0.06, 0.24, 0], r: [0.3, 0, -0.5], s: 0.18 }));
    } else if (hs !== 4 && !helmOn) {
      head.add(mesh(cap(HR * 1.06, PI * 0.45), hairM, { p: [0, 0.01, -0.012], r: [-0.3, 0, 0] }));
      for (let i = 0; i < 4; i++) head.add(mesh(cone(0.045, 0.13, 5), hairM, { p: [(i - 1.5) * 0.06, 0.13, 0.13 - Math.abs(i - 1.5) * 0.015], r: [1.9, 0, (i - 1.5) * 0.35], s: [1.2, 1, 0.6] }));
      for (const s of [-1, 1]) head.add(mesh(box(0.03, 0.12, 0.06), hairM, { p: [s * 0.185, -0.02, 0.03] }));
      if (hs === 0) for (let i = 0; i < 5; i++) head.add(mesh(cone(0.045, 0.12, 5), hairM, { p: [(i - 2) * 0.05, 0.17, 0.06 - Math.abs(i - 2) * 0.02], r: [0.7, 0, (i - 2) * -0.3] }));
      if (hs === 3) for (let i = 0; i < 6; i++) head.add(mesh(cone(0.04, 0.2 - Math.abs(i - 2.5) * 0.02, 4), hairM, { p: [0, 0.2 - i * 0.018, 0.1 - i * 0.07], r: [-0.4 - i * 0.18, 0, 0], s: [0.5, 1, 1.3] }));
      if (hs === 5) {
        head.add(mesh(sph(0.07, 10, 8), hairM, { p: [0, 0.21, -0.07] }));
        head.add(mesh(torus(0.05, 0.012, PI * 2, 4, 12), trimM, { p: [0, 0.19, -0.06], r: [1.2, 0, 0] }));
      }
    }
    if (!hoodOn && (hs === 1 || hs === 2 || (fem && hs === 0)) && raceId !== "moorling") {
      // Langes Haar faellt auf die Schultern
      head.add(mesh(cyl(0.17, 0.2, 0.3, 14, true), pmat("hair", look.hair, { ds: true }), { p: [0, -0.12, -0.05], s: [1, 1, 0.9] }));
      if (hs === 2) head.add(mesh(box(0.34, 0.42, 0.08), hairM, { p: [0, -0.24, -0.14], r: [0.15, 0, 0] }));
    }
    if (hs === 1 && raceId !== "moorling") {
      for (const s of [-1, 1]) {
        for (let i = 0; i < 4; i++) head.add(mesh(sph(0.035 - i * 0.003, 8, 6), hairM, { p: [s * 0.17, -0.1 - i * 0.07, 0.04 - i * 0.01] }));
        head.add(mesh(cyl(0.022, 0.022, 0.03, 8), trimM, { p: [s * 0.17, -0.38, 0.0] }));
      }
    }
    const bd = fem ? 0 : look.beard | 0;
    if (bd === 1) head.add(mesh(cone(0.05, 0.16, 8), hairM, { p: [0, -0.24, 0.14], r: [PI - 0.35, 0, 0] }));
    if (bd === 2 || bd === 3) {
      head.add(mesh(sph(0.15, 14, 10, 0), hairM, { p: [0, -0.15, 0.08], s: [1.1, 1.0, 0.75] }));
      head.add(mesh(cone(0.12, 0.24, 10), hairM, { p: [0, -0.32, 0.1], r: [PI - 0.15, 0, 0], s: [1, 1, 0.7] }));
      if (bd === 3) {
        for (const s of [-1, 1]) {
          for (let i = 0; i < 3; i++) head.add(mesh(sph(0.03, 8, 6), hairM, { p: [s * 0.06, -0.42 - i * 0.06, 0.13] }));
          head.add(mesh(cyl(0.022, 0.022, 0.03, 8), trimM, { p: [s * 0.06, -0.6, 0.13] }));
        }
      }
    }
    if (bd === 4 || bd === 2 || bd === 3) for (const s of [-1, 1]) head.add(mesh(capsule(0.016, 0.09, 6), hairM, { p: [s * 0.05, -0.095, 0.19], r: [0, 0, s * 1.15] }));
    if (bd === 4) for (const s of [-1, 1]) head.add(mesh(capsule(0.018, 0.1, 6), hairM, { p: [s * 0.1, -0.18, 0.17], r: [0, 0, s * 0.2] }));

    /* Kopfbedeckung */
    if (gear.helm) buildHelm(head, gear.helm, realm, RM, raceId, parts);

    /* Arme: Schulter, Ellbogen, Hand */
    const bareArms = mat === "leder" && !(gear.helm && false);
    const armSkin = bareArms ? armTex(look.skin, look.tattoo, tcol.c, !!tcol.glow) : null;
    const sleeveM = arch === "krieger" ? pmat("cloth", pantsC) : arch === "magier" ? pmat("cloth", armorC || realmCloth) : pmat("leather", shirtC);
    const handM = gear.handschuhe ? (arch === "krieger" ? pmat("metal", shade(gear.handschuhe.tint || armorC || RM.metal, 1)) : pmat("leather", gear.handschuhe.tint || "#4a3424")) : skinM;
    const upL = 0.3 * h;
    const foL = 0.28 * h;
    for (const side of [1, -1]) {
      const arm = grp([(0.34 * tw + 0.02) * side, shY - 0.04, 0]);
      arm.add(mesh(capsule(0.075 * bulk, upL * 0.7), bareArms ? armSkin : sleeveM, { p: [0, -upL / 2, 0] }));
      const elbow = grp([0, -upL, 0]);
      arm.add(elbow);
      elbow.add(mesh(capsule(0.068 * bulk, foL * 0.7), bareArms || arch === "krieger" ? (bareArms ? skinM : sleeveM) : sleeveM, { p: [0, -foL / 2, 0] }));
      // Armschienen / Aermel
      if (arch === "krieger") {
        elbow.add(mesh(cyl(0.085 * bulk, 0.075 * bulk, foL * 0.7, 10), metalM, { p: [0, -foL * 0.5, 0] }));
        arm.add(mesh(capsule(0.082 * bulk, upL * 0.4), metalM, { p: [0, -upL * 0.6, 0] }));
        elbow.add(mesh(sph(0.06 * bulk, 8, 6), trimM, { p: [0, 0, -0.04] }));
      } else if (arch === "magier") {
        elbow.add(mesh(cyl(0.08 * bulk, 0.15 * bulk, foL * 0.8, 12, true), pmat("cloth", armorC || realmCloth, { ds: true }), { p: [0, -foL * 0.55, 0] }));
        elbow.add(mesh(torus(0.145 * bulk, 0.012, PI * 2, 4, 16), trimM, { p: [0, -foL * 0.95, 0], r: [PI / 2, 0, 0] }));
      } else {
        elbow.add(mesh(cyl(0.078 * bulk, 0.072 * bulk, foL * 0.6, 10), pmat("leather", gear.handschuhe ? gear.handschuhe.tint || "#3a281c" : "#3a281c"), { p: [0, -foL * 0.62, 0] }));
        for (let i = 0; i < 2; i++) elbow.add(mesh(torus(0.079 * bulk, 0.008, PI * 2, 4, 12), trimM, { p: [0, -foL * (0.45 + i * 0.3), 0], r: [PI / 2, 0, 0] }));
      }
      const hand = grp([0, -foL - 0.04, 0.01]);
      hand.add(mesh(sph(0.065 * bulk, 10, 8), handM, { s: [1, 1.15, 1.05] }));
      hand.add(mesh(box(0.06 * bulk, 0.05, 0.1), handM, { p: [0, -0.03, 0.03] }));
      elbow.add(hand);
      buildShoulder(arm, side, arch, realm, RM, armor, tw, bulk, metalM, trimM);
      torso.add(arm);
      parts[side > 0 ? "armL" : "armR"] = arm;
      parts[side > 0 ? "elbowL" : "elbowR"] = elbow;
      parts[side > 0 ? "handL" : "handR"] = hand;
    }

    /* Waffe und Nebenhand */
    const wpn = gear.waffe;
    const dual = wpn && (wpn.base === "dolch" || wpn.base === "sichel" || wpn.base === "kurzschwert");
    if (wpn) {
      const wg = buildWeapon(wpn, realmArg);
      if (wpn.base === "bogen") {
        wg.rotation.set(PI / 2, 0, 0);
        wg.position.set(0, -0.02, 0.02);
        parts.handL.add(wg);
      } else if (wpn.base === "armbrust") {
        wg.rotation.set(-0.1, 0, 0);
        wg.position.set(0, -0.02, 0);
        parts.handR.add(wg);
      } else if (wpn.base === "stab" || wpn.base === "runenstab" || wpn.base === "speer") {
        wg.rotation.set(0.9, 0, 0);
        wg.position.set(0, -0.02, 0.02);
        parts.handR.add(wg);
      } else {
        // Klinge nach vorn und leicht nach aussen, nicht vor das Gesicht
        wg.rotation.set(dual ? 2.75 : 2.15, 0, dual ? 0 : 0.25);
        wg.position.set(0, -0.03, 0.02);
        parts.handR.add(wg);
      }
      wg.scale.setScalar(0.82);
      parts.weapon = wg;
      if (dual) {
        const w2 = buildWeapon(wpn, realmArg);
        w2.rotation.set(2.75, 0, 0);
        w2.position.set(0, -0.03, 0.02);
        w2.scale.setScalar(0.82);
        parts.handL.add(w2);
        parts.weapon2 = w2;
      }
    }
    const off = gear.nebenhand;
    if (off) {
      const og = buildOffhand(off, realmArg);
      if (off.base === "schild") {
        og.position.set(0.06, -0.06, 0.02);
        og.rotation.set(PI / 2, 0, -0.2);
        og.scale.setScalar(0.92);
        parts.handL.add(og);
      } else if (off.base === "koecher") {
        og.position.set(0.12, chestY + 0.05, -0.24);
        og.rotation.set(-0.25, 0, -0.45);
        torso.add(og);
      } else if (off.base === "wurfmesser") {
        og.position.set(0, chestY - 0.03, 0.235);
        og.rotation.set(-0.12, 0, -0.62);
        torso.add(og);
      } else {
        og.position.set(0.32, 0.25, 0.32);
        og.userData.float = 1;
        torso.add(og);
      }
      parts.offhand = og;
    }

    const scale = 0.96 + 0.04 * h;
    root.scale.setScalar(scale);
    const model = makeModel(root, parts, "hero");
    model.cls = clsId;
    model.arch = arch;
    model.realm = desc.realmDef ? null : realm;
    model.dual = !!dual;
    model.ranged = !!(wpn && SB.data.BASES[wpn.base] && SB.data.BASES[wpn.base].ranged);
    model.weaponBase = wpn ? wpn.base : null;
    model.height = (hipY + shY + 0.45) * scale;
    model.headY = (hipY + shY + 0.21) * scale;
    model.projColor = arch === "magier" ? (realm === "albion" ? "#ffd27a" : realm === "midgard" ? "#9fd8ff" : "#7fffb0") : arch === "jaeger" ? "#e9d8a6" : "#ffd25a";
    return model;
  };
  const glowEyes = (eyeInfo, undead) => !!(eyeInfo && eyeInfo.glow) || undead;

  /* ---------- Animation ---------- */
  function makeModel(root, parts, kind) {
    const model = {
      obj: root,
      parts,
      kind,
      t: Math.random() * 10,
      anim: null,
      hold: null,
      speed: 1,
      flashT: 0,
      play(name, dur) {
        dur = (dur || 0.5) / (model.speed || 1);
        if (model.inner) model.inner.play(name, dur * (model.speed || 1));
        return new Promise((res) => {
          if (model.anim && model.anim.res) model.anim.res();
          model.anim = { name, t: 0, dur, res };
          if (name === "defeat") model.hold = "defeat";
          if (name === "idle") model.hold = null;
        });
      },
      flash(dur) {
        model.flashT = dur || 0.1;
        root.traverse((o) => {
          if (o.isMesh && !o.material.transparent) {
            if (!o.userData.m0) o.userData.m0 = o.material;
            o.material = flashMat();
          }
        });
      },
      update(dt) {
        model.t += dt;
        if (model.flashT > 0) {
          model.flashT -= dt;
          if (model.flashT <= 0)
            root.traverse((o) => {
              if (o.isMesh && o.userData.m0) {
                o.material = o.userData.m0;
                o.userData.m0 = null;
              }
            });
        }
        let u = 0;
        let name = model.hold || "idle";
        if (model.anim) {
          model.anim.t += dt;
          u = Math.min(1, model.anim.t / model.anim.dur);
          name = model.anim.name;
          if (model.anim.t >= model.anim.dur) {
            const res = model.anim.res;
            model.anim = null;
            if (res) res();
            if (name === "defeat") u = 1;
          }
        }
        if (kind === "hero") poseHero(model, name, u, dt);
        else if (R.poseMonster) R.poseMonster(model, name, u, dt);
        if (model.inner) model.inner.update(dt);
        const t = model.t;
        root.traverse((o) => {
          const ud = o.userData;
          if (ud.spin) o.rotation.y += dt * ud.spin;
          if (ud.bob) o.position.y = Math.sin(t * 2.5) * 0.05;
          if (ud.float) o.position.y = 0.25 + Math.sin(t * 2) * 0.05;
          if (ud.dangle) o.rotation.z = Math.sin(t * 2 + ud.dangle) * 0.25;
          if (ud.pulse && o.isSprite) o.scale.setScalar(ud.s0 * (0.88 + Math.sin(t * 3 + ud.s0 * 7) * 0.12));
          if (ud.flick) o.scale.y = 1 + Math.sin(t * 13 + ud.flick) * 0.15;
        });
      },
    };
    return model;
  }
  R.makeModel = makeModel;
  R.headGeo = headGeo;
  const ease = (u) => u * u * (3 - 2 * u);
  const bell = (u) => Math.sin(PI * u);
  R.ease = ease;
  R.bell = bell;

  // Grundhaltung je Kampfstil
  function stance(m) {
    const A = m.arch;
    const s = { shL: [-0.25, 0.12], shR: [-0.3, -0.12], elL: -0.5, elR: -0.7, hipL: -0.12, hipR: 0.12, knL: 0.2, knR: 0.2, lean: 0.05, twist: 0, y: -0.02, head: 0 };
    if (A === "krieger") {
      s.shL = [-0.65, 0.25];
      s.elL = -1.0;
      s.shR = [-0.2, -0.2];
      s.elR = -0.9;
      s.hipL = -0.3;
      s.hipR = 0.2;
      s.knL = 0.35;
      s.knR = 0.25;
      s.twist = 0.12;
      s.y = -0.04;
    } else if (A === "schurke") {
      s.shL = [-0.55, 0.3];
      s.elL = -1.25;
      s.shR = [-0.5, -0.3];
      s.elR = -1.25;
      s.hipL = -0.45;
      s.hipR = 0.15;
      s.knL = 0.6;
      s.knR = 0.45;
      s.lean = 0.22;
      s.y = -0.1;
    } else if (A === "jaeger") {
      if (m.weaponBase === "bogen") {
        s.shL = [-0.35, 0.18];
        s.elL = -0.35;
        s.shR = [-0.15, -0.15];
        s.elR = -0.3;
      } else if (m.weaponBase === "armbrust") {
        s.shL = [-0.7, 0.35];
        s.elL = -0.8;
        s.shR = [-0.45, -0.1];
        s.elR = -1.0;
      } else {
        s.shR = [-0.35, -0.18];
        s.elR = -0.8;
        s.shL = [-0.45, 0.2];
        s.elL = -0.9;
      }
      s.hipL = -0.25;
      s.knL = 0.3;
    } else if (A === "magier") {
      s.shR = [-0.15, -0.18];
      s.elR = -0.75;
      s.shL = [-0.55, 0.3];
      s.elL = -1.0;
      s.knL = 0.1;
      s.knR = 0.1;
      s.hipL = -0.05;
      s.hipR = 0.05;
    }
    return s;
  }

  function poseHero(m, name, u) {
    const P = m.parts;
    const t = m.t;
    const s = stance(m);
    const br = Math.sin(t * 2.1);
    let shL = s.shL.slice();
    let shR = s.shR.slice();
    let elL = s.elL + br * 0.04;
    let elR = s.elR - br * 0.04;
    let hipL = s.hipL;
    let hipR = s.hipR;
    let knL = s.knL;
    let knR = s.knR;
    let lean = s.lean + br * 0.015;
    let twist = s.twist;
    let y = s.y + br * 0.012;
    let headX = s.head + Math.sin(t * 1.1) * 0.03;
    let rootRX = 0;
    let rootRZ = 0;
    let rootY = 0;
    const A = m.arch;
    switch (name) {
      case "attack": {
        const up = u < 0.4 ? ease(u / 0.4) : 1 - ease((u - 0.4) / 0.6);
        const sw = u < 0.4 ? 0 : bell((u - 0.4) / 0.6);
        if (m.dual) {
          const k = u < 0.5 ? bell(u * 2) : 0;
          const k2 = u >= 0.5 ? bell((u - 0.5) * 2) : 0;
          shR = [-0.5 - 1.2 * k, -0.3 - 0.6 * k];
          elR = -1.25 + 1.0 * k;
          shL = [-0.55 - 1.2 * k2, 0.3 + 0.6 * k2];
          elL = -1.25 + 1.0 * k2;
          twist = 0.35 * k - 0.35 * k2;
          lean = 0.3;
        } else {
          shR = [-0.3 - 2.5 * up + 1.6 * sw, -0.15 - 0.3 * up];
          elR = -0.9 + 0.6 * up + 0.5 * sw;
          twist = s.twist - 0.4 * up + 0.5 * sw;
          lean = s.lean - 0.12 * up + 0.3 * sw;
          knL = s.knL + 0.25 * sw;
        }
        break;
      }
      case "cast": {
        const up = bell(u);
        shR = [-0.15 - 1.4 * up, -0.18];
        elR = -0.75 + 0.4 * up;
        shL = [-0.55 - 1.0 * up, 0.3 + 0.2 * up];
        elL = -1.0 + 0.8 * up;
        y += 0.06 * up;
        headX = -0.15 * up;
        lean = -0.08 * up;
        break;
      }
      case "shoot": {
        const raise = u < 0.25 ? ease(u / 0.25) : 1;
        const pull = u < 0.25 ? 0 : u < 0.7 ? ease((u - 0.25) / 0.45) : 1 - ease((u - 0.7) / 0.3);
        if (m.weaponBase === "bogen") {
          shL = [-1.55 * raise, 0.15];
          elL = -0.05;
          shR = [-1.55 * raise, -0.1 + 0.35 * pull];
          elR = -0.4 - 1.9 * pull;
          twist = 0.45 * raise;
        } else if (m.weaponBase === "speer") {
          shR = [-0.3 - 2.6 * pull + (u > 0.7 ? 2.2 * (u - 0.7) / 0.3 : 0), -0.2];
          elR = -0.5;
          lean = 0.2 * pull;
        } else {
          shL = [-1.3 * raise, 0.35];
          elL = -0.5;
          shR = [-1.3 * raise, -0.1];
          elR = -0.6;
          lean = -0.1 * pull;
        }
        break;
      }
      case "hit":
        lean = s.lean - 0.4 * bell(u);
        headX = -0.3 * bell(u);
        y += -0.04 * bell(u);
        break;
      case "block":
        shL = [-1.4 * bell(u) + s.shL[0] * (1 - bell(u)), 0.4];
        elL = -1.4;
        lean = s.lean - 0.1 * bell(u);
        knL = s.knL + 0.2 * bell(u);
        knR = s.knR + 0.2 * bell(u);
        y -= 0.06 * bell(u);
        break;
      case "evade":
        rootRZ = 0.35 * bell(u);
        y += 0.1 * bell(u);
        knL += 0.4 * bell(u);
        knR += 0.4 * bell(u);
        hipL -= 0.3 * bell(u);
        hipR -= 0.3 * bell(u);
        break;
      case "victory": {
        const j = Math.abs(Math.sin(u * PI * 2));
        rootY = 0.25 * j;
        shR = [-2.9, -0.25];
        elR = -0.2;
        shL = [-0.4, 0.5];
        elL = -0.6;
        headX = -0.25;
        break;
      }
      case "walk": {
        const sw = Math.sin(t * 9);
        hipL = -sw * 0.55;
        hipR = sw * 0.55;
        knL = 0.3 + Math.max(0, sw) * 0.7;
        knR = 0.3 + Math.max(0, -sw) * 0.7;
        if (A !== "krieger") {
          shL = [sw * 0.5 + s.shL[0] * 0.5, s.shL[1]];
          shR = [-sw * 0.5 + s.shR[0] * 0.5, s.shR[1]];
        }
        y = -0.03 + Math.abs(Math.cos(t * 9)) * 0.04;
        break;
      }
      case "defeat": {
        const e = ease(u);
        rootRX = -1.45 * e;
        rootY = -0.08 * e;
        knL = s.knL + 0.8 * e;
        knR = s.knR + 0.6 * e;
        hipL = -0.6 * e;
        shL = [-2.4 * e, 0.6];
        shR = [-2.2 * e, -0.6];
        elL = -0.3;
        elR = -0.3;
        break;
      }
      case "special": {
        const up = bell(u);
        const sp = u < 0.5 ? ease(u * 2) : 1;
        rootY = 0.45 * up;
        if (A === "magier") {
          shR = [-2.8 * up, -0.2];
          shL = [-2.8 * up, 0.2];
          elR = -0.2;
          elL = -0.2;
          headX = -0.3 * up;
        } else if (A === "jaeger" && m.weaponBase === "bogen") {
          shL = [-1.9 * up, 0.15];
          elL = 0;
          shR = [-1.9 * up, 0.2];
          elR = -2.0 * up;
          lean = -0.3 * up;
        } else {
          twist = PI * 2 * sp;
          shR = [-1.4 * up, -1.2 * up];
          elR = -0.3;
          shL = [-1.0 * up, 1.0 * up];
          elL = -0.4;
          knL = 0.6 * up + s.knL;
          knR = 0.6 * up + s.knR;
        }
        break;
      }
    }
    P.body.position.y = y + rootY;
    P.body.rotation.x = rootRX;
    P.body.rotation.z = rootRZ;
    P.torso.rotation.x = lean;
    P.torso.rotation.y = twist;
    if (P.armL) P.armL.rotation.set(shL[0], 0, shL[1]);
    if (P.armR) P.armR.rotation.set(shR[0], 0, shR[1]);
    if (P.elbowL) P.elbowL.rotation.x = elL;
    if (P.elbowR) P.elbowR.rotation.x = elR;
    if (P.head) P.head.rotation.x = headX - lean * 0.6;
    // Beine gleichen die Rumpfneigung aus, damit die Fuesse am Boden bleiben
    if (P.legL) P.legL.rotation.x = hipL;
    if (P.legR) P.legR.rotation.x = hipR;
    if (P.kneeL) P.kneeL.rotation.x = knL;
    if (P.kneeR) P.kneeR.rotation.x = knR;
    if (P.cape) {
      const arr = P.cape.geometry.attributes.position.array;
      const base = P.cape.userData.cape;
      for (let i = 0; i < arr.length; i += 3) {
        const yy = base[i + 1];
        const k = Math.max(0, -yy);
        arr[i + 2] = base[i + 2] - k * (0.18 + lean * 0.4) - Math.sin(t * 2.6 + yy * 4 + base[i] * 3) * 0.05 * k;
      }
      P.cape.geometry.attributes.position.needsUpdate = true;
    }
    if (P.tabard) P.tabard.rotation.x = -0.08 - Math.max(hipL, hipR) * -0.3 * 0 + Math.sin(t * 2.2) * 0.03 - Math.min(hipL, 0) * 0.4;
  }
})();

</script>
<script>/* src/r3d-monsters.js */
/* Helden von Schwebfels - Monster der Tiefe (three.js, prozedural).
   Bedrohliche Kreaturen statt niedlicher Figuren: gluehende Augen, Zaehne, Klauen, gebeugte Haltung. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const R = (SB.R3D = SB.R3D || {});
  const PI = Math.PI;
  let T = null;
  let mesh, grp, G, M;

  function init() {
    T = R.T();
    mesh = R.mesh;
    grp = R.grp;
    G = R.geo;
    M = R.mat;
  }

  /* ---------- Bausteine ---------- */
  // Zweigliedrige Gliedmasse: Ansatz, Gelenk, Ende
  function limb(parent, at, l1, l2, r1, r2, mat, rot) {
    const up = grp(at, rot);
    up.add(mesh(G.capsule(r1, Math.max(0.01, l1 - r1 * 1.4), 8), mat, { p: [0, -l1 / 2, 0] }));
    const lo = grp([0, -l1, 0]);
    up.add(lo);
    lo.add(mesh(G.capsule(r2, Math.max(0.01, l2 - r2 * 1.4), 8), mat, { p: [0, -l2 / 2, 0] }));
    const end = grp([0, -l2, 0]);
    lo.add(end);
    parent.add(up);
    return { up, lo, end };
  }
  function claws(g, n, len, mat, spread) {
    for (let i = 0; i < n; i++) {
      const a = (i - (n - 1) / 2) * (spread || 0.35);
      g.add(mesh(G.cone(len * 0.18, len, 5), mat, { p: [Math.sin(a) * len * 0.4, -len * 0.4, Math.cos(a) * len * 0.25 + 0.02], r: [PI - 0.5, 0, a] }));
    }
  }
  function eyes(g, pts, color, r) {
    const em = M.emis(color, 1.4);
    for (const p of pts) {
      g.add(mesh(G.sph(r, 8, 6), em, { p }));
      g.add(R.haloSprite(color, r * 7, 0.75, p));
    }
  }
  function teeth(g, n, x0, x1, y, z, len, mat, down) {
    for (let i = 0; i < n; i++) {
      const x = x0 + ((x1 - x0) * i) / Math.max(1, n - 1);
      g.add(mesh(G.cone(len * 0.28, len, 4), mat, { p: [x, y, z], r: [down ? PI : 0, 0, 0] }));
    }
  }
  function spikes(g, pts, len, mat) {
    for (const [x, y, z, rx, rz] of pts) g.add(mesh(G.cone(len * 0.22, len, 5), mat, { p: [x, y, z], r: [rx || 0, 0, rz || 0] }));
  }
  const bone = () => M.pmat("bone", "#e6dcc4");

  /* ---------- Monsterbauplaene ---------- */
  const B = {};

  // Untoter: abgemagert, gebeugt, lange Klauenarme
  B.ghul = function (m, root, P) {
    const skin = M.pmat("skin", m.color);
    const rag = M.pmat("cloth", R.shade(m.color, 0.35), { ds: true });
    const body = grp([0, 0, 0]);
    root.add(body);
    P.spine = body;
    for (const s of [1, -1]) {
      const L = limb(body, [0.14 * s, 0.95, 0], 0.48, 0.5, 0.06, 0.05, skin, [-0.5, 0, 0]);
      L.lo.rotation.x = 0.9;
      L.end.add(mesh(G.box(0.1, 0.05, 0.22), skin, { p: [0, 0, 0.08], r: [-0.4, 0, 0] }));
      (P.legs = P.legs || []).push({ up: L.up, lo: L.lo, ph: s > 0 ? 0 : PI, base: -0.5, kb: 0.9 });
    }
    const torso = grp([0, 0.95, 0], [0.75, 0, 0]);
    body.add(torso);
    P.torso = torso;
    torso.add(mesh(G.sph(0.16, 12, 10), skin, { p: [0, 0.05, 0], s: [1.2, 0.8, 0.9] }));
    torso.add(mesh(G.cyl(0.06, 0.07, 0.5, 8), skin, { p: [0, 0.3, -0.04] }));
    for (let i = 0; i < 5; i++) torso.add(mesh(G.torus(0.2 - i * 0.012, 0.022, PI * 1.3, 5, 14), bone(), { p: [0, 0.3 + i * 0.075, 0.02], r: [PI / 2, 0, PI * 0.35 + PI], s: [1.15, 0.85, 1] }));
    torso.add(mesh(G.sph(0.17, 10, 8), M.basic("#0b0a0e"), { p: [0, 0.45, 0], s: [1, 1.3, 0.7] }));
    for (let i = 0; i < 6; i++) torso.add(mesh(G.cone(0.03, 0.09, 4), bone(), { p: [0, 0.18 + i * 0.09, -0.15], r: [-1.9, 0, 0] }));
    // Lumpen
    torso.add(mesh(G.cyl(0.18, 0.28, 0.4, 10, true), rag, { p: [0, -0.15, 0] }));
    // Arme bis zum Boden
    const sh = 0.72;
    for (const s of [1, -1]) {
      const A = limb(torso, [0.24 * s, sh, 0], 0.48, 0.5, 0.055, 0.045, skin, [0, 0, 0.15 * s]);
      claws(A.end, 3, 0.18, bone(), 0.4);
      A.end.add(mesh(G.sph(0.06, 8, 6), skin, { s: [1, 1.2, 1] }));
      P[s > 0 ? "armL" : "armR"] = A;
    }
    // Kopf mit herabhaengendem Kiefer
    const head = grp([0, 0.95, 0.08], [-0.8, 0, 0]);
    torso.add(head);
    P.head = head;
    head.add(mesh(R.headGeo(0.7, 0.4, 1.05), skin, { s: [0.95, 1, 1] }));
    for (const s of [1, -1]) head.add(mesh(G.sph(0.055, 8, 6), M.basic("#050407"), { p: [s * 0.07, 0.02, 0.15] }));
    eyes(head, [[0.07, 0.02, 0.18], [-0.07, 0.02, 0.18]], m.accent, 0.022);
    const jaw = grp([0, -0.08, 0.02]);
    head.add(jaw);
    jaw.add(mesh(G.box(0.16, 0.04, 0.16), skin, { p: [0, -0.04, 0.08] }));
    teeth(jaw, 6, -0.06, 0.06, -0.01, 0.15, 0.05, bone());
    teeth(head, 6, -0.06, 0.06, -0.09, 0.17, 0.045, bone(), true);
    P.jaw = jaw;
    P.jawOpen = 0.35;
    head.add(mesh(G.cyl(0.13, 0.2, 0.18, 10, true), rag, { p: [0, -0.04, -0.06], r: [0.3, 0, 0] }));
    root.add(R.haloSprite(m.accent, 1.2, 0.15, [0, 1.3, 0]));
    P.headY = 1.75;
  };

  // Schlund: ein Maul auf Beinen mit Zahnkranz und Tentakeln
  B.schlund = function (m, root, P) {
    const hide = M.pmat("scale", m.color);
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.sph(0.75, 22, 16), hide, { p: [0, 0.9, -0.1], s: [1.15, 0.9, 1.05] }));
    // Maul: oberer Schaedel klappt auf
    const top = grp([0, 1.0, 0.2]);
    body.add(top);
    top.add(mesh(G.cap(0.7, PI * 0.5), hide, { p: [0, 0, 0.05], s: [1.1, 0.75, 1.0] }));
    teeth(top, 9, -0.5, 0.5, -0.02, 0.62, 0.16, bone(), true);
    for (let i = 0; i < 5; i++) {
      const a = -0.6 + i * 0.3;
      top.add(mesh(G.sph(0.05, 8, 6), M.emis(m.accent, 1.4), { p: [Math.sin(a) * 0.45, 0.42 - Math.abs(a) * 0.1, Math.cos(a) * 0.3] }));
    }
    top.add(R.haloSprite(m.accent, 0.7, 0.4, [0, 0.45, 0.25]));
    spikes(top, [[0, 0.5, -0.3, -0.8], [0.3, 0.45, -0.3, -0.8, -0.4], [-0.3, 0.45, -0.3, -0.8, 0.4], [0, 0.35, -0.6, -1.4]], 0.3, bone());
    P.jaw = top;
    P.jawOpen = -0.55;
    P.jawSign = -1;
    // Rachen und unterer Zahnkranz
    body.add(mesh(G.sph(0.55, 16, 10), M.emis(R.shade(m.accent, 0.35), 0.6), { p: [0, 0.95, 0.3], s: [1, 0.5, 0.8] }));
    teeth(body, 9, -0.5, 0.5, 0.95, 0.75, 0.15, bone());
    body.add(mesh(G.cone(0.12, 0.6, 8), M.pmat("skin", R.mix(m.color, "#c03050", 0.5)), { p: [0, 0.98, 0.5], r: [1.4, 0, 0], s: [1.4, 1, 0.5] }));
    // Tentakel
    P.tentacles = [];
    for (const s of [1, -1]) {
      for (let k = 0; k < 2; k++) {
        const tg = grp([0.7 * s, 0.9 - k * 0.25, -0.1 - k * 0.2], [0, 0, -s * (0.9 + k * 0.4)]);
        tg.add(mesh(G.tube("tent", [[0, 0, 0], [0.05, 0.25, 0.05], [0, 0.5, 0.1], [-0.08, 0.7, 0.05], [-0.04, 0.85, 0]], 0.06, 16, 6), hide));
        tg.add(mesh(G.cone(0.04, 0.12, 5), bone(), { p: [-0.04, 0.9, 0] }));
        body.add(tg);
        P.tentacles.push({ g: tg, s, k });
      }
    }
    for (const [x, z] of [[0.45, 0.3], [-0.45, 0.3], [0.45, -0.45], [-0.45, -0.45]]) {
      body.add(mesh(G.capsule(0.13, 0.25, 8), hide, { p: [x, 0.25, z] }));
      const foot = grp([x, 0.06, z + 0.1]);
      body.add(foot);
      claws(foot, 3, 0.1, bone());
    }
    P.headY = 1.8;
  };

  // Nachtgoblin: klein, krumm, grosse Ohren, Krummklinge
  B.goblin = function (m, root, P) {
    const skin = M.pmat("skin", m.color);
    const leather = M.pmat("leather", "#3a2a1e");
    const body = grp();
    root.add(body);
    P.spine = body;
    for (const s of [1, -1]) {
      const L = limb(body, [0.11 * s, 0.6, 0], 0.3, 0.3, 0.06, 0.05, skin, [-0.45, 0, 0]);
      L.lo.rotation.x = 0.8;
      L.end.add(mesh(G.box(0.1, 0.05, 0.2), leather, { p: [0, 0, 0.06], r: [-0.35, 0, 0] }));
      (P.legs = P.legs || []).push({ up: L.up, lo: L.lo, ph: s > 0 ? 0 : PI, base: -0.45, kb: 0.8 });
    }
    const torso = grp([0, 0.6, 0], [0.35, 0, 0]);
    body.add(torso);
    P.torso = torso;
    torso.add(mesh(G.sph(0.22, 14, 10), skin, { p: [0, 0.22, 0], s: [1.1, 1.0, 0.85] }));
    torso.add(mesh(G.cyl(0.18, 0.24, 0.24, 10, true), M.pmat("leather", "#4a3424", { ds: true }), { p: [0, 0.0, 0] }));
    torso.add(mesh(G.box(0.05, 0.4, 0.03), leather, { p: [0, 0.22, 0.17], r: [0, 0, 0.6] }));
    torso.add(mesh(G.cap(0.12, PI * 0.5), M.pmat("metal", "#6a6258"), { p: [0.2, 0.38, 0], r: [0, 0, -0.5], s: [1.2, 0.7, 1.1] }));
    for (const s of [1, -1]) {
      const A = limb(torso, [0.23 * s, 0.36, 0], 0.26, 0.26, 0.045, 0.04, skin, [-0.3, 0, 0.25 * s]);
      A.end.add(mesh(G.sph(0.05, 8, 6), skin));
      claws(A.end, 3, 0.07, bone(), 0.5);
      P[s > 0 ? "armL" : "armR"] = A;
    }
    // Krummklinge rechts
    const blade = grp([0, -0.02, 0.02], [PI / 2, 0, 0]);
    blade.add(mesh(G.cyl(0.02, 0.022, 0.12, 6), leather));
    blade.add(mesh(G.ext("sickle", R.SH.sickle, 0.01, 0.008), M.pmat("metal", "#8a8f96"), { p: [0, 0.06, 0], s: 1.3 }));
    P.armR.end.add(blade);
    // Kopf
    const head = grp([0, 0.6, 0.06], [-0.3, 0, 0]);
    torso.add(head);
    P.head = head;
    head.add(mesh(R.headGeo(1.5, 1.3, 0.9), skin, { s: [1.15, 0.95, 1] }));
    head.add(mesh(G.cone(0.04, 0.2, 6), skin, { p: [0, -0.02, 0.24], r: [1.2, 0, 0] }));
    for (const s of [1, -1]) head.add(mesh(G.cone(0.08, 0.42, 5), skin, { p: [s * 0.27, 0.05, -0.02], r: [0.3, 0, -s * 1.3], s: [1, 1, 0.35] }));
    eyes(head, [[0.08, 0.04, 0.17], [-0.08, 0.04, 0.17]], m.accent, 0.028);
    head.add(mesh(G.box(0.22, 0.03, 0.06), M.basic("#0b0a0e"), { p: [0, -0.1, 0.16] }));
    teeth(head, 7, -0.09, 0.09, -0.095, 0.185, 0.03, bone(), true);
    head.add(mesh(G.box(0.24, 0.06, 0.2), M.pmat("skin", R.shade(m.color, 0.85)), { p: [0, 0.08, 0.06], r: [-0.3, 0, 0] }));
    P.headY = 1.25;
  };

  // Bestie / Wolf: massiger Nacken, Maehne, Fangzaehne
  B.wolf = function (m, root, P) {
    const fur = M.pmat("fur", m.color);
    const dark = M.pmat("fur", R.shade(m.color, 0.6));
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.capsule(0.27, 0.8, 12), fur, { p: [0, 0.95, -0.15], r: [PI / 2 - 0.2, 0, 0], s: [0.95, 1, 1] }));
    body.add(mesh(G.sph(0.4, 16, 12), fur, { p: [0, 1.1, 0.35], s: [0.95, 1.05, 1.05] }));
    // Maehne
    for (let i = 0; i < 9; i++) {
      const z = 0.45 - i * 0.12;
      body.add(mesh(G.cone(0.09, 0.4 - i * 0.025, 5), dark, { p: [0, 1.48 - i * 0.05, z], r: [-1.1, 0, 0] }));
      for (const s of [1, -1]) if (i < 4) body.add(mesh(G.cone(0.07, 0.28, 5), dark, { p: [s * 0.3, 1.25 - i * 0.03, z], r: [-0.6, 0, -s * 0.8] }));
    }
    P.legs = [];
    const legAt = [[0.24, 0.95, 0.4, 0], [-0.24, 0.95, 0.4, PI], [0.22, 0.9, -0.6, PI], [-0.22, 0.9, -0.6, 0]];
    for (const [x, y, z, ph] of legAt) {
      const front = z > 0;
      const L = limb(body, [x, y, z], 0.45, 0.45, 0.085, 0.06, fur, [front ? 0.1 : 0.5, 0, 0]);
      L.lo.rotation.x = front ? -0.2 : -0.9;
      L.end.add(mesh(G.sph(0.09, 8, 6), dark, { p: [0, 0, 0.05], s: [1, 0.6, 1.4] }));
      claws(L.end, 3, 0.08, bone(), 0.4);
      P.legs.push({ up: L.up, lo: L.lo, ph, base: front ? 0.1 : 0.5, kb: front ? -0.2 : -0.9, quad: true });
    }
    // Kopf mit Schnauze und Kiefer
    const head = grp([0, 1.25, 0.8], [0.15, 0, 0]);
    body.add(head);
    P.head = head;
    head.add(mesh(G.sph(0.2, 14, 10), fur, { s: [1.1, 0.95, 1.05] }));
    head.add(mesh(G.cyl(0.08, 0.15, 0.42, 6), fur, { p: [0, -0.05, 0.3], r: [PI / 2, 0, 0], s: [1.1, 1, 0.7] }));
    head.add(mesh(G.sph(0.045, 8, 6), M.basic("#0b0a0e"), { p: [0, -0.02, 0.52] }));
    for (const s of [1, -1]) {
      head.add(mesh(G.cone(0.08, 0.28, 4), fur, { p: [s * 0.12, 0.2, -0.06], r: [-0.5, 0, -s * 0.3] }));
      head.add(mesh(G.box(0.12, 0.035, 0.06), M.pmat("fur", R.shade(m.color, 0.35)), { p: [s * 0.08, 0.1, 0.15], r: [0, 0, s * 0.4] }));
    }
    eyes(head, [[0.085, 0.06, 0.17], [-0.085, 0.06, 0.17]], m.accent, 0.03);
    teeth(head, 2, -0.065, 0.065, -0.13, 0.42, 0.1, bone(), true);
    teeth(head, 4, -0.06, 0.06, -0.13, 0.3, 0.05, bone(), true);
    const jaw = grp([0, -0.12, 0.06]);
    head.add(jaw);
    jaw.add(mesh(G.box(0.15, 0.05, 0.36), fur, { p: [0, -0.03, 0.2] }));
    jaw.add(mesh(G.box(0.12, 0.02, 0.3), M.pmat("skin", "#7a2a2a"), { p: [0, 0.0, 0.2] }));
    teeth(jaw, 2, -0.055, 0.055, 0.0, 0.34, 0.09, bone());
    P.jaw = jaw;
    P.jawOpen = 0.5;
    // Schwanz
    const tail = grp([0, 1.05, -0.65]);
    for (let i = 0; i < 4; i++) tail.add(mesh(G.sph(0.11 - i * 0.015, 8, 6), fur, { p: [0, -i * 0.08, -i * 0.12], s: [1, 1, 1.5] }));
    body.add(tail);
    P.tail = tail;
    P.headY = 1.75;
  };

  // Golem: Runenstein, gluehende Risse, schwebende Felsen
  B.golem = function (m, root, P) {
    const st = M.pmat("stone", m.color, { flat: true });
    const rune = M.emis(m.accent, 1.3);
    const body = grp();
    root.add(body);
    P.spine = body;
    for (const s of [1, -1]) {
      const L = limb(body, [0.32 * s, 1.0, 0], 0.5, 0.5, 0.18, 0.2, st, [-0.15, 0, 0]);
      L.lo.rotation.x = 0.2;
      L.end.add(mesh(G.dodeca(0.24), st, { p: [0, 0.02, 0.06], s: [1, 0.6, 1.3] }));
      (P.legs = P.legs || []).push({ up: L.up, lo: L.lo, ph: s > 0 ? 0 : PI, base: -0.15, kb: 0.2, heavy: true });
    }
    const torso = grp([0, 1.0, 0], [0.18, 0, 0]);
    body.add(torso);
    P.torso = torso;
    torso.add(mesh(G.dodeca(0.55), st, { p: [0, 0.75, 0], s: [1.35, 1.05, 0.95] }));
    torso.add(mesh(G.dodeca(0.32), st, { p: [0, 0.2, 0], s: [1.2, 0.9, 0.9] }));
    torso.add(mesh(G.octa(0.16), rune, { p: [0, 0.8, 0.48], s: [1, 1.4, 0.6] }));
    torso.add(R.haloSprite(m.accent, 1.1, 0.6, [0, 0.8, 0.55]));
    for (let i = 0; i < 6; i++) torso.add(mesh(G.box(0.03, 0.18, 0.02), rune, { p: [Math.cos(i) * 0.4, 0.55 + Math.sin(i * 2) * 0.3, 0.42 - Math.abs(Math.cos(i)) * 0.15], r: [0, Math.cos(i) * 0.6, i] }));
    // Schultern mit Felsen
    for (const s of [1, -1]) {
      torso.add(mesh(G.dodeca(0.3), st, { p: [s * 0.72, 1.05, 0], s: [1.2, 0.9, 1.1] }));
      torso.add(mesh(G.cone(0.1, 0.4, 5), st, { p: [s * 0.78, 1.32, -0.05], r: [0, 0, -s * 0.3] }));
      const A = limb(torso, [0.8 * s, 0.95, 0], 0.6, 0.6, 0.18, 0.2, st, [0, 0, 0.15 * s]);
      A.end.add(mesh(G.dodeca(0.32), st, { s: [1.1, 1, 1] }));
      A.end.add(mesh(G.box(0.04, 0.14, 0.02), rune, { p: [0, 0, 0.3] }));
      P[s > 0 ? "armL" : "armR"] = A;
    }
    const head = grp([0, 1.2, 0.18]);
    torso.add(head);
    P.head = head;
    head.add(mesh(G.dodeca(0.24), st, { s: [1.2, 0.9, 1] }));
    head.add(mesh(G.box(0.26, 0.04, 0.04), rune, { p: [0, 0.02, 0.22] }));
    head.add(R.haloSprite(m.accent, 0.6, 0.7, [0, 0.02, 0.25]));
    // Schwebende Brocken
    const orbit = grp([0, 1.7, 0]);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * PI * 2;
      orbit.add(mesh(G.dodeca(0.1 + (i % 2) * 0.05), st, { p: [Math.cos(a) * 1.2, Math.sin(a * 2) * 0.2, Math.sin(a) * 0.9] }));
    }
    body.add(orbit);
    P.orbit = orbit;
    P.headY = 2.55;
  };

  // Flugbestie: Hautfluegel mit Fingerknochen, Fangzaehne, Krallen
  function batWing(color, s) {
    const g = grp();
    const memb = M.pmat("skin", color, { ds: true });
    const pts = [[0, 0], [0.5, 0.35], [1.2, 0.5], [1.65, 0.2], ["q", 1.35, 0.0, 1.3, -0.35], ["q", 1.05, -0.1, 0.85, -0.45], ["q", 0.6, -0.15, 0.4, -0.45], ["q", 0.2, -0.2, 0, -0.3]];
    const geo = G.geo("batwing", () => new T.ShapeGeometry(R.shapeOf(pts), 6));
    const w = new T.Mesh(geo, memb);
    w.castShadow = true;
    g.add(w);
    const fing = M.pmat("bone", R.shade(color, 0.7));
    for (const [x, y] of [[1.65, 0.2], [1.3, -0.35], [0.85, -0.45], [0.4, -0.45]]) {
      const len = Math.hypot(x - 0.5, y - 0.35);
      const f = mesh(G.cyl(0.018, 0.012, len, 5), fing, { p: [(x + 0.5) / 2, (y + 0.35) / 2, 0.01] });
      f.rotation.z = Math.atan2(y - 0.35, x - 0.5) - PI / 2;
      g.add(f);
    }
    g.add(mesh(G.cyl(0.03, 0.02, 0.62, 6), fing, { p: [0.25, 0.18, 0.01], r: [0, 0, Math.atan2(0.35, 0.5) - PI / 2] }));
    if (s < 0) g.scale.x = -1;
    return g;
  }
  B.fledermaus = function (m, root, P) {
    const fur = M.pmat("fur", m.color);
    const body = grp([0, 0.6, 0]);
    root.add(body);
    P.hover = body;
    P.hoverY = 0.6;
    body.add(mesh(G.sph(0.32, 14, 10), fur, { p: [0, 0.95, 0], s: [1, 1.3, 0.9] }));
    body.add(mesh(G.sph(0.22, 12, 8), M.pmat("fur", R.shade(m.color, 1.3)), { p: [0, 0.95, 0.12], s: [1, 1.2, 0.7] }));
    const head = grp([0, 1.42, 0.08]);
    body.add(head);
    P.head = head;
    head.add(mesh(G.sph(0.2, 12, 10), fur, { s: [1.1, 0.95, 1] }));
    head.add(mesh(G.cone(0.1, 0.16, 6), fur, { p: [0, -0.04, 0.2], r: [1.5, 0, 0] }));
    for (const s of [1, -1]) {
      head.add(mesh(G.cone(0.1, 0.36, 4), fur, { p: [s * 0.13, 0.25, -0.02], r: [0, 0, -s * 0.35], s: [1, 1, 0.4] }));
    }
    eyes(head, [[0.08, 0.05, 0.16], [-0.08, 0.05, 0.16]], m.accent, 0.03);
    teeth(head, 2, -0.05, 0.05, -0.1, 0.18, 0.09, bone(), true);
    P.wings = [];
    for (const s of [1, -1]) {
      const wg = grp([0.22 * s, 1.1, -0.05]);
      wg.add(batWing(m.color, s));
      body.add(wg);
      P.wings.push({ g: wg, s });
    }
    for (const s of [1, -1]) {
      const L = limb(body, [0.12 * s, 0.7, 0], 0.22, 0.24, 0.05, 0.035, fur, [0.3, 0, 0]);
      L.lo.rotation.x = -0.6;
      claws(L.end, 3, 0.12, bone(), 0.5);
    }
    const tail = grp([0, 0.7, -0.1]);
    tail.add(mesh(G.tube("battail", [[0, 0, 0], [0, -0.2, -0.15], [0, -0.35, -0.1], [0, -0.5, 0.05]], 0.03, 12, 5), fur));
    tail.add(mesh(G.cone(0.05, 0.12, 4), bone(), { p: [0, -0.55, 0.07], r: [PI, 0, 0] }));
    body.add(tail);
    P.tail = tail;
    P.headY = 2.35;
  };

  // Sporenwesen: verwachsener Pilz mit leuchtenden Flecken und Wurzelbeinen
  B.pilz = function (m, root, P) {
    const stem = M.pmat("bark", R.mix(m.color, "#d9c8a8", 0.55));
    const capM = M.pmat("skin", m.color);
    const glowM = M.emis(m.accent, 1.2);
    const body = grp();
    root.add(body);
    P.spine = body;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * PI * 2;
      body.add(mesh(G.tube("root", [[0, 0.5, 0], [0.2, 0.3, 0.05], [0.4, 0.08, 0], [0.55, 0.0, -0.05]], 0.06, 10, 5), stem, { r: [0, a, 0] }));
    }
    body.add(mesh(G.lathe("pilzstem", [[0.0, 0.3], [0.32, 0.35], [0.36, 0.7], [0.3, 1.1], [0.26, 1.4], [0.0, 1.45]], 16), stem));
    // Maul im Stiel
    body.add(mesh(G.box(0.3, 0.08, 0.1), M.basic("#0b0a0e"), { p: [0, 0.82, 0.31] }));
    teeth(body, 6, -0.12, 0.12, 0.86, 0.34, 0.06, bone(), true);
    teeth(body, 5, -0.1, 0.1, 0.78, 0.34, 0.05, bone());
    eyes(body, [[0.12, 1.12, 0.27], [-0.12, 1.12, 0.27], [0, 1.22, 0.26]], m.accent, 0.03);
    const capG = grp([0, 1.42, 0]);
    body.add(capG);
    capG.add(mesh(G.lathe("pilzcap", [[0.0, 0.45], [0.35, 0.42], [0.7, 0.25], [0.95, 0.0], [0.9, -0.08], [0.5, -0.06], [0.0, -0.02]], 22), capM, { s: [1, 1, 1] }));
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * PI * 2;
      capG.add(mesh(G.box(0.02, 0.06, 0.6), M.pmat("plain", R.shade(m.color, 0.5)), { p: [Math.cos(a) * 0.45, -0.07, Math.sin(a) * 0.45], r: [0, -a + PI / 2, 0] }));
    }
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * PI * 2 + 0.3;
      const rr = i % 3 === 0 ? 0.25 : 0.6;
      const y = rr > 0.5 ? 0.22 : 0.4;
      capG.add(mesh(G.sph(0.06 + (i % 2) * 0.03, 8, 6), glowM, { p: [Math.cos(a) * rr, y, Math.sin(a) * rr], s: [1, 0.5, 1] }));
    }
    capG.add(R.haloSprite(m.accent, 1.6, 0.25, [0, 0.3, 0]));
    P.cap = capG;
    for (const s of [1, -1]) {
      const A = { up: grp([0.3 * s, 0.95, 0], [0, 0, -s * 0.6]) };
      A.up.add(mesh(G.tube("parm", [[0, 0, 0], [0.12 * s, -0.15, 0.05], [0.2 * s, -0.4, 0.1], [0.18 * s, -0.55, 0.12]], 0.045, 10, 5), stem));
      const hnd = grp([0.18 * s, -0.55, 0.12]);
      A.up.add(hnd);
      claws(hnd, 3, 0.1, stem);
      body.add(A.up);
      P[s > 0 ? "armL" : "armR"] = A;
    }
    // Sporen
    const spores = grp([0, 1.3, 0]);
    for (let i = 0; i < 10; i++) {
      const sp = R.haloSprite(m.accent, 0.12, 0.8, [Math.cos(i * 2.4) * 0.9, (i % 4) * 0.25, Math.sin(i * 2.4) * 0.9]);
      spores.add(sp);
    }
    body.add(spores);
    P.orbit = spores;
    P.headY = 2.0;
  };

  // Riesenspinne: acht gegliederte Beine, Augenhaufen, Giftklauen
  B.spinne = function (m, root, P) {
    const ch = M.pmat("fur", m.color);
    const shell = M.pmat("scale", R.shade(m.color, 0.85));
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.sph(0.65, 18, 14), ch, { p: [0, 0.9, -0.75], s: [1, 0.85, 1.2] }));
    for (let i = 0; i < 3; i++) body.add(mesh(G.box(0.5 - i * 0.12, 0.04, 0.08), M.emis(m.accent, 0.9), { p: [0, 1.42 - i * 0.03, -0.55 - i * 0.28], r: [0.35 + i * 0.25, 0, 0] }));
    body.add(mesh(G.sph(0.36, 14, 10), shell, { p: [0, 0.8, 0.12], s: [1, 0.75, 1.1] }));
    const head = grp([0, 0.82, 0.45]);
    body.add(head);
    P.head = head;
    head.add(mesh(G.sph(0.22, 12, 10), shell, { s: [1.1, 0.8, 0.9] }));
    const ep = [];
    for (let i = 0; i < 8; i++) ep.push([(i % 4 - 1.5) * 0.07, 0.1 + Math.floor(i / 4) * 0.06, 0.17 - Math.abs(i % 4 - 1.5) * 0.02]);
    eyes(head, ep, m.accent, 0.022);
    const jaw = grp([0, -0.06, 0.15]);
    head.add(jaw);
    for (const s of [1, -1]) {
      jaw.add(mesh(G.capsule(0.04, 0.12, 6), shell, { p: [s * 0.07, -0.06, 0.04], r: [0.3, 0, 0] }));
      jaw.add(mesh(G.cone(0.025, 0.14, 5), bone(), { p: [s * 0.07, -0.17, 0.07], r: [PI - 0.2, 0, -s * 0.4] }));
    }
    P.jaw = jaw;
    P.jawOpen = -0.4;
    P.legs = [];
    for (let i = 0; i < 4; i++) {
      for (const s of [1, -1]) {
        const base = grp([0.28 * s, 0.85, 0.32 - i * 0.18], [0, (i - 1.5) * 0.4 * s, 0]);
        const up = grp([0, 0, 0], [0, 0, s * 2.25]);
        base.add(up);
        up.add(mesh(G.capsule(0.05, 0.55, 6), ch, { p: [0, -0.32, 0] }));
        const lo = grp([0, -0.62, 0], [0, 0, -s * 1.85]);
        up.add(lo);
        lo.add(mesh(G.capsule(0.035, 0.75, 6), ch, { p: [0, -0.4, 0] }));
        lo.add(mesh(G.cone(0.03, 0.12, 4), bone(), { p: [0, -0.82, 0], r: [PI, 0, 0] }));
        body.add(base);
        P.legs.push({ up: base, lo, ph: i * 1.3 + (s > 0 ? 0 : PI), spider: true, s, rz: -s * 1.85 });
      }
    }
    P.headY = 1.6;
  };

  // Drache: langer Hals, Hoerner, Hautfluegel, Ruckenstacheln, gluehender Rachen
  B.drache = function (m, root, P) {
    const sc = M.pmat("scale", m.color);
    const belly = M.pmat("scale", R.mix(m.color, "#e8d8b0", 0.45));
    const horn = M.pmat("bone", "#3a3036");
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.sph(0.75, 18, 14), sc, { p: [0, 1.15, -0.3], s: [1, 0.9, 1.4] }));
    body.add(mesh(G.sph(0.55, 14, 10), belly, { p: [0, 1.0, 0.15], s: [0.95, 0.9, 0.8] }));
    P.legs = [];
    for (const [x, z, ph] of [[0.5, 0.25, 0], [-0.5, 0.25, PI], [0.55, -0.85, PI], [-0.55, -0.85, 0]]) {
      const front = z > 0;
      const L = limb(body, [x, 1.0, z], 0.5, 0.5, 0.21, 0.16, sc, [front ? -0.2 : 0.4, 0, 0]);
      L.lo.rotation.x = front ? 0.3 : -0.6;
      L.end.add(mesh(G.sph(0.14, 8, 6), sc, { p: [0, 0, 0.06], s: [1, 0.55, 1.4] }));
      claws(L.end, 3, 0.14, horn, 0.4);
      P.legs.push({ up: L.up, lo: L.lo, ph, base: front ? -0.2 : 0.4, kb: front ? 0.3 : -0.6, heavy: true, quad: true });
    }
    // Hals
    const neck = grp([0, 1.45, 0.45]);
    body.add(neck);
    P.neck = neck;
    const npts = [[0, -0.1, -0.15], [0, 0.3, 0.12], [0, 0.62, 0.3], [0, 0.85, 0.5], [0, 0.95, 0.6]];
    neck.add(mesh(G.tube("dneck2", npts, 0.25, 20, 10), sc));
    neck.add(mesh(G.sph(0.3, 12, 10), sc, { p: [0, -0.05, -0.05] }));
    for (let i = 0; i < 4; i++) neck.add(mesh(G.cone(0.05, 0.2, 4), horn, { p: [0, npts[i][1] + 0.15, npts[i][2] - 0.17], r: [-0.9, 0, 0] }));
    const head = grp([0, 1.0, 0.68]);
    neck.add(head);
    P.head = head;
    head.add(mesh(G.sph(0.33, 14, 10), sc, { s: [1, 0.8, 1.15] }));
    head.add(mesh(G.cyl(0.13, 0.22, 0.5, 7), sc, { p: [0, -0.02, 0.35], r: [PI / 2, 0, 0], s: [1.1, 1, 0.7] }));
    for (const s of [1, -1]) {
      head.add(mesh(G.tube("dhorn" + s, [[0, 0, 0], [0.06 * s, 0.12, -0.15], [0.1 * s, 0.18, -0.38], [0.08 * s, 0.14, -0.58]], 0.045, 12, 6), horn, { p: [s * 0.14, 0.15, -0.05] }));
      head.add(mesh(G.cone(0.04, 0.2, 4), horn, { p: [s * 0.24, -0.04, 0.0], r: [0, 0, -s * 1.3] }));
    }
    eyes(head, [[0.13, 0.1, 0.22], [-0.13, 0.1, 0.22]], m.accent, 0.035);
    teeth(head, 6, -0.12, 0.12, -0.12, 0.45, 0.07, bone(), true);
    const jaw = grp([0, -0.12, 0.1]);
    head.add(jaw);
    jaw.add(mesh(G.box(0.24, 0.07, 0.48), sc, { p: [0, -0.04, 0.25] }));
    teeth(jaw, 6, -0.1, 0.1, 0.0, 0.42, 0.06, bone());
    jaw.add(mesh(G.sph(0.08, 8, 6), M.emis(m.accent, 1.4), { p: [0, 0.03, 0.2] }));
    P.jaw = jaw;
    P.jawOpen = 0.5;
    head.add(R.haloSprite(m.accent, 0.6, 0.5, [0, -0.1, 0.4]));
    // Fluegel
    P.wings = [];
    for (const s of [1, -1]) {
      const wg = grp([0.5 * s, 1.6, -0.3], [0, 0, 0]);
      const w = batWing(R.shade(m.color, 0.7), s);
      w.scale.set(s * 1.6, 1.6, 1.6);
      w.rotation.y = -s * 0.3;
      wg.add(w);
      body.add(wg);
      P.wings.push({ g: wg, s, slow: true });
    }
    // Rueckenstacheln und Schwanz
    for (let i = 0; i < 6; i++) body.add(mesh(G.cone(0.07, 0.28, 4), horn, { p: [0, 1.85 - i * 0.07, 0.2 - i * 0.25], r: [-0.5, 0, 0] }));
    const tail = grp([0, 1.0, -1.25]);
    for (let i = 0; i < 6; i++) tail.add(mesh(G.sph(0.22 - i * 0.03, 10, 8), sc, { p: [0, -i * 0.06, -i * 0.27] }));
    tail.add(mesh(G.ext("leaf", R.SH.leaf, 0.04, 0.02), horn, { p: [0, -0.36, -1.75], r: [PI / 2, 0, 0], s: 0.45 }));
    body.add(tail);
    P.tail = tail;
    P.headY = 3.0;
    P.big = true;
  };

  // Schemen: zerrissene Robe ohne Koerper, nur gluehende Augen in der Kapuze
  B.schemen = function (m, root, P) {
    const cloth = M.pmat("cloth", m.color, { op: 0.82, ds: true, e: m.accent, ei: 0.12 });
    const body = grp([0, 0.4, 0]);
    root.add(body);
    P.hover = body;
    P.hoverY = 0.4;
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const y = 1.6 - i * 0.17;
      pts.push([0.16 + i * 0.045 + (i === 10 ? 0.05 : 0), y]);
    }
    body.add(mesh(G.lathe("wraith", pts.reverse(), 18), cloth));
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * PI * 2;
      const tg = mesh(G.cone(0.08, 0.5, 4), cloth, { p: [Math.cos(a) * 0.55, -0.05, Math.sin(a) * 0.55], r: [PI, 0, 0] });
      tg.userData.flick = i;
      body.add(tg);
    }
    const head = grp([0, 1.75, 0.05]);
    body.add(head);
    P.head = head;
    head.add(mesh(G.cap(0.3, PI * 0.62), cloth, { r: [-1.0, 0, 0], s: [1, 1.15, 1.2] }));
    head.add(mesh(G.cone(0.14, 0.5, 6), cloth, { p: [0, 0.12, -0.3], r: [-2.3, 0, 0] }));
    head.add(mesh(G.sph(0.2, 12, 10), M.basic("#020104"), { p: [0, -0.06, 0.1], s: [1, 1.15, 0.8] }));
    eyes(head, [[0.075, -0.02, 0.27], [-0.075, -0.02, 0.27]], m.accent, 0.03);
    for (const s of [1, -1]) {
      const A = limb(body, [0.3 * s, 1.45, 0.05], 0.5, 0.5, 0.08, 0.06, cloth, [-0.5, 0, 0.35 * s]);
      A.up.add(mesh(G.cyl(0.08, 0.16, 0.45, 8, true), cloth, { p: [0, -0.3, 0] }));
      A.lo.rotation.x = -0.5;
      A.end.add(mesh(G.sph(0.06, 8, 6), M.pmat("bone", R.mix(m.color, "#ffffff", 0.3))));
      claws(A.end, 4, 0.2, M.pmat("bone", "#d9d2c5"), 0.35);
      P[s > 0 ? "armL" : "armR"] = A;
    }
    body.add(R.haloSprite(m.accent, 2.2, 0.18, [0, 1.0, 0]));
    P.headY = 2.5;
  };

  // Panzerkrebs: Stachelpanzer, eine riesige Schere
  B.krebs = function (m, root, P) {
    const sh = M.pmat("scale", m.color);
    const dark = M.pmat("scale", R.shade(m.color, 0.65));
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.sph(0.62, 18, 12), sh, { p: [0, 0.9, -0.1], s: [1.15, 0.62, 0.95] }));
    body.add(mesh(G.sph(0.5, 14, 10), dark, { p: [0, 0.72, 0.0], s: [1.3, 0.4, 0.95] }));
    spikes(body, [[0, 1.08, 0], [0.4, 1.0, -0.1, 0, -0.4], [-0.4, 1.0, -0.1, 0, 0.4], [0.7, 0.9, 0.1, 0, -0.9], [-0.7, 0.9, 0.1, 0, 0.9], [0.2, 1.0, -0.4, -0.5, -0.2], [-0.2, 1.0, -0.4, -0.5, 0.2]], 0.25, M.pmat("bone", R.shade(m.accent, 0.8)));
    for (const s of [1, -1]) {
      const stalk = grp([0.2 * s, 0.95, 0.5]);
      stalk.add(mesh(G.cyl(0.03, 0.035, 0.3, 6), dark, { p: [0, 0.12, 0] }));
      body.add(stalk);
      eyes(stalk, [[0, 0.3, 0]], m.accent, 0.045);
    }
    teeth(body, 4, -0.12, 0.12, 0.62, 0.7, 0.08, bone(), true);
    P.legs = [];
    for (let i = 0; i < 3; i++) {
      for (const s of [1, -1]) {
        const base = grp([0.6 * s, 0.75, 0.2 - i * 0.28], [0, (i - 1) * 0.3 * s, 0]);
        const up = grp([0, 0, 0], [0, 0, s * 2.0]);
        base.add(up);
        up.add(mesh(G.capsule(0.055, 0.3, 6), sh, { p: [0, -0.2, 0] }));
        const lo = grp([0, -0.4, 0], [0, 0, -s * 1.6]);
        up.add(lo);
        lo.add(mesh(G.cone(0.05, 0.55, 6), dark, { p: [0, -0.27, 0], r: [PI, 0, 0] }));
        body.add(base);
        P.legs.push({ up: base, lo, ph: i * 1.6 + (s > 0 ? 0 : PI), spider: true, s, rz: -s * 1.6 });
      }
    }
    for (const s of [1, -1]) {
      const big = s < 0;
      const k = big ? 1.4 : 0.85;
      const arm = grp([0.5 * s, 0.85, 0.5], [0, -s * 0.35, 0]);
      arm.add(mesh(G.capsule(0.08 * k, 0.3 * k, 6), sh, { p: [0, 0.07 * k, 0.16 * k], r: [1.15, 0, 0] }));
      const claw = grp([0, 0.15 * k, 0.4 * k]);
      arm.add(claw);
      claw.add(mesh(G.sph(0.22 * k, 12, 10), M.pmat("scale", R.shade(m.color, 1.15)), { s: [0.9, 0.75, 1.25] }));
      claw.add(mesh(G.cone(0.03, 0.1, 4), M.pmat("bone", R.shade(m.accent, 0.8)), { p: [0, 0.18 * k, 0], r: [-0.4, 0, 0] }));
      claw.add(mesh(G.cone(0.1 * k, 0.4 * k, 6), dark, { p: [0, 0.06 * k, 0.32 * k], r: [1.45, 0, 0] }));
      const pin = grp([0, -0.05 * k, 0.12 * k]);
      pin.add(mesh(G.cone(0.08 * k, 0.36 * k, 6), dark, { p: [0, -0.04 * k, 0.18 * k], r: [1.8, 0, 0] }));
      claw.add(pin);
      body.add(arm);
      P[s > 0 ? "armL" : "armR"] = { up: arm };
      if (big) P.pincer = pin;
    }
    P.headY = 1.5;
  };

  // Todesritter: untoter Ritter, gebaut aus dem Heldenbausatz
  B.todesritter = function (m, root, P) {
