<title>Helden von Schwebfels</title>
<style>
/* Layout: die 3D-Insel fuellt die Buehne, Messing-Instrumententafeln schweben darueber. */
:root {
  --night: #0e1b24;
  --deck: #15303c;
  --deck-2: #1d3f4d;
  --deck-3: #275262;
  --brass: #dcaa4a;
  --brass-hi: #f3d08a;
  --brass-dim: #8a6a2c;
  --sail: #f3ead6;
  --fog: #a3b8c1;
  --coral: #ff7a59;
  --sea: #52d1b4;
  --ink: #1c1626;
  --r-gewoehnlich: #c9d2d8;
  --r-ungewoehnlich: #74d86f;
  --r-selten: #4fa9ff;
  --r-episch: #c47bff;
  --r-legendaer: #ffb13b;
  --font-display: "Pirata One", "Luminari", "Georgia", serif;
  --font-body: "Alegreya Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --panel-w: min(560px, 46vw);
  --dock-h: 74px;
  --top-h: 64px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--sail);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
img { max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1.25em; height: 1.25em; vertical-align: -0.28em; flex: none; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; background: linear-gradient(#5fb0ff, #dff3ff); }
#stage .r3d-canvas { display: block; position: absolute; inset: 0; touch-action: none; }
.stage-fallback {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 90px 16px 100px;
  background: radial-gradient(ellipse at 50% 30%, #2a5a70, var(--night));
}
.stage-fallback .fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; width: min(760px, 100%); }
.stage-fallback button { padding: 16px 8px; border-radius: 14px; border: 2px solid var(--brass-dim); background: var(--deck-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stage-fallback button .ic { width: 34px; height: 34px; }

/* Hub-Beschriftungen */
.hub-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hub-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  padding: 3px 10px 4px; border-radius: 999px; border: 1.5px solid var(--brass);
  background: rgba(14, 27, 36, 0.82); color: var(--sail); font-size: 13px; font-weight: 700;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35); transition: background 0.15s, transform 0.05s;
}
.hub-label.hover, .hub-label:hover { background: var(--brass); color: var(--ink); }
.hl-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; display: inline-grid; place-items: center; }
.hub-label.ready { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -4px; } }

/* Kopfleiste */
#topbar {
  position: absolute; left: 0; right: 0; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
  background: linear-gradient(rgba(14, 27, 36, 0.92), rgba(14, 27, 36, 0.6) 80%, transparent);
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.logo { font-family: var(--font-display); font-size: 26px; color: var(--brass-hi); text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
.me-chip { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.porthole {
  width: 48px; height: 48px; border-radius: 50%; flex: none; overflow: hidden;
  border: 3px solid var(--brass); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 2px var(--ink);
  background: radial-gradient(circle at 40% 35%, #3e7f97, #16303c);
}
.porthole img { width: 100%; height: 100%; object-fit: cover; display: block; }
.me-meta { min-width: 0; }
.me-meta > span { display: block; }
.me-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.me-sub { font-size: 12px; color: var(--fog); }
.xpbar { width: 150px; height: 7px; border-radius: 4px; background: #0a141b; border: 1px solid var(--brass-dim); overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #4fa9ff, #9fe3ff); }
.res { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: rgba(21, 48, 60, 0.92); border: 1.5px solid var(--brass-dim); font-weight: 800; white-space: nowrap;
}
.gauge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border-radius: 999px; background: rgba(21, 48, 60, 0.92); border: 1.5px solid var(--brass-dim); font-weight: 800; }
.gauge svg { width: 38px; height: 38px; }
.gauge small { display: block; font-size: 10px; color: var(--fog); font-weight: 600; line-height: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--brass-dim); background: rgba(21, 48, 60, 0.92); cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { border-color: var(--brass); }

/* Dock */
#dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; gap: 6px;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(transparent, rgba(14, 27, 36, 0.85) 35%);
  overflow-x: auto; scrollbar-width: none;
}
#dock::-webkit-scrollbar { display: none; }
.dock-btn {
  position: relative; flex: none; width: 68px; padding: 7px 2px 6px; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--brass-dim); background: linear-gradient(var(--deck-2), var(--deck));
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700;
  box-shadow: 0 4px 0 #08131a;
}
.dock-btn .ic { width: 28px; height: 28px; }
.dock-btn:hover, .dock-btn.active { border-color: var(--brass); background: linear-gradient(var(--deck-3), var(--deck-2)); }
.dock-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #08131a; }
.dock-btn .badge { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--coral); color: #fff; font-size: 12px; display: grid; place-items: center; border: 2px solid var(--night); }

/* Aktivitaet */
#activity {
  position: absolute; z-index: 21; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-h) + 18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 16px;
  background: rgba(14, 27, 36, 0.94); border: 1.5px solid var(--brass); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  max-width: calc(100vw - 32px); cursor: pointer;
}
#activity .act-text { min-width: 0; }
#activity .act-title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.progress { height: 8px; border-radius: 5px; background: #0a141b; border: 1px solid var(--brass-dim); overflow: hidden; margin-top: 4px; min-width: 160px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), #b8f5e6); transition: width 0.9s linear; }
.done-pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(220, 170, 74, 0.35); } }

/* Panels */
#panel {
  position: absolute; z-index: 30; right: 16px; top: calc(var(--top-h) + 8px); bottom: calc(var(--dock-h) + 16px);
  width: var(--panel-w); display: flex; flex-direction: column;
  background: linear-gradient(170deg, var(--deck) 0%, #112631 100%);
  border: 2px solid var(--brass); border-radius: 20px;
  box-shadow: 0 0 0 4px rgba(14, 27, 36, 0.8), 0 18px 50px rgba(0, 0, 0, 0.5);
  animation: slideIn 0.25s ease-out;
}
#panel::before, #panel::after {
  content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; top: 9px;
  background: radial-gradient(circle at 35% 35%, var(--brass-hi), var(--brass-dim)); box-shadow: 0 1px 0 var(--ink);
}
#panel::before { left: 9px; }
#panel::after { right: 9px; }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 22px; border-bottom: 1.5px solid rgba(220, 170, 74, 0.35); }
.panel-head .porthole { width: 58px; height: 58px; }
.panel-head h2 { font-size: 28px; color: var(--brass-hi); line-height: 1.05; }
.panel-head .role { font-size: 13px; color: var(--fog); }
.panel-head .close { margin-left: auto; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 18px 18px; scrollbar-color: var(--brass-dim) transparent; }
.say { position: relative; background: var(--deck-2); border: 1.5px solid var(--deck-3); border-radius: 14px; padding: 9px 13px; margin-bottom: 14px; font-style: italic; color: #e9dfc8; }
.say::before { content: ""; position: absolute; left: 22px; top: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--deck-3); }
.section-title { font-family: var(--font-display); font-size: 21px; color: var(--brass-hi); margin: 16px 0 8px; }
.muted { color: var(--fog); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  padding: 9px 16px; border-radius: 12px; font-weight: 800; border: 1.5px solid var(--ink);
  background: linear-gradient(var(--brass-hi), var(--brass) 55%, #b8862e); color: var(--ink);
  box-shadow: 0 3px 0 #6a4d18, inset 0 1px 0 rgba(255, 255, 255, 0.5); white-space: nowrap;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6a4d18; }
.btn[disabled] { filter: grayscale(0.85) brightness(0.7); cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--sail); border-color: var(--brass-dim); box-shadow: none; }
.btn.ghost:hover { border-color: var(--brass); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.btn.big { padding: 13px 24px; font-size: 18px; }
.btn.danger { background: linear-gradient(#ff9e85, var(--coral)); box-shadow: 0 3px 0 #8a3020; }

/* Auftragskarten: Seekarten-Notizen */
.quests { display: grid; gap: 12px; }
.quest {
  position: relative; display: grid; grid-template-columns: 86px 1fr; gap: 12px; padding: 12px; border-radius: 16px;
  background-color: #1a3946;
  background-image: repeating-linear-gradient(0deg, rgba(159, 227, 255, 0.06) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(159, 227, 255, 0.06) 0 1px, transparent 1px 22px);
  border: 1.5px solid var(--deck-3);
}
.quest:hover { border-color: var(--brass-dim); }
.quest .mon { width: 86px; height: 86px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #2f6b80, #13303c); display: grid; place-items: center; overflow: hidden; }
.quest .mon img, .quest .mon svg { width: 100%; height: 100%; object-fit: contain; }
.quest h3 { font-size: 20px; color: var(--brass-hi); }
.quest p { margin: 4px 0 8px; font-size: 14px; color: #dcd3bf; }
.quest .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; align-items: center; }
.quest .rewards { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; align-items: center; font-weight: 800; }
.quest .foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: #0a141b; border: 1px solid var(--brass-dim); }
.pips i.on { background: var(--coral); border-color: var(--coral); }
.chance { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #0a141b; }
.chance.good { color: var(--sea); }
.chance.ok { color: var(--brass-hi); }
.chance.bad { color: var(--coral); }
.mini-item { width: 34px; height: 34px; border-radius: 9px; background: #0d1f28; display: inline-grid; place-items: center; cursor: pointer; border: 2px solid var(--r-gewoehnlich); vertical-align: middle; }
.mini-item svg { width: 28px; height: 28px; }

/* Gegenstaende */
.slot {
  position: relative; aspect-ratio: 1; border-radius: 14px; cursor: pointer;
  background: radial-gradient(circle at 50% 35%, #24485a, #0d1f28 75%);
  border: 2px solid #33586a; display: grid; place-items: center; padding: 6px;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
}
.slot svg { width: 100%; height: 100%; }
.slot.empty { opacity: 0.55; cursor: default; }
.slot.empty .ic { width: 50%; height: 50%; opacity: 0.6; }
.slot .slot-name { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 9.5px; color: var(--fog); }
.slot .up { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; }
.slot .price .ic { width: 12px; height: 12px; vertical-align: -2px; }
.slot .price { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; background: var(--night); border: 1px solid var(--brass-dim); padding: 0 6px; border-radius: 8px; white-space: nowrap; }
.r-gewoehnlich { border-color: var(--r-gewoehnlich); }
.r-ungewoehnlich { border-color: var(--r-ungewoehnlich); }
.r-selten { border-color: var(--r-selten); box-shadow: 0 0 10px rgba(79, 169, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.r-episch { border-color: var(--r-episch); box-shadow: 0 0 12px rgba(196, 123, 255, 0.45), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.r-legendaer { border-color: var(--r-legendaer); box-shadow: 0 0 16px rgba(255, 177, 59, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.t-gewoehnlich { color: var(--r-gewoehnlich); }
.t-ungewoehnlich { color: var(--r-ungewoehnlich); }
.t-selten { color: var(--r-selten); }
.t-episch { color: var(--r-episch); }
.t-legendaer { color: var(--r-legendaer); }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.grid6.shop { row-gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Heldenblatt */
.sheet { display: grid; grid-template-columns: 74px 1fr 74px; gap: 10px; align-items: start; }
.sheet .col { display: grid; gap: 8px; }
.heroview { position: relative; height: 340px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #2f6b80 0%, #13303c 70%); border: 1.5px solid var(--deck-3); }
.heroview .r3d-canvas { display: block; cursor: grab; }
.heroview .hv-caption { position: absolute; left: 0; right: 0; top: 8px; text-align: center; pointer-events: none; }
.heroview .hv-caption b { font-family: var(--font-display); font-size: 24px; font-weight: 400; color: var(--brass-hi); text-shadow: 0 2px 0 var(--ink); }
.heroview .hv-fallback { display: grid; place-items: center; height: 100%; }
.heroview .hv-fallback svg { width: 60%; }
.attrs { display: grid; gap: 6px; }
.attr { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 12px; background: var(--deck-2); }
.attr .ic { width: 24px; height: 24px; }
.attr .val { font-weight: 800; font-size: 17px; }
.attr .cost { font-size: 12px; color: var(--fog); white-space: nowrap; }
.attr.main { outline: 1.5px solid var(--brass-dim); }
.plus { width: 34px; height: 34px; border-radius: 10px; padding: 0; font-size: 20px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 14px; margin-top: 10px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(163, 184, 193, 0.25); padding-bottom: 3px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--brass-dim); background: transparent; cursor: pointer; font-weight: 700; }
.tab.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }

/* Tooltip und Detailkarte */
#tip {
  position: fixed; z-index: 90; pointer-events: none; width: 260px; padding: 10px 12px; border-radius: 14px;
  background: rgba(10, 20, 27, 0.97); border: 2px solid var(--r-gewoehnlich); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); font-size: 13.5px;
}
.itemcard h4 { margin: 0 0 2px; font-size: 16px; }
.itemcard .kind { font-size: 12px; color: var(--fog); margin-bottom: 6px; }
.itemcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.itemcard li { display: flex; justify-content: space-between; gap: 10px; }
.delta-up { color: var(--sea); font-weight: 800; }
.delta-down { color: var(--coral); font-weight: 800; }
.itemcard .cmp { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(163, 184, 193, 0.3); font-size: 12.5px; }

/* Modal */
#modal { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; padding: 16px; background: rgba(5, 10, 14, 0.66); backdrop-filter: blur(3px); }
.dialog {
  width: min(480px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 18px 20px 20px; border-radius: 20px;
  background: linear-gradient(170deg, var(--deck), #112631); border: 2px solid var(--brass); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: pop 0.22s ease-out;
}
@keyframes pop { from { transform: scale(0.94); opacity: 0; } }
.dialog h2 { font-size: 30px; color: var(--brass-hi); margin-bottom: 8px; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.dialog textarea, .dialog input[type="text"] { width: 100%; box-sizing: border-box; border-radius: 12px; border: 1.5px solid var(--brass-dim); background: #0a141b; color: var(--sail); padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; }

/* Kampf */
#battle { position: fixed; inset: 0; z-index: 70; background: var(--night); }
#battle .bstage { position: absolute; inset: 0; }
#battle .bstage .r3d-canvas { display: block; }
.battle-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fx-text { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 34px; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 10px rgba(0, 0, 0, 0.6); animation: floatUp 1.1s ease-out forwards; white-space: nowrap; }
.fx-text.crit { font-size: 50px; color: var(--r-legendaer); }
.fx-text.critlabel { font-size: 24px; color: var(--r-legendaer); margin-top: -46px; }
.fx-text.evade { color: #9fe3ff; font-size: 26px; }
.fx-text.block { color: var(--brass-hi); font-size: 26px; }
.fx-text.stun { color: #ffe45a; font-size: 24px; margin-top: -30px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
.fx-banner { position: absolute; top: 24%; font-family: var(--font-display); font-size: 40px; color: var(--brass-hi); text-shadow: 0 3px 0 var(--ink); padding: 4px 22px; background: linear-gradient(90deg, transparent, rgba(14, 27, 36, 0.85), transparent); animation: bannerIn 1.2s ease-out forwards; white-space: nowrap; }
.fx-banner.left { left: 8%; }
.fx-banner.right { right: 8%; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.4); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.plates { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; gap: 16px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; pointer-events: none; z-index: 2; }
.plate { display: flex; align-items: center; gap: 10px; width: min(380px, 46%); padding: 8px 12px 8px 8px; border-radius: 16px; background: rgba(14, 27, 36, 0.88); border: 1.5px solid var(--brass); }
.plate.right { flex-direction: row-reverse; text-align: right; }
.plate .porthole { width: 52px; height: 52px; }
.plate .pmeta { flex: 1; min-width: 0; }
.plate .pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .plv { font-size: 12px; color: var(--fog); }
.hp { position: relative; height: 16px; border-radius: 8px; background: #2a0d10; border: 1.5px solid var(--ink); overflow: hidden; margin-top: 4px; }
.hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#8ff09f, #3fbf5f); transition: width 0.3s ease-out; }
.hp i.low { background: linear-gradient(#ffb08a, #e0503a); }
.hp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; text-shadow: 0 1px 0 #000; }
.plate.right .hp i { left: auto; right: 0; }
.bcontrols .on { background: var(--brass); color: var(--ink); }
.bcontrols { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 2; flex-wrap: wrap; justify-content: center; }
.blog { position: absolute; left: 16px; right: 16px; bottom: 80px; top: 100px; overflow-y: auto; padding: 12px; border-radius: 16px; background: rgba(10, 20, 27, 0.8); font-size: 14px; }
.blog p { margin: 0 0 4px; }
.fb2d { position: absolute; inset: 90px 16px 140px; display: flex; justify-content: space-around; align-items: center; }
.fb2d .fig { width: min(200px, 38vw); transition: transform 0.15s; }
.fb2d .fig.hit { transform: translateX(10px) rotate(4deg); filter: brightness(2); }
.result { text-align: center; }
.result h2 { font-size: 46px; }
.result.win h2 { color: var(--brass-hi); }
.result.lose h2 { color: var(--coral); }
.rewardlist { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
.rewardlist .chip { font-size: 16px; }

/* Toasts */
#toasts { position: fixed; z-index: 80; top: calc(var(--top-h) + 10px); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 14px; background: rgba(14, 27, 36, 0.96); border: 1.5px solid var(--brass); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); display: flex; gap: 10px; align-items: center; animation: toastIn 0.3s ease-out; font-weight: 700; }
.toast.good { border-color: var(--sea); }
.toast.bad { border-color: var(--coral); }
.toast.gold { border-color: var(--r-legendaer); background: linear-gradient(90deg, rgba(90, 60, 10, 0.96), rgba(14, 27, 36, 0.96)); }
.toast.out { animation: toastOut 0.35s ease-in forwards; }
body.in-battle #toasts { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }

/* Hinweise von Kaept'n Ottilie */
#hint { position: absolute; z-index: 40; left: 16px; bottom: calc(var(--dock-h) + 20px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 16px; background: rgba(14, 27, 36, 0.96); border: 1.5px solid var(--sea); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); }
#hint .porthole { width: 52px; height: 52px; }
#hint p { margin: 0 0 8px; font-size: 14px; }

/* Charaktererstellung */
#create { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); background: radial-gradient(ellipse at 30% 40%, #2f6b80, var(--night) 70%); overflow: hidden; }
#create .cview { position: relative; min-height: 0; }
#create .cview .r3d-canvas { display: block; }
#create .ctitle { position: absolute; left: 24px; top: calc(18px + env(safe-area-inset-top, 0px)); z-index: 2; }
#create .ctitle h1 { font-size: 54px; color: var(--brass-hi); text-shadow: 0 3px 0 var(--ink); line-height: 0.95; }
#create .ctitle p { margin: 4px 0 0; color: var(--fog); max-width: 380px; }
#create .cform { overflow-y: auto; padding: 22px 22px 28px; background: linear-gradient(170deg, var(--deck), #112631); border-left: 2px solid var(--brass); }
.cform h3 { font-size: 20px; color: var(--brass-hi); margin: 14px 0 6px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.choice { padding: 8px 6px; border-radius: 12px; border: 1.5px solid var(--deck-3); background: var(--deck-2); cursor: pointer; font-weight: 700; text-align: center; }
.choice.on { border-color: var(--brass); background: var(--deck-3); box-shadow: inset 0 0 0 1px var(--brass); }
.choice small { display: block; font-weight: 500; font-size: 11.5px; color: var(--fog); }
.cls-choices { grid-template-columns: repeat(3, 1fr); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; box-shadow: 0 0 0 2px transparent; }
.sw.on { box-shadow: 0 0 0 2px var(--brass-hi); }
.cform .desc { font-size: 13.5px; color: #d6cdb8; margin: 6px 0 0; min-height: 38px; }
.cform input#heroName { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--brass-dim); background: #0a141b; color: var(--sail); }

/* Brunnen-Muenze (CSS-3D) */
.well { display: grid; place-items: center; padding: 18px 0; perspective: 600px; }
.coin { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; }
.coin.flip { animation: coinflip 1.6s cubic-bezier(0.2, 0.7, 0.3, 1); }
.coin .face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; display: grid; place-items: center; font-family: var(--font-display); font-size: 40px; color: #6a4d18; background: radial-gradient(circle at 35% 30%, #fff1b8, #e0b04a 55%, #a87a22); border: 4px solid #8a6a2c; box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.2); }
.coin .back { transform: rotateY(180deg); }
@keyframes coinflip { 0% { transform: translateY(0) rotateY(0); } 45% { transform: translateY(-120px) rotateY(900deg); } 100% { transform: translateY(0) rotateY(1800deg); } }

table.fame { width: 100%; border-collapse: collapse; font-size: 14px; }
table.fame th { text-align: left; font-size: 12px; color: var(--fog); font-weight: 700; padding: 4px 6px; }
table.fame td { padding: 6px; border-top: 1px solid rgba(163, 184, 193, 0.15); }
table.fame tr.me td { background: rgba(220, 170, 74, 0.18); }
table.fame tr.gap td { text-align: center; color: var(--fog); }
table.fame tr[data-act] { cursor: pointer; }
table.fame tr[data-act]:hover td { background: rgba(255, 255, 255, 0.05); }
.tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--sea); color: var(--ink); font-weight: 800; vertical-align: 1px; }

.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--deck-2); border: 1.5px solid var(--deck-3); }

.card h4 { margin: 0; font-size: 16px; }
.card.locked { opacity: 0.55; }
.bestiary { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.beast { text-align: center; font-size: 11.5px; padding: 6px; border-radius: 12px; background: var(--deck-2); }
.beast .pic { aspect-ratio: 1; border-radius: 10px; background: radial-gradient(circle at 50% 40%, #2f6b80, #13303c); display: grid; place-items: center; overflow: hidden; }
.beast .pic img { width: 100%; height: 100%; object-fit: contain; }
.beast.unknown .pic img { filter: brightness(0) opacity(0.5); }
.ach { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--deck-2); margin-bottom: 6px; }
.ach .ic { width: 30px; height: 30px; }
.ach.locked { opacity: 0.5; }
input[type="range"] { width: 100%; accent-color: var(--brass); }

@media (max-width: 860px) {
  :root { --panel-w: auto; --dock-h: 68px; }
  #panel { left: 8px; right: 8px; top: calc(var(--top-h) + 4px); bottom: calc(var(--dock-h) + 10px); }
  .logo { display: none; }
  .xpbar { width: 110px; }
  .me-name { max-width: 110px; }
  .res { gap: 5px; }
  .chip { padding: 4px 8px; font-size: 13px; }
  .chip.hon { display: none; }
  .dock-btn { width: 60px; font-size: 10.5px; }
  .dock-btn .ic { width: 24px; height: 24px; }
  #dock { justify-content: flex-start; padding-left: 12px; padding-right: 12px; }
  #create { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
  #create .cform { border-left: 0; border-top: 2px solid var(--brass); }
  #create .ctitle h1 { font-size: 34px; }
  #create .ctitle p { display: none; }
  .sheet { grid-template-columns: 62px 1fr 62px; gap: 6px; }
  .heroview { height: 300px; }
  .grid6 { grid-template-columns: repeat(4, 1fr); }
  .fx-banner { font-size: 28px; }
}
@media (max-width: 520px) {
  #topbar { gap: 8px; padding-left: 10px; padding-right: 10px; }
  .me-meta .me-name { display: none; }
  .me-meta .me-sub { font-size: 11px; white-space: nowrap; }
  .me-meta .xpbar { width: 64px; }
  .porthole { width: 42px; height: 42px; }
  body.panel-open #hint { bottom: auto; top: calc(var(--top-h) + 70px); }
  .gauge small { display: none; }
  .quest { grid-template-columns: 64px 1fr; }
  .quest .mon { width: 64px; height: 64px; }
  .card { grid-template-columns: 56px 1fr; }
  .card .pic { width: 56px; height: 56px; }
  .card > :last-child { grid-column: 1 / -1; }
  .plate .porthole { width: 40px; height: 40px; }
  .plate { padding: 6px 8px 6px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

<script>/* src/engine.js */
/* Helden von Schwebfels - Spiellogik ohne DOM.
   Laeuft im Browser und in Node (fuer Tests und Balance-Simulationen). */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;

  /* ---------------- Hilfsfunktionen ---------------- */
  const U = (SB.util = {});
  U.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };
  U.rng = function (seed) {
    let a = (typeof seed === "string" ? U.hash(seed) : seed >>> 0) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  U.rf = (r, a, b) => a + r() * (b - a);
  U.pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  U.wpick = function (r, list, key) {
    key = key || "w";
    let total = 0;
    for (const it of list) total += it[key];
    let x = r() * total;
    for (const it of list) {
      x -= it[key];
      if (x <= 0) return it;
    }
    return list[list.length - 1];
  };
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.fmt = function (n) {
    n = Math.round(n);
    const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (n < 0 ? "-" : "") + s;
  };
  U.fmtShort = function (n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " Mio.";
    if (n >= 1e4) return Math.round(n / 1000) + " Tsd.";
    return U.fmt(n);
  };
  U.fmtTime = function (ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    return m + ":" + String(sec).padStart(2, "0");
  };
  U.esc = (str) =>
    String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  U.dayKey = function (ts) {
    const d = new Date(ts);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  };
  U.cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  let uidCounter = 0;
  U.uid = () => Date.now().toString(36) + "-" + (uidCounter++).toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);

  /* ---------------- Ereignisbus ---------------- */
  const listeners = {};
  SB.bus = {
    on(ev, fn) {
      (listeners[ev] = listeners[ev] || []).push(fn);
    },
    emit(ev, payload) {
      (listeners[ev] || []).forEach((fn) => {
        try {
          fn(payload);
        } catch (e) {
          console.error(e);
        }
      });
    },
  };
  const toast = (text, kind, extra) => SB.bus.emit("toast", Object.assign({ text, kind: kind || "info" }, extra || {}));

  /* ---------------- Kurven und Konstanten ---------------- */
  const E = (SB.engine = {});
  E.now = () => Date.now();
  E.C = {
    ENERGY_MAX: 100,
    ENERGY_REGEN_MS: 36 * 1000, // 1 Punkt pro 36 s, voll in einer Stunde
    BREW_ENERGY: 30,
    MONSTER_Q: 1.1,
    BREW_MAX: 5,
    SHIFT_MS: 5 * 60 * 1000,
    SHIFT_MAX: 8,
    ARENA_CD: 5 * 60 * 1000,
    DUNGEON_CD: 10 * 60 * 1000,
    SHOP_REFRESH: 15 * 60 * 1000,
    INV_SIZE: 12,
    WELL_PAID_MAX: 10,
    SPECIAL_EVERY: 4,
    MAX_ACTIONS: 90,
    NPC_COUNT: 140,
  };
  E.xpNeed = (L) => Math.round(80 * Math.pow(L, 1.75) + 40);
  E.goldBase = (L) => Math.round(6 + 3.2 * Math.pow(L, 1.42));
  E.questXpFrac = (L) => Math.max(0.07, 0.3 - 0.0075 * (L - 1));
  E.attrCost = (b) => Math.round(3 + 0.45 * Math.pow(b, 1.62) + b * 1.5);
  E.itemStat = (L) => 1.5 + 0.9 * L;
  E.weaponAvg = (L) => 2 + 1.5 * L;
  // Grundschaden, der unabhaengig von der Waffe mit der Stufe waechst
  E.baseDmg = (L) => [Math.round(1 + 0.6 * L), Math.round(2 + 0.9 * L)];
  E.armorBase = (L) => 6 + 4.5 * L;
  E.itemValue = (L) => 10 + 6 * Math.pow(L, 1.3);

  /* ---------------- Gegenstaende ---------------- */
  const ADJ_END = { m: "er", f: "e", n: "es", pl: "e" };
  const TINTS = {
    platte: ["#9aa4ad", "#b8bec4", "#7f8a96", "#c9a441", "#8d6b4a"],
    leder: ["#8a5a35", "#6b4a2f", "#a8743f", "#4f6b3a", "#5a4a3a"],
    stoff: ["#5b4fbf", "#3f6fbf", "#8f3f8f", "#2f7a6b", "#b04a4a"],
    schmuck: ["#e0b04a", "#c9d2d8", "#d98a4a", "#5fd0d6", "#c47bff"],
    holz: ["#8a5a35", "#6b4a2f", "#a8743f"],
  };

  E.baseFor = function (slot, cls, r) {
    const C = D.CLASSES[cls];
    if (slot === "waffe") return U.pick(r, C.weapons);
    if (slot === "nebenhand") return C.offhand;
    if (slot === "helm") return C.helm;
    if (slot === "ruestung") return C.chest;
    return slot; // handschuhe, stiefel, umhang, amulett, ring, talisman
  };

  E.rollRarity = function (r, opts) {
    opts = opts || {};
    const min = opts.minRarity ? D.RARITY_ORDER.indexOf(opts.minRarity) : 0;
    const boost = opts.boost || 0; // verschiebt Gewicht zu besseren Stufen
    const list = D.RARITY_ORDER.map((id, i) => ({ id, w: i < min ? 0 : D.RARITIES[id].weight * Math.pow(1 + boost, i) }));
    return U.wpick(r, list).id;
  };

  E.makeItem = function (r, opts) {
    const L = Math.max(1, Math.round(opts.level || 1));
    const cls = opts.cls;
    const slot = opts.slot || U.pick(r, D.SLOTS.filter((s) => s !== "nebenhand" || cls));
    const base = opts.base || E.baseFor(slot, cls, r);
    const B = D.BASES[base];
    const rarity = opts.rarity || E.rollRarity(r, opts);
    const R = D.RARITIES[rarity];
    const SI = D.SLOT_INFO[slot];
    const C = D.CLASSES[cls];
    const stats = {};
    const used = [];
    const statBase = E.itemStat(L) * R.mult * SI.stat;
    const lineMult = [1, 0.7, 0.55, 0.45];
    for (let i = 0; i < R.lines; i++) {
      let attr;
      if (i === 0) attr = r() < 0.68 ? C.main : "konstitution";
      else {
        const pool = D.ATTRS.filter((a) => used.indexOf(a) < 0).map((a) => ({
          a,
          w: a === C.main ? 3 : a === "konstitution" ? 3 : a === "glueck" ? 2 : 1,
        }));
        attr = U.wpick(r, pool).a;
      }
      used.push(attr);
      stats[attr] = Math.max(1, Math.round(statBase * lineMult[i] * U.rf(r, 0.88, 1.12)));
    }
    const item = { id: U.uid(), base, slot, cls: B.cls || null, level: L, rarity, stats, style: U.ri(r, 0, 2) };
    if (SI.armor > 0) item.armor = Math.max(1, Math.round(E.armorBase(L) * SI.armor * Math.pow(R.mult, 0.8) * U.rf(r, 0.9, 1.1)));
    if (slot === "waffe") {
      const avg = E.weaponAvg(L) * Math.pow(R.mult, 0.85) * U.rf(r, 0.94, 1.06);
      item.min = Math.max(1, Math.round(avg * 0.78));
      item.max = Math.max(item.min + 1, Math.round(avg * 1.22));
    }
    // Name
    const nounName = B.names ? B.names[cls] || B.names.klinge : B.name;
    const adj = U.pick(r, D.ADJ[rarity]);
    const adjWords = adj.split(" ");
    adjWords[adjWords.length - 1] += ADJ_END[B.g];
    let name = U.cap(adjWords.join(" ")) + " " + nounName;
    if (D.RARITY_ORDER.indexOf(rarity) >= 2) name += " " + U.pick(r, D.SUFFIX[used[0]]);
    item.name = name;
    // Farbe
    let palette;
    if (["amulett", "ring", "talisman"].indexOf(slot) >= 0) palette = TINTS.schmuck;
    else if (slot === "waffe" && (base === "bogen" || base === "stab")) palette = TINTS.holz;
    else palette = TINTS[C.material];
    item.tint = U.pick(r, palette);
    item.value = Math.max(5, Math.round(E.itemValue(L) * SI.price * R.price * U.rf(r, 0.9, 1.1)));
    return item;
  };

  E.itemScore = function (item, cls) {
    if (!item) return 0;
    const C = D.CLASSES[cls];
    let s = 0;
    for (const a in item.stats) s += item.stats[a] * (a === C.main ? 2 : a === "konstitution" ? 1.2 : a === "glueck" ? 0.6 : 0.2);
    if (item.armor) s += item.armor * 0.35;
    if (item.min) s += (item.min + item.max) * 1.6;
    if (item.base === "schild" && cls === "klinge") s += 25 + item.level * 4;
    return s;
  };

  /* ---------------- Held erstellen ---------------- */
  E.newHero = function (opts) {
    const now = E.now();
    const C = D.CLASSES[opts.cls];
    const race = D.RACES[opts.race];
    const base = {};
    for (const a of D.ATTRS) base[a] = 8 + (race.mods[a] || 0);
    base[C.main] += 4;
    base.konstitution += 2;
    const r = U.rng("start:" + opts.name + now);
    const S = {
      v: 1,
      created: now,
      name: opts.name,
      race: opts.race,
      gender: opts.gender,
      cls: opts.cls,
      look: opts.look,
      level: 1,
      xp: 0,
      gold: 120,
      perlen: 6,
      honor: 100,
      energy: { val: E.C.ENERGY_MAX, ts: now },
      base,
      bought: { kraft: 0, geschick: 0, verstand: 0, konstitution: 0, glueck: 0 },
      equip: {},
      inv: [],
      quest: { seed: U.hash(opts.name + now), offers: [], active: null },
      guard: null,
      arena: { next: 0, wins: 0, losses: 0, rivals: [] },
      dungeons: { progress: {}, next: 0 },
      shops: {},
      buffs: [],
      mounts: { owned: [] },
      bestiary: {},
      ach: {},
      stats: { quests: 0, wins: 0, losses: 0, arenaWins: 0, bosses: 0, goldEarned: 0, items: 0 },
      daily: { day: U.dayKey(now), wellFree: 1, brews: 0, arenaXp: 0, wellPaid: 0 },
      npcSeed: U.hash("npc:" + opts.name + now),
      npcHonor: {},
      settings: { sound: true, quality: "hoch", fastFights: false },
      tut: 0,
    };
    for (const s of D.SLOTS) S.equip[s] = null;
    S.equip.waffe = E.makeItem(r, { level: 1, slot: "waffe", cls: opts.cls, rarity: "gewoehnlich", base: C.weapons[0] });
    S.equip.ruestung = E.makeItem(r, { level: 1, slot: "ruestung", cls: opts.cls, rarity: "gewoehnlich" });
    S.equip.stiefel = E.makeItem(r, { level: 1, slot: "stiefel", cls: opts.cls, rarity: "gewoehnlich" });
    if (opts.cls === "klinge") S.equip.nebenhand = E.makeItem(r, { level: 1, slot: "nebenhand", cls: opts.cls, rarity: "gewoehnlich" });
    E.refreshOffers(S);
    E.refreshShop(S, "schmiede", true);
    E.refreshShop(S, "arkanum", true);
    return S;
  };

  E.migrate = function (S) {
    if (!S || typeof S !== "object" || !S.cls || !D.CLASSES[S.cls]) return null;
    S.settings = Object.assign({ sound: true, quality: "hoch", fastFights: false }, S.settings || {});
    S.stats = Object.assign({ quests: 0, wins: 0, losses: 0, arenaWins: 0, bosses: 0, goldEarned: 0, items: 0 }, S.stats || {});
    S.bestiary = S.bestiary || {};
    S.ach = S.ach || {};
    S.buffs = S.buffs || [];
    S.mounts = S.mounts || { owned: [] };
    S.npcHonor = S.npcHonor || {};
    S.inv = (S.inv || []).filter(Boolean);
    for (const s of D.SLOTS) if (!(s in S.equip)) S.equip[s] = null;
    return S;
  };

  /* ---------------- Werte des Helden ---------------- */
  E.activeBuffs = function (S, now) {
    now = now || E.now();
    S.buffs = (S.buffs || []).filter((b) => b.until > now);
    return S.buffs;
  };

  E.heroAttrs = function (S, now) {
    const C = D.CLASSES[S.cls];
    const out = {};
    for (const a of D.ATTRS) {
      const auto = a === C.main || a === "konstitution" ? S.level - 1 : Math.floor((S.level - 1) / 2);
      out[a] = S.base[a] + S.bought[a] + auto;
    }
    for (const s of D.SLOTS) {
      const it = S.equip[s];
      if (it) for (const a in it.stats) out[a] += it.stats[a];
    }
    const buffs = E.activeBuffs(S, now);
    const mult = { kraft: 1, geschick: 1, verstand: 1, konstitution: 1, glueck: 1 };
    for (const b of buffs) {
      const P = D.POTIONS.find((p) => p.id === b.id);
      if (!P) continue;
      for (const k in P.eff) {
        if (k === "main") mult[C.main] += P.eff[k];
        else if (k === "all") D.ATTRS.forEach((a) => (mult[a] += P.eff[k]));
        else mult[k] += P.eff[k];
      }
    }
    for (const a of D.ATTRS) out[a] = Math.round(out[a] * mult[a]);
    return out;
  };

  E.armorTotal = function (S) {
    let a = 0;
    for (const s of D.SLOTS) if (S.equip[s] && S.equip[s].armor) a += S.equip[s].armor;
    return a;
  };

  E.damageReduction = (prof, armor, attLevel) => (prof.armorCap / 100) * (armor / (armor + 2.8 * attLevel + 30));
  E.critChance = (luck, defLevel) => U.clamp(0.03 + (0.5 * luck) / (luck + 8 * defLevel + 20), 0.03, 0.45);

  E.profileFor = function (cls) {
    const C = D.CLASSES[cls];
    return { hpMult: C.hpMult, armorCap: C.armorCap, block: C.block, evade: C.evade, unblockable: C.unblockable, dmgMult: C.dmgMult, special: C.special };
  };

  E.heroFighter = function (S, now) {
    const C = D.CLASSES[S.cls];
    const attrs = E.heroAttrs(S, now);
    const prof = E.profileFor(S.cls);
    if (!(S.equip.nebenhand && S.equip.nebenhand.base === "schild")) prof.block = 0;
    const w = S.equip.waffe;
    const L = S.level;
    return {
      kind: "hero",
      name: S.name,
      level: L,
      cls: S.cls,
      race: S.race,
      gender: S.gender,
      look: S.look,
      gear: E.gearVisual(S.equip),
      mainKey: C.main,
      attrs,
      prof,
      maxHp: Math.round(attrs.konstitution * prof.hpMult * (L + 1)),
      wMin: (w ? w.min : 0) + E.baseDmg(L)[0],
      wMax: (w ? w.max : 1) + E.baseDmg(L)[1],
      armor: E.armorTotal(S),
      ranged: !!(w && D.BASES[w.base].ranged),
    };
  };

  E.gearVisual = function (equip) {
    const g = {};
    for (const s of ["helm", "ruestung", "umhang", "handschuhe", "stiefel", "waffe", "nebenhand"]) {
      const it = equip[s];
      g[s] = it ? { base: it.base, tint: it.tint, rarity: it.rarity, style: it.style || 0 } : null;
    }
    return g;
  };

  E.heroSummary = function (S, now) {
    const f = E.heroFighter(S, now);
    const red = E.damageReduction(f.prof, f.armor, S.level);
    const eff = 1 + f.attrs[f.mainKey] / 10;
    return {
      fighter: f,
      attrs: f.attrs,
      hp: f.maxHp,
      dmgMin: Math.round(f.wMin * eff * f.prof.dmgMult),
      dmgMax: Math.round(f.wMax * eff * f.prof.dmgMult),
      armor: f.armor,
      reduction: red,
      crit: E.critChance(f.attrs.glueck, S.level),
      block: f.prof.block,
      evade: f.prof.evade,
    };
  };

  /* Modell-Held einer Stufe: Basis fuer Monster, NPC-Helden und Balance. q = Ausruestungsqualitaet */
  E.modelAttrs = function (L, q) {
    q = q == null ? 1 : q;
    // An einen simulierten, sparsam spielenden Helden angepasst (tests/progression.mjs)
    return {
      main: Math.round(12 + (9 * L + 0.24 * L * L) * q),
      con: Math.round(10 + (4 * L + 0.25 * L * L) * q),
      luck: Math.round(8 + 2.5 * L * q),
      other: Math.round(8 + 0.5 * (L - 1) + 0.6 * E.itemStat(L) * q),
      weapon: E.weaponAvg(L) * 1.1 * q,
      armor: E.armorBase(L) * 1.05 * q,
    };
  };

  E.modelHeroFighter = function (L, cls, q, extra) {
    const C = D.CLASSES[cls];
    const m = E.modelAttrs(L, q);
    const attrs = { kraft: m.other, geschick: m.other, verstand: m.other, konstitution: m.con, glueck: m.luck };
    attrs[C.main] = m.main;
    const prof = E.profileFor(cls);
    return Object.assign(
      {
        kind: "hero",
        name: "Modell",
        level: L,
        cls,
        mainKey: C.main,
        attrs,
        prof,
        maxHp: Math.round(attrs.konstitution * prof.hpMult * (L + 1)),
        wMin: Math.round(m.weapon * 0.78) + E.baseDmg(L)[0],
        wMax: Math.round(m.weapon * 1.22) + E.baseDmg(L)[1],
        armor: Math.round(m.armor),
        ranged: cls !== "klinge",
      },
      extra || {}
    );
  };

  E.monsterFighter = function (mon, L, power, opts) {
    opts = opts || {};
    const type = D.ARCH_TYPE[mon.arch];
    const T = D.MONSTER_TYPES[type];
    // Fruehe Stufen etwas sanfter, da Neulinge noch kaum Ausruestung haben
    const ramp = Math.min(1, 0.62 + 0.042 * L);
    const p = power * ramp;
    const m = E.modelAttrs(L, E.C.MONSTER_Q);
    const attrs = { kraft: 0, geschick: 0, verstand: 0, konstitution: 0, glueck: 0 };
    attrs.kraft = attrs.geschick = attrs.verstand = Math.round(m.other * p);
    attrs[type] = Math.round(m.main * 0.86 * p);
    attrs.konstitution = Math.round(m.con * 0.95 * p);
    attrs.glueck = Math.round(m.luck * 0.8 * p);
    const hpBoost = opts.boss ? 1.25 : 1;
    const prof = { hpMult: T.hpMult, armorCap: T.armorCap, block: T.block, evade: T.evade, unblockable: T.unblockable, dmgMult: T.dmgMult, special: T.special };
    const wAvg = m.weapon * (0.85 + 0.15 * p) + (E.baseDmg(L)[0] + E.baseDmg(L)[1]) / 2;
    return {
      kind: "monster",
      id: mon.id,
      name: mon.name,
      arch: mon.arch,
      color: mon.color,
      accent: mon.accent,
      boss: !!opts.boss,
      final: !!opts.final,
      level: L,
      mainKey: type,
      attrs,
      prof,
      maxHp: Math.round(attrs.konstitution * prof.hpMult * (L + 1) * hpBoost),
      wMin: Math.max(1, Math.round(wAvg * 0.8)),
      wMax: Math.max(2, Math.round(wAvg * 1.2)),
      armor: Math.round(m.armor * 0.9 * p),
      ranged: type === "verstand",
    };
  };

  /* ---------------- Kampf ---------------- */
  E.simulate = function (A, B, seed) {
    const r = U.rng(seed);
    const f = [Object.assign({}, A, { hp: A.maxHp, meter: 0, stun: false }), Object.assign({}, B, { hp: B.maxHp, meter: 0, stun: false })];
    const sA = (A.attrs.geschick + A.attrs.glueck) * U.rf(r, 0.8, 1.2);
    const sB = (B.attrs.geschick + B.attrs.glueck) * U.rf(r, 0.8, 1.2);
    let turn = sA >= sB ? 0 : 1;
    const events = [];
    let winner = -1;
    for (let i = 0; i < E.C.MAX_ACTIONS && winner < 0; i++) {
      const att = f[turn];
      const def = f[1 - turn];
      if (att.stun) {
        att.stun = false;
        events.push({ a: turn, kind: "stun", hits: [], hp: [f[0].hp, f[1].hp] });
        turn = 1 - turn;
        continue;
      }
      att.meter++;
      const special = att.meter % E.C.SPECIAL_EVERY === 0 ? att.prof.special : null;
      let hits = [{ mult: 1 }];
      let stunTarget = false;
      if (special) {
        switch (special.id) {
          case "schildbrecher":
            hits = [{ mult: 1.5, sure: true }];
            stunTarget = true;
            break;
          case "pfeilhagel":
            hits = [{ mult: 0.6 }, { mult: 0.6 }, { mult: 0.6 }];
            break;
          case "sternenbruch":
            hits = [{ mult: 2.2, sure: true, pierce: true }];
            break;
          case "zermalmen":
            hits = [{ mult: 1.8 }];
            break;
          case "raserei":
            hits = [{ mult: 0.85 }, { mult: 0.85 }];
            break;
          case "fluch":
            hits = [{ mult: 1.5, sure: true, pierce: true }];
            break;
        }
      }
      const out = [];
      let landed = false;
      for (const h of hits) {
        if (def.hp <= 0) break;
        const sure = h.sure || att.prof.unblockable;
        if (!sure && def.prof.evade && r() < def.prof.evade) {
          out.push({ res: "evade", dmg: 0 });
          continue;
        }
        // Schilde fangen auch Zauber ab, aber nur halb so oft
        const blockChance = h.sure ? 0 : att.prof.unblockable ? def.prof.block * 0.5 : def.prof.block;
        if (blockChance && r() < blockChance) {
          out.push({ res: "block", dmg: 0 });
          continue;
        }
        // Gleiches Attribut schwaecht Angriffe nur im Duell zwischen Helden
        const main = att.attrs[att.mainKey];
        const pvp = att.kind !== "monster" && def.kind !== "monster";
        const eff = pvp ? Math.max(main * 0.5, main - def.attrs[att.mainKey] * 0.5) : main;
        const roll = U.rf(r, att.wMin, att.wMax);
        const red = h.pierce ? 0 : E.damageReduction(def.prof, def.armor, att.level);
        let dmg = roll * (1 + eff / 10) * att.prof.dmgMult * h.mult * (1 - red);
        const crit = r() < E.critChance(att.attrs.glueck, def.level);
        if (crit) dmg *= 2;
        dmg = Math.max(1, Math.round(dmg));
        def.hp = Math.max(0, def.hp - dmg);
        landed = true;
        out.push({ res: crit ? "crit" : "hit", dmg });
      }
      if (stunTarget && landed && def.hp > 0) def.stun = true;
      events.push({ a: turn, kind: special ? "special" : "attack", sp: special ? special.id : null, spName: special ? special.name : null, hits: out, stun: stunTarget && landed, hp: [f[0].hp, f[1].hp] });
      if (def.hp <= 0) winner = turn;
      turn = 1 - turn;
    }
    if (winner < 0) winner = f[0].hp / f[0].maxHp >= f[1].hp / f[1].maxHp ? 0 : 1;
    return { events, winner, hp: [f[0].hp, f[1].hp], max: [A.maxHp, B.maxHp] };
  };

  E.estimateWin = function (A, B, n, salt) {
    n = n || 40;
    let w = 0;
    for (let i = 0; i < n; i++) if (E.simulate(A, B, "est" + (salt || "") + i).winner === 0) w++;
    return w / n;
  };

  /* ---------------- Zeit, Energie, Tageswechsel ---------------- */
  E.energy = function (S, now) {
    now = now || E.now();
    const e = S.energy;
    if (e.val >= E.C.ENERGY_MAX) return e.val;
    return Math.min(E.C.ENERGY_MAX, e.val + (now - e.ts) / E.C.ENERGY_REGEN_MS);
  };
  E.setEnergy = function (S, val, now) {
    S.energy = { val, ts: now || E.now() };
  };
  E.nextEnergyIn = function (S, now) {
    now = now || E.now();
    const cur = E.energy(S, now);
    if (cur >= E.C.ENERGY_MAX) return 0;
    const frac = cur - Math.floor(cur);
    return (1 - frac) * E.C.ENERGY_REGEN_MS;
  };

  E.tick = function (S, now) {
    now = now || E.now();
    const day = U.dayKey(now);
    if (S.daily.day !== day) {
      S.daily = { day, wellFree: 1, brews: 0, arenaXp: 0, wellPaid: 0 };
      toast("Ein neuer Tag auf Schwebfels. Der Wunschbrunnen glitzert wieder.", "info");
    }
    for (const k of ["schmiede", "arkanum"]) if (!S.shops[k] || now - S.shops[k].ts > E.C.SHOP_REFRESH) E.refreshShop(S, k, true);
    E.activeBuffs(S, now);
  };

  E.busy = function (S, now) {
    now = now || E.now();
    if (S.quest.active) return { what: "quest", until: S.quest.active.end };
    if (S.guard) return { what: "guard", until: S.guard.end };
    return null;
  };

  E.bestiaryBonus = (S) => 1 + Object.keys(S.bestiary).length * 0.005;
  E.mountCut = function (S) {
    let cut = 0;
    for (const id of S.mounts.owned) {
      const M = D.MOUNTS.find((m) => m.id === id);
      if (M && M.cut > cut) cut = M.cut;
    }
    return cut;
  };

  E.gainXp = function (S, xp) {
    S.xp += xp;
    let ups = 0;
    while (S.xp >= E.xpNeed(S.level)) {
      S.xp -= E.xpNeed(S.level);
      S.level++;
      S.perlen += 1;
      ups++;
    }
    if (ups) {
      SB.bus.emit("levelup", { level: S.level });
      E.checkAch(S);
    }
    return ups;
  };
  E.gainGold = function (S, g) {
    S.gold += g;
    if (g > 0) S.stats.goldEarned += g;
  };

  E.addItem = function (S, item) {
    if (S.inv.length >= E.C.INV_SIZE) return false;
    S.inv.push(item);
    S.stats.items++;
    if (item.rarity === "episch") E.grantAch(S, "episch");
    if (item.rarity === "legendaer") E.grantAch(S, "legendaer");
    return true;
  };

  /* ---------------- Taverne / Auftraege ---------------- */
  const TIERS = [
    { id: "kurz", name: "Kurz", sec: [20, 35], energy: 6 },
    { id: "mittel", name: "Mittel", sec: [40, 70], energy: 10 },
    { id: "lang", name: "Lang", sec: [80, 120], energy: 14 },
  ];
  const DIFF = [
    null,
    { name: "Gemütlich", power: 0.88, reward: 0.85 },
    { name: "Ordentlich", power: 0.97, reward: 1.0 },
    { name: "Halsbrecherisch", power: 1.06, reward: 1.35 },
  ];
  E.DIFF = DIFF;

  E.monstersFor = function (L) {
    let list = D.MONSTERS.filter((m) => L >= m.lv[0] && L <= m.lv[1]);
    if (list.length < 3) {
      list = D.MONSTERS.slice().sort((a, b) => Math.abs((a.lv[0] + Math.min(a.lv[1], 60)) / 2 - L) - Math.abs((b.lv[0] + Math.min(b.lv[1], 60)) / 2 - L)).slice(0, 6);
    }
    return list;
  };

  E.makeOffer = function (S, r, idx) {
    const L = S.level;
    const tier = TIERS[idx % 3 === 0 ? U.ri(r, 0, 1) : idx % 3 === 1 ? 1 : U.ri(r, 1, 2)];
    const diff = U.wpick(r, [{ d: 1, w: 38 }, { d: 2, w: 42 }, { d: 3, w: 20 }]).d;
    const mon = U.pick(r, E.monstersFor(L));
    // Verschiedene Vorlagen und Gegner innerhalb eines Angebots
    let tpl = U.pick(r, D.QUESTS);
    for (let k = 0; k < 8 && S._tplUsed && S._tplUsed.indexOf(tpl.t) >= 0; k++) tpl = U.pick(r, D.QUESTS);
    const place = U.pick(r, D.PLACES);
    const person = U.pick(r, D.PERSONS);
    const fill = (s) => s.replace(/\{m\}/g, mon.name).replace(/\{o\}/g, place).replace(/\{p\}/g, person);
    const ef = tier.energy / 10;
    const dm = DIFF[diff].reward;
    const bonus = E.bestiaryBonus(S);
    const offer = {
      id: U.uid(),
      tpl: tpl.t,
      title: fill(tpl.t),
      text: U.cap(fill(tpl.x)),
      place,
      tier: tier.id,
      sec: U.ri(r, tier.sec[0], tier.sec[1]),
      energy: tier.energy,
      diff,
      monster: mon.id,
      mlevel: Math.max(1, L + (diff === 3 ? U.ri(r, 0, 1) : diff === 1 ? -U.ri(r, 0, 1) : 0)),
      xp: Math.max(5, Math.round(E.xpNeed(L) * E.questXpFrac(L) * ef * dm * U.rf(r, 0.9, 1.1) * bonus)),
      gold: Math.max(3, Math.round(E.goldBase(L) * ef * dm * U.rf(r, 0.85, 1.15) * bonus)),
      item: null,
      perle: r() < 0.05 + 0.02 * diff ? 1 : 0,
      seed: Math.floor(r() * 1e9),
    };
    if (r() < 0.3 + 0.08 * diff) {
      offer.item = E.makeItem(r, { level: L + U.ri(r, 0, 1), cls: S.cls, slot: U.pick(r, D.SLOTS), boost: 0.25 * diff });
    }
    return offer;
  };

  E.refreshOffers = function (S) {
    const r = U.rng(S.quest.seed++);
    S._tplUsed = [];
    S.quest.offers = [0, 1, 2].map((i) => {
      const o = E.makeOffer(S, r, i);
      S._tplUsed.push(o.tpl);
      return o;
    });
    delete S._tplUsed;
  };

  E.questDuration = (S, offer) => Math.round(offer.sec * (1 - E.mountCut(S)) * 1000);

  E.startQuest = function (S, idx, now) {
    now = now || E.now();
    const o = S.quest.offers[idx];
    if (!o) return { ok: false, msg: "Dieser Auftrag existiert nicht mehr." };
    if (E.busy(S, now)) return { ok: false, msg: "Du bist gerade beschäftigt." };
    const en = E.energy(S, now);
    if (en < o.energy) return { ok: false, msg: "Dir fehlt der Tatendrang. Ein Wolkenbräu hilft." };
    E.setEnergy(S, en - o.energy, now);
    S.quest.active = { offer: o, start: now, end: now + E.questDuration(S, o) };
    return { ok: true };
  };

  E.skipQuest = function (S, now) {
    now = now || E.now();
    const a = S.quest.active;
    if (!a || a.end <= now) return { ok: false };
    if (S.perlen < 1) return { ok: false, msg: "Dafür brauchst du eine Wolkenperle." };
    S.perlen -= 1;
    a.end = now;
    return { ok: true };
  };

  E.questMonster = (o) => D.MONSTERS.find((m) => m.id === o.monster);

  // Auftragsgegner wachsen mit dem Helden, aber nur halb so schnell wie seine tatsaechliche Staerke
  E.heroStrength = function (hero, L) {
    const m = E.modelHeroFighter(L, hero.cls, 1);
    const main = hero.attrs[hero.mainKey] / m.attrs[m.mainKey];
    const hp = hero.maxHp / m.maxHp;
    const wpn = (hero.wMin + hero.wMax) / (m.wMin + m.wMax);
    return U.clamp(Math.cbrt(main * hp * wpn), 0.4, 2.0);
  };
  E.questFoe = function (o, hero) {
    let p = DIFF[o.diff].power;
    if (hero) p *= 0.5 + 0.5 * E.heroStrength(hero, o.mlevel);
    return E.monsterFighter(E.questMonster(o), o.mlevel, p);
  };

  E.questFight = function (S, now) {
    now = now || E.now();
    const a = S.quest.active;
    if (!a || a.end > now) return null;
    const o = a.offer;
    const hero = E.heroFighter(S, now);
    const foe = E.questFoe(o, hero);
    const result = E.simulate(hero, foe, o.seed);
    return { hero, foe, result, offer: o };
  };

  E.resolveQuest = function (S, fight) {
    const o = fight.offer;
    const won = fight.result.winner === 0;
    const rew = { won, xp: 0, gold: 0, item: null, itemSold: 0, perle: 0 };
    S.quest.active = null;
    if (won) {
      rew.xp = o.xp;
      rew.gold = o.gold;
      E.gainGold(S, o.gold);
      if (o.item) {
        if (E.addItem(S, o.item)) rew.item = o.item;
        else {
          rew.itemSold = Math.round(o.item.value * 0.25);
          E.gainGold(S, rew.itemSold);
        }
      }
      if (o.perle) {
        S.perlen += o.perle;
        rew.perle = o.perle;
      }
      S.stats.wins++;
      S.bestiary[o.monster] = (S.bestiary[o.monster] || 0) + 1;
      E.grantAch(S, "ersterSieg");
    } else {
      // Trostpflaster, damit eine Pechstraehne nicht zur Abwaertsspirale wird
      rew.xp = Math.round(o.xp * 0.25);
      rew.gold = Math.round(o.gold * 0.25);
      E.gainGold(S, rew.gold);
      S.stats.losses++;
    }
    S.stats.quests++;
    E.gainXp(S, rew.xp);
    E.refreshOffers(S);
    E.checkAch(S);
    return rew;
  };

  E.buyBrew = function (S, now) {
    now = now || E.now();
    if (S.daily.brews >= E.C.BREW_MAX) return { ok: false, msg: "Hulda schenkt heute nichts mehr aus. Morgen wieder." };
    if (S.perlen < 1) return { ok: false, msg: "Ein Wolkenbräu kostet eine Wolkenperle." };
    S.perlen -= 1;
    S.daily.brews++;
    E.setEnergy(S, E.energy(S, now) + E.C.BREW_ENERGY, now);
    return { ok: true };
  };

  /* ---------------- Leuchtturmwache ---------------- */
  E.shiftPay = (S) => Math.round(E.goldBase(S.level) * 0.8);
  E.startGuard = function (S, shifts, now) {
    now = now || E.now();
    if (E.busy(S, now)) return { ok: false, msg: "Du bist gerade beschäftigt." };
    shifts = U.clamp(Math.round(shifts), 1, E.C.SHIFT_MAX);
    S.guard = { start: now, end: now + shifts * E.C.SHIFT_MS, shifts, pay: shifts * E.shiftPay(S) };
    return { ok: true };
  };
  E.cancelGuard = function (S) {
    S.guard = null;
  };
  E.collectGuard = function (S, now) {
    now = now || E.now();
    const g = S.guard;
    if (!g || g.end > now) return { ok: false };
    E.gainGold(S, g.pay);
    if (g.shifts >= 8) E.grantAch(S, "wache8");
    S.guard = null;
    return { ok: true, gold: g.pay };
  };

  /* ---------------- NPC-Helden, Ruhmeshalle, Arena ---------------- */
  E.npcList = function (S, now) {
    now = now || E.now();
    const out = [];
    const days = Math.max(0, (now - S.created) / 86400000);
    const r = U.rng(S.npcSeed);
    const races = Object.keys(D.RACES);
    const classes = Object.keys(D.CLASSES);
    const usedNames = {};
    for (let i = 0; i < E.C.NPC_COUNT; i++) {
      const t = i / (E.C.NPC_COUNT - 1);
      const baseL = 1 + Math.floor(64 * Math.pow(t, 1.7) + r() * 3);
      const growth = U.rf(r, 0.2, 1.4);
      const L = Math.min(90, baseL + Math.floor(days * growth));
      let name;
      do name = U.pick(r, D.NPC_FIRST) + " " + U.pick(r, D.NPC_LAST);
      while (usedNames[name]);
      usedNames[name] = 1;
      const race = U.pick(r, races);
      const cls = U.pick(r, classes);
      const R = D.RACES[race];
      const look = { skin: U.pick(r, R.skins), hair: U.pick(r, R.hairs), hairStyle: U.ri(r, 0, 4), beard: U.ri(r, 0, 3), eyes: "#1d1b26" };
      const gender = r() < 0.5 ? "m" : "w";
      const q = U.rf(r, 0.82, 1.12);
      const honorBase = Math.round(60 + L * 32 + r() * 260);
      const id = "npc" + i;
      const gearSeed = Math.floor(r() * 1e9);
      out.push({
        id, kind: "npc", name, race, cls, gender, look, level: L, q,
        honor: Math.max(0, honorBase + (S.npcHonor[id] || 0)),
        gearSeed,
      });
    }
    return out;
  };

  E.npcGear = function (npc) {
    const r = U.rng(npc.gearSeed);
    const C = D.CLASSES[npc.cls];
    const g = {};
    const rar = () => E.rollRarity(r, { boost: 0.4 });
    g.waffe = { base: U.pick(r, C.weapons), tint: "#9aa4ad", rarity: rar(), style: U.ri(r, 0, 2) };
    g.ruestung = { base: C.chest, tint: U.pick(r, ["#9aa4ad", "#8a5a35", "#5b4fbf", "#b04a4a", "#2f7a6b", "#c9a441"]), rarity: rar(), style: U.ri(r, 0, 2) };
    g.helm = r() < 0.75 ? { base: C.helm, tint: U.pick(r, ["#7f8a96", "#6b4a2f", "#3f6fbf", "#8f3f8f"]), rarity: rar(), style: U.ri(r, 0, 2) } : null;
    g.umhang = r() < 0.6 ? { base: "umhang", tint: U.pick(r, ["#b04a4a", "#2f4f8f", "#2f7a6b", "#6b3f8f", "#c9a441"]), rarity: rar(), style: 0 } : null;
    g.handschuhe = r() < 0.7 ? { base: "handschuhe", tint: "#6b4a2f", rarity: rar(), style: 0 } : null;
    g.stiefel = { base: "stiefel", tint: "#5a4a3a", rarity: rar(), style: 0 };
    g.nebenhand = r() < 0.85 ? { base: C.offhand, tint: U.pick(r, ["#8d6b4a", "#7f8a96", "#5fd0d6"]), rarity: rar(), style: U.ri(r, 0, 2) } : null;
    return g;
  };

  E.npcFighter = function (npc) {
    const f = E.modelHeroFighter(npc.level, npc.cls, npc.q);
    f.name = npc.name;
    f.race = npc.race;
    f.gender = npc.gender;
    f.look = npc.look;
    f.gear = npc.gear || E.npcGear(npc);
    f.kind = "hero";
    if (!f.gear.nebenhand || f.gear.nebenhand.base !== "schild") f.prof.block = 0;
    return f;
  };

  E.remoteFighter = function (h, st) {
    const C = D.CLASSES[h.cls];
    const prof = E.profileFor(h.cls);
    if (!st.shield) prof.block = 0;
    const w = h.gear && h.gear.waffe;
    return {
      kind: "hero", name: h.name, level: h.level, cls: h.cls, race: h.race, gender: h.gender, look: h.look, gear: h.gear,
      mainKey: C.main, attrs: st.attrs, prof,
      maxHp: Math.round(st.attrs.konstitution * prof.hpMult * (h.level + 1)),
      wMin: st.wMin, wMax: st.wMax, armor: st.armor,
      ranged: !!(w && D.BASES[w.base] && D.BASES[w.base].ranged),
    };
  };

  E.allHeroes = function (S, now, remote) {
    const list = E.npcList(S, now);
    if (remote) for (const h of remote) list.push(h);
    list.push({ id: "me", kind: "me", name: S.name, race: S.race, cls: S.cls, gender: S.gender, look: S.look, level: S.level, honor: S.honor });
    list.sort((a, b) => b.honor - a.honor || b.level - a.level);
    list.forEach((h, i) => (h.rank = i + 1));
    return list;
  };

  E.arenaRivals = function (S, now, remote) {
    const all = E.allHeroes(S, now, remote);
    const me = all.find((h) => h.kind === "me");
    const idx = me.rank - 1;
    const r = U.rng(S.npcSeed + S.arena.wins * 7 + S.arena.losses * 13 + Math.floor((now || E.now()) / E.C.ARENA_CD));
    const pickFrom = (a, b) => {
      const pool = all.slice(Math.max(0, a), Math.max(0, b)).filter((h) => h.kind !== "me");
      return pool.length ? U.pick(r, pool) : null;
    };
    const picks = [pickFrom(idx - 12, idx - 3), pickFrom(idx - 3, idx + 4), pickFrom(idx + 2, idx + 14)].filter(Boolean);
    const seen = {};
    return picks.filter((h) => (seen[h.id] ? false : (seen[h.id] = true)));
  };

  E.arenaFight = function (S, opp, now) {
    now = now || E.now();
    if (E.busy(S, now)) return { ok: false, msg: "Du bist gerade beschäftigt." };
    if (S.arena.next > now) return { ok: false, msg: "Baronin Krawall lässt dich noch nicht wieder in den Ring." };
    const hero = E.heroFighter(S, now);
    const foe = opp.fighter || E.npcFighter(opp);
    const seed = U.hash(S.name + opp.id + now);
    const result = E.simulate(hero, foe, seed);
    return { ok: true, fight: { hero, foe, result, opp } };
  };

  E.resolveArena = function (S, fight, now) {
    now = now || E.now();
    const opp = fight.opp;
    const won = fight.result.winner === 0;
    const gain = U.clamp(Math.round(22 + (opp.honor - S.honor) / 15), 6, 60);
    const rew = { won, honor: 0, gold: 0, xp: 0 };
    S.arena.next = now + E.C.ARENA_CD;
    if (won) {
      S.honor += gain;
      rew.honor = gain;
      rew.gold = Math.round(E.goldBase(S.level) * 0.5);
      E.gainGold(S, rew.gold);
      if (S.daily.arenaXp < 10) {
        S.daily.arenaXp++;
        rew.xp = Math.round(E.xpNeed(S.level) * 0.035);
        E.gainXp(S, rew.xp);
      }
      S.arena.wins++;
      S.stats.arenaWins++;
      if (opp.kind === "npc") S.npcHonor[opp.id] = (S.npcHonor[opp.id] || 0) - Math.round(gain * 0.6);
      E.grantAch(S, "ersterSieg");
    } else {
      const loss = Math.round(gain * 0.5);
      S.honor = Math.max(0, S.honor - loss);
      rew.honor = -loss;
      S.arena.losses++;
      if (opp.kind === "npc") S.npcHonor[opp.id] = (S.npcHonor[opp.id] || 0) + Math.round(gain * 0.4);
    }
    E.checkAch(S, now);
    return rew;
  };

  E.skipArena = function (S, now) {
    now = now || E.now();
    if (S.arena.next <= now) return { ok: false };
    if (S.perlen < 1) return { ok: false, msg: "Dafür brauchst du eine Wolkenperle." };
    S.perlen -= 1;
    S.arena.next = now;
    return { ok: true };
  };

  /* ---------------- Dungeons ---------------- */
  E.dungeonState = function (S, d) {
    const D0 = D.DUNGEONS[d];
    const cleared = S.dungeons.progress[D0.id] || 0;
    return { def: D0, cleared, done: cleared >= D0.bosses.length, unlocked: S.level >= D0.unlock && (d === 0 || (S.dungeons.progress[D.DUNGEONS[d - 1].id] || 0) >= 1) };
  };
  E.bossFor = function (d, floor) {
    const D0 = D.DUNGEONS[d];
    const b = D0.bosses[floor];
    const mon = { id: D0.id + "-" + floor, name: b.name, arch: b.arch, color: b.color, accent: b.accent };
    const L = D0.base + floor;
    const power = 0.95 + 0.02 * floor + (b.final ? 0.05 : 0);
    return { mon, L, power, final: !!b.final };
  };
  E.dungeonFight = function (S, d, now) {
    now = now || E.now();
    const st = E.dungeonState(S, d);
    if (!st.unlocked) return { ok: false, msg: "Dieser Dungeon ist noch versiegelt." };
    if (st.done) return { ok: false, msg: "Diesen Dungeon hast du bereits gesäubert." };
    if (E.busy(S, now)) return { ok: false, msg: "Du bist gerade beschäftigt." };
    if (S.dungeons.next > now) return { ok: false, msg: "Du musst erst wieder zu Kräften kommen." };
    const b = E.bossFor(d, st.cleared);
    const hero = E.heroFighter(S, now);
    const foe = E.monsterFighter(b.mon, b.L, b.power, { boss: true, final: b.final });
    const result = E.simulate(hero, foe, U.hash(S.name + b.mon.id + now));
    return { ok: true, fight: { hero, foe, result, dungeon: d, floor: st.cleared, boss: b } };
  };
  E.resolveDungeon = function (S, fight, now) {
    now = now || E.now();
    const won = fight.result.winner === 0;
    const b = fight.boss;
    const rew = { won, xp: 0, gold: 0, item: null, perlen: 0, itemSold: 0 };
    S.dungeons.next = now + E.C.DUNGEON_CD;
    if (won) {
      const D0 = D.DUNGEONS[fight.dungeon];
      S.dungeons.progress[D0.id] = (S.dungeons.progress[D0.id] || 0) + 1;
      rew.xp = Math.round(E.xpNeed(Math.min(S.level, b.L)) * (b.final ? 0.6 : 0.32) * E.bestiaryBonus(S));
      rew.gold = Math.round(E.goldBase(b.L) * (b.final ? 8 : 3));
      const r = U.rng(U.hash(b.mon.id + now));
      const item = E.makeItem(r, { level: b.L, cls: S.cls, minRarity: b.final ? "episch" : "selten", boost: b.final ? 2 : 0.6 });
      if (E.addItem(S, item)) rew.item = item;
      else {
        rew.itemSold = Math.round(item.value * 0.25);
        E.gainGold(S, rew.itemSold);
      }
      if (b.final) {
        rew.perlen = 3;
        S.perlen += 3;
        E.grantAch(S, "dungeon1");
      }
      E.gainGold(S, rew.gold);
      E.gainXp(S, rew.xp);
      S.stats.bosses++;
      S.stats.wins++;
      S.bestiary[b.mon.id] = (S.bestiary[b.mon.id] || 0) + 1;
      E.grantAch(S, "boss1");
    } else S.stats.losses++;
    E.checkAch(S, now);
    return rew;
  };
  E.skipDungeon = function (S, now) {
    now = now || E.now();
    if (S.dungeons.next <= now) return { ok: false };
    if (S.perlen < 1) return { ok: false, msg: "Dafür brauchst du eine Wolkenperle." };
    S.perlen -= 1;
    S.dungeons.next = now;
    return { ok: true };
  };

  /* ---------------- Laeden ---------------- */
  const SHOP_SLOTS = {
    schmiede: ["waffe", "helm", "ruestung", "handschuhe", "stiefel", "nebenhand"],
    arkanum: ["umhang", "amulett", "ring", "talisman", null, null],
  };
  E.refreshShop = function (S, shop, auto) {
    const r = U.rng(U.hash(S.name + shop + E.now() + Math.random()));
    const items = SHOP_SLOTS[shop].map((slot) => {
      const sl = slot || U.pick(r, ["umhang", "amulett", "ring", "talisman", "handschuhe", "stiefel", "helm"]);
      return E.makeItem(r, { level: S.level + U.ri(r, 0, 1), cls: S.cls, slot: sl, boost: 0.15 });
    });
    S.shops[shop] = { items, ts: E.now() };
    if (!auto) SB.bus.emit("shop", { shop });
  };
  E.rerollShop = function (S, shop) {
    if (S.perlen < 1) return { ok: false, msg: "Neue Ware kostet eine Wolkenperle." };
    S.perlen -= 1;
    E.refreshShop(S, shop);
    return { ok: true };
  };
  E.buyItem = function (S, shop, idx) {
    const sh = S.shops[shop];
    const it = sh && sh.items[idx];
    if (!it) return { ok: false, msg: "Schon verkauft." };
    if (S.gold < it.value) return { ok: false, msg: "Dafür reicht dein Gold nicht." };
    if (S.inv.length >= E.C.INV_SIZE) return { ok: false, msg: "Dein Rucksack ist voll." };
    S.gold -= it.value;
    E.addItem(S, it);
    sh.items[idx] = null;
    return { ok: true, item: it };
  };
  E.sellPrice = (it) => Math.max(1, Math.round(it.value * 0.25));
  E.sellItem = function (S, invIdx) {
    const it = S.inv[invIdx];
    if (!it) return { ok: false };
    S.inv.splice(invIdx, 1);
    const p = E.sellPrice(it);
    E.gainGold(S, p);
    return { ok: true, gold: p };
  };
  E.canEquip = function (S, it) {
    if (!it) return false;
    if (it.cls && it.cls !== S.cls) return false;
    return true;
  };
  E.equip = function (S, invIdx) {
    const it = S.inv[invIdx];
    if (!E.canEquip(S, it)) return { ok: false, msg: "Das kann deine Klasse nicht benutzen." };
    const old = S.equip[it.slot];
    S.equip[it.slot] = it;
    S.inv.splice(invIdx, 1);
    if (old) S.inv.splice(invIdx, 0, old);
    return { ok: true };
  };
  E.unequip = function (S, slot) {
    const it = S.equip[slot];
    if (!it) return { ok: false };
    if (S.inv.length >= E.C.INV_SIZE) return { ok: false, msg: "Dein Rucksack ist voll." };
    S.equip[slot] = null;
    S.inv.push(it);
    return { ok: true };
  };

  E.buyAttr = function (S, attr, times) {
    times = times || 1;
    let n = 0;
    while (n < times) {
      const c = E.attrCost(S.bought[attr]);
      if (S.gold < c) break;
      S.gold -= c;
      S.bought[attr]++;
      n++;
    }
    return { ok: n > 0, n, msg: n ? null : "Nicht genug Gold." };
  };

  E.potionCost = function (S, P) {
    if (P.cost.perlen) return { perlen: P.cost.perlen };
    return { gold: Math.round(E.goldBase(S.level) * P.cost.goldMult) };
  };
  E.buyPotion = function (S, id, now) {
    now = now || E.now();
    const P = D.POTIONS.find((p) => p.id === id);
    const c = E.potionCost(S, P);
    if (c.gold && S.gold < c.gold) return { ok: false, msg: "Dafür reicht dein Gold nicht." };
    if (c.perlen && S.perlen < c.perlen) return { ok: false, msg: "Dafür fehlen dir Wolkenperlen." };
    if (c.gold) S.gold -= c.gold;
    if (c.perlen) S.perlen -= c.perlen;
    E.applyPotion(S, id, now);
    return { ok: true };
  };
  E.applyPotion = function (S, id, now) {
    const P = D.POTIONS.find((p) => p.id === id);
    const ex = S.buffs.find((b) => b.id === id && b.until > now);
    if (ex) ex.until += P.mins * 60000;
    else S.buffs.push({ id, until: now + P.mins * 60000 });
  };

  E.buyMount = function (S, id) {
    const M = D.MOUNTS.find((m) => m.id === id);
    if (!M || S.mounts.owned.indexOf(id) >= 0) return { ok: false };
    if (M.cost.gold && S.gold < M.cost.gold) return { ok: false, msg: "Dafür reicht dein Gold nicht." };
    if (M.cost.perlen && S.perlen < M.cost.perlen) return { ok: false, msg: "Dafür fehlen dir Wolkenperlen." };
    if (M.cost.gold) S.gold -= M.cost.gold;
    if (M.cost.perlen) S.perlen -= M.cost.perlen;
    S.mounts.owned.push(id);
    E.grantAch(S, "reittier");
    return { ok: true };
  };

  /* ---------------- Wunschbrunnen ---------------- */
  E.tossWell = function (S, now) {
    now = now || E.now();
    let paid = false;
    if (S.daily.wellFree > 0) S.daily.wellFree--;
    else {
      if (S.daily.wellPaid >= E.C.WELL_PAID_MAX) return { ok: false, msg: "Der Brunnen ist für heute erschöpft." };
      if (S.perlen < 1) return { ok: false, msg: "Ein weiterer Wurf kostet eine Wolkenperle." };
      S.perlen -= 1;
      S.daily.wellPaid++;
      paid = true;
    }
    const r = U.rng(U.hash(S.name + "well" + now));
    const prize = U.wpick(r, D.WELL_PRIZES);
    const out = { ok: true, prize: prize.id, label: prize.label, paid };
    switch (prize.id) {
      case "gold":
        out.gold = Math.round(E.goldBase(S.level) * U.rf(r, 2, 4));
        E.gainGold(S, out.gold);
        break;
      case "goldGross":
        out.gold = Math.round(E.goldBase(S.level) * U.rf(r, 8, 12));
        E.gainGold(S, out.gold);
        break;
      case "perle":
        out.perlen = 1;
        S.perlen += 1;
        break;
      case "perlen3":
        out.perlen = 3;
        S.perlen += 3;
        break;
      case "tatendrang":
        out.energy = 30;
        E.setEnergy(S, E.energy(S, now) + 30, now);
        break;
      case "xp":
        out.xp = Math.round(E.xpNeed(S.level) * 0.1);
        E.gainXp(S, out.xp);
        break;
      case "item": {
        const it = E.makeItem(r, { level: S.level + 1, cls: S.cls, minRarity: "ungewoehnlich", boost: 0.8 });
        if (E.addItem(S, it)) out.item = it;
        else {
          out.gold = Math.round(it.value * 0.25);
          E.gainGold(S, out.gold);
          out.itemSold = true;
        }
        break;
      }
      case "trank":
        E.applyPotion(S, "sternenstaub", now);
        break;
    }
    return out;
  };

  /* ---------------- Ehrenabzeichen ---------------- */
  E.grantAch = function (S, id) {
    if (S.ach[id]) return false;
    const A = D.ACHIEVEMENTS.find((a) => a.id === id);
    if (!A) return false;
    S.ach[id] = E.now();
    S.perlen += A.perlen;
    SB.bus.emit("achievement", A);
    return true;
  };
  E.checkAch = function (S, now) {
    if (S.stats.quests >= 10) E.grantAch(S, "quest10");
    if (S.stats.quests >= 50) E.grantAch(S, "quest50");
    if (S.stats.quests >= 150) E.grantAch(S, "quest150");
    if (S.level >= 10) E.grantAch(S, "stufe10");
    if (S.level >= 25) E.grantAch(S, "stufe25");
    if (S.level >= 40) E.grantAch(S, "stufe40");
    if (S.stats.arenaWins >= 10) E.grantAch(S, "arena10");
    if (Object.keys(S.bestiary).length >= 12) E.grantAch(S, "bestiarium12");
    if (now !== undefined) {
      const all = E.allHeroes(S, now, SB.remoteHeroes || null);
      const me = all.find((h) => h.kind === "me");
      if (me && me.rank <= 10) E.grantAch(S, "arenaTop10");
    }
  };

  E.TIERS = TIERS;
})();

</script>
