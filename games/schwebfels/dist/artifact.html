      return svg(`<path d="M10 58 C6 34 16 12 32 12 C48 12 58 34 54 58 Z" fill="${c}" ${st()}/><path d="M22 30 L28 34 M42 30 L36 34" stroke="#ffcf5a" stroke-width="3" stroke-linecap="round"/><path d="M22 46 L26 42 L30 46 L34 42 L38 46 L42 42" fill="none" stroke="#e8dcc0" stroke-width="2.4"/>`);
    return svg(`<circle cx="32" cy="20" r="11" fill="#d9b494" ${st()}/><path d="M10 62 C10 40 20 32 32 32 C44 32 54 40 54 62 Z" fill="${c}" ${st()}/><path d="M14 36 C10 34 8 30 10 26 C16 30 20 32 22 34 Z M50 36 C54 34 56 30 54 26 C48 30 44 32 42 34 Z" fill="${shade(c, 1.3)}" ${st(1.2)}/>`);
  };
})();

</script>
<script>/* src/audio.js */
/* Helden von Schwebfels - Klangeffekte und Musik, live mit WebAudio erzeugt (keine fremden Aufnahmen).
   Musik je Ort: Insel bei Tag und bei Nacht, Taverne, Kampf, Tiefe (Dungeon), Heim, Chronik. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const A = (SB.audio = { enabled: true, musicOn: true, ctx: null, context: null });
  let master = null;
  let sfxBus = null;
  let musicBus = null;
  let reverb = null;
  let noiseBuf = null;

  function impulse(c, seconds, decay) {
    const len = Math.floor(c.sampleRate * seconds);
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  A.unlock = function () {
    if (A.ctx) {
      if (A.ctx.state === "suspended") A.ctx.resume().catch(() => {});
      return;
    }
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const c = (A.ctx = new Ctx());
      master = c.createGain();
      master.gain.value = 0.36;
      master.connect(c.destination);
      sfxBus = c.createGain();
      sfxBus.gain.value = 1;
      sfxBus.connect(master);
      musicBus = c.createGain();
      musicBus.gain.value = 0;
      reverb = c.createConvolver();
      reverb.buffer = impulse(c, 3.2, 2.6);
      const wet = c.createGain();
      wet.gain.value = 0.45;
      musicBus.connect(master);
      musicBus.connect(reverb);
      reverb.connect(wet);
      wet.connect(master);
      const len = c.sampleRate * 1.0;
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      startScheduler();
      if (A.context) A.music(A.context, true);
    } catch (e) {
      A.ctx = null;
    }
  };

  /* ---------- Bausteine ---------- */
  const hz = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function tone(freq, dur, type, vol, delay, glideTo, out, at) {
    const c = A.ctx;
    const t = at != null ? at : c.currentTime + (delay || 0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(out || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, filterType, freq, delay, freqTo, out, at, q) {
    const c = A.ctx;
    const t = at != null ? at : c.currentTime + (delay || 0);
    const s = c.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = dur > 0.9;
    const f = c.createBiquadFilter();
    f.type = filterType || "lowpass";
    f.frequency.setValueAtTime(freq || 1200, t);
    if (q) f.Q.value = q;
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f);
    f.connect(g);
    g.connect(out || sfxBus);
    s.start(t);
    s.stop(t + dur + 0.05);
  }

  /* ---------- Klangeffekte ---------- */
  const FX = {
    click: () => tone(880, 0.05, "triangle", 0.2),
    page: () => noise(0.18, 0.25, "bandpass", 2400, 0, 900),
    door: () => {
      tone(110, 0.3, "triangle", 0.35, 0, 80);
      noise(0.25, 0.25, "lowpass", 600);
    },
    coin: () => {
      tone(1320, 0.08, "triangle", 0.3);
      tone(1760, 0.2, "triangle", 0.3, 0.07);
    },
    hit: () => {
      noise(0.14, 0.6, "lowpass", 1400);
      tone(140, 0.12, "sine", 0.6, 0, 70);
    },
    crit: () => {
      noise(0.25, 0.8, "lowpass", 2400);
      tone(110, 0.25, "square", 0.3, 0, 50);
      tone(1500, 0.2, "triangle", 0.25, 0.03);
    },
    block: () => {
      tone(620, 0.14, "square", 0.2);
      tone(930, 0.2, "square", 0.15, 0.01);
      noise(0.08, 0.3, "highpass", 3000);
    },
    evade: () => noise(0.25, 0.35, "bandpass", 500, 0, 2600),
    swing: () => noise(0.18, 0.35, "bandpass", 1100, 0, 280),
    bow: () => {
      tone(320, 0.16, "triangle", 0.35, 0, 140);
      noise(0.2, 0.2, "bandpass", 3000, 0.05, 900);
    },
    spell: () => {
      tone(420, 0.4, "sine", 0.3, 0, 1300);
      tone(630, 0.4, "sine", 0.18, 0.05, 1700);
      noise(0.4, 0.15, "bandpass", 3000, 0, 6000);
    },
    special: () => {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, "sawtooth", 0.12, i * 0.06));
      noise(0.5, 0.2, "bandpass", 800, 0, 3000);
    },
    heal: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.5, "sine", 0.2, i * 0.07)),
    poison: () => {
      noise(0.3, 0.25, "bandpass", 400, 0, 1200, null, null, 6);
      tone(220, 0.3, "triangle", 0.15, 0.05, 160);
    },
    roar: () => {
      noise(0.7, 0.5, "lowpass", 500, 0, 150);
      tone(90, 0.7, "sawtooth", 0.25, 0, 55);
    },
    ko: () => {
      tone(200, 0.6, "sine", 0.5, 0, 45);
      noise(0.4, 0.3, "lowpass", 400);
    },
    levelup: () => {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.4, "triangle", 0.3, i * 0.09));
      noise(0.6, 0.1, "highpass", 6000, 0.3);
    },
    victory: () => {
      [392, 523, 659].forEach((f, i) => tone(f, 0.2, "square", 0.13, i * 0.12));
      tone(784, 0.7, "square", 0.15, 0.36);
      tone(392, 0.7, "triangle", 0.2, 0.36);
    },
    defeat: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, "triangle", 0.28, i * 0.18)),
    well: () => {
      tone(1568, 0.4, "sine", 0.22);
      tone(2093, 0.6, "sine", 0.18, 0.12);
      noise(0.35, 0.2, "bandpass", 1800, 0.35);
      tone(523, 0.9, "sine", 0.12, 0.4, 1046);
    },
    buy: () => {
      tone(988, 0.07, "triangle", 0.28);
      tone(1319, 0.16, "triangle", 0.28, 0.06);
    },
    anvil: () => {
      tone(1800, 0.5, "square", 0.08);
      tone(2700, 0.4, "sine", 0.12);
      noise(0.1, 0.4, "highpass", 2000);
    },
    horn: () => {
      tone(147, 1.2, "sawtooth", 0.18, 0, 150);
      tone(220, 1.0, "sawtooth", 0.12, 0.25);
    },
    chime: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.8, "sine", 0.14, i * 0.11)),
    quest: () => {
      tone(392, 0.25, "triangle", 0.25);
      tone(587, 0.4, "triangle", 0.25, 0.15);
    },
  };

  A.play = function (name) {
    if (!A.enabled || !A.ctx || !FX[name]) return;
    try {
      FX[name]();
    } catch (e) {
      /* Ton ist optional */
    }
  };

  /* ---------- Musik ---------- */
  function pluck(n, t, dur, vol) {
    const c = A.ctx;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(700, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    for (const [type, det] of [["triangle", 0], ["sawtooth", 4]]) {
      const o = c.createOscillator();
      o.type = type;
      o.frequency.value = hz(n);
      o.detune.value = det;
      const og = c.createGain();
      og.gain.value = type === "sawtooth" ? 0.25 : 1;
      o.connect(og);
      og.connect(f);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    f.connect(g);
    g.connect(musicBus);
  }
  function pad(notes, t, dur, vol, bright) {
    const c = A.ctx;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = bright || 900;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.linearRampToValueAtTime(vol * 0.8, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    for (const n of notes)
      for (const det of [-7, 7]) {
        const o = c.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = hz(n);
        o.detune.value = det;
        o.connect(f);
        o.start(t);
        o.stop(t + dur + 0.1);
      }
    f.connect(g);
    g.connect(musicBus);
  }
  function bell(n, t, vol) {
    for (const [m, v, d] of [[1, 1, 2.2], [2.76, 0.4, 1.2], [5.4, 0.15, 0.6]]) tone(hz(n) * m, d, "sine", vol * v, 0, null, musicBus, t);
  }
  function flute(n, t, dur, vol) {
    const c = A.ctx;
    const o = c.createOscillator();
    o.type = "sine";
    o.frequency.value = hz(n);
    const lfo = c.createOscillator();
    lfo.frequency.value = 5;
    const lg = c.createGain();
    lg.gain.value = 4;
    lfo.connect(lg);
    lg.connect(o.detune);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.08);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(musicBus);
    o.start(t);
    lfo.start(t);
    o.stop(t + dur + 0.05);
    lfo.stop(t + dur + 0.05);
  }
  function bass(n, t, dur, vol) {
    const c = A.ctx;
    const o = c.createOscillator();
    o.type = "square";
    o.frequency.value = hz(n);
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 380;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f);
    f.connect(g);
    g.connect(musicBus);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function drum(kind, t, vol) {
    if (kind === "kick") tone(130, 0.25, "sine", vol, 0, 42, musicBus, t);
    else if (kind === "tom") tone(190, 0.3, "sine", vol, 0, 90, musicBus, t);
    else if (kind === "frame") noise(0.18, vol, "bandpass", 220, 0, 120, musicBus, t, 2);
    else if (kind === "hat") noise(0.05, vol, "highpass", 7000, 0, null, musicBus, t);
    else if (kind === "boom") {
      tone(60, 2.2, "sine", vol, 0, 30, musicBus, t);
      noise(1.5, vol * 0.4, "lowpass", 200, 0, 60, musicBus, t);
    }
  }

  // Tonleitern und Akkorde als MIDI-Noten
  const SONGS = {
    tag: {
      bpm: 80, beats: 4,
      chords: [[50, 53, 57], [48, 52, 55], [46, 50, 53], [48, 52, 55]],
      scale: [62, 64, 65, 67, 69, 71, 72, 74, 76],
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        pad(ch.map((n) => n + 12), t, sp * 4.1, 0.035, 1100);
        bass(ch[0] - 12, t, sp * 3.5, 0.12);
        const arp = [0, 1, 2, 1, 0, 2, 1, 2];
        arp.forEach((k, i) => pluck(ch[k] + (i > 3 ? 24 : 12), t + i * sp * 0.5, sp * 1.2, 0.06));
        if (b % 2 === 1 || r() < 0.4) {
          let idx = Math.floor(r() * 5) + 2;
          for (let i = 0; i < 3; i++) {
            if (r() < 0.25) continue;
            idx = Math.max(0, Math.min(this.scale.length - 1, idx + Math.floor(r() * 3) - 1));
            flute(this.scale[idx] + 12, t + i * sp * 1.25, sp * 1.2, 0.045);
          }
        }
      },
    },
    nacht: {
      bpm: 56, beats: 4,
      chords: [[45, 52, 57], [41, 48, 53], [43, 50, 55], [40, 47, 52]],
      scale: [69, 72, 74, 76, 79, 81, 84],
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        pad(ch.map((n) => n + 12), t, sp * 4.2, 0.04, 700);
        bass(ch[0] - 12, t, sp * 4, 0.08);
        for (let i = 0; i < 4; i++) if (r() < 0.45) bell(this.scale[Math.floor(r() * this.scale.length)], t + i * sp + (r() < 0.5 ? sp * 0.5 : 0), 0.05);
      },
    },
    taverne: {
      bpm: 128, beats: 6,
      chords: [[55, 59, 62], [48, 52, 55], [50, 54, 57], [55, 59, 62]],
      scale: [67, 69, 71, 72, 74, 76, 78, 79],
      pos: 3,
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        bass(ch[0] - 12, t, sp * 1.5, 0.14);
        bass(ch[2] - 12, t + sp * 3, sp * 1.5, 0.12);
        for (const k of [1, 2, 4, 5]) pluck(ch[k % 3] + 12, t + k * sp, sp * 0.8, 0.045);
        drum("frame", t, 0.35);
        drum("frame", t + sp * 3, 0.28);
        drum("hat", t + sp * 2, 0.05);
        drum("hat", t + sp * 5, 0.05);
        for (let i = 0; i < 6; i++) {
          if (r() < 0.15) continue;
          this.pos = Math.max(0, Math.min(this.scale.length - 1, this.pos + Math.floor(r() * 3) - 1));
          pluck(this.scale[this.pos] + 12, t + i * sp, sp * 0.9, 0.05);
        }
      },
    },
    kampf: {
      bpm: 138, beats: 4,
      chords: [[40, 47, 52], [36, 43, 48], [38, 45, 50], [35, 42, 47]],
      riff: [0, 0, 3, 0, 5, 3, 2, 0],
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        this.riff.forEach((k, i) => bass(ch[0] + k, t + i * sp * 0.5, sp * 0.45, 0.13));
        drum("kick", t, 0.5);
        drum("kick", t + sp * 2, 0.5);
        drum("frame", t + sp, 0.3);
        drum("frame", t + sp * 3, 0.3);
        for (let i = 0; i < 8; i++) drum("hat", t + i * sp * 0.5, 0.04);
        if (b % 4 === 3) for (let i = 0; i < 4; i++) drum("tom", t + sp * 2 + i * sp * 0.5, 0.3);
        pad(ch.map((n) => n + 24), t, sp * 0.9, 0.05, 1600);
        if (b % 2 === 0) pad(ch.map((n) => n + 24), t + sp * 2.5, sp * 0.6, 0.04, 1600);
      },
    },
    tiefe: {
      bpm: 48, beats: 4,
      bar(b, t, sp, r) {
        pad([38, 45], t, sp * 4.2, 0.05, 260);
        if (b % 4 === 0) drum("boom", t, 0.35);
        if (r() < 0.6) {
          const n = [62, 63, 65, 68, 70][Math.floor(r() * 5)];
          bell(n, t + sp * (1 + Math.floor(r() * 3)), 0.035);
          if (r() < 0.4) bell(n + 1, t + sp * 3.2, 0.025);
        }
        noise(sp * 3, 0.02, "bandpass", 300, 0, 900, musicBus, t + sp, 3);
      },
    },
    heim: {
      bpm: 70, beats: 4,
      chords: [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]],
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        pad(ch.map((n) => n + 12), t, sp * 4.1, 0.03, 900);
        [0, 1, 2, 1].forEach((k, i) => pluck(ch[k] + 12, t + i * sp, sp * 1.6, 0.055));
        if (r() < 0.6) pluck(ch[Math.floor(r() * 3)] + 24, t + sp * 2.5, sp * 1.5, 0.04);
        for (let i = 0; i < 6; i++) if (r() < 0.5) noise(0.02, 0.03, "highpass", 3000, 0, null, musicBus, t + r() * sp * 4);
      },
    },
    chronik: {
      bpm: 60, beats: 4,
      chords: [[50, 57, 62], [46, 53, 58], [43, 50, 55], [45, 52, 57]],
      scale: [62, 65, 67, 69, 72, 74],
      bar(b, t, sp, r) {
        const ch = this.chords[b % 4];
        pad(ch, t, sp * 4.2, 0.045, 800);
        flute(this.scale[Math.floor(r() * this.scale.length)] + 12, t + sp, sp * 2.5, 0.04);
        if (r() < 0.5) bell(ch[2] + 12, t + sp * 3, 0.04);
      },
    },
  };
  A.SONGS = Object.keys(SONGS);

  let sched = null;
  let cur = null;
  let nextBar = 0;
  let barNo = 0;
  let rnd = Math.random;
  function startScheduler() {
    if (sched) return;
    sched = setInterval(() => {
      if (!A.ctx || !cur || !A.musicOn) return;
      const c = A.ctx;
      const song = SONGS[cur];
      const sp = 60 / song.bpm;
      while (nextBar < c.currentTime + 0.4) {
        if (nextBar < c.currentTime) nextBar = c.currentTime + 0.05;
        try {
          song.bar(barNo, nextBar, sp, rnd);
        } catch (e) {
          /* Musik ist optional */
        }
        barNo++;
        nextBar += sp * song.beats;
      }
    }, 120);
  }
  // Ort wechseln: blendet sanft ueber
  A.music = function (context, force) {
    if (context === A.context && !force && cur) return;
    A.context = context;
    if (!A.ctx || !musicBus) return;
    const c = A.ctx;
    const g = musicBus.gain;
    g.cancelScheduledValues(c.currentTime);
    g.setValueAtTime(g.value, c.currentTime);
    g.linearRampToValueAtTime(0.0001, c.currentTime + 0.6);
    setTimeout(() => {
      cur = A.musicOn && SONGS[context] ? context : null;
      barNo = 0;
      nextBar = c.currentTime + 0.1;
      if (cur) {
        g.cancelScheduledValues(c.currentTime);
        g.setValueAtTime(0.0001, c.currentTime);
        g.linearRampToValueAtTime(cur === "kampf" ? 0.75 : 0.85, c.currentTime + 1.5);
      }
    }, 650);
  };
  A.setMusic = function (on) {
    A.musicOn = !!on;
    if (!on) {
      cur = null;
      if (musicBus && A.ctx) musicBus.gain.setTargetAtTime(0.0001, A.ctx.currentTime, 0.2);
    } else if (A.context) A.music(A.context, true);
  };
  A.setSfx = function (on) {
    A.enabled = !!on;
  };
})();

</script>
<script>/* src/store.js */
/* Helden von Schwebfels - Speichern.
   Immer lokal im Browser; in claude.ai zusaetzlich im privaten Bereich des Kontos,
   plus ein oeffentliches Heldenprofil, damit sich Mitspieler in der Arena begegnen. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const KEY = "schwebfels:save:v1";
  const St = (SB.store = { cloud: false, uid: null });
  let db = null;
  let cloudTimer = 0;
  let heroTimer = 0;
  let lastHeroJson = "";
  let unsub = null;

  St.loadLocal = function () {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  };
  St.saveLocal = function (S) {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      return true;
    } catch (e) {
      return false;
    }
  };
  St.clearLocal = function () {
    try {
      localStorage.removeItem(KEY);
    } catch (e) {
      /* nichts zu tun */
    }
  };

  St.save = function (S) {
    S.savedAt = Date.now();
    St.saveLocal(S);
    if (db && St.uid) {
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(() => St.saveCloud(S), 6000);
      clearTimeout(heroTimer);
      heroTimer = setTimeout(() => St.publishHero(S), 9000);
    }
  };
  St.flush = function (S) {
    if (db && St.uid) {
      clearTimeout(cloudTimer);
      St.saveCloud(S);
    }
  };

  St.saveCloud = async function (S) {
    if (!db || !St.uid) return;
    try {
      const json = JSON.stringify(S);
      if (json.length > 240000) return;
      await db.doc("data/users/" + St.uid + "/save").set({ v: 1, json, updatedAt: S.savedAt || Date.now() });
    } catch (e) {
      console.warn("Cloud-Speicherung fehlgeschlagen", e && e.code);
    }
  };

  /* Oeffentliches Profil: nur Spielwerte, keine Kontodaten */
  St.publishHero = async function (S, force) {
    if (!db || !St.uid) return;
    const f = SB.engine.heroFighter(S);
    const pub = {
      v: 2,
      name: S.name,
      race: S.race,
      realm: S.realm,
      cls: S.cls,
      guild: S.guild ? { id: S.guild.id, name: S.guild.name, tag: S.guild.tag } : null,
      gender: S.gender,
      look: S.look,
      level: S.level,
      honor: S.honor,
      gear: f.gear,
      attrs: f.attrs,
      wMin: f.wMin,
      wMax: f.wMax,
      armor: f.armor,
      shield: !!(S.equip.nebenhand && S.equip.nebenhand.base === "schild"),
      updatedAt: Date.now(),
    };
    const json = JSON.stringify(Object.assign({}, pub, { updatedAt: 0 }));
    if (json === lastHeroJson && !force) return;
    try {
      await db.doc("heroes/" + St.uid).set(pub);
      lastHeroJson = json;
    } catch (e) {
      console.warn("Heldenprofil nicht veroeffentlicht", e && e.code);
    }
  };

  /* Fremde Daten pruefen, bevor sie ins Spiel gelangen */
  const HEX = /^#[0-9a-fA-F]{6}$/;
  const num = (v, a, b) => (typeof v === "number" && isFinite(v) ? Math.max(a, Math.min(b, v)) : a);
  const OLD_RACE = { wolkling: "albier", steinbart: "kreidezwerg", hornvolk: "trollblut", nebelalb: "sidhe", moosling: "moorling" };
  const OLD_ARCH = { klinge: "krieger", wind: "jaeger", rune: "magier" };
  const cleanText = (v, n) => String(v || "").replace(/[^\p{L}\p{N} '\-]/gu, "").slice(0, n).trim();
  St.sanitizeGuild = function (g) {
    if (!g || typeof g !== "object") return null;
    const id = String(g.id || "");
    if (!/^[pg]-[\w-]{2,80}$/.test(id)) return null;
    const name = cleanText(g.name, 24);
    const tag = cleanText(g.tag, 4).toUpperCase();
    if (name.length < 3 || tag.length < 2) return null;
    return { id, name, tag, realm: D.REALMS[g.realm] ? g.realm : null };
  };
  St.sanitizeHero = function (id, h) {
    if (!h || typeof h !== "object") return null;
    if (!D.RACES[h.race] && OLD_RACE[h.race]) h = Object.assign({}, h, { race: OLD_RACE[h.race] });
    if (!D.RACES[h.race]) return null;
    if (!D.CLASSES[h.cls] && OLD_ARCH[h.cls]) h = Object.assign({}, h, { cls: SB.engine.CLASS_FOR[D.RACES[h.race].realm][OLD_ARCH[h.cls]] });
    if (!D.CLASSES[h.cls]) return null;
    const name = cleanText(h.name, 18);
    if (name.length < 2) return null;
    const look = h.look || {};
    const gear = {};
    for (const s of ["helm", "ruestung", "umhang", "handschuhe", "stiefel", "waffe", "nebenhand"]) {
      const g = h.gear && h.gear[s];
      if (g && D.BASES[g.base] && (!g.tint || HEX.test(g.tint)) && (!g.rarity || D.RARITIES[g.rarity])) gear[s] = { base: g.base, tint: g.tint || "#9aa4ad", rarity: g.rarity || "gewoehnlich", style: num(g.style, 0, 2) | 0 };
      else gear[s] = null;
    }
    const attrs = {};
    for (const a of D.ATTRS) attrs[a] = Math.round(num(h.attrs && h.attrs[a], 1, 1e6));
    const level = Math.round(num(h.level, 1, 300));
    const wMin = Math.round(num(h.wMin, 1, 1e6));
    const hero = {
      id: "u:" + id,
      kind: "real",
      name,
      race: h.race,
      realm: D.CLASSES[h.cls].realm,
      cls: h.cls,
      gender: h.gender === "w" ? "w" : "m",
      guild: h.guild ? St.sanitizeGuild(Object.assign({ realm: D.CLASSES[h.cls].realm }, h.guild)) : null,
      look: {
        skin: HEX.test(look.skin) ? look.skin : D.RACES[h.race].skins[0],
        hair: HEX.test(look.hair) ? look.hair : D.RACES[h.race].hairs[0],
        eyes: HEX.test(look.eyes) ? look.eyes : "#3a2a1e",
        hairStyle: num(look.hairStyle, 0, D.HAIR_STYLES.length - 1) | 0,
        beard: num(look.beard, 0, D.BEARDS.length - 1) | 0,
        tattoo: D.TATTOOS.find((t) => t.id === look.tattoo) ? look.tattoo : "keine",
        tattooColor: HEX.test(look.tattooColor) ? look.tattooColor : "#2f5fd0",
        scar: D.SCARS.find((t) => t.id === look.scar) ? look.scar : "keine",
        horns: num(look.horns, 0, 2) | 0,
      },
      level,
      honor: Math.round(num(h.honor, 0, 1e7)),
      gear,
    };
    hero.fighter = SB.engine.remoteFighter(hero, { attrs, wMin, wMax: Math.max(wMin + 1, Math.round(num(h.wMax, 2, 1e6))), armor: Math.round(num(h.armor, 0, 1e7)), shield: !!h.shield });
    return hero;
  };

  St.initCloud = async function (onLoaded) {
    const claude = globalThis.claude;
    if (!claude || typeof claude.use !== "function") return;
    try {
      const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!dbNs || !user) return;
      const uid = await user.id();
      if (!uid) return;
      db = dbNs;
      St.uid = uid;
      St.cloud = true;
      const snap = await db.doc("data/users/" + uid + "/save").get();
      let cloudState = null;
      if (snap.exists) {
        try {
          cloudState = JSON.parse(snap.data().json);
        } catch (e) {
          cloudState = null;
        }
      }
      onLoaded(cloudState);
      unsub = db
        .collection("heroes")
        .orderBy("honor", "desc")
        .limit(150)
        .onSnapshot(
          (qs) => {
            const list = [];
            for (const d of qs.docs) {
              if (d.id === uid) continue;
              const h = St.sanitizeHero(d.id, d.data());
              if (h) list.push(h);
            }
            SB.remoteHeroes = list;
            SB.bus.emit("remote", list);
          },
          () => {
            SB.remoteHeroes = null;
          }
        );
      db.collection("guilds")
        .limit(200)
        .onSnapshot(
          (qs) => {
            const list = [];
            for (const d of qs.docs) {
              const g = St.sanitizeGuild(d.data());
              if (g && g.realm && g.id === "p-" + d.id) list.push(Object.assign({ kind: "real" }, g));
            }
            SB.remoteGuilds = list;
            SB.bus.emit("remote", list);
          },
          () => {
            SB.remoteGuilds = null;
          }
        );
    } catch (e) {
      console.warn("Cloud nicht verfuegbar", e && e.code);
    }
  };

  /* Gilden echter Spieler: der Gruender veroeffentlicht sie unter seiner Kennung */
  St.publishGuild = async function (S) {
    if (!db || !St.uid || !S.guild || !S.guild.founder) return;
    try {
      await db.doc("guilds/" + St.uid).set({ id: "p-" + St.uid, name: S.guild.name, tag: S.guild.tag, realm: S.guild.realm, updatedAt: Date.now() });
    } catch (e) {
      console.warn("Gilde nicht veroeffentlicht", e && e.code);
    }
  };
  St.removeGuild = async function () {
    if (!db || !St.uid) return;
    try {
      await db.doc("guilds/" + St.uid).delete();
    } catch (e) {
      console.warn("Gilde nicht entfernt", e && e.code);
    }
  };

  /* Spielstand als Text sichern und laden */
  St.exportCode = function (S) {
    const json = JSON.stringify(S);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return "SBF1:" + b64;
  };
  St.importCode = function (code) {
    code = String(code || "").trim();
    if (!code.startsWith("SBF1:")) throw new Error("Das ist kein Spielstand-Code von Schwebfels.");
    const json = decodeURIComponent(escape(atob(code.slice(5))));
    const S = SB.engine.migrate(JSON.parse(json));
    if (!S) throw new Error("Der Spielstand ist beschädigt.");
    return S;
  };
})();

</script>
<script>/* src/r3d-models.js */
/* Helden von Schwebfels - 3D-Figuren (three.js, prozedural).
   Heroischer Stil: kraeftige Silhouetten, grosse Schulterstuecke und Haende, handgemalt wirkende Texturen.
   Alle Texturen werden zur Laufzeit auf Canvas gemalt, es werden keine fremden Grafiken geladen. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const R = (SB.R3D = SB.R3D || {});
  let T = null;

  R.ready = function () {
    T = globalThis.THREE || null;
    if (!T) return false;
    if (R._webgl === undefined) {
      try {
        const c = document.createElement("canvas");
        R._webgl = !!(c.getContext("webgl2") || c.getContext("webgl"));
      } catch (e) {
        R._webgl = false;
      }
    }
    return R._webgl;
  };
  R.T = () => T;

  /* ---------- kleine Helfer ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(s) {
    let h = 2166136261;
    s = String(s);
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  const PI = Math.PI;
  function canvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  }
  const shade = (hex, f) => {
    const c = new T.Color(hex);
    c.multiplyScalar(f);
    c.r = Math.min(1, c.r);
    c.g = Math.min(1, c.g);
    c.b = Math.min(1, c.b);
    return "#" + c.getHexString();
  };
  const mix = (a, b, t) => {
    const c = new T.Color(a);
    c.lerp(new T.Color(b), t);
    return "#" + c.getHexString();
  };
  R.shade = shade;
  R.mix = mix;

  /* ---------- Geometriecache ---------- */
  const G = {};
  const geo = (k, make) => G[k] || (G[k] = make());
  const sph = (r, w, h) => geo("s" + r + "|" + (w || 18) + "|" + (h || 14), () => new T.SphereGeometry(r, w || 18, h || 14));
  const cap = (r, th) => geo("cap" + r + "|" + th, () => new T.SphereGeometry(r, 18, 10, 0, PI * 2, 0, th));
  const box = (x, y, z) => geo("b" + x + "|" + y + "|" + z, () => new T.BoxGeometry(x, y, z));
  const cyl = (rt, rb, h, s, open) => geo("c" + rt + "|" + rb + "|" + h + "|" + (s || 14) + (open ? "o" : ""), () => new T.CylinderGeometry(rt, rb, h, s || 14, 1, !!open));
  const cone = (r, h, s) => geo("k" + r + "|" + h + "|" + (s || 12), () => new T.ConeGeometry(r, h, s || 12));
  const capsule = (r, l, s) => geo("p" + r + "|" + l + "|" + (s || 12), () => new T.CapsuleGeometry(r, l, 4, s || 12));
  const torus = (r, t, arc, rs, ts) => geo("t" + r + "|" + t + "|" + arc + "|" + (rs || 8) + "|" + (ts || 24), () => new T.TorusGeometry(r, t, rs || 8, ts || 24, arc || PI * 2));
  const octa = (r) => geo("o" + r, () => new T.OctahedronGeometry(r, 0));
  const ico = (r, d) => geo("i" + r + "|" + (d || 0), () => new T.IcosahedronGeometry(r, d || 0));
  const dodeca = (r) => geo("d" + r, () => new T.DodecahedronGeometry(r, 0));
  // Drehkoerper aus [radius, hoehe]-Paaren
  const lathe = (k, pts, segs) => geo("l" + k, () => new T.LatheGeometry(pts.map((p) => new T.Vector2(p[0], p[1])), segs || 20));
  // Flache Form, extrudiert und mittig in z
  function shapeOf(pts) {
    const s = new T.Shape();
    s.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      if (p[0] === "q") s.quadraticCurveTo(p[1], p[2], p[3], p[4]);
      else s.lineTo(p[0], p[1]);
    }
    s.closePath();
    return s;
  }
  const ext = (k, pts, depth, bev) =>
    geo("x" + k + "|" + depth + "|" + bev, () => {
      const g = new T.ExtrudeGeometry(shapeOf(pts), { depth, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bev, bevelSegments: 1, curveSegments: 8 });
      g.translate(0, 0, -depth / 2);
      g.computeVertexNormals();
      return g;
    });
  const tube = (k, pts, r, segs, rs) =>
    geo("u" + k + "|" + r, () => new T.TubeGeometry(new T.CatmullRomCurve3(pts.map((p) => new T.Vector3(p[0], p[1], p[2]))), segs || 24, r, rs || 6, false));
  R.geo = { sph, cap, box, cyl, cone, capsule, torus, octa, ico, dodeca, lathe, ext, tube, geo };

  /* ---------- Gemalte Texturen (Graustufen, werden mit der Materialfarbe multipliziert) ---------- */
  const TEX = {};
  function paintTex(kind) {
    if (TEX[kind]) return TEX[kind];
    const S = 128;
    const c = canvas(S, S);
    const g = c.getContext("2d");
    const r = rng(hash(kind));
    const gr = g.createLinearGradient(0, 0, 0, S);
    gr.addColorStop(0, "#ffffff");
    gr.addColorStop(0.55, "#e2e2e2");
    gr.addColorStop(1, "#a9a9a9");
    g.fillStyle = gr;
    g.fillRect(0, 0, S, S);
    const dab = (n, rmin, rmax, light, alpha) => {
      for (let i = 0; i < n; i++) {
        g.fillStyle = (r() < light ? "rgba(255,255,255," : "rgba(0,0,0,") + alpha * (0.4 + r() * 0.6) + ")";
        g.beginPath();
        g.ellipse(r() * S, r() * S, rmin + r() * (rmax - rmin), rmin + r() * (rmax - rmin) * 0.6, r() * PI, 0, PI * 2);
        g.fill();
      }
    };
    const strokes = (n, len, w, vertical, alpha, light) => {
      g.lineCap = "round";
      for (let i = 0; i < n; i++) {
        g.strokeStyle = (r() < (light || 0.4) ? "rgba(255,255,255," : "rgba(0,0,0,") + alpha * (0.4 + r() * 0.6) + ")";
        g.lineWidth = w * (0.5 + r());
        const x = r() * S;
        const y = r() * S;
        const l = len * (0.5 + r());
        const a = (vertical ? PI / 2 : 0) + (r() - 0.5) * 0.35;
        g.beginPath();
        g.moveTo(x, y);
        g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (r() - 0.5) * 6, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
        g.stroke();
      }
    };
    switch (kind) {
      case "metal":
        strokes(90, 60, 1.2, false, 0.1, 0.5);
        g.fillStyle = "rgba(255,255,255,0.35)";
        g.fillRect(0, S * 0.18, S, S * 0.07);
        g.fillStyle = "rgba(0,0,0,0.12)";
        g.fillRect(0, S * 0.72, S, S * 0.05);
        dab(30, 1, 3, 0.2, 0.15);
        break;
      case "leather":
        dab(260, 1, 4, 0.35, 0.09);
        strokes(20, 25, 1, true, 0.12);
        g.setLineDash([3, 3]);
        g.strokeStyle = "rgba(0,0,0,0.35)";
        g.lineWidth = 1.2;
        for (const y of [10, S - 10]) {
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(S, y);
          g.stroke();
        }
        g.setLineDash([]);
        break;
      case "cloth":
        for (let y = 0; y < S; y += 3) {
          g.fillStyle = "rgba(0,0,0," + (0.03 + r() * 0.04) + ")";
          g.fillRect(0, y, S, 1);
        }
        for (let x = 0; x < S; x += 3) {
          g.fillStyle = "rgba(255,255,255," + (0.02 + r() * 0.04) + ")";
          g.fillRect(x, 0, 1, S);
        }
        strokes(14, 70, 6, true, 0.08);
        break;
      case "wood":
        strokes(70, 90, 1.6, true, 0.16, 0.25);
        dab(6, 2, 5, 0, 0.25);
        break;
      case "stone":
        dab(120, 3, 14, 0.4, 0.1);
        g.strokeStyle = "rgba(0,0,0,0.35)";
        g.lineWidth = 1.4;
        for (let i = 0; i < 7; i++) {
          let x = r() * S;
          let y = r() * S;
          g.beginPath();
          g.moveTo(x, y);
          for (let k = 0; k < 5; k++) {
            x += (r() - 0.5) * 30;
            y += (r() - 0.5) * 30;
            g.lineTo(x, y);
          }
          g.stroke();
        }
        break;
      case "fur":
        strokes(500, 9, 1.4, true, 0.2, 0.45);
        break;
      case "hair":
        strokes(260, 40, 1.3, true, 0.2, 0.4);
        break;
      case "skin":
        dab(70, 4, 16, 0.5, 0.05);
        break;
      case "scale":
        for (let y = 0; y < S + 12; y += 10)
          for (let x = (y / 10) % 2 ? 6 : 0; x < S + 12; x += 12) {
            const sg = g.createRadialGradient(x, y - 3, 1, x, y, 8);
            sg.addColorStop(0, "rgba(255,255,255,0.25)");
            sg.addColorStop(1, "rgba(0,0,0,0.3)");
            g.fillStyle = sg;
            g.beginPath();
            g.arc(x, y, 7, 0, PI);
            g.fill();
          }
        break;
      case "bone":
        dab(80, 2, 9, 0.6, 0.08);
        g.strokeStyle = "rgba(60,40,20,0.3)";
        for (let i = 0; i < 10; i++) {
          g.beginPath();
          g.moveTo(r() * S, r() * S);
          g.lineTo(r() * S, r() * S);
          g.stroke();
        }
        break;
      case "bark":
        strokes(60, 120, 4, true, 0.25, 0.2);
        strokes(40, 40, 2, true, 0.18, 0.6);
        break;
      default:
        dab(60, 3, 12, 0.5, 0.05);
    }
    const t = new T.CanvasTexture(c);
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = 4;
    return (TEX[kind] = t);
  }

  /* ---------- Materialien ---------- */
  const MC = {};
  // kind: metal, leather, cloth, wood, stone, fur, hair, skin, scale, bone, bark, plain
  function pmat(kind, color, o) {
    o = o || {};
    const k = "m" + kind + "|" + color + "|" + (o.e || "") + "|" + (o.ei || 0) + "|" + (o.op || 1) + "|" + (o.ds ? 1 : 0) + "|" + (o.flat ? 1 : 0) + "|" + (o.sh || 0);
    if (MC[k]) return MC[k];
    const props = { map: paintTex(kind), color: new T.Color(color).multiplyScalar(1.12) };
    let m;
    if (kind === "metal") m = new T.MeshPhongMaterial(Object.assign(props, { specular: new T.Color("#b8b2a6"), shininess: o.sh || 46 }));
    else if (kind === "skin" || kind === "scale" || kind === "bone" || kind === "hair") m = new T.MeshPhongMaterial(Object.assign(props, { specular: new T.Color("#2a2622"), shininess: o.sh || 14 }));
    else m = new T.MeshLambertMaterial(props);
    if (o.e) {
      m.emissive = new T.Color(o.e);
      m.emissiveIntensity = o.ei == null ? 1 : o.ei;
    }
    if (o.op && o.op < 1) {
      m.transparent = true;
      m.opacity = o.op;
      m.depthWrite = false;
    }
    if (o.ds) m.side = T.DoubleSide;
    if (o.flat) m.flatShading = true;
    return (MC[k] = m);
  }
  // Rueckwaertskompatibel: frueher Cartoon-Material, jetzt matt bemalt
  const toon = (color, o) => pmat((o && o.kind) || "plain", color, o);
  // Leuchtendes Material: Grundfarbe plus kraeftiges Eigenleuchten
  const emis = (color, ei) => pmat("plain", color, { e: color, ei: ei == null ? 1 : ei });
  function glow(color, op) {
    const k = "g" + color + "|" + (op == null ? 0.6 : op);
    if (MC[k]) return MC[k];
    return (MC[k] = new T.MeshBasicMaterial({ color: new T.Color(color), transparent: true, opacity: op == null ? 0.6 : op, blending: T.AdditiveBlending, depthWrite: false }));
  }
  function basic(color, op) {
    const k = "bs" + color + "|" + (op || 1);
    if (MC[k]) return MC[k];
    const m = new T.MeshBasicMaterial({ color: new T.Color(color) });
    if (op && op < 1) {
      m.transparent = true;
      m.opacity = op;
      m.depthWrite = false;
    }
    return (MC[k] = m);
  }
  let haloTex = null;
  function halo(color, op) {
    const k = "h" + color + "|" + (op || 1);
    if (MC[k]) return MC[k];
    if (!haloTex) {
      const c = canvas(64, 64);
      const g = c.getContext("2d");
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, "rgba(255,255,255,1)");
      gr.addColorStop(0.25, "rgba(255,255,255,0.55)");
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      haloTex = new T.CanvasTexture(c);
    }
    return (MC[k] = new T.SpriteMaterial({ map: haloTex, color: new T.Color(color), transparent: true, opacity: op || 1, blending: T.AdditiveBlending, depthWrite: false }));
  }
  function haloSprite(color, size, op, pos) {
    const s = new T.Sprite(halo(color, op));
    s.scale.setScalar(size);
    if (pos) s.position.set(pos[0], pos[1], pos[2]);
    s.userData.pulse = 1;
    s.userData.s0 = size;
    return s;
  }
  let flashM = null;
  const flashMat = () => flashM || (flashM = new T.MeshBasicMaterial({ color: 0xffffff }));
  R.mat = { toon, pmat, emis, glow, basic, halo, outline: () => basic("#1c1626") };
  R.haloSprite = haloSprite;
  R.paintTex = paintTex;

  function mesh(g, m, o) {
    const me = new T.Mesh(g, m);
    o = o || {};
    if (o.p) me.position.set(o.p[0], o.p[1], o.p[2]);
    if (o.r) me.rotation.set(o.r[0], o.r[1], o.r[2]);
    if (o.s != null) typeof o.s === "number" ? me.scale.setScalar(o.s) : me.scale.set(o.s[0], o.s[1], o.s[2]);
    me.castShadow = o.shadow !== false && !m.transparent;
    return me;
  }
  const grp = (p, r) => {
    const g = new T.Group();
    if (p) g.position.set(p[0], p[1], p[2]);
    if (r) g.rotation.set(r[0], r[1], r[2]);
    return g;
  };
  R.mesh = mesh;
  R.grp = grp;

  const RAR_GLOW = { gewoehnlich: null, ungewoehnlich: null, selten: "#4fa9ff", episch: "#c47bff", legendaer: "#ffb13b" };
  R.RAR_GLOW = RAR_GLOW;
  const GOLD = "#d9a441";
  const STEEL = "#b9c0c8";
  const DARKWOOD = "#5a3a24";
  // Ein Reich kann als Schluessel oder als eigenes Farbobjekt (z. B. fuer Untote) uebergeben werden
  const realmOf = (realm) => (realm && typeof realm === "object" ? realm.key || "tod" : SB.data.REALMS[realm] ? realm : "albion");
  const realmData = (realm) => (realm && typeof realm === "object" ? realm : SB.data.REALMS[realmOf(realm)]);

  /* ---------- Gesicht: Canvas-Textur mit Augen, Brauen, Tattoos, Narben ---------- */
  // Kugel-UV: u=0.25 ist vorne (Blickrichtung +z), v=0 oben. Canvas 512x256, Gesichtsmitte x=128.
  const FACE = {};
  function faceTex(o) {
    const key = [o.skin, o.eyes, o.eyeGlow ? 1 : 0, o.brow, o.tattoo, o.tc, o.tglow ? 1 : 0, o.scar, o.fem ? 1 : 0, o.undead ? 1 : 0, o.race].join("|");
    if (FACE[key]) return FACE[key];
    const W = 512;
    const H = 256;
    const c = canvas(W, H);
    const g = c.getContext("2d");
    const e = canvas(W, H);
    const ge = e.getContext("2d");
    ge.fillStyle = "#000";
    ge.fillRect(0, 0, W, H);
    const cx = 128;
    const eyeY = 120;
    // Haut mit gemaltem Licht von oben
    const base = new T.Color(o.skin);
    const hx = (f) => "#" + base.clone().multiplyScalar(f).getHexString();
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, hx(1.05));
    gr.addColorStop(0.45, hx(1.0));
    gr.addColorStop(0.75, hx(0.86));
    gr.addColorStop(1, hx(0.7));
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
    const blob = (x, y, rx, ry, col, a) => {
      g.save();
      g.globalAlpha = a;
      const rg = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      rg.addColorStop(0, col);
      rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg;
      g.beginPath();
      g.ellipse(x, y, rx, ry, 0, 0, PI * 2);
      g.fill();
      g.restore();
    };
    // Schatten unter den Brauen, Wangenknochen, Kinn
    for (const s of [-1, 1]) {
      blob(cx + s * 28, eyeY - 2, 22, 11, hx(0.6), 0.45);
      blob(cx + s * 52, eyeY + 34, 18, 16, hx(0.8), 0.3);
      blob(cx + s * 36, eyeY + 18, 16, 7, hx(1.15), 0.3);
    }
    blob(cx, eyeY + 46, 18, 8, hx(0.65), 0.45);
    blob(cx, eyeY - 30, 46, 18, hx(1.18), 0.3);
    if (o.undead) {
      for (const s of [-1, 1]) blob(cx + s * 30, eyeY, 30, 20, "#000", 0.85);
      blob(cx, eyeY + 40, 34, 18, "#000", 0.35);
    }
    // Tattoos
    const tc = o.tc || "#2f5fd0";
    const paint = (fn) => {
      for (const [ctx, col] of [[g, tc], o.tglow ? [ge, tc] : null].filter(Boolean)) {
        ctx.save();
        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalAlpha = ctx === g ? 0.85 : 1;
        fn(ctx);
        ctx.restore();
      }
    };
    switch (o.tattoo) {
      case "runen":
        paint((x) => {
          x.lineWidth = 3;
          const rune = (px, py, k) => {
            x.beginPath();
            x.moveTo(px, py - 9);
            x.lineTo(px, py + 9);
            if (k % 3 === 0) {
              x.moveTo(px, py - 9);
              x.lineTo(px + 6, py - 3);
              x.lineTo(px, py + 2);
            } else if (k % 3 === 1) {
              x.moveTo(px - 6, py - 6);
              x.lineTo(px + 6, py + 2);
            } else {
              x.moveTo(px, py - 2);
              x.lineTo(px + 6, py - 8);
              x.moveTo(px, py - 2);
              x.lineTo(px - 6, py - 8);
            }
            x.stroke();
          };
          rune(cx, eyeY - 36, 0);
          rune(cx - 16, eyeY - 30, 1);
          rune(cx + 16, eyeY - 30, 2);
          for (const s of [-1, 1]) {
            rune(cx + s * 44, eyeY + 18, s > 0 ? 1 : 2);
            rune(cx + s * 52, eyeY + 38, 0);
          }
        });
        break;
      case "knoten":
        paint((x) => {
          x.lineWidth = 3;
          for (const s of [-1, 1]) {
            const px = cx + s * 46;
            const py = eyeY + 26;
            for (let i = 0; i < 3; i++) {
              const a = (i / 3) * PI * 2;
              x.beginPath();
              x.arc(px + Math.cos(a) * 7, py + Math.sin(a) * 7, 8, 0, PI * 2);
              x.stroke();
            }
          }
          x.beginPath();
          x.arc(cx, eyeY - 34, 8, 0, PI * 2);
          x.stroke();
          x.beginPath();
          x.moveTo(cx - 22, eyeY - 34);
          x.lineTo(cx + 22, eyeY - 34);
          x.stroke();
        });
        break;
      case "kriegsbemalung":
        paint((x) => {
          x.globalAlpha *= 0.9;
          x.beginPath();
          x.moveTo(cx - 70, eyeY - 12);
          x.quadraticCurveTo(cx, eyeY - 20, cx + 70, eyeY - 12);
          x.lineTo(cx + 66, eyeY + 12);
          x.quadraticCurveTo(cx, eyeY + 4, cx - 66, eyeY + 12);
          x.closePath();
          x.fill();
          x.lineWidth = 5;
          for (const s of [-1, 0, 1]) {
            x.beginPath();
            x.moveTo(cx + s * 10, eyeY + 50);
            x.lineTo(cx + s * 12, eyeY + 76);
            x.stroke();
          }
        });
        break;
      case "linien":
        paint((x) => {
          x.lineWidth = 4;
          for (const s of [-1, 1]) {
            for (let k = 0; k < 2; k++) {
              x.beginPath();
              x.moveTo(cx + s * (24 + k * 9), eyeY - 40);
              x.quadraticCurveTo(cx + s * (60 + k * 8), eyeY + 6, cx + s * (34 + k * 10), eyeY + 56);
              x.stroke();
            }
          }
          x.beginPath();
          x.moveTo(cx, eyeY - 50);
          x.lineTo(cx, eyeY - 18);
          x.stroke();
        });
        break;
      case "mond":
        paint((x) => {
          x.beginPath();
          x.arc(cx, eyeY - 34, 14, 0.25 * PI, 1.75 * PI, false);
          x.arc(cx + 6, eyeY - 34, 11, 1.65 * PI, 0.35 * PI, true);
          x.closePath();
          x.fill();
          for (const s of [-1, 1]) {
            x.beginPath();
            x.arc(cx + s * 40, eyeY + 24, 3, 0, PI * 2);
            x.arc(cx + s * 48, eyeY + 34, 2.5, 0, PI * 2);
            x.fill();
          }
        });
        break;
      case "dornen":
        paint((x) => {
          x.lineWidth = 3;
          x.beginPath();
          x.moveTo(cx - 10, eyeY - 52);
          x.bezierCurveTo(cx - 60, eyeY - 30, cx - 20, eyeY + 20, cx - 58, eyeY + 60);
          x.stroke();
          for (let i = 0; i < 6; i++) {
            const t = i / 6;
            const px = cx - 10 - 40 * Math.sin(t * PI) - t * 30;
            const py = eyeY - 50 + t * 106;
            x.beginPath();
            x.moveTo(px, py);
            x.lineTo(px + (i % 2 ? 9 : -9), py - 5);
            x.lineTo(px + (i % 2 ? 3 : -3), py + 3);
            x.fill();
          }
        });
        break;
    }
    // Narben
    g.save();
    g.strokeStyle = "rgba(120,50,50,0.75)";
    g.lineWidth = 3;
    g.lineCap = "round";
    const scar = (x1, y1, x2, y2) => {
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
      g.save();
      g.strokeStyle = "rgba(255,230,210,0.45)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x1 + 1, y1 - 1);
      g.lineTo(x2 + 1, y2 - 1);
      g.stroke();
      g.restore();
    };
    if (o.scar === "auge") scar(cx + 22, eyeY - 30, cx + 36, eyeY + 22);
    if (o.scar === "wange") scar(cx - 52, eyeY + 14, cx - 30, eyeY + 46);
    if (o.scar === "kreuz") {
      scar(cx - 44, eyeY + 20, cx - 22, eyeY + 44);
      scar(cx - 22, eyeY + 20, cx - 46, eyeY + 42);
    }
    g.restore();
    // Augen: mandelfoermig, mit dunklem Lid (heroischer Blick)
    for (const s of [-1, 1]) {
      const ex = cx + s * 27;
      const almond = (x, rx, ry) => {
        x.beginPath();
        x.moveTo(ex - rx, eyeY + 1);
        x.quadraticCurveTo(ex - s * 2, eyeY - ry * 1.5, ex + rx, eyeY - 2 * s * 0 - 2);
        x.quadraticCurveTo(ex + s * 2, eyeY + ry * 1.3, ex - rx, eyeY + 1);
        x.closePath();
      };
      if (o.eyeGlow || o.undead) {
        const col = o.eyes || "#9fe3ff";
        for (const x of [g, ge]) {
          x.save();
          x.fillStyle = col;
          almond(x, 12, 6);
          x.fill();
          x.restore();
        }
        g.fillStyle = "rgba(255,255,255,0.8)";
        g.beginPath();
        g.ellipse(ex, eyeY - 1, 4, 2.5, 0, 0, PI * 2);
        g.fill();
      } else {
        g.fillStyle = "#ece6dc";
        almond(g, 11, 6);
        g.fill();
        g.fillStyle = o.eyes || "#3a2a1e";
        g.beginPath();
        g.arc(ex + s * 1, eyeY - 1, 4.6, 0, PI * 2);
        g.fill();
        g.fillStyle = "#0e0c10";
        g.beginPath();
        g.arc(ex + s * 1, eyeY - 1, 2, 0, PI * 2);
        g.fill();
        g.fillStyle = "rgba(255,255,255,0.9)";
        g.fillRect(ex + s * 1 + 1, eyeY - 4, 2, 2);
      }
      // Lidstrich
      g.strokeStyle = "rgba(20,14,12,0.9)";
      g.lineWidth = o.fem ? 2.6 : 2.2;
      g.beginPath();
      g.moveTo(ex - s * 12, eyeY + 2);
      g.quadraticCurveTo(ex - s * 2, eyeY - 10, ex + s * 13, eyeY - 3);
      g.stroke();
      // Brauen: kraeftig, schraeg nach innen unten
      g.strokeStyle = o.brow || "#2b1d16";
      g.lineWidth = o.fem ? 3 : 5;
      g.beginPath();
      g.moveTo(ex - s * 14, eyeY - 10);
      g.quadraticCurveTo(ex, eyeY - 18, ex + s * 16, eyeY - 18);
      g.stroke();
    }
    // Nase und Mund
    g.strokeStyle = hx(0.6);
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(cx - 6, eyeY + 30);
    g.quadraticCurveTo(cx, eyeY + 34, cx + 6, eyeY + 30);
    g.stroke();
    g.strokeStyle = o.undead ? "#000" : "rgba(60,25,20,0.85)";
    g.lineWidth = o.fem ? 2.5 : 3;
    g.beginPath();
    g.moveTo(cx - 13, eyeY + 47);
    g.quadraticCurveTo(cx, eyeY + 44, cx + 13, eyeY + 47);
    g.stroke();
    if (o.fem) {
      g.fillStyle = "rgba(150,60,60,0.35)";
      g.beginPath();
      g.ellipse(cx, eyeY + 50, 9, 3.5, 0, 0, PI * 2);
      g.fill();
    }
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    t.anisotropy = 4;
    let em = null;
    if (o.eyeGlow || o.tglow || o.undead) {
      em = new T.CanvasTexture(e);
      em.colorSpace = T.SRGBColorSpace;
    }
    const m = new T.MeshPhongMaterial({ map: t, specular: new T.Color("#2a2622"), shininess: 12 });
    if (em) {
      m.emissive = new T.Color("#ffffff");
      m.emissiveMap = em;
      m.emissiveIntensity = 1;
    }
    return (FACE[key] = m);
  }

  // Arm-Tattoo: Haut mit umlaufenden Mustern (Kapsel-UV: u rundherum, v entlang)
  const ARMT = {};
  function armTex(skin, tattoo, tc, tglow) {
    const key = skin + "|" + tattoo + "|" + tc + "|" + (tglow ? 1 : 0);
    if (ARMT[key]) return ARMT[key];
    const W = 256;
    const H = 128;
    const c = canvas(W, H);
    const g = c.getContext("2d");
    const e = canvas(W, H);
    const ge = e.getContext("2d");
    ge.fillStyle = "#000";
    ge.fillRect(0, 0, W, H);
    const base = new T.Color(skin);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#" + base.clone().multiplyScalar(1.05).getHexString());
    gr.addColorStop(1, "#" + base.clone().multiplyScalar(0.8).getHexString());
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
    if (tattoo && tattoo !== "keine") {
      for (const x of tglow ? [g, ge] : [g]) {
        x.save();
        x.strokeStyle = tc;
        x.fillStyle = tc;
        x.lineWidth = 4;
        x.globalAlpha = x === g ? 0.85 : 1;
        // zwei Baender mit Muster, das sich um den Arm zieht
        for (const by of [38, 70]) {
          x.beginPath();
          x.moveTo(0, by - 9);
          x.lineTo(W, by - 9);
          x.moveTo(0, by + 9);
          x.lineTo(W, by + 9);
          x.stroke();
          for (let i = 0; i < 8; i++) {
            const px = i * 32 + 16;
            x.beginPath();
            if (tattoo === "runen") {
              x.moveTo(px, by - 6);
              x.lineTo(px, by + 6);
              x.lineTo(px + 6, by);
            } else if (tattoo === "knoten") {
              x.arc(px, by, 5, 0, PI * 2);
            } else if (tattoo === "dornen") {
              x.moveTo(px - 8, by + 6);
              x.lineTo(px, by - 6);
              x.lineTo(px + 8, by + 6);
            } else if (tattoo === "mond") {
              x.arc(px, by, 5, 0.3 * PI, 1.7 * PI);
            } else {
              x.moveTo(px - 10, by);
              x.quadraticCurveTo(px, by - 8, px + 10, by);
            }
            x.stroke();
          }
        }
        x.restore();
      }
    }
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    const m = new T.MeshPhongMaterial({ map: t, specular: new T.Color("#2a2622"), shininess: 14 });
    if (tglow && tattoo && tattoo !== "keine") {
      const em = new T.CanvasTexture(e);
      em.colorSpace = T.SRGBColorSpace;
      m.emissive = new T.Color("#ffffff");
      m.emissiveMap = em;
    }
    return (ARMT[key] = m);
  }

  // Wappen fuer Schilde und Waffenroecke
  const CREST = {};
  function crestMat(realm, color, trim) {
    const key = realm + "|" + color + "|" + trim;
    if (CREST[key]) return CREST[key];
    const S = 128;
    const c = canvas(S, S);
    const g = c.getContext("2d");
    g.fillStyle = color;
    g.fillRect(0, 0, S, S);
    const gr = g.createLinearGradient(0, 0, 0, S);
    gr.addColorStop(0, "rgba(255,255,255,0.18)");
    gr.addColorStop(1, "rgba(0,0,0,0.3)");
    g.fillStyle = gr;
    g.fillRect(0, 0, S, S);
    g.fillStyle = trim;
    g.strokeStyle = trim;
    g.lineWidth = 7;
    g.lineCap = "round";
    if (realm === "albion") {
      // Kreidekreuz mit Krone
      g.fillRect(S / 2 - 7, 22, 14, 86);
      g.fillRect(28, 50, 72, 14);
      g.beginPath();
      g.moveTo(40, 30);
      g.lineTo(48, 14);
      g.lineTo(56, 26);
      g.lineTo(64, 10);
      g.lineTo(72, 26);
      g.lineTo(80, 14);
      g.lineTo(88, 30);
      g.closePath();
      g.fill();
    } else if (realm === "midgard") {
      // Frostzeichen: sechsarmiger Eisstern
      g.save();
      g.translate(S / 2, S / 2);
      for (let i = 0; i < 6; i++) {
        g.rotate(PI / 3);
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(0, -46);
        g.moveTo(0, -24);
        g.lineTo(12, -36);
        g.moveTo(0, -24);
        g.lineTo(-12, -36);
        g.stroke();
      }
      g.beginPath();
      g.arc(0, 0, 9, 0, PI * 2);
      g.fill();
      g.restore();
    } else if (realm === "tod") {
      // gesenktes Schwert
      g.fillRect(S / 2 - 6, 20, 12, 90);
      g.fillRect(34, 36, 60, 10);
      g.beginPath();
      g.moveTo(S / 2 - 6, 110);
      g.lineTo(S / 2, 122);
      g.lineTo(S / 2 + 6, 110);
      g.fill();
    } else {
      // Dreifachspirale
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * PI * 2 - PI / 2;
        g.beginPath();
        for (let k = 0; k < 30; k++) {
          const t = k / 29;
          const rr = 4 + t * 22;
          const aa = a + t * 4.2;
          const x = S / 2 + Math.cos(a) * 20 + Math.cos(aa) * rr * 0.9;
          const y = S / 2 + Math.sin(a) * 20 + Math.sin(aa) * rr * 0.9;
          k ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
    }
    g.strokeStyle = trim;
    g.lineWidth = 6;
    g.strokeRect(4, 4, S - 8, S - 8);
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    return (CREST[key] = new T.MeshLambertMaterial({ map: t, side: T.DoubleSide }));
  }
  R.crestMat = crestMat;

  /* ---------- Formen ---------- */
  const SH = {
    blade: [[0, 1], [0.07, 0.84], [0.062, 0.12], [0.045, 0.04], [0.045, 0], [-0.045, 0], [-0.045, 0.04], [-0.062, 0.12], [-0.07, 0.84]],
    broad: [[0, 1], [0.1, 0.8], [0.085, 0.3], [0.1, 0.1], [0.05, 0], [-0.05, 0], [-0.1, 0.1], [-0.085, 0.3], [-0.1, 0.8]],
    runeblade: [[0, 1], [0.05, 0.9], [0.09, 0.75], [0.06, 0.62], [0.09, 0.45], [0.06, 0.12], [0.04, 0], [-0.04, 0], [-0.06, 0.12], [-0.09, 0.45], [-0.06, 0.62], [-0.09, 0.75], [-0.05, 0.9]],
    guard: [[-0.24, 0.02], ["q", -0.12, -0.04, 0, -0.02], ["q", 0.12, -0.04, 0.24, 0.02], [0.26, 0.07], ["q", 0.12, 0.02, 0, 0.04], ["q", -0.12, 0.02, -0.26, 0.07]],
    axe: [[0, -0.06], [0.12, -0.12], ["q", 0.36, -0.1, 0.42, -0.34], ["q", 0.5, 0, 0.42, 0.34], ["q", 0.36, 0.1, 0.12, 0.12], [0, 0.06]],
    axeback: [[0, -0.05], [-0.1, -0.08], [-0.2, -0.02], [-0.2, 0.02], [-0.1, 0.08], [0, 0.05]],
    dagger: [[0, 0.5], ["q", 0.07, 0.3, 0.045, 0.02], [0.03, 0], [-0.03, 0], [-0.045, 0.02], ["q", -0.02, 0.3, 0, 0.5]],
    sickle: [[0.02, 0], ["q", 0.05, 0.25, -0.12, 0.5], ["q", 0.25, 0.42, 0.22, 0.12], ["q", 0.18, 0.32, 0.03, 0.4], ["q", 0.08, 0.2, -0.02, 0]],
    leafblade: [[0, 0.62], ["q", 0.1, 0.42, 0.05, 0.05], [0.04, 0], [-0.04, 0], [-0.05, 0.05], ["q", -0.1, 0.42, 0, 0.62]],
    spearhead: [[0, 0.36], ["q", 0.09, 0.16, 0.035, 0], [-0.035, 0], ["q", -0.09, 0.16, 0, 0.36]],
    heater: [[-0.36, 0.4], [0.36, 0.4], [0.36, 0.05], ["q", 0.3, -0.35, 0, -0.5], ["q", -0.3, -0.35, -0.36, 0.05]],
    kite: [[0, 0.5], ["q", 0.32, 0.45, 0.34, 0.2], ["q", 0.25, -0.3, 0, -0.62], ["q", -0.25, -0.3, -0.34, 0.2], ["q", -0.32, 0.45, 0, 0.5]],
    leaf: [[0, 0.55], ["q", 0.42, 0.2, 0.05, -0.55], [0, -0.6], [-0.05, -0.55], ["q", -0.42, 0.2, 0, 0.55]],
    wing: [[0, 0], [0.3, 0.12], [0.55, 0.35], [0.4, 0.3], [0.45, 0.18], [0.28, 0.16], [0.3, 0.06]],
    feather: [[0, 0], ["q", 0.06, 0.2, 0, 0.42], ["q", -0.05, 0.2, 0, 0]],
  };
  R.SH = SH;

  /* ---------- Waffen ---------- */
  function edgeMat(rarity, base) {
    const gc = RAR_GLOW[rarity];
    return gc ? pmat("metal", mix(base || STEEL, gc, 0.25), { e: gc, ei: 0.35 }) : pmat("metal", base || STEEL);
  }
  function runes(g, color, y0, y1, x, z, n) {
    for (let i = 0; i < n; i++) {
      const y = y0 + ((y1 - y0) * (i + 0.5)) / n;
      g.add(mesh(box(0.022, 0.05, 0.004), basic(color), { p: [x, y, z], r: [0, 0, (i % 2 ? 0.5 : -0.5)], shadow: false }));
    }
  }
  function addGlow(g, rarity, pts, size) {
    const gc = RAR_GLOW[rarity];
    if (!gc) return;
    for (const p of pts) g.add(haloSprite(gc, size * (rarity === "legendaer" ? 1.5 : 1), rarity === "selten" ? 0.5 : 0.75, p));
  }
  function buildWeapon(w, realm) {
    const g = grp();
    const RM = realmData(realm);
    const gc = RAR_GLOW[w.rarity];
    const edge = edgeMat(w.rarity, w.base === "schwert" && w.style === 2 ? "#8f9aa6" : STEEL);
    const trim = pmat("metal", RM.trim, { sh: 70 });
    const grip = pmat("leather", shade(w.tint || "#5a3d2a", 0.8));
    const wood = pmat("wood", w.tint && w.base !== "schwert" ? w.tint : DARKWOOD);
    const gem = gc ? emis(gc, 0.9) : emis(RM.accent, 0.5);
    switch (w.base) {
      case "schwert": {
        const sh = w.style === 1 ? SH.broad : w.style === 2 ? SH.runeblade : SH.blade;
        g.add(mesh(cyl(0.03, 0.034, 0.26, 8), grip, { p: [0, 0.02, 0] }));
        g.add(mesh(sph(0.055, 10, 8), trim, { p: [0, -0.13, 0] }));
        g.add(mesh(octa(0.03), gem, { p: [0, -0.13, 0.045] }));
        g.add(mesh(ext("guard", SH.guard, 0.04, 0.012), trim, { p: [0, 0.15, 0] }));
        g.add(mesh(octa(0.035), gem, { p: [0, 0.17, 0.035] }));
        g.add(mesh(ext("bl" + (w.style || 0), sh, 0.012, 0.012), edge, { p: [0, 0.17, 0], s: [1, 0.95, 1] }));
        g.add(mesh(box(0.018, 0.62, 0.03), pmat("metal", "#6f7782"), { p: [0, 0.5, 0], shadow: false }));
        if (gc || w.style === 2) runes(g, gc || RM.accent, 0.3, 0.8, 0, 0.02, 4);
        addGlow(g, w.rarity, [[0, 0.6, 0], [0, 0.95, 0]], 0.35);
        break;
      }
      case "axt": {
        g.add(mesh(cyl(0.035, 0.042, 1.0, 8), wood, { p: [0, 0.3, 0] }));
        for (const y of [0.0, 0.12]) g.add(mesh(torus(0.042, 0.012, PI * 2, 5, 12), trim, { p: [0, y, 0], r: [PI / 2, 0, 0] }));
        g.add(mesh(ext("axe", SH.axe, 0.03, 0.014), edge, { p: [0.03, 0.72, 0] }));
        if (w.style === 1) g.add(mesh(ext("axe", SH.axe, 0.03, 0.014), edge, { p: [-0.03, 0.72, 0], r: [0, PI, 0] }));
        else g.add(mesh(ext("axeback", SH.axeback, 0.03, 0.01), trim, { p: [-0.02, 0.72, 0] }));
        g.add(mesh(cyl(0.06, 0.06, 0.2, 8), trim, { p: [0, 0.72, 0] }));
        g.add(mesh(cone(0.04, 0.16, 6), trim, { p: [0, 0.88, 0] }));
        if (w.style === 2) for (let i = 0; i < 3; i++) g.add(mesh(cone(0.012, 0.12, 4), pmat("bone", "#e8dcc0"), { p: [0.02, 0.5 - i * 0.07, 0.04], r: [0.2, 0, 0.3] }));
        if (gc) runes(g, gc, 0.6, 0.85, 0.25, 0.03, 3);
        addGlow(g, w.rarity, [[0.3, 0.72, 0]], 0.5);

      }
      case "hammer": {
        g.add(mesh(cyl(0.035, 0.042, 0.95, 8), wood, { p: [0, 0.28, 0] }));

        if (w.style === 1) {
          // Morgenstern
          g.add(mesh(ico(0.16, 1), edge, { p: [0, 0.82, 0] }));
          for (let i = 0; i < 10; i++) {

            g.add(mesh(cone(0.035, 0.14, 5), edge, { p: [Math.cos(a) * 0.16, 0.82 + y, Math.sin(a) * 0.16], r: [Math.sin(a) * 1.57, 0, -Math.cos(a) * 1.57] }));
          }
          g.add(mesh(cone(0.04, 0.16, 5), edge, { p: [0, 1.0, 0] }));
        } else {
          g.add(mesh(cyl(0.15, 0.15, 0.42, 8), edge, { p: [0, 0.82, 0], r: [0, 0, PI / 2] }));
          for (const s of [-1, 1]) g.add(mesh(cyl(0.165, 0.165, 0.05, 8), trim, { p: [s * 0.17, 0.82, 0], r: [0, 0, PI / 2] }));
          g.add(mesh(cyl(0.16, 0.16, 0.08, 8), trim, { p: [0, 0.82, 0], r: [0, 0, PI / 2] }));
          if (w.style === 2) g.add(mesh(cone(0.05, 0.22, 6), edge, { p: [0, 1.06, 0] }));

          g.add(mesh(ext("dgu", [[-0.1, 0], [0.1, 0], [0.12, 0.04], [-0.12, 0.04]], 0.03, 0.008), trim, { p: [0, 0.07, 0] }));
          const sh = w.base === "dolch" ? SH.dagger : SH.leafblade;
          g.add(mesh(ext("rb" + w.base, sh, 0.008, 0.01), edge, { p: [0, 0.1, 0], s: w.base === "kurzschwert" ? [1, 1.2, 1] : 1 }));

        if (gc) {
          g.add(mesh(box(0.012, 0.25, 0.012), emis(gc, 1), { p: [0, 0.3, 0.012], shadow: false }));

        for (const s of [-1, 1]) {
          g.add(mesh(cone(0.03, 0.1, 6), trim, { p: [0, s * L, -0.08], r: [s > 0 ? 0 : PI, 0, 0] }));
          if (w.style === 2) g.add(mesh(ext("feather", SH.feather, 0.004, 0), pmat("cloth", RM.accent, { ds: true }), { p: [0, s * L * 0.55, 0.14], r: [0, PI / 2, s > 0 ? -0.4 : PI + 0.4], s: 0.5 }));
        }
        g.add(mesh(cyl(0.004, 0.004, L * 2, 3), basic("#e8dfca"), { p: [0, 0, -0.08], shadow: false }));
        addGlow(g, w.rarity, [[0, L * 0.6, 0.06], [0, -L * 0.6, 0.06]], 0.25);
        break;
      }
      case "armbrust": {
        g.add(mesh(box(0.07, 0.08, 0.62), wood, { p: [0, 0.02, 0.18] }));
        g.add(mesh(box(0.06, 0.16, 0.08), wood, { p: [0, -0.06, -0.08] }));
        const pts = [[-0.36, 0, 0.36], [-0.18, 0, 0.5], [0, 0, 0.52], [0.18, 0, 0.5], [0.36, 0, 0.36]];
        g.add(mesh(tube("xbow", pts, 0.025, 16, 6), pmat("metal", shade(RM.metal, 0.8)), { p: [0, 0.05, 0] }));
        g.add(mesh(cyl(0.004, 0.004, 0.7, 3), basic("#e8dfca"), { p: [0, 0.05, 0.38], r: [0, 0, PI / 2], shadow: false }));
        g.add(mesh(cyl(0.012, 0.012, 0.4, 5), pmat("wood", "#c9b89a"), { p: [0, 0.08, 0.32], r: [PI / 2, 0, 0] }));
        g.add(mesh(box(0.1, 0.02, 0.1), trim, { p: [0, 0.07, 0.48] }));
        addGlow(g, w.rarity, [[0, 0.06, 0.4]], 0.3);
        break;
      }
      case "speer": {
        g.add(mesh(cyl(0.026, 0.03, 1.7, 8), wood, { p: [0, 0.35, 0] }));
        g.add(mesh(ext("spear", SH.spearhead, 0.012, 0.012), edge, { p: [0, 1.2, 0] }));
        g.add(mesh(cyl(0.035, 0.03, 0.1, 8), trim, { p: [0, 1.18, 0] }));
        for (let i = 0; i < 2; i++) g.add(mesh(ext("feather", SH.feather, 0.004, 0), pmat("cloth", i ? RM.accent : RM.color, { ds: true }), { p: [0.02, 1.1, 0], r: [0, i * 1.2, -2.6], s: 0.5 }));

        addGlow(g, w.rarity, [[0, 1.35, 0]], 0.35);

        // gewundener Holzstab mit Krallenfassung und schwebendem Kristall
        const pts = [];

        for (let i = 0; i < 4; i++) {

        const c = gc || "#7fe3ff";

        crystal.userData.spin = 1.5;

        g.add(haloSprite(c, 0.55, 0.85, [0, 1.56, 0]));
        if (w.style === 1) g.add(mesh(torus(0.15, 0.01, PI * 2, 4, 24), glow(c, 0.7), { p: [0, 1.56, 0], r: [PI / 2.4, 0, 0] }));

        break;
      }
      case "zepter": {
        g.add(mesh(cyl(0.03, 0.035, 0.7, 8), trim, { p: [0, 0.15, 0] }));
        g.add(mesh(sph(0.045, 8, 6), trim, { p: [0, -0.2, 0] }));
        for (const s of [-1, 1]) g.add(mesh(ext("wing", SH.wing, 0.012, 0.006), trim, { p: [s * 0.02, 0.48, 0], r: [0, s > 0 ? 0 : PI, 0], s: 0.42 }));

        const orb = mesh(sph(0.1, 16, 12), emis(c, 0.85), { p: [0, 0.6, 0] });
        g.add(orb);
        g.add(mesh(torus(0.11, 0.012, PI * 2, 4, 20), trim, { p: [0, 0.6, 0], r: [PI / 2, 0, 0] }));
        g.add(haloSprite(c, 0.5, 0.8, [0, 0.6, 0]));
        break;
      }
      case "runenstab": {
        g.add(mesh(cyl(0.032, 0.04, 1.65, 7), pmat("bone", "#d9cfb8"), { p: [0, 0.42, 0] }));
        for (let i = 0; i < 5; i++) g.add(mesh(torus(0.04, 0.01, PI * 2, 4, 10), pmat("leather", "#3a2a1e"), { p: [0, 0.1 + i * 0.25, 0], r: [PI / 2, 0, 0] }));
        // Geweih oben
        for (const s of [-1, 1]) {
          g.add(mesh(tube("ant", [[0, 0, 0], [0.08, 0.1, 0], [0.12, 0.24, 0.02], [0.1, 0.36, 0]], 0.018, 10, 5), pmat("bone", "#e8dcc0"), { p: [0, 1.22, 0], r: [0, s > 0 ? 0 : PI, 0] }));
        }
        const c = gc || RM.accent;
        const stone = mesh(dodeca(0.075), emis(c, 0.8), { p: [0, 1.36, 0] });
        stone.userData.spin = 1;
        g.add(stone);
        g.add(haloSprite(c, 0.45, 0.8, [0, 1.36, 0]));
        runes(g, c, 0.3, 1.0, 0, 0.04, 5);
        for (const s of [-1, 1]) {
          const tal = grp([s * 0.06, 1.12, 0]);
          tal.add(mesh(cyl(0.003, 0.003, 0.16, 3), basic("#3a2a1e"), { p: [0, -0.08, 0] }));
          tal.add(mesh(cone(0.02, 0.06, 5), pmat("bone", "#e8dcc0"), { p: [0, -0.17, 0], r: [PI, 0, 0] }));
          tal.userData.dangle = s;
          g.add(tal);
        }
        break;
      }
      default:
        g.add(mesh(box(0.08, 0.6, 0.08), wood, { p: [0, 0.3, 0] }));
    }
    return g;
  }

  // UV einer flachen Form auf 0..1 strecken, damit Wappen ganz sichtbar sind
  function fitUV(g) {
    g.computeBoundingBox();
    const bb = g.boundingBox;
    const p = g.attributes.position;
    const uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), (p.getY(i) - bb.min.y) / (bb.max.y - bb.min.y));
    uv.needsUpdate = true;
    return g;
  }
  R.fitUV = fitUV;

  function buildOffhand(o, realm) {
    const g = grp();
    const RM = realmData(realm);
    const rk = realmOf(realm);
    const gc = RAR_GLOW[o.rarity];
    const trim = pmat("metal", gc ? mix(RM.trim, gc, 0.35) : RM.trim, gc ? { e: gc, ei: 0.25 } : null);
    if (o.base === "schild") {
      const face = o.tint || RM.color;
      const shapeK = o.style === 1 ? "kite" : o.style === 2 ? (rk === "hibernia" ? "leaf" : "heater") : rk === "albion" ? "heater" : rk === "hibernia" ? "leaf" : "round";
      if (shapeK === "round") {
        g.add(mesh(cyl(0.44, 0.44, 0.06, 28), pmat("wood", face), { r: [PI / 2, 0, 0] }));
        g.add(mesh(torus(0.44, 0.035, PI * 2, 6, 32), trim));
        g.add(mesh(sph(0.11, 14, 10), trim, { p: [0, 0, 0.04], s: [1, 1, 0.7] }));
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * PI * 2;
          g.add(mesh(sph(0.025, 6, 6), trim, { p: [Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0.035] }));
        }
        const crest = new T.Mesh(new T.CircleGeometry(0.3, 24), crestMat(rk, shade(face, 0.9), RM.trim));
        crest.position.z = 0.032;
        g.add(crest);
      } else {
        const pts = SH[shapeK];
        g.add(mesh(ext("sh" + shapeK, pts, 0.05, 0.03), pmat("metal", shade(RM.metal, 0.85)), { s: [1, 1, 1] }));
        const front = new T.Mesh(geo("shf" + shapeK, () => fitUV(new T.ShapeGeometry(shapeOf(pts), 10))), crestMat(rk, face, RM.trim));
        front.scale.set(0.86, 0.86, 1);
        front.position.z = 0.058;
        g.add(front);
        g.add(mesh(sph(0.07, 12, 8), trim, { p: [0, 0.05, 0.06], s: [1, 1, 0.6] }));
      }
      addGlow(g, o.rarity, [[0, 0.05, 0.12]], 0.5);
    } else if (o.base === "koecher") {
      g.add(mesh(cyl(0.1, 0.085, 0.62, 10), pmat("leather", o.tint || "#6b4a2f")));
      g.add(mesh(torus(0.1, 0.015, PI * 2, 4, 14), trim, { p: [0, 0.3, 0], r: [PI / 2, 0, 0] }));
      g.add(mesh(torus(0.09, 0.015, PI * 2, 4, 14), trim, { p: [0, -0.2, 0], r: [PI / 2, 0, 0] }));
      for (let i = 0; i < 5; i++) {
        const x = (i - 2) * 0.035;
        g.add(mesh(cyl(0.008, 0.008, 0.3, 4), pmat("wood", "#c9b89a"), { p: [x, 0.42, (i % 2) * 0.03] }));
        g.add(mesh(ext("feather", SH.feather, 0.003, 0), pmat("cloth", i % 2 ? RM.accent : RM.color, { ds: true }), { p: [x, 0.5, (i % 2) * 0.03], s: 0.32 }));
      }
    } else if (o.base === "wurfmesser") {
      // Bandelier mit Messern quer ueber die Brust
      g.add(mesh(box(0.07, 0.75, 0.025), pmat("leather", "#2a1e18"), {}));
      for (let i = 0; i < 4; i++) {
        const k = grp([0, -0.22 + i * 0.15, 0.02]);
        k.add(mesh(ext("rbdolch", SH.dagger, 0.006, 0.006), edgeMat(o.rarity), { s: 0.45, r: [0, 0, PI] }));
        k.add(mesh(cyl(0.012, 0.012, 0.06, 6), pmat("leather", "#5a3d2a"), { p: [0, 0.03, 0] }));
        g.add(k);
      }
    } else if (o.base === "fokus") {
      const c = gc || o.tint || RM.accent;
      if (o.style === 2) {
        // schwebendes Buch
        const book = grp();
        book.add(mesh(box(0.28, 0.05, 0.22), pmat("leather", "#4a2a3a")));
        book.add(mesh(box(0.26, 0.04, 0.2), pmat("cloth", "#efe6d2"), { p: [0, 0.035, 0] }));
        book.add(mesh(octa(0.04), emis(c, 1), { p: [0, 0.07, 0] }));
        book.userData.bob = 1;
        g.add(book);
      } else {
        const cr = mesh(octa(0.13), emis(c, 0.9), { s: [1, 1.5, 1] });
