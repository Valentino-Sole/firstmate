<title>Helden von Schwebfels</title>
<style>
/* Helden von Schwebfels - Gestaltung: dunkler Stein, gealtertes Gold, Pergament. Menueleiste links wie in klassischen Browser-Rollenspielen. */
:root {
  --night: #0c0a10;
  --stone: #17151b;
  --stone-2: #211e25;
  --stone-3: #2e2a33;
  --stone-4: #3b3641;
  --gold: #c9a441;
  --gold-hi: #f0d68a;
  --gold-dim: #6e5a2a;
  --parch: #e8dcc0;
  --parch-dim: #b9ab8c;
  --fog: #a49e94;
  --ink: #14101a;
  --blood: #b8322e;
  --jade: #6fd0a8;
  --frost: #9fd8ff;
  --albion: #b8322e;
  --midgard: #2f5fa8;
  --hibernia: #2f8f4f;
  --r-gewoehnlich: #c9d2d8;
  --r-ungewoehnlich: #74d86f;
  --r-selten: #4fa9ff;
  --r-episch: #c47bff;
  --r-legendaer: #ffb13b;
  --font-display: "Pirata One", "Luminari", "Georgia", serif;
  --font-body: "Alegreya Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --side-w: 188px;
  --panel-w: min(600px, 48vw);
  --dock-h: 72px;
  --top-h: 64px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--parch);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
img { max-width: 100%; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1.25em; height: 1.25em; vertical-align: -0.28em; flex: none; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.small { font-size: 13px; }
.muted { color: var(--fog); }
.muted.small { font-family: var(--font-body); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.gtag { color: var(--gold-hi); font-weight: 700; font-size: 0.85em; }
/* Feiner Rahmen in gealtertem Gold */
.frame { border: 1.5px solid var(--gold-dim); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.6); }

#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0 0 0 var(--side-w); background: linear-gradient(#1a2236, #0c0a10); }
#stage .r3d-canvas { display: block; position: absolute; inset: 0; touch-action: none; }
.stage-fallback {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 90px 16px 40px;
  background: radial-gradient(ellipse at 50% 30%, #2a2a44, var(--night));
}
.stage-fallback .fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; width: min(760px, 100%); }
.stage-fallback button { padding: 16px 8px; border-radius: 10px; border: 1.5px solid var(--gold-dim); background: var(--stone-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stage-fallback button .ic { width: 34px; height: 34px; }

/* Beschriftungen auf der Insel */
.hub-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hub-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  padding: 2px 10px 3px; border-radius: 4px; border: 1px solid var(--gold-dim);
  background: linear-gradient(rgba(33, 30, 37, 0.9), rgba(12, 10, 16, 0.9)); color: var(--gold-hi);
  font-family: var(--font-display); font-size: 16px; letter-spacing: 0.03em;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5); transition: background 0.15s;
}
.hub-label.hover, .hub-label:hover { background: linear-gradient(#5a4a22, #2e2614); border-color: var(--gold); }
.hl-badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--blood); color: #fff; font: 700 11px var(--font-body); display: inline-grid; place-items: center; }
.hub-label.ready { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -4px; } }

/* Kopfleiste */
#topbar {
  position: absolute; left: var(--side-w); right: 0; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: linear-gradient(rgba(12, 10, 16, 0.94), rgba(12, 10, 16, 0.65) 75%, transparent);
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.me-chip { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.porthole {
  width: 48px; height: 48px; border-radius: 50%; flex: none; overflow: hidden;
  border: 2.5px solid var(--gold); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 2px var(--ink), 0 0 12px rgba(201, 164, 65, 0.25);
  background: radial-gradient(circle at 40% 35%, #3a3448, #120f16);
}
.porthole img { width: 100%; height: 100%; object-fit: cover; display: block; }
.iconport { display: grid; place-items: center; height: 100%; }
.iconport .ic { width: 60%; height: 60%; }
.me-meta { min-width: 0; }
.me-meta > span { display: block; }
.me-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.me-sub { font-size: 12px; color: var(--fog); }
.xpwrap { flex: 1; min-width: 120px; max-width: 420px; background: none; border: 0; padding: 0; cursor: pointer; }
.xpbar { position: relative; display: block; height: 20px; border-radius: 3px; background: #0a080c; border: 1px solid var(--gold-dim); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6); }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#7a5cff, #4a2fb0 60%, #3a2490); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.xptext { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.res { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px;
  background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid var(--gold-dim); font-weight: 800; white-space: nowrap;
}
.daychip { font-weight: 600; font-size: 13px; }
.gauge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 2px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid var(--gold-dim); font-weight: 800; }
.gauge svg { width: 36px; height: 36px; }
.gauge small { display: block; font-size: 10px; color: var(--fog); font-weight: 600; line-height: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 4px; border: 1px solid var(--gold-dim); background: linear-gradient(var(--stone-3), var(--stone-2)); cursor: pointer; display: grid; place-items: center; color: var(--parch); }
.iconbtn:hover { border-color: var(--gold); }
.iconbtn.off { opacity: 0.45; }

/* Menueleiste: links am Desktop */
#dock {
  position: absolute; left: 0; top: 0; bottom: 0; width: var(--side-w); z-index: 25;
  display: flex; flex-direction: column; gap: 3px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 12px;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.25), transparent 30%),
    repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.015) 0 2px, transparent 2px 7px),
    linear-gradient(#211b17, #15110f);
  border-right: 2px solid var(--gold-dim); box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6);
  overflow-y: auto; scrollbar-width: none; box-sizing: border-box;
}
#dock::-webkit-scrollbar { display: none; }
.side-logo { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--gold-hi); text-align: center; text-shadow: 0 2px 0 #000, 0 0 14px rgba(201, 164, 65, 0.35); padding: 4px 0 10px; margin-bottom: 4px; border-bottom: 1px solid var(--gold-dim); }
.side-logo small { display: block; font: 600 11px var(--font-body); color: var(--fog); letter-spacing: 0.04em; margin-top: 3px; }
.dock-btn {
  position: relative; flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 4px; cursor: pointer; text-align: left;
  border: 1px solid #3a2f24; background: linear-gradient(#2b2420, #1c1714); font-weight: 700; font-size: 14.5px; color: var(--parch);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 0 #000;
}
.dock-btn .ic { width: 26px; height: 26px; }
.dock-btn:hover { border-color: var(--gold-dim); background: linear-gradient(#3a2f26, #241c17); }
.dock-btn.active { border-color: var(--gold); background: linear-gradient(#5a4520, #2e2412); color: var(--gold-hi); }
.dock-btn:active { transform: translateY(1px); }
.dock-btn .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--blood); color: #fff; font-size: 11px; display: grid; place-items: center; border: 1px solid #000; }

/* Aktivitaet */
#activity {
  position: absolute; z-index: 21; left: calc(var(--side-w) + (100vw - var(--side-w)) / 2); transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 6px;
  background: linear-gradient(rgba(33, 30, 37, 0.96), rgba(12, 10, 16, 0.96)); border: 1.5px solid var(--gold); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  max-width: calc(100vw - var(--side-w) - 32px); cursor: pointer;
}
#activity .act-text { min-width: 0; }
#activity .act-title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.progress { height: 8px; border-radius: 3px; background: #0a080c; border: 1px solid var(--gold-dim); overflow: hidden; margin-top: 4px; min-width: 160px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, #3f9f7a, var(--jade)); transition: width 0.9s linear; }
.done-pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(201, 164, 65, 0.35); } }

/* Panels */
#panel {
  position: absolute; z-index: 30; right: 14px; top: calc(var(--top-h) + 6px); bottom: 14px;
  width: var(--panel-w); display: flex; flex-direction: column;
  background: radial-gradient(ellipse at 50% 0%, #2a2530 0%, var(--stone) 60%), var(--stone);
  border: 2px solid var(--gold-dim); border-radius: 6px;
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000, 0 18px 50px rgba(0, 0, 0, 0.7);
  animation: slideIn 0.22s ease-out;
}
#panel::before, #panel::after {
  content: ""; position: absolute; width: 18px; height: 18px; top: -3px; pointer-events: none;
  border-top: 3px solid var(--gold); border-left: 3px solid var(--gold);
}
#panel::before { left: -3px; }
#panel::after { right: -3px; transform: scaleX(-1); }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px 16px; border-bottom: 1px solid var(--gold-dim); background: linear-gradient(rgba(201, 164, 65, 0.08), transparent); }
.panel-head .porthole { width: 58px; height: 58px; }
.panel-head h2 { font-size: 30px; color: var(--gold-hi); line-height: 1.05; text-shadow: 0 2px 0 #000; }
.panel-head .role { font-size: 13px; color: var(--fog); }
.panel-head .close { margin-left: auto; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; scrollbar-color: var(--gold-dim) transparent; }
.say { position: relative; background: linear-gradient(#e8dcc0, #d8c8a4); color: #2a2018; border-radius: 3px; padding: 9px 13px; margin-bottom: 14px; font-style: italic; box-shadow: 0 2px 0 #000, inset 0 0 18px rgba(120, 90, 40, 0.35); }
.say b, .say .num { font-style: normal; }
.say .btn { font-style: normal; }
.section-title { font-family: var(--font-display); font-size: 22px; color: var(--gold-hi); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(201, 164, 65, 0.25); padding-bottom: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  padding: 8px 16px; border-radius: 4px; font-weight: 800; border: 1px solid #000;
  background: linear-gradient(#f0d68a, #c9a441 50%, #8a6a24); color: var(--ink);
  box-shadow: 0 3px 0 #3a2c10, inset 0 1px 0 rgba(255, 255, 255, 0.6); white-space: nowrap; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3a2c10; }
.btn[disabled] { filter: grayscale(0.9) brightness(0.6); cursor: not-allowed; transform: none; }
.btn.ghost { background: linear-gradient(var(--stone-3), var(--stone-2)); color: var(--parch); border-color: var(--gold-dim); box-shadow: 0 2px 0 #000; text-shadow: none; }
.btn.ghost:hover { border-color: var(--gold); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 12px 24px; font-size: 18px; }
.btn.danger { background: linear-gradient(#e0705a, var(--blood) 55%, #6a1414); color: #fff; text-shadow: 0 1px 0 #000; box-shadow: 0 3px 0 #3a0a0a; }

/* Auftraege: Aushaenge am Brett */
.quests { display: grid; gap: 12px; }
.quest {
  position: relative; display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 12px; border-radius: 3px;
  background: linear-gradient(#e8dcc0, #d4c39c); color: #2a2018;
  box-shadow: 0 3px 0 #000, inset 0 0 26px rgba(110, 80, 30, 0.35);
}
.quest::before { content: ""; position: absolute; top: -5px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e0705a, #6a1414); box-shadow: 0 2px 2px rgba(0, 0, 0, 0.6); }
.quest.rare { background: linear-gradient(#2a2238, #1a1424); color: var(--parch); border: 1.5px solid var(--r-episch); box-shadow: 0 0 18px rgba(196, 123, 255, 0.35), 0 3px 0 #000; }
.quest.rare h3 { color: #e0c4ff; }
.quest.rare p { color: #d8cce8; }
.quest .mon { width: 88px; height: 88px; border-radius: 4px; background: radial-gradient(circle at 50% 40%, #3a3448, #120f16); display: grid; place-items: center; overflow: hidden; border: 1px solid #000; }
.quest .mon img, .quest .mon svg { width: 100%; height: 100%; object-fit: contain; }
.quest h3 { font-size: 21px; color: #4a1a10; }
.quest p { margin: 4px 0 8px; font-size: 14px; color: #3a2c20; }
.quest .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; align-items: center; }
.quest .rewards { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; align-items: center; font-weight: 800; }
.quest .foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.quest .muted { color: #6a5a44; }
.quest.rare .muted { color: var(--fog); }
.waves { margin: 0 0 8px; font-size: 13px; }
.wavepics { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
.wp { position: relative; width: 52px; height: 52px; border-radius: 4px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3a3448, #120f16); border: 1px solid #000; display: grid; place-items: center; }
.wp img { width: 100%; height: 100%; object-fit: contain; }
.wp.boss { border-color: var(--r-legendaer); box-shadow: 0 0 8px rgba(255, 177, 59, 0.5); }
.wp i { position: absolute; left: 2px; top: 1px; font: 800 11px var(--font-body); color: #fff; text-shadow: 0 1px 2px #000; font-style: normal; }
.wp .ic { width: 60%; height: 60%; opacity: 0.6; }
.foe-names { font-size: 12.5px; color: var(--fog); margin-left: 4px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: #0a080c; border: 1px solid var(--gold-dim); }
.pips i.on { background: var(--blood); border-color: #e0705a; }
.chance { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 3px; background: #0a080c; }
.chance.good { color: var(--jade); }
.chance.ok { color: var(--gold-hi); }
.chance.bad { color: #ff7a59; }
.mini-item { width: 36px; height: 36px; border-radius: 4px; background: radial-gradient(#3a3040, #160f1a); display: inline-grid; place-items: center; cursor: pointer; border: 2px solid var(--r-gewoehnlich); vertical-align: middle; padding: 1px; }
.mini-item svg { width: 30px; height: 30px; }
.tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--jade); color: var(--ink); font-weight: 800; vertical-align: 1px; font-family: var(--font-body); font-style: normal; }
.tag.rare { background: var(--r-episch); }

/* Gegenstaende */
.slot {
  position: relative; aspect-ratio: 1; border-radius: 4px; cursor: pointer;
  background: radial-gradient(circle at 50% 35%, #3a3040, #140f18 75%);
  border: 2px solid #3a3440; display: grid; place-items: center; padding: 5px;
  box-shadow: inset 0 0 0 1px #000, inset 0 -3px 6px rgba(0, 0, 0, 0.5);
}
.slot svg { width: 100%; height: 100%; }
.slot.empty { opacity: 0.55; cursor: default; }
.slot.empty .ic { width: 50%; height: 50%; opacity: 0.6; }
.slot.blocked::after { content: ""; position: absolute; inset: 0; background: rgba(110, 20, 20, 0.35); border-radius: 2px; }
.slot .slot-name { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 9.5px; color: var(--fog); }
.slot .up { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; filter: drop-shadow(0 1px 1px #000); }
.slot .price .ic { width: 12px; height: 12px; vertical-align: -2px; }
.slot .price { position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; background: var(--night); border: 1px solid var(--gold-dim); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.r-gewoehnlich { border-color: var(--r-gewoehnlich); }
.r-ungewoehnlich { border-color: var(--r-ungewoehnlich); }
.r-selten { border-color: var(--r-selten); box-shadow: 0 0 10px rgba(79, 169, 255, 0.4), inset 0 0 0 1px #000; }
.r-episch { border-color: var(--r-episch); box-shadow: 0 0 12px rgba(196, 123, 255, 0.5), inset 0 0 0 1px #000; }
.r-legendaer { border-color: var(--r-legendaer); box-shadow: 0 0 16px rgba(255, 177, 59, 0.6), inset 0 0 0 1px #000; }
.t-gewoehnlich { color: var(--r-gewoehnlich); }
.t-ungewoehnlich { color: var(--r-ungewoehnlich); }
.t-selten { color: var(--r-selten); }
.t-episch { color: var(--r-episch); }
.t-legendaer { color: var(--r-legendaer); }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.grid6.shop { row-gap: 18px; }

/* Charakterbogen */
.xpblock { padding: 10px 12px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid var(--gold-dim); margin-bottom: 12px; }
.xprow { display: flex; gap: 10px; align-items: baseline; }
.xprow .lv { font-family: var(--font-display); font-size: 22px; color: var(--gold-hi); }
.xprow .lv.next { color: var(--fog); }
.xpbig { position: relative; height: 22px; margin: 4px 0; border-radius: 3px; background: #0a080c; border: 1px solid var(--gold-dim); overflow: hidden; }
.xpbig i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#8a6cff, #4a2fb0 60%, #3a2490); }
.xpbig span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; text-shadow: 0 1px 2px #000; }
.xprest { font-size: 14px; }
.xprest b { color: var(--gold-hi); }
.sheet { display: grid; grid-template-columns: 74px 1fr 74px; gap: 10px; align-items: start; }
.sheet .col { display: grid; gap: 8px; }
.heroview { position: relative; height: 360px; border-radius: 4px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #3a3448 0%, #140f18 70%); border: 1px solid var(--gold-dim); }
.heroview.small { height: 320px; }
.heroview .r3d-canvas { display: block; cursor: grab; }
.heroview .hv-caption { position: absolute; left: 0; right: 0; top: 6px; text-align: center; pointer-events: none; }
.heroview .hv-caption b { font-family: var(--font-display); font-size: 24px; font-weight: 400; color: var(--gold-hi); text-shadow: 0 2px 0 #000; }
.hv-fallback { display: grid; place-items: center; height: 100%; }
.hv-fallback svg { width: 60%; }
.attrs { display: grid; gap: 6px; }
.attr { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; }
.attr .ic { width: 24px; height: 24px; }
.attr .val { font-weight: 800; font-size: 17px; }
.attr .cost { font-size: 12px; color: var(--fog); white-space: nowrap; }
.attr.main { border-color: var(--gold-dim); }
.plus { width: 34px; height: 34px; padding: 0; font-size: 20px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 14px; margin-top: 10px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(164, 158, 148, 0.25); padding-bottom: 3px; }
.special { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--gold); background: rgba(201, 164, 65, 0.08); font-size: 13.5px; }
.special b { color: var(--gold-hi); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { padding: 6px 12px; border-radius: 4px; border: 1px solid var(--gold-dim); background: linear-gradient(var(--stone-3), var(--stone-2)); cursor: pointer; font-weight: 700; }
.tab.on { background: linear-gradient(#f0d68a, #c9a441 60%, #8a6a24); color: var(--ink); border-color: #000; }
.mirror { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; align-items: start; }
.mirror-form h4, .cform h4 { font-size: 17px; color: var(--gold-hi); margin: 12px 0 5px; }
.lore { padding: 10px 12px; margin-bottom: 10px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; border-left: 3px solid var(--gold-dim); }
.lore h3 { font-size: 22px; color: var(--gold-hi); display: flex; align-items: center; gap: 8px; }
.lore h3 small { font: italic 13px var(--font-body); color: var(--fog); }
.lore p { margin: 6px 0; }
.lore.realm-albion { border-left-color: var(--albion); }
.lore.realm-midgard { border-left-color: var(--midgard); }
.lore.realm-hibernia { border-left-color: var(--hibernia); }

/* Vergleich und Tooltips */
#tip {
  position: fixed; z-index: 90; pointer-events: none; width: 270px; padding: 10px 12px; border-radius: 4px;
  background: linear-gradient(rgba(33, 30, 37, 0.98), rgba(12, 10, 16, 0.98)); border: 2px solid var(--r-gewoehnlich); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); font-size: 13.5px;
}
.itemcard h4 { margin: 0 0 2px; font-size: 19px; }
.itemcard .kind { font-size: 12px; color: var(--fog); margin-bottom: 6px; }
.itemcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.itemcard li { display: flex; justify-content: space-between; gap: 10px; }
.delta-up { color: var(--jade); font-weight: 800; }
.delta-down { color: #ff7a59; font-weight: 800; }
.itemcard .cmp { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(164, 158, 148, 0.3); font-size: 12.5px; }
.cmptable { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13.5px; }
.cmptable th { text-align: right; font-size: 11.5px; color: var(--fog); font-weight: 700; padding: 3px 6px; }
.cmptable th:first-child, .cmptable td:first-child { text-align: left; }
.cmptable td { padding: 4px 6px; border-top: 1px solid rgba(164, 158, 148, 0.15); text-align: right; }
.cmptable tr.sep th { text-align: left; padding-top: 10px; color: var(--gold-hi); font: 400 17px var(--font-display); }

/* Dialoge */
#modal { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; padding: 16px; background: rgba(5, 4, 8, 0.7); backdrop-filter: blur(3px); }
.dialog {
  width: min(500px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 18px 20px 20px; border-radius: 6px;
  background: radial-gradient(ellipse at 50% 0%, #2a2530, var(--stone) 70%); border: 2px solid var(--gold-dim); box-shadow: inset 0 0 0 1px #000, 0 20px 60px rgba(0, 0, 0, 0.7);
  animation: pop 0.22s ease-out;
}
.dialog.wide { width: min(720px, 100%); }
@keyframes pop { from { transform: scale(0.94); opacity: 0; } }
.dialog h2 { font-size: 32px; color: var(--gold-hi); margin-bottom: 8px; text-shadow: 0 2px 0 #000; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.dialog textarea, .dialog input[type="text"] { width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid var(--gold-dim); background: #0a080c; color: var(--parch); padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
.realmcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.realmcard { text-align: left; cursor: pointer; padding: 12px; border-radius: 4px; border: 1.5px solid #000; background: linear-gradient(var(--stone-3), var(--stone-2)); display: flex; flex-direction: column; gap: 4px; }
.realmcard .ic { width: 42px; height: 42px; }
.realmcard h3 { font-size: 24px; color: var(--gold-hi); }
.realmcard i { font-size: 13px; color: var(--fog); }
.realmcard p { margin: 4px 0; font-size: 13px; }
.realmcard:hover, .realmcard.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(201, 164, 65, 0.3); }
.realmcard.r-albion { background: linear-gradient(rgba(184, 50, 46, 0.35), var(--stone-2)); }
.realmcard.r-midgard { background: linear-gradient(rgba(47, 95, 168, 0.35), var(--stone-2)); }
.realmcard.r-hibernia { background: linear-gradient(rgba(47, 143, 79, 0.35), var(--stone-2)); }
.realmcards.small .realmcard { align-items: center; text-align: center; padding: 8px 4px; }
.realmcards.small .realmcard h3 { font-size: 20px; }
.realmcards.small .realmcard .ic { width: 34px; height: 34px; }

/* Kampf */
#battle { position: fixed; inset: 0; z-index: 70; background: var(--night); }
#battle .bstage { position: absolute; inset: 0; }
#battle .bstage .r3d-canvas { display: block; }
.battle-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fx-text { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 36px; color: #fff; text-shadow: 0 3px 0 #000, 0 0 10px rgba(0, 0, 0, 0.7); animation: floatUp 1.1s ease-out forwards; white-space: nowrap; }
.fx-text.crit { font-size: 54px; color: var(--r-legendaer); }
.fx-text.critlabel { font-size: 24px; color: var(--r-legendaer); margin-top: -50px; }
.fx-text.evade { color: var(--frost); font-size: 26px; }
.fx-text.block { color: var(--gold-hi); font-size: 26px; }
.fx-text.stun { color: #ffe45a; font-size: 24px; margin-top: -30px; }
.fx-text.heal { color: #7fffb0; font-size: 32px; }
.fx-text.poison { color: #9fff5a; font-size: 26px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
.fx-banner { position: absolute; top: 26%; font-family: var(--font-display); font-size: 44px; color: var(--gold-hi); text-shadow: 0 3px 0 #000, 0 0 18px rgba(201, 164, 65, 0.5); padding: 4px 26px; background: linear-gradient(90deg, transparent, rgba(12, 10, 16, 0.85), transparent); animation: bannerIn 1.2s ease-out forwards; white-space: nowrap; }
.fx-banner.left { left: 8%; }
.fx-banner.right { right: 8%; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.4); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.plates { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; pointer-events: none; z-index: 2; }
.plate { display: flex; align-items: center; gap: 10px; width: min(360px, 40%); padding: 8px 12px 8px 8px; border-radius: 4px; background: linear-gradient(rgba(33, 30, 37, 0.92), rgba(12, 10, 16, 0.92)); border: 1.5px solid var(--gold-dim); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
.plate.right { flex-direction: row-reverse; text-align: right; }
.plate .porthole { width: 52px; height: 52px; }
.plate .pmeta { flex: 1; min-width: 0; }
.plate .pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .plv { font-size: 12px; color: var(--fog); }
.btitle { flex: 1; text-align: center; font-family: var(--font-display); font-size: 24px; color: var(--gold-hi); text-shadow: 0 2px 0 #000; padding-top: 6px; }
.btitle .wave { font: 700 14px var(--font-body); color: var(--parch); }
.btitle .wave b { color: var(--r-legendaer); }
.wavebanner { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); z-index: 3; font-family: var(--font-display); font-size: 40px; color: var(--r-legendaer); text-shadow: 0 3px 0 #000; padding: 6px 30px; background: linear-gradient(90deg, transparent, rgba(12, 10, 16, 0.9), transparent); animation: bannerIn 1.8s ease-out forwards; white-space: nowrap; pointer-events: none; }
.hp { position: relative; height: 16px; border-radius: 2px; background: #2a0d10; border: 1px solid #000; overflow: hidden; margin-top: 4px; }
.hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#e0504a, #9a1a1a); transition: width 0.3s ease-out; }
.hp i.low { background: linear-gradient(#ff9a6a, #c03a1a); animation: lowhp 0.8s ease-in-out infinite; }
@keyframes lowhp { 50% { filter: brightness(1.4); } }
.hp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; text-shadow: 0 1px 0 #000; }
.plate.right .hp i { left: auto; right: 0; }
.bcontrols .on { background: linear-gradient(#f0d68a, #c9a441); color: var(--ink); }
.bcontrols { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 2; flex-wrap: wrap; justify-content: center; }
.blog { position: absolute; left: 16px; right: 16px; bottom: 70px; height: 130px; overflow-y: auto; padding: 12px; border-radius: 4px; background: rgba(12, 10, 16, 0.85); font-size: 14px; border: 1px solid var(--gold-dim); }
.blog p { margin: 0 0 4px; }
.fb2d { position: absolute; inset: 100px 16px 220px; display: flex; justify-content: space-around; align-items: center; }
.fb2d .fig { width: min(200px, 38vw); transition: transform 0.15s; }
.fb2d .fig.hit { transform: translateX(10px) rotate(4deg); filter: brightness(2); }
.result { text-align: center; }
.result h2 { font-size: 50px; }
.result.win h2 { color: var(--gold-hi); }
.result.lose h2 { color: #ff7a59; }
.rewardlist { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
.rewardlist .chip { font-size: 16px; }
.lootcard { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; text-align: left; width: min(340px, 100%); margin: 6px auto; padding: 10px 12px; border-radius: 4px; background: #0c0a10; border: 2px solid; }
.lootpic { width: 76px; height: 76px; border-radius: 4px; border: 2px solid; display: grid; place-items: center; background: radial-gradient(#3a3040, #140f18); }
.lootpic svg { width: 66px; height: 66px; }
.xpmini { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; font-size: 13.5px; }
.xpmini .xpbar { width: 140px; height: 10px; }

/* Hinweise und Meldungen */
#toasts { position: fixed; z-index: 80; top: calc(var(--top-h) + 10px); left: calc(var(--side-w) + (100vw - var(--side-w)) / 2); transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 4px; background: linear-gradient(rgba(33, 30, 37, 0.97), rgba(12, 10, 16, 0.97)); border: 1.5px solid var(--gold-dim); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5); display: flex; gap: 10px; align-items: center; animation: toastIn 0.3s ease-out; font-weight: 700; }
.toast.good { border-color: var(--jade); }
.toast.bad { border-color: #ff7a59; }
.toast.gold { border-color: var(--r-legendaer); background: linear-gradient(90deg, rgba(90, 60, 10, 0.97), rgba(12, 10, 16, 0.97)); }
.toast.out { animation: toastOut 0.35s ease-in forwards; }
body.in-battle #toasts { top: auto; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }
#hint { position: absolute; z-index: 40; left: calc(var(--side-w) + 14px); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 4px; background: linear-gradient(#e8dcc0, #d4c39c); color: #2a2018; border: 1.5px solid #000; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55), inset 0 0 20px rgba(110, 80, 30, 0.35); }
#hint .porthole { width: 52px; height: 52px; }
#hint p { margin: 0 0 8px; font-size: 14px; }
#hint .btn.ghost { color: var(--parch); }

/* Heldenerschaffung */
#create { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 540px); background: radial-gradient(ellipse at 30% 40%, #2a2a44, var(--night) 70%); overflow: hidden; }
#create[data-realm="albion"] { background: radial-gradient(ellipse at 30% 40%, #4a1a1a, var(--night) 70%); }
#create[data-realm="midgard"] { background: radial-gradient(ellipse at 30% 40%, #18284a, var(--night) 70%); }
#create[data-realm="hibernia"] { background: radial-gradient(ellipse at 30% 40%, #143a22, var(--night) 70%); }
#create .cview { position: relative; min-height: 0; }
#create .cview .r3d-canvas { display: block; }
#create .ctitle { position: absolute; left: 24px; top: calc(18px + env(safe-area-inset-top, 0px)); z-index: 2; pointer-events: none; }
#create .ctitle h1 { font-size: 58px; color: var(--gold-hi); text-shadow: 0 3px 0 #000, 0 0 24px rgba(201, 164, 65, 0.3); line-height: 0.95; }
#create .ctitle p { margin: 6px 0 0; color: var(--fog); max-width: 420px; font-size: 14px; }
#create .cform { overflow-y: auto; padding: 18px 20px 28px; background: radial-gradient(ellipse at 50% 0%, #2a2530, var(--stone) 70%); border-left: 2px solid var(--gold-dim); }
.step { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; }
.step:first-child { margin-top: 0; }
.step h3 { font-size: 22px; color: var(--gold-hi); }
.stepno { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(#f0d68a, #8a6a24); color: var(--ink); font-weight: 800; border: 1px solid #000; flex: none; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.choice { padding: 7px 6px; border-radius: 4px; border: 1px solid #000; background: linear-gradient(var(--stone-3), var(--stone-2)); cursor: pointer; font-weight: 700; text-align: center; }
.choice.on { border-color: var(--gold); background: linear-gradient(#4a3a1c, #2a2012); color: var(--gold-hi); }
.choice small { display: block; font-weight: 500; font-size: 11.5px; color: var(--fog); }
.choice .crest { width: 28px; height: 28px; }
.cls-choices { grid-template-columns: repeat(4, 1fr); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #000; cursor: pointer; box-shadow: 0 0 0 2px transparent; }
.sw.on { box-shadow: 0 0 0 2px var(--gold-hi); }
.sw.glowsw { box-shadow: 0 0 8px currentColor, 0 0 0 1px rgba(255, 255, 255, 0.5); }
.sw.glowsw.on { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 10px rgba(255, 255, 255, 0.6); }
.cform .desc { font-size: 13.5px; color: #d6cab0; margin: 6px 0 0; }
.cform input#heroName { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--gold-dim); background: #0a080c; color: var(--parch); }

/* Wunschbrunnen */
.well { display: grid; place-items: center; padding: 18px 0 8px; perspective: 600px; }
.coin { width: 110px; height: 110px; position: relative; transform-style: preserve-3d; }
.coin.flip { animation: coinflip 1.6s cubic-bezier(0.2, 0.7, 0.3, 1); }
.coin .face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff1b8, #d9a441 55%, #8a6a22); border: 4px solid #6e5a2a; box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.2), 0 6px 18px rgba(0, 0, 0, 0.6); }
.coin .face .ic { width: 60%; height: 60%; }
.coin .back { transform: rotateY(180deg); }
@keyframes coinflip { 0% { transform: translateY(0) rotateY(0); } 45% { transform: translateY(-110px) rotateY(900deg); } 100% { transform: translateY(0) rotateY(1800deg); } }
.wellbox { margin: 10px 0; padding: 12px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; text-align: center; display: grid; gap: 8px; justify-items: center; }
.wellbox.ready { border-color: var(--jade); box-shadow: 0 0 14px rgba(111, 208, 168, 0.25); }
.wl-title { font-family: var(--font-display); font-size: 20px; color: var(--gold-hi); display: flex; gap: 6px; align-items: center; }
.wl-big { font-family: var(--font-display); font-size: 40px; color: var(--parch); line-height: 1; }

/* Tabellen, Karten, Ranglisten */
table.fame { width: 100%; border-collapse: collapse; font-size: 14px; }
table.fame th { text-align: left; font-size: 12px; color: var(--fog); font-weight: 700; padding: 4px 6px; }
table.fame td { padding: 6px; border-top: 1px solid rgba(164, 158, 148, 0.15); }
table.fame tr.me td { background: rgba(201, 164, 65, 0.16); }
table.fame tr.gap td { text-align: center; color: var(--fog); }
table.fame tr[data-act] { cursor: pointer; }
table.fame tr[data-act]:hover td { background: rgba(255, 255, 255, 0.05); }
.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; }
.card .pic { width: 72px; height: 72px; border-radius: 4px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3a3448, #120f16); display: grid; place-items: center; border: 1px solid #000; }
.card .pic.dpic { background: radial-gradient(circle at 50% 40%, var(--theme, #3a3448), #120f16 80%); }
.card .pic img, .card .pic svg { width: 100%; height: 100%; object-fit: contain; }
.card .pic.iconport .ic { width: 70%; height: 70%; }
.card h4 { margin: 0; font-size: 19px; color: var(--gold-hi); }
.card.locked { opacity: 0.55; }
.realmchip { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
.realmbar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; border: 1px solid #000; margin: 4px 0 12px; }
.rb { display: grid; place-items: center; min-width: 0; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-shadow: 0 1px 2px #000; }
.rb.r-albion, .realmrow.r-albion { background: linear-gradient(#c8423e, #6a1414); }
.rb.r-midgard, .realmrow.r-midgard { background: linear-gradient(#3f6fb8, #14284a); }
.rb.r-hibernia, .realmrow.r-hibernia { background: linear-gradient(#3f9f5f, #123a22); }
.realmrow { display: grid; grid-template-columns: 30px 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #000; }
.realmrow .rk { font-family: var(--font-display); font-size: 28px; color: var(--gold-hi); text-shadow: 0 2px 0 #000; }
.realmrow .ic { width: 32px; height: 32px; }
.realmrow.mine { outline: 2px solid var(--gold); }
.realmrow .muted { color: #e8dcc0; opacity: 0.8; }
.chapters { display: grid; gap: 12px; }
.chapter { padding: 12px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; }
.chapter.open { border-color: var(--gold); box-shadow: 0 0 14px rgba(201, 164, 65, 0.25); }
.chapter.done { opacity: 0.75; }
.chapter.locked { opacity: 0.5; }
.ch-kind { font-size: 12px; color: var(--fog); text-transform: uppercase; letter-spacing: 0.06em; }
.chapter h3 { font-size: 24px; color: var(--gold-hi); }
.chapter p { margin: 6px 0; font-size: 14px; }
.chapter .foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.guildhead { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 4px; border: 1px solid #000; }
.guildhead .ic { width: 52px; height: 52px; }
.guildhead h3 { font-size: 26px; color: var(--gold-hi); }
.guildhead.r-albion { background: linear-gradient(rgba(184, 50, 46, 0.4), var(--stone-2)); }
.guildhead.r-midgard { background: linear-gradient(rgba(47, 95, 168, 0.4), var(--stone-2)); }
.guildhead.r-hibernia { background: linear-gradient(rgba(47, 143, 79, 0.4), var(--stone-2)); }
.guildform { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: end; }
.guildform label { display: grid; gap: 3px; font-size: 12.5px; color: var(--fog); }
.guildform input { padding: 8px 10px; border-radius: 4px; border: 1px solid var(--gold-dim); background: #0a080c; color: var(--parch); font: inherit; }
.homeview { position: relative; height: 300px; border-radius: 4px; overflow: hidden; border: 1px solid var(--gold-dim); background: #120f16; margin-bottom: 12px; }
.homeview .r3d-canvas { display: block; cursor: grab; }
.homeview .hv-fallback .ic { width: 40%; height: 40%; opacity: 0.5; }
.housecard { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); border: 1px solid #000; }
.housecard h3 { font-size: 24px; color: var(--gold-hi); }

.beast.unknown .pic img { filter: brightness(0) opacity(0.5); }
.ach { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 4px; background: linear-gradient(var(--stone-3), var(--stone-2)); margin-bottom: 6px; }
.ach .ic { width: 30px; height: 30px; }

<script>/* src/engine.js */
/* Helden von Schwebfels - Spiellogik ohne DOM (Version 2).
   Laeuft im Browser und in Node (fuer Tests und Balance-Simulationen). */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;

  /* ---------------- Hilfsfunktionen ---------------- */
  const U = (SB.util = {});
  U.hash = function (str) {
    let h = 2166136261 >>> 0;
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };
  U.rng = function (seed) {
    let a = (typeof seed === "string" ? U.hash(seed) : seed >>> 0) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  U.rf = (r, a, b) => a + r() * (b - a);
  U.pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  U.wpick = function (r, list, key) {
    key = key || "w";
    let total = 0;
    for (const it of list) total += it[key];
    let x = r() * total;
    for (const it of list) {
      x -= it[key];
      if (x <= 0) return it;
    }
    return list[list.length - 1];
  };
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.fmt = function (n) {
    n = Math.round(n);
    const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (n < 0 ? "-" : "") + s;
  };
  U.fmtShort = function (n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " Mio.";
    if (n >= 1e4) return Math.round(n / 1000) + " Tsd.";
    return U.fmt(n);
  };
  U.fmtTime = function (ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    return m + ":" + String(sec).padStart(2, "0");
  };
  U.esc = (str) =>
    String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  U.dayKey = function (ts) {
    const d = new Date(ts);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  };
  U.cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  let uidCounter = 0;
  U.uid = () => Date.now().toString(36) + "-" + (uidCounter++).toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);

  /* ---------------- Ereignisbus ---------------- */
  const listeners = {};
  SB.bus = {
    on(ev, fn) {
      (listeners[ev] = listeners[ev] || []).push(fn);
    },
    emit(ev, payload) {
      (listeners[ev] || []).forEach((fn) => {
        try {
          fn(payload);
        } catch (e) {
          console.error(e);
        }
      });
    },
  };
  const toast = (text, kind, extra) => SB.bus.emit("toast", Object.assign({ text, kind: kind || "info" }, extra || {}));

  /* ---------------- Kurven und Konstanten ---------------- */
  const E = (SB.engine = {});
  E.now = () => Date.now();
  E.C = {
    ENERGY_MAX: 100,
    ENERGY_REGEN_MS: 36 * 1000,
    BREW_ENERGY: 30,
    BREW_MAX: 5,
    MONSTER_Q: 1.1,
    SHIFT_MS: 5 * 60 * 1000,
    SHIFT_MAX: 8,
    ARENA_CD: 5 * 60 * 1000,
    DUNGEON_CD: 10 * 60 * 1000,
    STORY_CD: 5 * 60 * 1000,
    SHOP_REFRESH: 15 * 60 * 1000,
    INV_SIZE: 12,
    WELL_PAID_MAX: 10,
    SPECIAL_EVERY: 4,
    MAX_ACTIONS: 90,
    NPC_COUNT: 150,
    GUILD_COST: 500,
    CHAIN_BREATHER: 0.12,
  };
  E.xpNeed = (L) => Math.round(80 * Math.pow(L, 1.75) + 40);
  E.goldBase = (L) => Math.round(6 + 3.2 * Math.pow(L, 1.42));
  E.questXpFrac = (L) => Math.max(0.07, 0.3 - 0.0075 * (L - 1));
  E.attrCost = (b) => Math.round(3 + 0.45 * Math.pow(b, 1.62) + b * 1.5);
  E.itemStat = (L) => 1.5 + 0.9 * L;
  E.weaponAvg = (L) => 2 + 1.5 * L;
  E.baseDmg = (L) => [Math.round(1 + 0.6 * L), Math.round(2 + 0.9 * L)];
  E.armorBase = (L) => 6 + 4.5 * L;
  E.itemValue = (L) => 10 + 6 * Math.pow(L, 1.3);

  E.classOf = (S) => D.CLASSES[S.cls];
  E.archOf = (S) => D.CLASSES[S.cls].arch;
  const CLASS_FOR = {};
  for (const id in D.CLASSES) {
    const c = D.CLASSES[id];
    (CLASS_FOR[c.realm] = CLASS_FOR[c.realm] || {})[c.arch] = id;
  }
  E.CLASS_FOR = CLASS_FOR;

  /* ---------------- Heim (Housing) ---------------- */
  E.furn = (S, id) => (S.house && S.house.furn[id]) || 0;
  E.furnDef = (id) => D.FURNITURE.find((f) => f.id === id);
  E.energyMax = (S) => E.C.ENERGY_MAX + E.furn(S, "lager") * 10;
  E.invSize = (S) => E.C.INV_SIZE + E.furn(S, "truhe") * 2;
  E.bossesDefeated = (S) => Object.values(S.dungeons.progress).reduce((a, b) => a + b, 0);
  E.goldBonus = (S) => (E.furn(S, "trophaeen") ? E.bossesDefeated(S) * 0.01 : 0);
  E.xpBonus = (S) => E.furn(S, "herd") * 0.03;
  E.buyHouseTier = function (S) {
    const next = D.HOUSE_TIERS[S.house.tier + 1];
    if (!next) return { ok: false, msg: "Dein Heim ist bereits vollständig ausgebaut." };
    if (S.level < next.lv) return { ok: false, msg: "Dafür brauchst du Stufe " + next.lv + "." };
    if (S.gold < next.cost) return { ok: false, msg: "Dafür reicht dein Gold nicht." };
    if (next.perlen && S.perlen < next.perlen) return { ok: false, msg: "Dafür fehlen dir Wolkenperlen." };
    S.gold -= next.cost;
    if (next.perlen) S.perlen -= next.perlen;
    S.house.tier++;
    if (S.house.tier >= 1) E.grantAch(S, "heim");
    return { ok: true, name: next.name };
  };
  E.furnCost = function (S, id) {
    const f = E.furnDef(id);
    const lv = E.furn(S, id);
    if (lv >= f.levels.length) return null;
    return { gold: f.cost[lv], tier: f.tier[lv], name: f.levels[lv] };
  };
  E.buyFurniture = function (S, id) {
    const c = E.furnCost(S, id);
    if (!c) return { ok: false, msg: "Das ist bereits auf höchster Stufe." };
    if (S.house.tier < c.tier) return { ok: false, msg: "Dafür muss dein Heim zur " + D.HOUSE_TIERS[c.tier].name + " ausgebaut sein." };
    if (S.gold < c.gold) return { ok: false, msg: "Dafür reicht dein Gold nicht." };
    S.gold -= c.gold;
    S.house.furn[id] = E.furn(S, id) + 1;
    return { ok: true, name: c.name };
  };

  /* ---------------- Gegenstaende ---------------- */
  const ADJ_END = { m: "er", f: "e", n: "es", pl: "e" };
  const TINTS = {
    platte: ["#9aa4ad", "#b8bec4", "#7f8a96", "#c9a441", "#8d6b4a", "#5a6270"],
    leder: ["#6b4a2f", "#4a3424", "#8a5a35", "#3f4a2a", "#2f2a2a", "#5a3a2a"],
    stoff: ["#4b3f9f", "#2f4f8f", "#7a2f6f", "#2f6a5b", "#8a2a2a", "#3a3346"],
    schmuck: ["#e0b04a", "#c9d2d8", "#d98a4a", "#5fd0d6", "#c47bff", "#ff5a7a"],
    holz: ["#6b4a2f", "#4a3424", "#8a5a35"],
  };
  E.baseFor = function (slot, arch, r) {
    const A = D.ARCHETYPES[arch];
    if (slot === "waffe") return U.pick(r, A.weapons);
    if (slot === "nebenhand") return A.offhand;
    if (slot === "helm") return A.helm;
    if (slot === "ruestung") return A.chest;
    return slot;
  };
  E.rollRarity = function (r, opts) {
    opts = opts || {};
    const min = opts.minRarity ? D.RARITY_ORDER.indexOf(opts.minRarity) : 0;
    const boost = opts.boost || 0;
    const list = D.RARITY_ORDER.map((id, i) => ({ id, w: i < min ? 0 : D.RARITIES[id].weight * Math.pow(1 + boost, i) }));
    return U.wpick(r, list).id;
  };
  E.makeItem = function (r, opts) {
    const L = Math.max(1, Math.round(opts.level || 1));
    const arch = opts.arch || (opts.cls && D.CLASSES[opts.cls] ? D.CLASSES[opts.cls].arch : "krieger");
    const A = D.ARCHETYPES[arch];
    const slot = opts.slot || U.pick(r, D.SLOTS);
    const base = opts.base || E.baseFor(slot, arch, r);
    const B = D.BASES[base];
    const rarity = opts.rarity || E.rollRarity(r, opts);
    const R = D.RARITIES[rarity];
    const SI = D.SLOT_INFO[slot];
    const stats = {};
    const used = [];
    const statBase = E.itemStat(L) * R.mult * SI.stat;
    const lineMult = [1, 0.7, 0.55, 0.45];
    for (let i = 0; i < R.lines; i++) {
      let attr;
      if (i === 0) attr = r() < 0.68 ? A.main : "konstitution";
      else {
        const pool = D.ATTRS.filter((a) => used.indexOf(a) < 0).map((a) => ({ a, w: a === A.main ? 3 : a === "konstitution" ? 3 : a === "glueck" ? 2 : 1 }));
        attr = U.wpick(r, pool).a;
      }
      used.push(attr);
      stats[attr] = Math.max(1, Math.round(statBase * lineMult[i] * U.rf(r, 0.88, 1.12)));
    }
    const names = B.byArch ? B.byArch[arch] : B.names;
    const variant = Math.floor(r() * names.length);
    const item = { id: U.uid(), base, slot, arch: B.arch || null, level: L, rarity, stats, variant, style: variant % 3 };
    if (SI.armor > 0) item.armor = Math.max(1, Math.round(E.armorBase(L) * SI.armor * Math.pow(R.mult, 0.8) * U.rf(r, 0.9, 1.1)));
    if (slot === "waffe") {
      const avg = E.weaponAvg(L) * Math.pow(R.mult, 0.85) * U.rf(r, 0.94, 1.06);
      item.min = Math.max(1, Math.round(avg * 0.78));
      item.max = Math.max(item.min + 1, Math.round(avg * 1.22));
    }
    const noun = names[variant];
    const adj = U.pick(r, D.ADJ[rarity]);
    const adjWords = adj.split(" ");
    adjWords[adjWords.length - 1] += ADJ_END[B.g];
    let name = U.cap(adjWords.join(" ")) + " " + noun;
    if (D.RARITY_ORDER.indexOf(rarity) >= 2) name += " " + U.pick(r, D.SUFFIX[used[0]]);
    if (rarity === "legendaer") name = U.pick(r, D.LEGEND_NAMES) + ", " + adjWords.join(" ") + " " + noun;
    item.name = name;
    let palette;
    if (["amulett", "ring", "talisman"].indexOf(slot) >= 0) palette = TINTS.schmuck;
    else if (slot === "waffe" && ["bogen", "stab", "speer", "runenstab"].indexOf(base) >= 0) palette = TINTS.holz;
    else if (slot === "umhang") palette = TINTS.stoff.concat(TINTS.leder.slice(0, 2));
    else palette = TINTS[A.material];
    item.tint = U.pick(r, palette);

  /* Alte Spielstaende (Version 1) uebernehmen */
  const RACE_MAP = { wolkling: "albier", steinbart: "kreidezwerg", hornvolk: "trollblut", nebelalb: "sidhe", moosling: "moorling" };
  const ARCH_MAP = { klinge: "krieger", wind: "jaeger", rune: "magier" };
  E.migrate = function (S) {

        delete it.cls;
        if (it.variant === undefined) it.variant = it.style || 0;

      };
      for (const s of D.SLOTS) S.equip[s] = fixItem(S.equip[s] || null);

  /* Nach der Uebernahme darf das Reich einmal gewechselt werden; die Grundart bleibt. */
  E.chooseRealm = function (S, realm) {

      if (R.hairs.indexOf(S.look.hair) < 0) S.look.hair = R.hairs[0];

  E.setLook = function (S, look) {

  /* ---------------- Werte des Helden ---------------- */
  E.activeBuffs = function (S, now) {

  E.heroAttrs = function (S, now) {
    const C = E.classOf(S);
    const out = {};
    for (const a of D.ATTRS) {
      const auto = a === C.main || a === "konstitution" ? S.level - 1 : Math.floor((S.level - 1) / 2);
      out[a] = S.base[a] + S.bought[a] + auto;
    }
    for (const s of D.SLOTS) {
      const it = S.equip[s];
      if (it) for (const a in it.stats) out[a] += it.stats[a];

    const mult = { kraft: 1, geschick: 1, verstand: 1, konstitution: 1, glueck: 1 };
    mult[C.main] += E.furn(S, "altar") * 0.02;
    for (const b of E.activeBuffs(S, now)) {
      const P = D.POTIONS.find((p) => p.id === b.id);
      if (!P) continue;
      for (const k in P.eff) {
        if (k === "main") mult[C.main] += P.eff[k];
        else if (k === "all") D.ATTRS.forEach((a) => (mult[a] += P.eff[k]));

  E.profileFor = function (cls) {

  E.heroFighter = function (S, now) {

  E.summaryOf = function (f) {

  E.heroSummary = (S, now) => E.summaryOf(E.heroFighter(S, now));
  /* Vergleich: Werte des Helden, wenn er einen Gegenstand anlegen wuerde */
  E.previewEquip = function (S, item) {

  /* Modell-Held einer Stufe: Basis fuer Monster, NPC-Helden und Balance */
  E.modelAttrs = function (L, q) {
    q = q == null ? 1 : q;

      main: Math.round(12 + (9 * L + 0.24 * L * L) * q),

  E.modelHeroFighter = function (L, cls, q, extra) {

      {

    );

  E.monsterFighter = function (mon, L, power, opts) {
    opts = opts || {};
    const type = D.ARCH_TYPE[mon.arch];
    const T = D.MONSTER_TYPES[type];
    const ramp = Math.min(1, 0.62 + 0.042 * L);
    const p = power * ramp;
    const m = E.modelAttrs(L, E.C.MONSTER_Q);
    const attrs = { kraft: 0, geschick: 0, verstand: 0, konstitution: 0, glueck: 0 };
    attrs.kraft = attrs.geschick = attrs.verstand = Math.round(m.other * p);
    attrs[type] = Math.round(m.main * 0.86 * p);
    attrs.konstitution = Math.round(m.con * 0.95 * p);
    attrs.glueck = Math.round(m.luck * 0.8 * p);
    const hpBoost = opts.boss ? 1.25 : 1;
    const prof = { hpMult: T.hpMult, armorCap: T.armorCap, block: T.block, evade: T.evade, unblockable: T.unblockable, dmgMult: T.dmgMult, special: T.special, critMult: 2, critBonus: 0 };
    const wAvg = m.weapon * (0.85 + 0.15 * p) + (E.baseDmg(L)[0] + E.baseDmg(L)[1]) / 2;
    return {
      kind: "monster", id: mon.id, name: mon.name, arch: mon.arch, color: mon.color, accent: mon.accent,

      maxHp: Math.round(attrs.konstitution * prof.hpMult * (L + 1) * hpBoost),
      wMin: Math.max(1, Math.round(wAvg * 0.8)), wMax: Math.max(2, Math.round(wAvg * 1.2)),
