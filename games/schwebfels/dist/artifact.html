      else if (s.dungeons.next > now) h += '<div class="say">Du brauchst noch <b class="num" data-until="' + s.dungeons.next + '"></b> Erholung. <button class="btn small" data-act="dungeonSkip">Sofort · 1 ' + I.ui("perle") + "</button></div>";
      const hero = E.heroFighter(s, now);
      h += '<div class="cards">';
      D.DUNGEONS.forEach((dg, d) => {
        const st = E.dungeonState(s, d);
        let pic;
        let info;
        let btn = "";
        if (!st.unlocked) {
          pic = I.ui("tiefen");
          info = '<div class="muted" style="font-size:13px">Öffnet sich ab Stufe ' + dg.unlock + (d > 0 ? " und nach dem ersten Boss des vorigen Dungeons" : "") + ".</div>";
        } else if (st.done) {
          pic = UI.portrait(UI.monDesc(dg.bosses[7], true, true), 128);
          info = '<div style="font-size:13px" class="delta-up">Gesäubert! Alle acht Bosse besiegt.</div>';
        } else {
          const b = E.bossFor(d, st.cleared);
          const foe = E.monsterFighter(b.mon, b.L, b.power, { boss: true, final: b.final });
          const c = estimate(hero, foe, b.mon.id);
          pic = UI.portrait(UI.monDesc(b.mon, true, b.final), 128);
          info = '<div style="font-size:13px">Boss ' + (st.cleared + 1) + "/8: <b>" + esc(b.mon.name) + "</b> · Stufe " + b.L + "</div>" + chanceTxt(c);
          btn = '<button class="btn" data-act="dungeonFight" data-d="' + d + '"' + (busy || s.dungeons.next > now ? " disabled" : "") + ">Angreifen</button>";
        }
        h +=
          '<div class="card' + (st.unlocked ? "" : " locked") + '"><div class="pic">' + pic + "</div><div><h4>" + esc(dg.name) + '</h4><div class="muted" style="font-size:12.5px">' + esc(dg.desc) + "</div>" +
          '<div class="pips" style="margin:5px 0">' + dg.bosses.map((_, i) => '<i class="' + (i < st.cleared ? "on" : "") + '"></i>').join("") + "</div>" + info + "</div>" + btn + "</div>";
      });
      return h + "</div>";
    },
  };
  A.dungeonSkip = () => {
    if (!done(E.skipDungeon(S()))) return;
    UI.refresh();
  };
  A.dungeonFight = async (el) => {
    const s = S();
    const d = +el.dataset.d;
    const res = E.dungeonFight(s, d);
    if (!done(res)) return;
    const rew = E.resolveDungeon(s, res.fight);
    UI.saveNow();
    await UI.runBattle(res.fight, { setting: "dungeon", tint: D.DUNGEONS[d].theme, title: D.DUNGEONS[d].name, rewards: rew, foeName: res.fight.boss.mon.name });
    UI.refresh();
  };

  /* ================= Stall ================= */
  P.stall = {
    render() {
      const s = S();
      let h = say("hufnagel");
      h += '<div class="muted" style="margin-bottom:10px">Reittiere verkürzen die Reisezeit zu jedem Auftrag dauerhaft. Es zählt immer dein schnellstes Tier.</div><div class="cards">';
      const colors = { esel: "#c9d2d8", ziege: "#e8d6b0", greif: "#e0b04a", wal: "#4f8fd8" };
      for (const m of D.MOUNTS) {
        const owned = s.mounts.owned.indexOf(m.id) >= 0;
        const cost = m.cost.gold ? UI.gold(m.cost.gold) : UI.perlen(m.cost.perlen);
        h +=
          '<div class="card"><div class="pic"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="' + colors[m.id] + '" stroke="#1c1626" stroke-width="2.4"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#1c1626" font-family="sans-serif">-' + Math.round(m.cut * 100) + "%</text></svg></div>" +
          "<div><h4>" + esc(m.name) + '</h4><div class="muted" style="font-size:13px">' + esc(m.desc) + "</div></div>" +
          (owned ? '<span class="tag">Im Stall</span>' : '<button class="btn small" data-act="mount" data-id="' + m.id + '">' + cost + "</button>") + "</div>";
      }
      return h + "</div>";
    },
  };
  A.mount = (el) => {
    if (!done(E.buyMount(S(), el.dataset.id))) return;
    SB.audio.play("buy");
    UI.toast("Henrietta führt dein neues Reittier aus dem Stall.", "good", "stall");
    UI.refresh();
  };

  /* ================= Ruhmeshalle ================= */
  P.ruhmeshalle = {
    role: "Die Besten von Schwebfels",
    portrait: () => '<span style="display:grid;place-items:center;height:100%">' + I.ui("ruhm") + "</span>",
    render() {
      const s = S();
      const all = E.allHeroes(s, E.now(), SB.remoteHeroes || null);
      const me = all.find((h) => h.kind === "me");
      const rows = [];
      const show = new Set();
      for (let i = 0; i < Math.min(10, all.length); i++) show.add(i);
      for (let i = Math.max(0, me.rank - 6); i < Math.min(all.length, me.rank + 5); i++) show.add(i);
      let prev = -1;
      [...show].sort((a, b) => a - b).forEach((i) => {
        if (prev >= 0 && i > prev + 1) rows.push('<tr class="gap"><td colspan="5">⋯</td></tr>');
        prev = i;
        const h = all[i];
        rows.push(
          "<tr" + (h.kind === "me" ? ' class="me"' : ' data-act="heroInfo" data-id="' + esc(h.id) + '"') + '><td class="num">' + h.rank + "</td><td>" + esc(h.name) + (h.kind === "real" ? ' <span class="tag">Spieler</span>' : "") + (h.kind === "me" ? ' <span class="tag">Du</span>' : "") + "</td><td>" + I.classCrest(h.cls) + '</td><td class="num">' + h.level + '</td><td class="num">' + U.fmt(h.honor) + "</td></tr>"
        );
      });
      return '<div class="muted" style="margin-bottom:8px">Ehre gibt es in der Wolkenarena. Klick auf einen Namen für Details.</div><table class="fame"><thead><tr><th>Platz</th><th>Held</th><th>Klasse</th><th>Stufe</th><th>Ehre</th></tr></thead><tbody>' + rows.join("") + "</tbody></table>";
    },
  };
  A.heroInfo = (el) => {
    const s = S();
    const h = E.allHeroes(s, E.now(), SB.remoteHeroes || null).find((x) => x.id === el.dataset.id);
    if (!h) return;
    const f = h.fighter || E.npcFighter(h);
    const hp = f.maxHp;
    UI.dialog(
      '<div class="row" style="align-items:flex-start"><span class="porthole" style="width:96px;height:96px">' + UI.portrait(UI.fighterDesc(f), 160, true) + '</span><div><h2 style="margin:0">' + esc(h.name) + "</h2>" +
        '<div class="muted">' + D.RACES[h.race].name + " · " + D.CLASSES[h.cls].name + " · Stufe " + h.level + "</div><div>Platz " + h.rank + " · " + U.fmt(h.honor) + " Ehre</div></div></div>" +
        '<div class="stats"><div><span>Lebenspunkte</span><b class="num">' + U.fmt(hp) + "</b></div>" + D.ATTRS.map((a) => "<div><span>" + I.ui(a) + " " + D.ATTR_INFO[a].name + '</span><b class="num">' + U.fmt(f.attrs[a]) + "</b></div>").join("") + "</div>" +
        '<div class="actions"><button class="btn ghost" data-act="closeDialog">Schließen</button><button class="btn" data-act="openArena">Zur Arena</button></div>'
    );
  };
  A.openArena = () => {
    UI.closeDialog();
    UI.openPanel("arena");
  };

  /* ================= Wunschbrunnen ================= */
  const COIN_FRONT =
    '<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path d="M14 40 C8 40 8 31 15 30 C15 22 26 20 29 26 C32 18 46 19 46 28 C54 27 56 38 49 40 Z" fill="#fff3c4" stroke="#6a4d18" stroke-width="3" stroke-linejoin="round"/><path d="M22 46 L42 46 M26 51 L38 51" stroke="#6a4d18" stroke-width="3" stroke-linecap="round"/></svg>';
  UI.lastWell = null;
  P.brunnen = {
    role: "Ein Wurf am Tag ist frei",
    portrait: () => '<span style="display:grid;place-items:center;height:100%">' + I.ui("brunnen") + "</span>",
    render() {
      const s = S();
      const free = s.daily.wellFree > 0;
      let h = '<div class="say">Man sagt, der Brunnen erfüllt Wünsche. Meistens wünscht er sich allerdings Münzen.</div>';
      h += '<div class="well"><div class="coin" id="coin"><div class="face">' + COIN_FRONT + '</div><div class="face back">' + I.ui("perle") + "</div></div></div>";
      h += '<div class="row" style="justify-content:center">' + (free ? '<button class="btn big" data-act="well">Kostenlos werfen</button>' : '<button class="btn big" data-act="well"' + (s.daily.wellPaid >= E.C.WELL_PAID_MAX ? " disabled" : "") + ">Werfen · 1 " + I.ui("perle") + "</button>") + "</div>";
      h += '<p class="muted" style="text-align:center">' + (free ? "Dein freier Wurf für heute wartet." : "Weitere Würfe heute: " + (E.C.WELL_PAID_MAX - s.daily.wellPaid)) + "</p>";
      if (UI.lastWell) h += '<div class="say" style="text-align:center;font-style:normal" id="wellResult">' + UI.lastWell + "</div>";
      h += '<div class="section-title">Mögliche Gaben</div><ul class="muted" style="margin:0;padding-left:20px">' + D.WELL_PRIZES.map((p) => "<li>" + esc(p.label) + "</li>").join("") + "</ul>";
      return h;
    },
  };
  A.well = () => {
    const s = S();
    const res = E.tossWell(s);
    if (!done(res)) return;
    const coin = document.getElementById("coin");
    SB.audio.play("well");
    let txt = "<b>" + esc(res.label) + "</b>";
    if (res.gold) txt += "<br>" + UI.gold(res.gold);
    if (res.perlen) txt += "<br>" + UI.perlen(res.perlen);
    if (res.energy) txt += "<br>+" + res.energy + " Tatendrang";
    if (res.xp) txt += "<br>+" + U.fmt(res.xp) + " Erfahrung";
    if (res.item) txt += '<br><span class="t-' + res.item.rarity + '">' + esc(res.item.name) + "</span> liegt in deinem Rucksack.";
    if (res.itemSold) txt += "<br>(Rucksack voll: Gegenstand verkauft)";
    UI.lastWell = txt;
    if (coin) {
      coin.classList.remove("flip");
      void coin.offsetWidth;
      coin.classList.add("flip");
      setTimeout(() => UI.refresh(), 1650);
    } else UI.refresh();
    UI.saveNow();
  };

  /* ================= Einstellungen ================= */
  P.einstellungen = {
    title: "Einstellungen",
    role: "Spielstand und Darstellung",
    portrait: () => '<span style="display:grid;place-items:center;height:100%">' + I.ui("einstellungen") + "</span>",
    render() {
      const s = S();
      const q = s.settings.quality;
      let h = '<div class="section-title">Darstellung</div><div class="row">' + [["hoch", "3D mit Schatten"], ["niedrig", "3D schlicht"], ["aus", "Ohne 3D"]].map(([id, n]) => '<button class="tab' + (q === id ? " on" : "") + '" data-act="quality" data-q="' + id + '">' + n + "</button>").join("") + "</div>";
      h += '<p class="muted" style="font-size:13px">Die Änderung wird nach dem Neuladen der Seite wirksam.</p>';
      h += '<div class="section-title">Kämpfe</div><div class="row"><button class="tab' + (s.settings.fastFights ? " on" : "") + '" data-act="fastFights">Kämpfe standardmäßig doppelt so schnell</button></div>';
      h += '<div class="section-title">Ton</div><div class="row"><button class="tab' + (s.settings.sound ? " on" : "") + '" data-act="toggleSound">Klangeffekte ' + (s.settings.sound ? "an" : "aus") + "</button></div>";
      h += '<div class="section-title">Spielstand</div><p class="muted" style="font-size:13px">' + (SB.store.cloud ? "Dein Spielstand wird in diesem Browser und privat in deinem claude.ai-Konto gespeichert." : "Dein Spielstand wird in diesem Browser gespeichert. Sichere ihn als Code, wenn du das Gerät wechseln willst.") + "</p>";
      h += '<div class="row"><button class="btn ghost" data-act="exportSave">Spielstand als Code</button><button class="btn ghost" data-act="importSave">Code laden</button><span class="spacer"></span><button class="btn danger small" data-act="resetHero">Neuen Helden beginnen</button></div>';
      h += '<div class="section-title">Über das Spiel</div><p class="muted" style="font-size:13px">Helden von Schwebfels ist ein eigenständiges Browser-Rollenspiel. Alle Figuren, Texte, Symbole und 3D-Modelle sind eigens dafür entstanden. Die 3D-Darstellung nutzt die Bibliothek three.js.</p>';
      return h;
    },
  };
  A.quality = (el) => {
    S().settings.quality = el.dataset.q;
    UI.saveNow();
    UI.renderPanel();
    UI.toast("Gespeichert. Lade die Seite neu, um die Darstellung zu wechseln.", "", "einstellungen");
  };
  A.fastFights = () => {
    S().settings.fastFights = !S().settings.fastFights;
    UI.save();
    UI.renderPanel();
  };
  A.exportSave = () => {
    UI.saveNow();
    const code = SB.store.exportCode(S());
    const d = UI.dialog('<h2>Spielstand-Code</h2><p class="muted">Kopiere diesen Code und bewahre ihn gut auf. Mit „Code laden“ holst du deinen Helden zurück.</p><textarea id="saveCode" rows="6" readonly></textarea><div class="actions"><button class="btn ghost" data-act="closeDialog">Schließen</button><button class="btn" data-act="copyCode">Kopieren</button></div>');
    d.querySelector("#saveCode").value = code;
  };
  A.copyCode = () => {
    const ta = document.getElementById("saveCode");
    const fallback = () => {
      ta.focus();
      ta.select();
      UI.toast("Markiert. Jetzt mit Strg+C oder lange tippen kopieren.", "");
    };
    try {
      navigator.clipboard.writeText(ta.value).then(() => UI.toast("Code kopiert.", "good"), fallback);
    } catch (e) {
      fallback();
    }
  };
  A.importSave = () => {
    UI.dialog('<h2>Code laden</h2><p class="muted">Füge deinen Spielstand-Code ein. Dein jetziger Held wird dabei ersetzt.</p><textarea id="loadCode" rows="6" data-autofocus></textarea><p class="delta-down" id="loadErr" hidden></p><div class="actions"><button class="btn ghost" data-act="closeDialog">Abbrechen</button><button class="btn" data-act="doImport">Laden</button></div>');
  };
  A.doImport = () => {
    const err = document.getElementById("loadErr");
    try {
      const st = SB.store.importCode(document.getElementById("loadCode").value);
      UI.closeDialog();
      SB.main.replaceState(st);
    } catch (e) {
      err.hidden = false;
      err.textContent = e.message || "Das hat nicht geklappt.";
    }
  };
  A.resetHero = (el) => {
    if (!el.dataset.sure) {
      UI.dialog('<h2>Wirklich neu beginnen?</h2><p>Dein Held <b>' + esc(S().name) + "</b> geht dabei verloren, außer du sicherst vorher den Spielstand als Code.</p><div class=\"actions\"><button class=\"btn ghost\" data-act=\"closeDialog\">Behalten</button><button class=\"btn danger\" data-act=\"resetHero\" data-sure=\"1\">Neu beginnen</button></div>");
      return;
    }
    UI.closeDialog();
    SB.main.newHero();
  };
})();

</script>
<script>/* src/ui-battle.js */
/* Helden von Schwebfels - Kampfdarstellung und Charaktererstellung. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const D = SB.data;
  const E = SB.engine;
  const U = SB.util;
  const I = SB.icons;
  const UI = SB.ui;
  const esc = U.esc;
  const $ = UI.$;

  /* ================= Kampf ================= */
  UI.runBattle = function (fight, opts) {
    return new Promise((resolve) => {
      const S = UI.S;
      const root = $("#battle");
      UI.hideTip();
      if (UI.hub) UI.hub.pause();
      const hero = fight.hero;
      const foe = fight.foe;
      const res = fight.result;
      const plate = (f, side) =>
        '<div class="plate ' + side + '"><span class="porthole">' + UI.portrait(UI.fighterDesc(f), 128, f.kind !== "monster") + '</span><div class="pmeta"><div class="pname">' + esc(f.name) + '</div><div class="plv">Stufe ' + f.level + (f.kind === "monster" ? " · " + D.MONSTER_TYPES[f.mainKey].profile : " · " + D.CLASSES[f.cls].name) + '</div><div class="hp"><i style="width:100%"></i><span class="num">' + U.fmt(f.maxHp) + "</span></div></div></div>";
      root.innerHTML =
        '<div class="bstage"></div><div class="plates">' + plate(hero, "left") + plate(foe, "right") + "</div>" +
        '<div class="bcontrols"><button class="btn ghost small" data-speed="1">1×</button><button class="btn ghost small" data-speed="2">2×</button><button class="btn ghost small" data-speed="4">4×</button><button class="btn small" data-skip="1">Überspringen</button></div>';
      root.hidden = false;
      document.body.classList.add("in-battle");
      $("#hint").hidden = true;
      const stage = root.querySelector(".bstage");
      const bars = root.querySelectorAll(".hp");
      const max = [hero.maxHp, foe.maxHp];
      const setHp = (side, hp) => {
        const bar = bars[side];
        const pct = Math.max(0, hp / max[side]) * 100;
        const i = bar.querySelector("i");
        i.style.width = pct.toFixed(1) + "%";
        i.classList.toggle("low", pct < 30);
        bar.querySelector("span").textContent = U.fmt(Math.max(0, hp));
      };
      let speed = S.settings.fastFights ? 2 : 1;
      let skip = false;
      const markSpeed = () => root.querySelectorAll("[data-speed]").forEach((b) => b.classList.toggle("on", +b.dataset.speed === speed));
      markSpeed();
      let battle = null;
      let log = null;
      if (UI.use3d) {
        try {
          battle = SB.R3D.createBattle(stage, {
            setting: opts.setting,
            tint: opts.tint,
            left: UI.fighterDesc(hero),
            right: UI.fighterDesc(foe),
            hp: max.slice(),
            onImpact: (side, hp) => setHp(side, hp),
            sfx: (n) => SB.audio.play(n),
          });
          battle.setSpeed(speed);
        } catch (e) {
          console.warn("3D-Kampf nicht verfuegbar", e);
          battle = null;
        }
      }
      let figs = null;
      if (!battle) {
        stage.innerHTML = '<div class="fb2d"><div class="fig">' + UI.portrait(UI.fighterDesc(hero), 200) + '</div><div class="fig">' + UI.portrait(UI.fighterDesc(foe), 200) + '</div></div><div class="blog" style="top:auto;height:120px"></div>';
        log = stage.querySelector(".blog");
        figs = stage.querySelectorAll(".fig");
      }
      root.onclick = (ev) => {
        const b = ev.target.closest("button");
        if (!b) return;
        if (b.dataset.speed) {
          speed = +b.dataset.speed;
          if (battle) battle.setSpeed(speed);
          markSpeed();
        }
        if (b.dataset.skip) skip = true;
      };
      const names = [hero.name, foe.name];
      const hpNow = [hero.maxHp, foe.maxHp];
      const wait = (ms) => new Promise((r) => setTimeout(r, ms / speed));
      async function play2d(ev) {
        const a = ev.a;
        const d = 1 - a;
        if (ev.kind === "stun") {
          log.insertAdjacentHTML("beforeend", "<p>" + esc(names[a]) + " ist betäubt und setzt aus.</p>");
          await wait(500);
          return;
        }
        for (const h of ev.hits) {
          let txt;
          if (h.res === "evade") txt = esc(names[d]) + " weicht aus!";
          else if (h.res === "block") txt = esc(names[d]) + " blockt!";
          else {
            hpNow[d] = Math.max(0, hpNow[d] - h.dmg);
            setHp(d, hpNow[d]);
            figs[d].classList.add("hit");
            setTimeout(() => figs[d].classList.remove("hit"), 150);
            SB.audio.play(h.res === "crit" ? "crit" : "hit");
            txt = esc(names[a]) + (ev.spName ? " (" + esc(ev.spName) + ")" : "") + " trifft für <b>" + U.fmt(h.dmg) + "</b>" + (h.res === "crit" ? ", kritisch!" : "");
          }
          log.insertAdjacentHTML("beforeend", "<p>" + txt + "</p>");
          log.scrollTop = log.scrollHeight;
          await wait(420);
        }
      }
      (async () => {
        for (const ev of res.events) {
          if (skip) break;
          if (battle) await battle.play(ev);
          else await play2d(ev);
        }
        setHp(0, res.hp[0]);
        setHp(1, res.hp[1]);
        if (battle) await battle.finish(res.winner);
        else await wait(400);
        SB.audio.play(res.winner === 0 ? "victory" : "defeat");
        showResult();
      })();
      function showResult() {
        const r = opts.rewards || {};
        const win = res.winner === 0;
        const chips = [];
        if (r.xp) chips.push('<span class="chip">' + I.ui("xp") + " +" + U.fmt(r.xp) + " Erfahrung</span>");
        if (r.gold) chips.push('<span class="chip">' + UI.gold(r.gold) + "</span>");
        if (r.honor) chips.push('<span class="chip">' + I.ui("ehre") + " " + (r.honor > 0 ? "+" : "") + U.fmt(r.honor) + " Ehre</span>");
        if (r.perle) chips.push('<span class="chip">' + UI.perlen(r.perle) + "</span>");
        if (r.perlen) chips.push('<span class="chip">' + UI.perlen(r.perlen) + "</span>");
        if (r.itemSold) chips.push('<span class="chip">Rucksack voll: Fund für ' + UI.gold(r.itemSold) + " verkauft</span>");
        let itemHtml = "";
        if (r.item) itemHtml = '<div style="display:flex;justify-content:center"><div style="width:240px;text-align:left;padding:10px 12px;border-radius:14px;background:#0a141b;border:2px solid ' + D.RARITIES[r.item.rarity].color + '">' + UI.itemCard(r.item) + "</div></div>";
        const sub = win ? (opts.setting === "arena" ? "Das Publikum tobt!" : opts.setting === "dungeon" ? esc(opts.foeName) + " ist gefallen." : esc(opts.foeName) + " gibt sich geschlagen.") : opts.setting === "arena" ? "Das Publikum buht. Morgen ist ein neuer Tag." : "Diesmal war " + esc(opts.foeName) + " stärker. Bessere Ausrüstung und Attribute helfen.";
        const d = UI.dialog(
          '<div class="result ' + (win ? "win" : "lose") + '"><h2>' + (win ? "Sieg!" : "Niederlage") + '</h2><p class="muted">' + sub + '</p><div class="rewardlist">' + chips.join("") + "</div>" + itemHtml +
            '<div class="actions" style="justify-content:center"><button class="btn big" id="battleDone" data-autofocus>Weiter</button></div></div>'
        );
        d.parentNode.dataset.locked = "1";
        d.querySelector("#battleDone").onclick = () => {
          delete d.parentNode.dataset.locked;
          UI.closeDialog();
          if (battle) battle.dispose();
          root.hidden = true;
          document.body.classList.remove("in-battle");
          root.innerHTML = "";
          root.onclick = null;
          if (UI.hub) UI.hub.resume();
          resolve();
        };
      }
    });
  };

  /* ================= Charaktererstellung ================= */
  let view = null;
  let draft = null;
  function randomDraft(keepName) {
    const r = Math.random;
    const races = Object.keys(D.RACES);
    const race = races[Math.floor(r() * races.length)];
    const R = D.RACES[race];
    const cls = Object.keys(D.CLASSES)[Math.floor(r() * 3)];
    return {
      name: keepName || "",
      race,
      gender: r() < 0.5 ? "m" : "w",
      cls,
      look: { skin: R.skins[Math.floor(r() * R.skins.length)], hair: R.hairs[Math.floor(r() * R.hairs.length)], hairStyle: Math.floor(r() * 5), beard: r() < 0.5 ? 0 : Math.floor(r() * 4), eyes: "#1d1b26" },
    };
  }
  function previewDesc() {
    const C = D.CLASSES[draft.cls];
    return {
      kind: "hero",
      race: draft.race,
      cls: draft.cls,
      gender: draft.gender,
      look: draft.look,
      gear: {
        waffe: { base: C.weapons[0], tint: "#8a5a35", rarity: "gewoehnlich", style: 0 },
        ruestung: { base: C.chest, tint: C.material === "platte" ? "#9aa4ad" : C.material === "leder" ? "#8a5a35" : "#5b4fbf", rarity: "gewoehnlich", style: 0 },
        stiefel: { base: "stiefel", tint: "#5a4a3a", rarity: "gewoehnlich", style: 0 },
      },
    };
  }
  function renderForm() {
    const f = $("#create .cform");
    const R = D.RACES[draft.race];
    const C = D.CLASSES[draft.cls];
    const sw = (arr, key) => '<div class="swatches">' + arr.map((c) => '<button type="button" class="sw' + (draft.look[key] === c ? " on" : "") + '" style="background:' + c + '" data-cact="look" data-k="' + key + '" data-v="' + c + '" aria-label="Farbe ' + c + '"></button>').join("") + "</div>";
    const opt = (key, n, labels) => '<div class="choices">' + labels.map((l, i) => '<button type="button" class="choice' + (draft.look[key] === i ? " on" : "") + '" data-cact="lookn" data-k="' + key + '" data-v="' + i + '">' + l + "</button>").join("") + "</div>";
    f.innerHTML =
      '<label for="heroName"><h3 style="margin-top:0">Name deines Helden</h3></label><input id="heroName" maxlength="16" autocomplete="off" placeholder="z. B. Tilda Sturmfang" value="' + esc(draft.name) + '">' +
      '<p class="delta-down" id="nameErr" hidden></p>' +
      "<h3>Volk</h3><div class=\"choices\">" + Object.keys(D.RACES).map((id) => '<button type="button" class="choice' + (draft.race === id ? " on" : "") + '" data-cact="race" data-v="' + id + '">' + D.RACES[id].name + "</button>").join("") + "</div>" +
      '<p class="desc">' + esc(R.desc) + " " + modsText(R.mods) + "</p>" +
      "<h3>Klasse</h3><div class=\"choices cls-choices\">" + Object.keys(D.CLASSES).map((id) => '<button type="button" class="choice' + (draft.cls === id ? " on" : "") + '" data-cact="cls" data-v="' + id + '">' + I.classCrest(id) + "<br>" + D.CLASSES[id].name + "<small>" + D.ATTR_INFO[D.CLASSES[id].main].name + "</small></button>").join("") + "</div>" +
      '<p class="desc">' + esc(C.desc) + " Spezialangriff: " + esc(C.special.name) + ".</p>" +
      '<h3>Erscheinung</h3><div class="choices" style="grid-template-columns:repeat(2,1fr)"><button type="button" class="choice' + (draft.gender === "m" ? " on" : "") + '" data-cact="gender" data-v="m">Breitschultrig</button><button type="button" class="choice' + (draft.gender === "w" ? " on" : "") + '" data-cact="gender" data-v="w">Schmal</button></div>' +
      '<h3 style="font-size:16px">Haut</h3>' + sw(R.skins, "skin") +
      '<h3 style="font-size:16px">Haare</h3>' + sw(R.hairs, "hair") +
      opt("hairStyle", 5, ["Kurz", "Strubbelig", "Lang", "Zopf", "Glatze"]) +
      '<h3 style="font-size:16px">Bart</h3>' + opt("beard", 4, ["Keiner", "Kinnbart", "Vollbart", "Schnauzer"]) +
      '<div class="row" style="margin-top:18px"><button type="button" class="btn ghost" data-cact="random">Zufällig</button><button type="button" class="btn ghost" data-cact="import">Spielstand laden</button><span class="spacer"></span><button type="button" class="btn big" data-cact="start">In See stechen</button></div>';
    const inp = f.querySelector("#heroName");
    inp.addEventListener("input", () => (draft.name = inp.value));
  }
  function modsText(mods) {
    const parts = [];
    for (const a of D.ATTRS) if (mods[a]) parts.push((mods[a] > 0 ? "+" : "") + mods[a] + " " + D.ATTR_INFO[a].name);
    return parts.length ? "(" + parts.join(", ") + ")" : "";
  }
  function updateView() {
    if (view) view.set(previewDesc());
    else {
      const fb = $("#create .cview .hv-fallback");
      if (fb) fb.innerHTML = I.silhouette(previewDesc().gear.ruestung.tint, "hero");
    }
  }
  UI.showCreate = function (onDone) {
    const box = $("#create");
    draft = randomDraft("");
    box.innerHTML =
      '<div class="cview"><div class="ctitle"><h1>Helden von<br>Schwebfels</h1><p>Eine Stadt auf einer Wolkeninsel, drei Aufträge an der Wand und jede Menge Ärger darunter. Erschaffe deinen Helden.</p></div></div><div class="cform"></div>';
    box.hidden = false;
    const cv = box.querySelector(".cview");
    if (UI.use3d) {
      try {
        view = SB.R3D.createHeroView(cv, { distance: innerWidth <= 860 ? 8.6 : 10.5, lookY: innerWidth <= 860 ? 1.0 : 1.35 });
      } catch (e) {
        view = null;
      }
    }
    if (!view) cv.insertAdjacentHTML("beforeend", '<div class="hv-fallback" style="position:absolute;inset:120px 20% 20px"></div>');
    renderForm();
    updateView();
    box.onclick = (ev) => {
      const b = ev.target.closest("[data-cact]");
      if (!b) return;
      SB.audio.unlock();
      const act = b.dataset.cact;
      const v = b.dataset.v;
      if (act === "race") {
        draft.race = v;
        const R = D.RACES[v];
        draft.look.skin = R.skins[0];
        draft.look.hair = R.hairs[0];
      } else if (act === "cls") draft.cls = v;
      else if (act === "gender") draft.gender = v;
      else if (act === "look") draft.look[b.dataset.k] = v;
      else if (act === "lookn") draft.look[b.dataset.k] = +v;
      else if (act === "random") draft = randomDraft(draft.name);
      else if (act === "import") {
        UI.ACTIONS.importSave();
        return;
      } else if (act === "start") {
        const name = draft.name.trim().replace(/\s+/g, " ");
        const err = $("#nameErr");
        if (!/^[\p{L}\p{N}][\p{L}\p{N} '\-]{1,15}$/u.test(name)) {
          err.hidden = false;
          err.textContent = "Der Name braucht 2 bis 16 Zeichen: Buchstaben, Ziffern, Leerzeichen, Bindestrich oder Apostroph.";
          $("#heroName").focus();
          return;
        }
        SB.audio.play("levelup");
        const st = E.newHero({ name, race: draft.race, gender: draft.gender, cls: draft.cls, look: draft.look });
        UI.closeCreate();
        onDone(st);
        return;
      }
      SB.audio.play("click");
      const keep = $("#heroName") ? $("#heroName").value : draft.name;
      if (act !== "random") draft.name = keep;
      renderForm();
      updateView();
    };
  };
  UI.closeCreate = function () {
    const box = $("#create");
    if (view) view.dispose();
    view = null;
    box.hidden = true;
    box.innerHTML = "";
    box.onclick = null;
  };
})();

</script>
<script>/* src/main.js */
/* Helden von Schwebfels - Start, Spielstand-Wechsel, Cloud-Abgleich. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const UI = SB.ui;
  const E = SB.engine;
  const M = (SB.main = {});
  let ticker = 0;

  function shell() {
    const app = document.getElementById("app");
    app.innerHTML =
      '<div id="stage"></div><header id="topbar"></header><nav id="dock" aria-label="Orte auf Schwebfels"></nav>' +
      '<div id="activity" role="button" tabindex="0" hidden></div><section id="panel" hidden></section><div id="hint" hidden></div>';
  }

  function teardown() {
    clearInterval(ticker);
    if (UI.hub) UI.hub.dispose();
    UI.hub = null;
    UI.disposeHeroView();
    UI.panelId = null;
    UI.closeDialog();
    const app = document.getElementById("app");
    app.innerHTML = "";
  }

  M.start = function (S) {
    UI.S = S;
    SB.audio.enabled = S.settings.sound !== false;
    UI.use3d = S.settings.quality !== "aus" && SB.R3D.ready();
    shell();
    const stage = document.getElementById("stage");
    if (UI.use3d) {
      try {
        UI.hub = SB.R3D.createHub(stage, { quality: S.settings.quality, onPick: (id) => UI.openPanel(id) });
      } catch (e) {
        console.warn("3D-Insel nicht verfuegbar", e);
        UI.hub = null;
      }
    }
    if (!UI.hub) stage.innerHTML = '<div class="stage-fallback"><div class="fb-grid"></div></div>';
    E.tick(S);
    UI.refresh();
    clearInterval(ticker);
    ticker = setInterval(UI.tick, 1000);
    UI.saveNow();
  };

  M.replaceState = function (S) {
    S = E.migrate(S);
    if (!S) return;
    UI.closeCreate();
    teardown();
    M.start(S);
  };

  M.newHero = function () {
    teardown();
    SB.store.clearLocal();
    UI.S = null;
    UI.use3d = SB.R3D.ready();
    UI.showCreate((st) => M.start(st));
  };

  M.boot = function (saved) {
    const S = saved ? E.migrate(saved) : null;
    if (S) M.start(S);
    else {
      UI.use3d = SB.R3D.ready();
      UI.showCreate((st) => M.start(st));
    }
    // Spielstand im claude.ai-Konto abgleichen, falls verfuegbar
    SB.store.initCloud((cloud) => {
      const local = UI.S;
      if (cloud && E.migrate(cloud) && (!local || (cloud.savedAt || 0) > (local.savedAt || 0) + 2000)) {
        M.replaceState(cloud);
        UI.toast("Spielstand aus deinem Konto geladen.", "good", "rucksack");
      } else if (local) {
        SB.store.saveCloud(local);
        SB.store.publishHero(local);
      }
    });
  };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && UI.S) {
      SB.store.save(UI.S);
      SB.store.flush(UI.S);
    }
  });
  window.addEventListener("pagehide", () => {
    if (UI.S) SB.store.saveLocal(UI.S);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target && ev.target.id === "activity") ev.target.click();
  });

  const claude = globalThis.claude;
  const hot = claude && claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ save: UI.S ? JSON.stringify(UI.S) : null }));
  const start = (data) => {
    let saved = null;
    if (data && data.save) {
      try {
        saved = JSON.parse(data.save);
      } catch (e) {
        saved = null;
      }
    }
    M.boot(saved || SB.store.loadLocal());
  };
  if (hot && typeof hot.ready === "function") hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
