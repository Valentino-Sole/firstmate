  // Troll: riesig, gebeugt, lange Arme, Hauer, Knueppel
  B.troll = function (m, root, P) {
    const skin = M.pmat("skin", m.color);
    const moss = M.pmat("fur", R.mix(m.color, "#3f5a2a", 0.6));
    const body = grp();
    root.add(body);
    P.spine = body;
    for (const s of [1, -1]) {
      const L = limb(body, [0.3 * s, 1.0, 0], 0.5, 0.5, 0.16, 0.13, skin, [-0.35, 0, 0]);
      L.lo.rotation.x = 0.5;
      L.end.add(mesh(G.sph(0.16, 10, 8), skin, { p: [0, 0, 0.1], s: [1, 0.5, 1.5] }));
      claws(L.end, 3, 0.08, bone(), 0.5);
      (P.legs = P.legs || []).push({ up: L.up, lo: L.lo, ph: s > 0 ? 0 : PI, base: -0.35, kb: 0.5, heavy: true });
    }
    const torso = grp([0, 1.0, 0], [0.5, 0, 0]);
    body.add(torso);
    P.torso = torso;
    torso.add(mesh(G.sph(0.42, 16, 12), skin, { p: [0, 0.25, 0.05], s: [1.15, 0.9, 1] }));
    torso.add(mesh(G.sph(0.55, 16, 12), skin, { p: [0, 0.8, -0.05], s: [1.3, 0.85, 0.95] }));
    torso.add(mesh(G.sph(0.4, 12, 8), moss, { p: [0, 1.05, -0.2], s: [1.4, 0.6, 1] }));
    torso.add(mesh(G.cyl(0.4, 0.5, 0.35, 12, true), M.pmat("leather", "#3a2a1e", { ds: true }), { p: [0, 0.05, 0] }));
    for (let i = 0; i < 5; i++) torso.add(mesh(G.cone(0.06, 0.25, 4), M.pmat("hair", "#1f1a14"), { p: [0, 1.15 - i * 0.05, -0.35 - i * 0.07], r: [-1.2, 0, 0] }));
    for (const s of [1, -1]) {
      const A = limb(torso, [0.68 * s, 0.95, 0], 0.62, 0.62, 0.14, 0.13, skin, [0, 0, 0.12 * s]);
      A.end.add(mesh(G.sph(0.17, 10, 8), skin, { s: [1, 1.1, 1.1] }));
      claws(A.end, 4, 0.12, bone(), 0.35);
      P[s > 0 ? "armL" : "armR"] = A;
    }
    // Knueppel
    const club = grp([0, -0.05, 0.05], [PI / 2, 0, 0]);
    club.add(mesh(G.cyl(0.07, 0.15, 1.1, 8), M.pmat("wood", "#5a3a24"), { p: [0, 0.45, 0] }));
    for (let i = 0; i < 5; i++) club.add(mesh(G.cone(0.03, 0.14, 4), M.pmat("metal", "#8a8f96"), { p: [Math.cos(i * 2) * 0.14, 0.75 + i * 0.05, Math.sin(i * 2) * 0.14], r: [Math.sin(i * 2) * 1.5, 0, -Math.cos(i * 2) * 1.5] }));
    P.armR.end.add(club);
    const head = grp([0, 1.15, 0.38], [-0.5, 0, 0]);
    torso.add(head);
    P.head = head;
    head.add(mesh(R.headGeo(1.8, 1.8, 0.95), skin, { s: [1.25, 1.1, 1.2] }));
    head.add(mesh(G.cone(0.07, 0.2, 6), skin, { p: [0, 0.0, 0.26], r: [1.3, 0, 0] }));
    head.add(mesh(G.box(0.36, 0.06, 0.12), skin, { p: [0, 0.1, 0.18] }));
    for (const s of [1, -1]) {
      head.add(mesh(G.cone(0.035, 0.16, 6), bone(), { p: [s * 0.1, -0.12, 0.22], r: [-0.3, 0, s * 0.2] }));
      head.add(mesh(G.cone(0.06, 0.3, 5), skin, { p: [s * 0.27, 0.05, -0.02], r: [0.2, 0, -s * 1.3], s: [1, 1, 0.4] }));
    }
    eyes(head, [[0.08, 0.05, 0.21], [-0.08, 0.05, 0.21]], m.accent, 0.025);
    P.headY = 2.65;
  };

  // Baumhirte: Rinde, Wurzelfuesse, Astarme, Gesicht im Holz
  B.baum = function (m, root, P) {
    const bark = M.pmat("bark", m.color);
    const leaf = M.pmat("fur", R.mix(m.accent, "#2f4a2a", 0.6), { flat: true });
    const body = grp();
    root.add(body);
    P.spine = body;
    for (const s of [1, -1]) {
      const L = limb(body, [0.3 * s, 1.0, 0], 0.5, 0.5, 0.17, 0.15, bark, [-0.1, 0, 0.05 * s]);
      L.lo.rotation.x = 0.15;
      for (let i = 0; i < 3; i++) L.end.add(mesh(G.cone(0.07, 0.35, 5), bark, { p: [Math.cos(i * 2.1) * 0.12, -0.02, Math.sin(i * 2.1) * 0.12 + 0.08], r: [PI / 2 + 0.4, i * 2.1, 0] }));
      (P.legs = P.legs || []).push({ up: L.up, lo: L.lo, ph: s > 0 ? 0 : PI, base: -0.1, kb: 0.15, heavy: true });
    }
    const torso = grp([0, 1.0, 0], [0.12, 0, 0]);
    body.add(torso);
    P.torso = torso;
    torso.add(mesh(G.lathe("trunk", [[0.42, 0], [0.38, 0.4], [0.42, 0.9], [0.5, 1.3], [0.35, 1.6], [0.0, 1.7]], 12), bark, { s: [1, 1, 0.85] }));
    // Gesicht
    const face = grp([0, 1.15, 0.36]);
    torso.add(face);
    P.head = face;
    for (const s of [1, -1]) face.add(mesh(G.sph(0.08, 8, 6), M.basic("#050407"), { p: [s * 0.13, 0.05, 0], s: [1.2, 0.8, 0.5] }));
    eyes(face, [[0.13, 0.05, 0.04], [-0.13, 0.05, 0.04]], m.accent, 0.035);
    face.add(mesh(G.box(0.3, 0.1, 0.06), M.emis(R.shade(m.accent, 0.4), 0.8), { p: [0, -0.22, 0], r: [0, 0, 0.05] }));
    face.add(mesh(G.box(0.4, 0.06, 0.12), bark, { p: [0, 0.16, 0.03], r: [0, 0, 0] }));
    for (let i = 0; i < 5; i++) face.add(mesh(G.cone(0.04, 0.3, 4), M.pmat("fur", "#4f6a3c"), { p: [(i - 2) * 0.07, -0.42, 0.03], r: [PI, 0, (i - 2) * 0.1] }));
    // Krone aus Aesten und Laub
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * PI * 2;
      const br = grp([Math.cos(a) * 0.2, 1.6, Math.sin(a) * 0.15], [Math.sin(a) * 0.6, 0, -Math.cos(a) * 0.6]);
      br.add(mesh(G.cyl(0.03, 0.07, 0.6, 5), bark, { p: [0, 0.3, 0] }));
      br.add(mesh(G.ico(0.28, 0), leaf, { p: [0, 0.65, 0], s: [1, 0.8, 1] }));
      torso.add(br);
    }
    for (const s of [1, -1]) {
      const A = limb(torso, [0.48 * s, 1.25, 0], 0.65, 0.6, 0.12, 0.09, bark, [0, 0, 0.25 * s]);
      for (let i = 0; i < 4; i++) A.end.add(mesh(G.cone(0.03, 0.28, 4), bark, { p: [(i - 1.5) * 0.05, -0.12, 0.03], r: [PI, 0, (i - 1.5) * 0.3] }));
      A.up.add(mesh(G.ico(0.18, 0), leaf, { p: [0.05 * s, -0.1, -0.05] }));
      P[s > 0 ? "armL" : "armR"] = A;
    }
    P.headY = 3.0;
  };

  // Kultist: Kapuzenrobe, Knochenmaske, Augenstab, kreisende Runen
  B.kultist = function (m, root, P) {
    const robe = M.pmat("cloth", m.color, { ds: true });
    const dark = M.pmat("cloth", R.shade(m.color, 0.55), { ds: true });
    const body = grp();
    root.add(body);
    P.spine = body;
    body.add(mesh(G.lathe("cultrobe", [[0.0, 1.62], [0.24, 1.6], [0.3, 1.35], [0.28, 1.0], [0.36, 0.5], [0.46, 0.0], [0.0, 0.0]], 18), robe));
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * PI * 2;
      body.add(mesh(G.cone(0.07, 0.18, 4), robe, { p: [Math.cos(a) * 0.44, 0.02, Math.sin(a) * 0.44], r: [PI, 0, 0] }));
    }
    body.add(mesh(G.box(0.14, 1.1, 0.02), dark, { p: [0, 0.75, 0.31], r: [-0.12, 0, 0] }));
    body.add(mesh(G.torus(0.27, 0.03, PI * 2, 5, 18), M.pmat("leather", "#2a1e18"), { p: [0, 1.0, 0], r: [PI / 2, 0, 0] }));
    body.add(mesh(G.octa(0.05), M.emis(m.accent, 1.2), { p: [0, 1.25, 0.3] }));
    const head = grp([0, 1.85, 0.02]);
    body.add(head);
    P.head = head;
    head.add(mesh(G.cap(0.26, PI * 0.66), robe, { r: [-0.3, 0, 0], s: [1, 1.2, 1.1] }));
    head.add(mesh(G.cone(0.08, 0.3, 6), robe, { p: [0, 0.2, -0.2], r: [-2.2, 0, 0] }));
    head.add(mesh(G.sph(0.19, 12, 10), M.basic("#050407"), { p: [0, -0.04, 0.03] }));
    // Knochenmaske
    head.add(mesh(G.sph(0.15, 12, 10, 0), M.pmat("bone", "#e8dcc0"), { p: [0, -0.03, 0.1], s: [0.9, 1.1, 0.5] }));
    for (const s of [1, -1]) head.add(mesh(G.sph(0.03, 6, 6), M.basic("#050407"), { p: [s * 0.055, 0.0, 0.17] }));
    eyes(head, [[0.055, 0.0, 0.18], [-0.055, 0.0, 0.18]], m.accent, 0.018);
    for (const s of [1, -1]) {
      const A = limb(body, [0.3 * s, 1.5, 0.02], 0.38, 0.36, 0.07, 0.065, robe, [-0.35, 0, 0.25 * s]);
      A.lo.rotation.x = -0.8;
      A.end.add(mesh(G.sph(0.05, 8, 6), M.pmat("skin", "#8a8090")));
      claws(A.end, 4, 0.1, M.pmat("skin", "#8a8090"), 0.35);
      P[s > 0 ? "armL" : "armR"] = A;
    }
    const staff = grp([0, -0.05, 0.03], [0.9, 0, 0]);
    staff.add(mesh(G.cyl(0.025, 0.03, 1.8, 6), M.pmat("wood", "#2a1e18"), { p: [0, 0.3, 0] }));
    staff.add(mesh(G.torus(0.12, 0.02, PI * 1.6, 5, 14), M.pmat("metal", "#5a5f6a"), { p: [0, 1.28, 0], r: [0, 0, PI * 0.7] }));
    const orb = mesh(G.sph(0.085, 12, 10), M.emis(m.accent, 1.3), { p: [0, 1.28, 0] });
    staff.add(orb);
    staff.add(mesh(G.sph(0.035, 8, 6), M.basic("#050407"), { p: [0, 1.28, 0.07] }));
    staff.add(R.haloSprite(m.accent, 0.6, 0.85, [0, 1.28, 0]));
    P.armR.end.add(staff);
    // Runenkreis
    const ring = grp([0, 0.08, 0]);
    ring.add(mesh(G.torus(0.9, 0.012, PI * 2, 4, 48), M.glow(m.accent, 0.6), { r: [PI / 2, 0, 0] }));
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * PI * 2;
      ring.add(mesh(G.box(0.06, 0.12, 0.01), M.glow(m.accent, 0.8), { p: [Math.cos(a) * 0.9, 0.12, Math.sin(a) * 0.9], r: [0, -a + PI / 2, 0] }));
    }
    body.add(ring);
    P.ring = ring;
    P.headY = 2.2;
  };

  // Alte Bauplaene der ersten Version auf die neuen abbilden
  const ALIAS = { schleim: "schlund", kobold: "goblin", skelett: "ghul", flatterer: "fledermaus", geist: "schemen", krabbe: "krebs", ritter: "todesritter" };

  R.buildMonster = function (m) {
    if (!T) init();
    const root = grp();
    const P = {};
    const arch = B[m.arch] ? m.arch : ALIAS[m.arch] || "ghul";
    const mm = Object.assign({ color: "#6a6a6a", accent: "#ff5a3d" }, m, { arch });
    B[arch](mm, root, P);
    if (m.boss) {
      const s = m.final ? 1.4 : 1.2;
      root.scale.setScalar(s);
      P.headY = (P.headY || 1.5) * s;
      // Aura und bei Endgegnern eine eiserne Dornenkrone
      root.add(R.haloSprite(mm.accent, 2.4, 0.16, [0, 1.0, 0]));
      if (m.final) {
        const crown = grp([0, P.headY / s + 0.15, 0]);
        const iron = M.pmat("metal", "#3a3640");
        crown.add(mesh(G.torus(0.2, 0.03, PI * 2, 5, 18), iron, { r: [PI / 2, 0, 0] }));
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * PI * 2;
          crown.add(mesh(G.cone(0.035, 0.22, 4), iron, { p: [Math.cos(a) * 0.2, 0.1, Math.sin(a) * 0.2], r: [Math.sin(a) * 0.3, 0, -Math.cos(a) * 0.3] }));
        }
        crown.add(R.haloSprite(mm.accent, 0.9, 0.5, [0, 0.12, 0]));
        crown.userData.bob = 0;
        root.add(crown);
        P.crown = crown;
      }
    }
    const model = R.makeModel(root, P, "monster");
    model.arch = arch;
    model.headY = P.headY || 1.5;
    model.height = model.headY + 0.2;
    model.ranged = SB.data.ARCH_TYPE[arch] === "verstand";
    model.projColor = mm.accent;
    if (P.inner) model.inner = P.inner;
    return model;
  };

  /* ---------- Monsteranimation ---------- */
  const ease = (u) => u * u * (3 - 2 * u);
  const bell = (u) => Math.sin(PI * u);
  R.poseMonster = function (m, name, u) {
    const P = m.parts;
    const t = m.t;
    const root = m.obj.children[0];
    if (!root || P.inner) return;
    let y = 0;
    let rx = 0;
    let rz = 0;
    let lean = 0;
    let jaw = 0.12 + Math.max(0, Math.sin(t * 1.7)) * 0.08;
    let armX = Math.sin(t * 1.8) * 0.12;
    let armBend = -0.3;
    let walk = 0;
    const breathe = Math.sin(t * 2);
    if (P.hover) P.hover.position.y = (P.hoverY || 0.4) + Math.sin(t * 1.8) * 0.12;
    if (P.wings) for (const w of P.wings) w.g.rotation.z = w.s * (w.slow ? Math.sin(t * 2.2) * 0.25 : Math.sin(t * 10) * 0.55);
    if (P.tail) P.tail.rotation.y = Math.sin(t * 2.4) * 0.3;
    if (P.cap) P.cap.rotation.z = Math.sin(t * 1.4) * 0.05;
    if (P.orbit) P.orbit.rotation.y = t * 0.6;
    if (P.ring) P.ring.rotation.y = t * 0.8;
    if (P.neck) P.neck.rotation.x = Math.sin(t * 1.2) * 0.06;
    if (P.tentacles) for (const k of P.tentacles) k.g.rotation.x = Math.sin(t * 2.5 + k.k * 1.5 + k.s) * 0.35;
    switch (name) {
      case "attack":
      case "special": {
        const wind = u < 0.4 ? ease(u / 0.4) : 1 - ease((u - 0.4) / 0.6);
        const hit = u < 0.4 ? 0 : bell((u - 0.4) / 0.6);
        lean = -0.15 * wind + 0.4 * hit;
        armX = -2.2 * wind + 0.6 * hit;
        armBend = -0.2 - 0.6 * wind;
        jaw = 0.1 + 1.0 * Math.max(wind, hit);
        if (name === "special") y = 0.45 * bell(u);
        break;
      }
      case "cast": {
        const b = bell(u);
        y = 0.2 * b;
        lean = -0.2 * b;
        armX = -1.8 * b;
        armBend = -0.1;
        jaw = 0.1 + 0.8 * b;
        break;
      }
      case "hit":
        lean = -0.35 * bell(u);
        jaw = 0.6 * bell(u);
        break;
      case "evade":
        rz = 0.35 * bell(u);
        y = 0.2 * bell(u);
        break;
      case "block":
        lean = -0.15 * bell(u);
        armX = -1.2 * bell(u);
        break;
      case "victory":
        y = 0.3 * Math.abs(Math.sin(u * PI * 2));
        jaw = 1;
        armX = -2.4;
        break;
      case "walk":
        walk = 1;
        break;
      case "defeat":
        rz = 1.4 * ease(u);
        y = -0.25 * ease(u);
        jaw = 1;
        break;
    }
    if (P.spine) {
      P.spine.rotation.x = lean;
      P.spine.position.y = breathe * 0.015;
    }
    if (P.head) P.head.rotation.x = (P.head.userData.rx0 == null ? (P.head.userData.rx0 = P.head.rotation.x) : P.head.userData.rx0) + Math.sin(t * 1.3) * 0.05 - lean * 0.4;
    if (P.jaw) {
      if (P.jaw.userData.rx0 == null) P.jaw.userData.rx0 = P.jaw.rotation.x;
      P.jaw.rotation.x = P.jaw.userData.rx0 + (P.jawOpen || 0.4) * Math.min(1, jaw);
    }
    if (P.pincer) P.pincer.rotation.x = 0.45 * Math.min(1, jaw);
    for (const k of ["armR", "armL"]) {
      const A = P[k];
      if (!A || !A.up) continue;
      if (A.up.userData.rx0 == null) A.up.userData.rx0 = A.up.rotation.x;
      const main = k === "armR" || !P.armR;
      A.up.rotation.x = A.up.userData.rx0 + (main ? armX : armX * 0.35 + Math.sin(t * 1.6 + 1) * 0.08);
      if (A.lo) {
        if (A.lo.userData.rx0 == null) A.lo.userData.rx0 = A.lo.rotation.x;
        A.lo.rotation.x = A.lo.userData.rx0 + (main ? armBend : -0.2);
      }
    }
    if (P.legs)
      for (const L of P.legs) {
        const sp = walk ? 9 : 0;
        const ph = Math.sin(t * sp + L.ph);
        if (L.spider) {
          if (L.up.userData.ry0 == null) L.up.userData.ry0 = L.up.rotation.y;
          L.up.rotation.x = Math.sin(t * (walk ? 10 : 3) + L.ph) * (walk ? 0.25 : 0.04);
          L.lo.rotation.z = L.rz + Math.sin(t * 3 + L.ph) * 0.04;
        } else {
          L.up.rotation.x = L.base + ph * (walk ? 0.5 : 0);
          L.lo.rotation.x = L.kb + (walk ? Math.max(0, -ph) * (L.quad ? -0.5 : 0.6) : 0);
        }
      }
    root.position.y = y;
    root.rotation.x = rx;
    root.rotation.z = rz;
  };

  R.buildFighter = function (desc) {
    if (!desc) return null;
    if (desc.kind === "monster") return R.buildMonster(desc);
    return R.buildHero(desc);
  };
})();

</script>
<script>/* src/r3d-scenes.js */
/* Helden von Schwebfels - 3D-Schauplaetze: Freistatt-Insel im Nebelmeer, Heldenansicht, Heim, Kampfbuehne, Portraits.
   Mystische Stimmung: gedaempfte Farben, Nebel, Gluehwuermchen, Polarlicht bei Nacht, automatischer Tag-Nacht-Wechsel. */
(function () {
  "use strict";
  const SB = (globalThis.SB = globalThis.SB || {});
  const R = (SB.R3D = SB.R3D || {});
  const PI = Math.PI;
  let T = null;
  let mesh, grp, G, M, pm, emis, glow, basic;

  function init() {
    T = R.T();
    mesh = R.mesh;
    grp = R.grp;
    G = R.geo;
    M = R.mat;
    pm = M.pmat;
    emis = M.emis;
    glow = M.glow;
    basic = M.basic;
  }

  function makeRenderer(el, opts) {
    opts = opts || {};
    const r = new T.WebGLRenderer({ antialias: true, alpha: !!opts.alpha, preserveDrawingBuffer: !!opts.preserve, powerPreference: "high-performance" });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, opts.maxDpr || 2));
    r.outputColorSpace = T.SRGBColorSpace;
    r.toneMapping = T.ACESFilmicToneMapping;
    r.toneMappingExposure = opts.exposure || 1.15;
    if (opts.shadows) {
      r.shadowMap.enabled = true;
      r.shadowMap.type = T.PCFSoftShadowMap;
    }
    if (el) {
      r.domElement.className = "r3d-canvas";
      el.appendChild(r.domElement);
    }
    return r;
  }
  function killRenderer(r) {
    try {
      r.dispose();
      r.forceContextLoss();
      if (r.domElement && r.domElement.parentNode) r.domElement.parentNode.removeChild(r.domElement);
    } catch (e) {
      /* bereits entsorgt */
    }
  }
  const col = (c) => new T.Color(c);
  const lerpC = (a, b, t) => col(a).lerp(col(b), Math.max(0, Math.min(1, t)));
  const smooth = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  /* ---------- Tageszeit ---------- */
  const CYCLE_MS = 20 * 60 * 1000;
  // 0 = Mitternacht, 0.5 = Mittag
  R.dayTime = function (mode, now) {
    now = now || Date.now();
    if (mode === "tag") return 0.5;
    if (mode === "nacht") return 0.02;
    if (mode === "echtzeit") {
      const d = new Date(now);
      return (d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600) / 24;
    }
    return (now / CYCLE_MS + 0.3) % 1;
  };
  R.dayInfo = function (t) {
    const sunH = -Math.cos(t * 2 * PI);
    const day = smooth(-0.12, 0.3, sunH);
    const dusk = Math.max(0, 1 - Math.abs(sunH - 0.02) / 0.28);
    return { t, sunH, day, dusk, night: 1 - day };
  };
  R.dayLabel = function (t) {
    const i = R.dayInfo(t);
    if (i.dusk > 0.45) return t < 0.5 ? "Morgengrauen" : "Abenddämmerung";
    return i.day > 0.5 ? "Tag" : "Nacht";
  };
  // Mystische Farbpalette je Tageszeit
  function palette(info) {
    const dayTop = "#36557f";
    const dayBot = "#8fa2ad";
    const duskTop = "#2b2c5a";
    const duskBot = "#c27556";
    const nightTop = "#04060f";
    const nightBot = "#141f38";
    const top = lerpC(nightTop, dayTop, info.day).lerp(col(duskTop), info.dusk * 0.6);
    const bot = lerpC(nightBot, dayBot, info.day).lerp(col(duskBot), info.dusk * 0.75);
    const fog = bot.clone().lerp(col(info.day > 0.5 ? "#6e8290" : "#18223a"), 0.35);
    return {
      top,
      bot,
      fog,
      sun: lerpC("#8fa6ff", "#ffe9c8", info.day).lerp(col("#ff9a62"), info.dusk * 0.7),
      sunI: 1.3 + 1.2 * info.day,
      hemiSky: lerpC("#6a7ac8", "#d8e2ee", info.day),
      hemiGround: lerpC("#2a2438", "#4a3e30", info.day),
      hemiI: 1.0 + 0.3 * info.day,
    };
  }

  /* ---------- Gemeinsame Texturen ---------- */
  let dotTex = null;
  function dot() {
    if (dotTex) return dotTex;
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.3, "rgba(255,255,255,0.5)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return (dotTex = new T.CanvasTexture(c));
  }
  let mistTex = null;
  function mist() {
    if (mistTex) return mistTex;
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    const r = R.rng(77);
    for (let i = 0; i < 70; i++) {
      const x = r() * 256;
      const y = r() * 256;
      const rad = 20 + r() * 60;
      for (const [ox, oy] of [[0, 0], [256, 0], [-256, 0], [0, 256], [0, -256]]) {
        const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
        gr.addColorStop(0, "rgba(255,255,255,0.22)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr;
        g.fillRect(0, 0, 256, 256);
      }
    }
    mistTex = new T.CanvasTexture(c);
    mistTex.wrapS = mistTex.wrapT = T.RepeatWrapping;
    return mistTex;
  }
  const TILED = {};
  function tiled(kind, color, rx, ry, o) {
    const k = kind + color + rx + "|" + ry;
    if (TILED[k]) return TILED[k];
    const t = R.paintTex(kind).clone();
    t.needsUpdate = true;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.repeat.set(rx, ry);
    const m = new T.MeshLambertMaterial(Object.assign({ map: t, color: col(color).multiplyScalar(1.12) }, o || {}));
    return (TILED[k] = m);
  }

  /* ---------- Himmel, Sterne, Mond, Polarlicht, Nebelmeer ---------- */
  function skyDome() {
    const geo = new T.SphereGeometry(260, 32, 20);
    const cols = new Float32Array(geo.attributes.position.count * 3);
    geo.setAttribute("color", new T.BufferAttribute(cols, 3));
    const m = new T.Mesh(geo, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
    m.userData.recolor = (top, bot, under) => {
      const pos = geo.attributes.position;
      const a = geo.attributes.color;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) / 260;
        let c;
        if (y >= 0) c = bot.clone().lerp(top, Math.pow(Math.min(1, y / 0.75), 0.7));
        else c = bot.clone().lerp(under, Math.min(1, -y / 0.25));
        a.setXYZ(i, c.r, c.g, c.b);
      }
      a.needsUpdate = true;
    };
    m.renderOrder = -10;
    return m;
  }
  function starField(rng, n) {
    const geo = new T.BufferGeometry();
    const sp = [];
    for (let i = 0; i < n; i++) {
      const u = rng() * PI * 2;
      const v = Math.acos(1 - rng() * 0.95);
      sp.push(Math.cos(u) * Math.sin(v) * 230, Math.cos(v) * 230, Math.sin(u) * Math.sin(v) * 230);
    }
    geo.setAttribute("position", new T.Float32BufferAttribute(sp, 3));
    const mat = new T.PointsMaterial({ color: 0xdfe8ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
    const p = new T.Points(geo, mat);
    p.renderOrder = -9;
    return p;
  }
  function moonSprite() {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(235,240,255,1)");
    gr.addColorStop(0.42, "rgba(220,228,250,1)");
    gr.addColorStop(0.46, "rgba(160,180,255,0.35)");
    gr.addColorStop(1, "rgba(120,140,255,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    g.fillStyle = "rgba(150,160,190,0.35)";
    for (const [x, y, r] of [[52, 54, 8], [74, 70, 6], [60, 78, 4], [78, 50, 5]]) {
      g.beginPath();
      g.arc(x, y, r, 0, PI * 2);
      g.fill();
    }
    const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c), transparent: true, fog: false, depthWrite: false }));
    s.scale.setScalar(26);
    s.renderOrder = -8;
    return s;
  }
  function aurora() {
    const c = document.createElement("canvas");
    c.width = 4;
    c.height = 128;
    const g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 128, 0, 0);
    gr.addColorStop(0, "rgba(80,255,170,0)");
    gr.addColorStop(0.15, "rgba(80,255,170,0.9)");
    gr.addColorStop(0.55, "rgba(90,200,255,0.45)");
    gr.addColorStop(1, "rgba(170,110,255,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 4, 128);
    const tex = new T.CanvasTexture(c);
    const group = grp();
    const bands = [];
    for (let k = 0; k < 3; k++) {
      const geo = new T.PlaneGeometry(1, 1, 80, 1);
      const pos = geo.attributes.position;
      const base = [];
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) + 0.5;
        const top = pos.getY(i) > 0;
        const a = -1.5 + u * 3.0 + k * 0.4;
        const rr = 200 - k * 15;
        base.push([a, top, rr]);
      }
      const mat = new T.MeshBasicMaterial({ map: tex, transparent: true, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, fog: false, opacity: 0 });
      const m = new T.Mesh(geo, mat);
      m.frustumCulled = false;
      m.renderOrder = -7;
      group.add(m);
      bands.push({ m, base, k });
    }
    group.userData.update = (t, op) => {
      for (const b of bands) {
        b.m.material.opacity = op * (0.7 - b.k * 0.15);
        if (op <= 0.01) continue;
        const pos = b.m.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const [a, top, rr] = b.base[i];
          const wob = Math.sin(a * 5 + t * 0.4 + b.k) * 8 + Math.sin(a * 11 - t * 0.7) * 3;
          const y = 22 + b.k * 8 + Math.sin(a * 3 + t * 0.25) * 8 + (top ? 34 + Math.sin(a * 7 + t) * 8 : 0);
          pos.setXYZ(i, Math.sin(a) * (rr + wob), y, -Math.cos(a) * (rr + wob));
        }
        pos.needsUpdate = true;
      }
    };
    return group;
  }
  function cloudSea(y, size) {
    const t = mist().clone();
    t.needsUpdate = true;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.repeat.set(6, 6);
    const mat = new T.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.9, depthWrite: false, color: 0xffffff });
    const m = new T.Mesh(new T.CircleGeometry(size, 48), mat);
    m.rotation.x = -PI / 2;
    m.position.y = y;
    m.userData.tex = t;
    return m;
  }
  function fireflies(rng, n, radius, yMin, yMax, color) {
    const geo = new T.BufferGeometry();
    const p = new Float32Array(n * 3);
    const base = [];
    for (let i = 0; i < n; i++) {
      const a = rng() * PI * 2;
      const r = Math.sqrt(rng()) * radius;
      base.push([Math.cos(a) * r, yMin + rng() * (yMax - yMin), Math.sin(a) * r, rng() * 10]);
    }
    geo.setAttribute("position", new T.BufferAttribute(p, 3));
    const mat = new T.PointsMaterial({ color: col(color || "#d9ff8a"), size: 0.32, map: dot(), transparent: true, blending: T.AdditiveBlending, depthWrite: false, opacity: 0.8 });
    const pts = new T.Points(geo, mat);
    pts.frustumCulled = false;
    pts.userData.update = (t, op) => {
      mat.opacity = op;
      for (let i = 0; i < n; i++) {
        const b = base[i];
        p[i * 3] = b[0] + Math.sin(t * 0.5 + b[3]) * 0.8;
        p[i * 3 + 1] = b[1] + Math.sin(t * 0.9 + b[3] * 2) * 0.3;
        p[i * 3 + 2] = b[2] + Math.cos(t * 0.4 + b[3]) * 0.8;
      }
      geo.attributes.position.needsUpdate = true;
    };
    return pts;
  }
  function mistWisps(rng, n, radius, y) {
    const group = grp();
    const list = [];
    for (let i = 0; i < n; i++) {
      const s = new T.Sprite(new T.SpriteMaterial({ map: dot(), color: 0xffffff, transparent: true, opacity: 0.12, depthWrite: false }));
      const a = rng() * PI * 2;
      const r = radius * (0.6 + rng() * 0.5);
      s.scale.set(7 + rng() * 6, 2 + rng() * 1.5, 1);
      group.add(s);
      list.push({ s, a, r, y: y + rng() * 1.2, sp: (rng() - 0.5) * 0.04 });
    }
    group.userData.update = (dt, color, op) => {
      for (const w of list) {
        w.a += w.sp * dt;
        w.s.position.set(Math.cos(w.a) * w.r, w.y, Math.sin(w.a) * w.r);
        w.s.material.color.copy(color);
        w.s.material.opacity = op;
      }
    };
    return group;
  }

  /* ---------- Gelaende ---------- */
  function noise2(x, z, s) {
    return Math.sin(x * 0.37 + s) * Math.cos(z * 0.41 - s) * 0.5 + Math.sin(x * 0.11 + z * 0.13 + s * 2) * 0.5 + Math.sin(x * 1.3 - z * 0.9) * 0.15;
  }
  // Schwebende Insel: huegelige Grasflaeche mit Wegen, Felskante, zerkluftete Unterseite mit Wurzeln
  function island(radius, depth, rng, o) {
    o = o || {};
    const isl = grp();
    const seed = rng() * 10;
    const paths = o.paths || [];
    const top = new T.RingGeometry(0.001, radius, 72, 28);
    top.rotateX(-PI / 2);
    const pos = top.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const g1 = col(o.grass || "#3f5a3c");
    const g2 = col(o.grass2 || "#5a6a3e");
    const dirt = col(o.dirt || "#6a5a44");
    const distSeg = (px, pz, ax, az, bx, bz) => {
      const vx = bx - ax;
      const vz = bz - az;
      const t = Math.max(0, Math.min(1, ((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz || 1)));
      return Math.hypot(px - ax - vx * t, pz - az - vz * t);
    };
    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let z = pos.getZ(i);
      const a = Math.atan2(z, x);
      const rr = Math.hypot(x, z);
      const k = 1 + 0.05 * Math.sin(3 * a + seed) + 0.03 * Math.sin(7 * a + seed * 2);
      x *= k;
      z *= k;
      const edge = rr / radius;
      let flat = 1;
      let pathD = 99;
      for (const p of paths) pathD = Math.min(pathD, p.r ? Math.abs(Math.hypot(x - p.x, z - p.z) - 0) - p.r : distSeg(x, z, p[0], p[1], p[2], p[3]) - 0.5);
      if (o.plaza) pathD = Math.min(pathD, Math.hypot(x - o.plaza[0], z - o.plaza[1]) - o.plaza[2]);
      flat = smooth(0, 2.5, pathD);
      const hill = (noise2(x, z, seed) * 0.35 + 0.1) * flat * (1 - smooth(0.85, 1, edge)) * (o.hills || 1);
      pos.setXYZ(i, x, hill, z);
      const n = (noise2(x * 3, z * 3, seed * 3) + 1) / 2;
      const c = g1.clone().lerp(g2, n);
      c.lerp(dirt, 1 - smooth(-0.2, 0.6, pathD));
      c.multiplyScalar(0.85 + 0.15 * (1 - edge * 0.5));
      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }
    top.setAttribute("color", new T.BufferAttribute(colors, 3));
    top.computeVertexNormals();
    const tm = new T.Mesh(top, new T.MeshLambertMaterial({ vertexColors: true }));
    tm.receiveShadow = true;
    isl.add(tm);
    // Felskante
    const cliffG = new T.CylinderGeometry(radius * 1.02, radius * 0.94, 2.2, 72, 4, true);
    const cp = cliffG.attributes.position;
    for (let i = 0; i < cp.count; i++) {
      const x = cp.getX(i);
      const z = cp.getZ(i);
      const a = Math.atan2(z, x);
      const k = 1 + 0.05 * Math.sin(3 * a + seed) + 0.03 * Math.sin(7 * a + seed * 2) + (rng() - 0.5) * 0.03;
      cp.setX(i, x * k);
      cp.setZ(i, z * k);
    }
    cliffG.computeVertexNormals();
    const cliff = new T.Mesh(cliffG, tiled("stone", o.rock || "#5a5650", 10, 1, { side: T.DoubleSide }));
    cliff.position.y = -1.1;
    isl.add(cliff);
    const under = new T.ConeGeometry(radius * 0.95, depth, 40, 8);
    const up = under.attributes.position;
    for (let i = 0; i < up.count; i++) {
      const y = up.getY(i);
      const f = 1 + (rng() - 0.5) * 0.3 * (1 - Math.abs(y / depth));
      up.setX(i, up.getX(i) * f);
      up.setZ(i, up.getZ(i) * f);
    }
    under.computeVertexNormals();
    const um = new T.Mesh(under, tiled("stone", R.shade(o.rock || "#5a5650", 0.7), 6, 3, { flatShading: true }));
    um.rotation.x = PI;
    um.position.y = -2.2 - depth / 2;
    isl.add(um);
    // Wurzeln und Ranken haengen herab
    const rootM = pm("bark", "#3a2e24");
    for (let i = 0; i < (o.roots || 14); i++) {
      const a = rng() * PI * 2;
      const r0 = radius * (0.9 + rng() * 0.08);
      const len = 1.5 + rng() * 3.5;
      const pts = [[0, 0, 0], [(rng() - 0.5) * 0.4, -len * 0.4, (rng() - 0.5) * 0.4], [(rng() - 0.5) * 0.8, -len, (rng() - 0.5) * 0.6]];
      const root = mesh(G.tube("root" + i + "|" + len.toFixed(1), pts, 0.06 + rng() * 0.05, 10, 5), rootM, { p: [Math.cos(a) * r0, -1.6, Math.sin(a) * r0] });
      isl.add(root);
      if (i % 3 === 0) isl.add(mesh(G.sph(0.08, 6, 6), emis(o.vineGlow || "#7fffc8", 1.2), { p: [Math.cos(a) * r0 + pts[2][0], -1.6 - len, Math.sin(a) * r0 + pts[2][2]] }));
    }
    for (let i = 0; i < 10; i++) {
      const a = rng() * PI * 2;
      const r0 = radius * 0.6 * rng();
      isl.add(mesh(G.cone(0.4 + rng() * 0.5, 2 + rng() * 3, 6), um.material, { p: [Math.cos(a) * r0, -2.2 - depth * (0.3 + rng() * 0.5), Math.sin(a) * r0], r: [PI, 0, 0] }));
    }
    isl.userData.top = tm;
    return isl;
  }
  // Hoehe der Insel an einer Stelle (fuer das Aufstellen von Dingen)
  function heightAt(isl, x, z) {
    const geo = isl.userData.top.geometry;
    const pos = geo.attributes.position;
    let best = 0;
    let bd = 1e9;
    for (let i = 0; i < pos.count; i += 3) {
      const d = (pos.getX(i) - x) ** 2 + (pos.getZ(i) - z) ** 2;
      if (d < bd) {
        bd = d;
        best = pos.getY(i);
      }
    }
    return best;
  }

  /* ---------- Pflanzen und Kleinkram ---------- */
  function gnarledTree(rng, o) {
    o = o || {};
    const t = grp();
    const bark = pm("bark", o.bark || "#4a3a2e");
    const h = 2.2 + rng() * 1.4;
    const pts = [[0, 0, 0], [(rng() - 0.5) * 0.4, h * 0.35, (rng() - 0.5) * 0.4], [(rng() - 0.5) * 0.7, h * 0.7, (rng() - 0.5) * 0.5], [(rng() - 0.5) * 0.6, h, (rng() - 0.5) * 0.4]];
    t.add(mesh(G.tube("tr" + h.toFixed(2) + pts[1][0].toFixed(2), pts, 0.17, 12, 7), bark));
    t.add(mesh(G.cone(0.32, 0.5, 7), bark, { p: [0, 0.2, 0] }));
    const leafC = o.leaf || ["#2c4436", "#33503c", "#28403a", "#3b4a2e"][Math.floor(rng() * 4)];
    const leafM = pm("plain", leafC, { flat: true });
    const top = pts[3];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * PI * 2 + rng();
      const r = i === 0 ? 0 : 0.6 + rng() * 0.3;
      t.add(mesh(G.ico(0.75 + rng() * 0.35, 1), leafM, { p: [top[0] + Math.cos(a) * r, top[1] + (i === 0 ? 0.35 : -0.1 + rng() * 0.3), top[2] + Math.sin(a) * r], s: [1, 0.75, 1] }));
    }
    for (let i = 0; i < 2; i++) {
      const s = i ? 1 : -1;
      t.add(mesh(G.tube("br" + i, [[0, 0, 0], [0.35 * s, 0.25, 0.05], [0.7 * s, 0.35, 0.1]], 0.06, 6, 5), bark, { p: [pts[2][0], pts[2][1] - 0.2, pts[2][2]] }));
    }
    if (o.moss !== false && rng() < 0.5)
      for (let i = 0; i < 3; i++) t.add(mesh(G.cone(0.04, 0.5 + rng() * 0.4, 4), pm("fur", "#5f7a4a"), { p: [top[0] + (rng() - 0.5) * 1.2, top[1] - 0.6, top[2] + (rng() - 0.5) * 1.2], r: [PI, 0, 0] }));
    t.scale.setScalar(0.85 + rng() * 0.4);
    return t;
  }
  function pine(rng) {

    const m = pm("plain", ["#1f3530", "#243a2f", "#2a3f36"][Math.floor(rng() * 3)], { flat: true });
    for (let i = 0; i < 4; i++) t.add(mesh(G.cone(1.0 - i * 0.2, 1.2, 7), m, { p: [0, 1.1 + i * 0.6, 0], r: [0, rng(), 0] }));

  function shrooms(rng, color) {

  function crystals(rng, color) {

  function standingStone(rng, h, runeC) {

  let prismGeo = null;
  function gableRoof(w, d, h, mat) {
    if (!prismGeo) {
      prismGeo = new T.CylinderGeometry(1, 1, 1, 3, 1);
      prismGeo.rotateZ(-PI / 2);
      prismGeo.rotateX(-PI / 2);
    }
    const sy = h / 1.5;
    return mesh(prismGeo, mat, { p: [0, 0.5 * sy, 0], s: [w, sy, d / 1.732] });
  }
  function fire(night, size) {
    const g = grp();
    const fm = new T.MeshBasicMaterial({ color: col("#ff8a2a"), transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false });
    for (let i = 0; i < 3; i++) {
      const f = mesh(G.cone(0.18 * size, 0.6 * size, 6), fm, { p: [(i - 1) * 0.08 * size, 0.25 * size, (i % 2) * 0.06 * size] });
      f.userData.flick = i + 1;
      g.add(f);
    }
    g.add(mesh(G.cone(0.1 * size, 0.4 * size, 6), new T.MeshBasicMaterial({ color: col("#ffe9a0") }), { p: [0, 0.18 * size, 0] }));
    const h = R.haloSprite("#ff9a3d", 2.2 * size, 0.7, [0, 0.35 * size, 0]);
    g.add(h);
    night.halos.push(h);
    g.userData.fire = true;
    return g;
  }

    w.add(tail);
    for (const s of [-1, 1]) w.add(mesh(G.box(1.4, 0.1, 0.6), skin, { p: [1.2, -0.6, s * 1.6], r: [0, s * 0.4, s * 0.3] }));
    for (const s of [-1, 1]) w.add(mesh(G.sph(0.12, 8, 6), emis("#9fe3ff", 1), { p: [3.4, 0.25, s * 0.9] }));
    for (let i = 0; i < 6; i++) w.add(mesh(G.sph(0.09, 6, 6), emis("#9fe3ff", 1.2), { p: [2 - i * 0.9, 1.25 - Math.abs(i - 2.5) * 0.05, 0] }));
    w.userData.tail = tail;
    return w;
  }
  function raven() {
    const b = grp();
    const m = basic("#0e0c12");
    b.add(mesh(G.sph(0.15, 8, 6), m, { s: [1, 0.8, 2] }));
    const wings = [];
    for (const s of [1, -1]) {
      const w = grp([0.1 * s, 0, 0]);
      w.add(mesh(G.box(0.6, 0.03, 0.22), m, { p: [0.3 * s, 0, 0] }));
      b.add(w);
      wings.push({ w, s });
    }
    b.userData.wings = wings;
    return b;
  }

  /* ---------- Insel-Hub ---------- */
  const LAYOUT = {
    brunnen: [0.5, 0.8],
    taverne: [-5.6, 1.8],
    heim: [-3.2, 6.6],
    stall: [4.6, 5.8],
    leuchtturm: [10.0, 3.2],
    arena: [7.6, -2.2],
    gildenhalle: [8.8, -7.2],
    ruhmeshalle: [3.6, -8.6],
    arkanum: [-2.4, -9.2],
    steinkreis: [-8.4, -6.6],
    schmiede: [-9.8, -1.6],
    tiefen: [-10.8, 3.8],
  };
  const LABEL_H = { brunnen: 3.6, taverne: 4.5, heim: 3.8, stall: 3.8, leuchtturm: 9.0, arena: 4.6, gildenhalle: 5.0, ruhmeshalle: 4.3, arkanum: 9.6, steinkreis: 3.4, schmiede: 4.8, tiefen: 4.8 };

  R.createHub = function (el, opts) {
    init();
    opts = opts || {};
    const quality = opts.quality || "hoch";
    const hi = quality === "hoch";
    const renderer = makeRenderer(el, { shadows: hi, maxDpr: hi ? 1.75 : 1.25 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(40, 1, 0.5, 700);
    const rng = R.rng(42);
    let dayMode = opts.dayCycle || "zyklus";
    const sky = skyDome();
    scene.add(sky);
    scene.fog = new T.Fog("#9fb0b4", 45, 170);
    const hemi = new T.HemisphereLight("#d8e2ee", "#4a3e30", 1.0);
    scene.add(hemi);
    const sun = new T.DirectionalLight("#ffe9c8", 2.0);
    sun.position.set(14, 24, 10);
    if (hi) {
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const sc = sun.shadow.camera;
      sc.left = -18;
      sc.right = 18;
      sc.top = 18;
      sc.bottom = -18;
      sc.near = 1;
      sc.far = 80;
      sun.shadow.bias = -0.0008;
      sun.shadow.normalBias = 0.03;
    }
    scene.add(sun);
    scene.add(sun.target);
    const stars = starField(rng, 900);
    scene.add(stars);
    const moon = moonSprite();
    scene.add(moon);
    const sunGlow = new T.Sprite(new T.SpriteMaterial({ map: dot(), color: col("#fff1d0"), transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
    sunGlow.scale.setScalar(60);
    scene.add(sunGlow);
    const aur = aurora();
    scene.add(aur);
    const sea = cloudSea(-26, 420);
    scene.add(sea);
    const sea2 = cloudSea(-18, 300);
    sea2.material.opacity = 0.35;
    sea2.userData.tex.repeat.set(4, 4);
    scene.add(sea2);
    const N = nightMats();

    const world = grp();
    scene.add(world);
    const paths = Object.values(LAYOUT).map(([x, z]) => [0.5, 0.8, x * 0.92, z * 0.92]);
    const isl = island(14, 12, rng, { paths, plaza: [0.5, 0.8, 3.0], grass: "#3d5a3e", grass2: "#55603c", dirt: "#5e5040", rock: "#5e5a54", roots: 22 });
    world.add(isl);
    // Pflastersteine auf dem Platz
    const cob = pm("stone", "#6a645c", { flat: true });
    for (let i = 0; i < 26; i++) {
      const a = rng() * PI * 2;
      const r = Math.sqrt(rng()) * 2.8;
      world.add(mesh(G.cyl(0.25 + rng() * 0.15, 0.3, 0.06, 6), cob, { p: [0.5 + Math.cos(a) * r, 0.03, 0.8 + Math.sin(a) * r], r: [0, rng(), 0], shadow: false }));
    }
    // Wasserfaelle
    const fallTex = (() => {
      const c = document.createElement("canvas");
      c.width = 32;
      c.height = 128;
      const g = c.getContext("2d");
      for (let i = 0; i < 40; i++) {
        g.fillStyle = "rgba(220,240,255," + (0.2 + Math.random() * 0.5) + ")";
        g.fillRect(Math.random() * 32, Math.random() * 128, 2 + Math.random() * 3, 10 + Math.random() * 30);
      }
      const t = new T.CanvasTexture(c);
      t.wrapS = t.wrapT = T.RepeatWrapping;
      return t;
    })();
    const falls = [];
    for (const a of [2.4, 4.0]) {
      const fm = new T.MeshBasicMaterial({ map: fallTex, color: col("#bfe0ff"), transparent: true, opacity: 0.55, depthWrite: false, side: T.DoubleSide });
      const f = new T.Mesh(new T.PlaneGeometry(1.4, 16), fm);
      f.position.set(Math.cos(a) * 14.3, -8, Math.sin(a) * 14.3);
      f.rotation.y = -a + PI / 2;
      world.add(f);
      falls.push(fm);
      const mm = R.haloSprite("#cfe8ff", 5, 0.25, [Math.cos(a) * 14.3, -15, Math.sin(a) * 14.3]);
      world.add(mm);
    }

    // Gebaeude
    const buildings = {};
    const pickables = [];
    const anim = { smoke: [], flags: [], beam: null, portal: null, runes: null, float: null, orbit: null, water: null, swing: null, orb: null, stones: null, griffin: null, homeFlag: null, sparks: [] };
    let homeTier = opts.homeTier || 0;
    let realm = opts.realm || "albion";
    function placeBuilding(id) {
      const [x, z] = LAYOUT[id];
      if (buildings[id]) world.remove(buildings[id]);
      const bg = B[id](rng, N, { homeTier, realm });
      bg.position.set(x, 0, z);
      bg.rotation.y = Math.atan2(0.5 - x, 10 - z);
      bg.userData.bid = id;
      world.add(bg);
      buildings[id] = bg;
      const u = bg.userData;
      if (u.smoke) {
        const parts = [];
        for (let i = 0; i < 7; i++) {
          const pm2 = new T.SpriteMaterial({ map: dot(), color: col("#8a8a92"), transparent: true, opacity: 0.5, depthWrite: false });
          const puff = new T.Sprite(pm2);
          puff.userData.t = i / 7;
          bg.add(puff);
          parts.push(puff);
        }
        anim.smoke = anim.smoke.filter((s) => s.id !== id);
        anim.smoke.push({ id, p: u.smoke, parts });
      }
      if (u.flags) anim.flags.push(...u.flags);
      if (u.beam) anim.beam = u.beam;
      if (u.portal) anim.portal = u.portal;
      if (u.runes) anim.runes = u.runes;
      if (u.float) anim.float = u.float;
      if (u.orbit) anim.orbit = u.orbit;
      if (u.water) anim.water = u.water;
      if (u.swing) anim.swing = u.swing;
      if (u.orb) anim.orb = u.orb;
      if (u.stones) anim.stones = u.stones;
      if (u.griffin) anim.griffin = u.griffin;
      if (u.flag) anim.homeFlag = u.flag;
      if (u.guildBanners) anim.guildBanners = u.guildBanners;
      if (u.sparks) anim.sparks.push({ b: bg, p: u.sparks });
      return bg;
    }
    for (const id in LAYOUT) placeBuilding(id);
    function rebuildPickables() {
      for (const p of pickables) scene.remove(p);
      pickables.length = 0;
      for (const id in buildings) {
        const bg = buildings[id];
        const bb = new T.Box3().setFromObject(bg);
        const size = bb.getSize(new T.Vector3());
        const center = bb.getCenter(new T.Vector3());
        const hit = new T.Mesh(new T.BoxGeometry(Math.min(size.x, 7) + 0.4, size.y + 0.4, Math.min(size.z, 7) + 0.4), new T.MeshBasicMaterial({ visible: false }));
        hit.position.copy(center);
        hit.userData.bid = id;
        scene.add(hit);
        pickables.push(hit);
      }
    }
    rebuildPickables();

    // Vegetation, Steine, Laternen
    const blocked = Object.values(LAYOUT).map(([x, z]) => [x, z, 3.2]).concat([[0.5, 0.8, 3.4]]);
    const free = (x, z, r) => !blocked.some(([bx, bz, br]) => Math.hypot(bx - x, bz - z) < br + r) && !paths.some((p) => {
      const vx = p[2] - p[0];
      const vz = p[3] - p[1];
      const t = Math.max(0, Math.min(1, ((x - p[0]) * vx + (z - p[1]) * vz) / (vx * vx + vz * vz)));
      return Math.hypot(x - p[0] - vx * t, z - p[1] - vz * t) < 1.1 + r;
    });
    const placeAt = (obj, x, z) => {
      obj.position.set(x, heightAt(isl, x, z) - 0.05, z);
      world.add(obj);
    };
    let placed = 0;
    for (let tries = 0; tries < 700 && placed < 38; tries++) {
      const a = rng() * PI * 2;
      const r = 3.5 + rng() * 9.8;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (!free(x, z, 0.8)) continue;
      if (z > 6 && Math.abs(x) < 6) continue;
      const kind = rng();
      const tr = kind < 0.45 ? gnarledTree(rng) : kind < 0.85 ? pine(rng) : deadTree(rng);
      tr.rotation.y = rng() * PI * 2;
      placeAt(tr, x, z);
      blocked.push([x, z, 1.0]);
      placed++;
    }
    for (let i = 0; i < 40; i++) {
      const a = rng() * PI * 2;
      const r = 3.6 + rng() * 9.8;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (!free(x, z, 0.3)) continue;
      const k = i % 4;
      const o = k === 0 ? shrooms(rng) : k === 1 ? crystals(rng, ["#8fd8ff", "#b48cff", "#7fffb0"][i % 3]) : rock(rng);
      placeAt(o, x, z);
    }
    // kleine Steinkreise und Runensteine verstreut
    for (let i = 0; i < 5; i++) {
      const a = rng() * PI * 2;
      const r = 6 + rng() * 6;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (!free(x, z, 0.5)) continue;
      const s = standingStone(rng, 1.2 + rng(), ["#9fd8ff", "#7fffb0", "#e8c35a"][i % 3]);
      s.scale.setScalar(0.7);
      s.rotation.y = rng() * PI;
      placeAt(s, x, z);
    }
    for (const id of ["taverne", "arena", "heim", "stall", "arkanum", "ruhmeshalle", "gildenhalle", "steinkreis"]) {
      const [x, z] = LAYOUT[id];
      const lx = x * 0.55 + 0.9;
      const lz = z * 0.55 + 0.5;
      const l = lantern(N);
      l.rotation.y = rng() * PI * 2;
      placeAt(l, lx, lz);
    }
    // Schwebende Felsen mit Ruinen
    const islets = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * PI * 2 + 0.4;
      const d = 24 + i * 3;
      const isg = grp([Math.cos(a) * d, -4 + (i % 3) * 3, Math.sin(a) * d]);
      const small = island(2.4 + rng() * 1.4, 4 + rng() * 3, rng, { grass: "#3a5038", grass2: "#4a5a38", rock: "#5a5650", roots: 5, hills: 0.4 });
      isg.add(small);
      if (i % 2) isg.add(gnarledTree(rng));
      else {
        for (let k = 0; k < 3; k++) {
          const s = standingStone(rng, 1.4 + rng(), k === 1 ? "#9fd8ff" : null);
          s.position.set((k - 1) * 0.9, 0, (rng() - 0.5) * 0.5);
          s.scale.setScalar(0.7);
          isg.add(s);
        }
      }
      islets.push({ g: isg, ph: rng() * 6, y: isg.position.y });
      scene.add(isg);
    }
    const whale = skyWhale(rng);
    scene.add(whale);
    const ravens = [];
    for (let i = 0; i < 5; i++) {
      const b = raven();
      b.scale.setScalar(0.7);
      ravens.push({ b, ph: rng() * 6, r: 16 + rng() * 10, h: 17 + rng() * 5, sp: 0.1 + rng() * 0.1 });
      scene.add(b);
    }
    const flies = fireflies(rng, hi ? 140 : 70, 13, 0.4, 3.0, "#d9ff8a");
    world.add(flies);
    const wisps = mistWisps(rng, hi ? 16 : 8, 13, 0.3);
    world.add(wisps);

    // Held und Bewohner der Freistatt
    let heroModel = null;
    const villagers = [];
    const vr = R.rng(7);
    const vSpots = [[-3.2, 3.0, 0.8, "albion"], [5.2, 1.4, -1.2, "midgard"], [-5.4, -3.2, 0.4, "hibernia"], [-6.2, -4.4, 2.6, "seherin"]];
    for (const [x, z, ry, rk] of vSpots) {
      let v;
      if (rk === "seherin") {
        v = R.buildHero({ race: "sidhe", cls: "dornenrufer", realm: "hibernia", gender: "w", look: { skin: "#d6cfe6", hair: "#f2f2f2", hairStyle: 2, eyes: "#7fffb0", tattoo: "mond", tattooColor: "#4fffb0" }, gear: { ruestung: { base: "robe", tint: "#3a3a5a", style: 1 }, helm: { base: "hut", tint: "#2a2a44", style: 0 }, waffe: { base: "stab", rarity: "episch", style: 1 } } });
      } else {
        const races = Object.keys(SB.data.RACES).filter((r) => SB.data.RACES[r].realm === rk);
        const race = races[Math.floor(vr() * races.length)];
        const R0 = SB.data.RACES[race];
        const clsList = Object.keys(SB.data.CLASSES).filter((c) => SB.data.CLASSES[c].realm === rk);
        v = R.buildHero({ race, cls: clsList[Math.floor(vr() * clsList.length)], realm: rk, gender: vr() < 0.5 ? "m" : "w", look: { skin: R0.skins[Math.floor(vr() * 4)], hair: R0.hairs[Math.floor(vr() * 5)], hairStyle: Math.floor(vr() * 6), beard: Math.floor(vr() * 5) }, gear: { umhang: { base: "umhang", tint: SB.data.REALMS[rk].color } } });
      }
      v.obj.position.set(x, heightAt(isl, x, z), z);
      v.obj.rotation.y = ry;
      v.obj.scale.multiplyScalar(0.72);
      world.add(v.obj);
      villagers.push(v);
    }

    // Kamera
    const cam = { az: 0.05, pol: 1.04, rad: 40, target: new T.Vector3(0, 0.2, 0) };
    const goal = { az: 0.05, pol: 1.04, rad: 40, target: new T.Vector3(0, 0.2, 0) };
    let inset = 0;
    function updateCamera() {
      const s = Math.sin(cam.pol);
      camera.position.set(cam.target.x + cam.rad * s * Math.sin(cam.az), cam.target.y + cam.rad * Math.cos(cam.pol), cam.target.z + cam.rad * s * Math.cos(cam.az));
      camera.lookAt(cam.target);
    }

    // Beschriftungen
    const labelLayer = document.createElement("div");
    labelLayer.className = "hub-labels";
    el.appendChild(labelLayer);
    const labels = {};
    for (const bdef of SB.data.BUILDINGS) {
      const d = document.createElement("button");
      d.type = "button";
      d.className = "hub-label";
      d.dataset.bid = bdef.id;
      d.innerHTML = '<span class="hl-name"></span><span class="hl-badge" hidden></span>';
      d.querySelector(".hl-name").textContent = bdef.short;
      d.addEventListener("click", (e) => {
        e.stopPropagation();
        if (opts.onPick) opts.onPick(bdef.id);
      });
      labelLayer.appendChild(d);
      labels[bdef.id] = d;
    }
    const tmpV = new T.Vector3();
    function updateLabels(w, h) {
      for (const id in labels) {
        const bg = buildings[id];
        if (!bg) continue;
        tmpV.set(bg.position.x, LABEL_H[id] || 4, bg.position.z);
        tmpV.project(camera);
        const lab = labels[id];
        if (tmpV.z > 1) {
          lab.style.opacity = "0";
          continue;
        }
        lab.style.opacity = "";
        lab.style.transform = "translate(" + ((tmpV.x * 0.5 + 0.5) * w).toFixed(1) + "px," + ((-tmpV.y * 0.5 + 0.5) * h).toFixed(1) + "px) translate(-50%,-100%)";
      }
    }

    // Eingabe
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    let hover = null;
    let drag = null;
    const canvas = renderer.domElement;
    function pick(ev) {
      const rect = canvas.getBoundingClientRect();
      ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects(pickables, false);
      return hits.length ? hits[0].object.userData.bid : null;
    }
    function setHover(id) {
      if (hover === id) return;
      if (hover && labels[hover]) labels[hover].classList.remove("hover");
      hover = id;
      if (id && labels[id]) labels[id].classList.add("hover");
      canvas.style.cursor = id ? "pointer" : "grab";
      if (opts.onHover) opts.onHover(id);
    }
    const pointers = new Map();
    let pinchStart = 0;
    canvas.addEventListener("pointerdown", (ev) => {
      canvas.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
        drag = null;
      } else drag = { x: ev.clientX, y: ev.clientY, moved: 0, az: goal.az, pol: goal.pol };
    });
    canvas.addEventListener("pointermove", (ev) => {
      if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchStart) goal.rad = Math.max(18, Math.min(48, goal.rad * (pinchStart / d)));
        pinchStart = d;
        return;
      }
      if (drag) {
        const dx = ev.clientX - drag.x;
        const dy = ev.clientY - drag.y;
        drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
        goal.az = drag.az - dx * 0.006;
        goal.pol = Math.max(0.55, Math.min(1.3, drag.pol - dy * 0.004));
        if (drag.moved > 6) canvas.style.cursor = "grabbing";
      } else if (ev.pointerType === "mouse") setHover(pick(ev));
    });
    const endPointer = (ev) => {
      pointers.delete(ev.pointerId);
      if (drag && drag.moved < 6) {
        const id = pick(ev);
        if (id && opts.onPick) opts.onPick(id);
      }
      drag = null;
      pinchStart = 0;
      canvas.style.cursor = hover ? "pointer" : "grab";
    };
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", (ev) => {
      pointers.delete(ev.pointerId);
      drag = null;
    });
    canvas.addEventListener("pointerleave", () => setHover(null));
    canvas.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        goal.rad = Math.max(18, Math.min(48, goal.rad * (1 + Math.sign(ev.deltaY) * 0.08)));
      },
      { passive: false }
    );

    // Tageszeit anwenden
    let info = R.dayInfo(R.dayTime(dayMode));
    const sunDir = new T.Vector3();
    const under = col("#0a0d18");
    function applyDaytime(t) {
      info = R.dayInfo(t);
      const P = palette(info);
      const a = t * 2 * PI;
      sunDir.set(Math.sin(a) * 0.55, -Math.cos(a), 0.45).normalize();
      const lightDir = info.sunH > -0.05 ? sunDir : sunDir.clone().negate();
      sun.position.copy(lightDir).multiplyScalar(40);
      sun.color.copy(P.sun);
      sun.intensity = P.sunI * (info.sunH > -0.05 ? 1 : 0.75);
      hemi.color.copy(P.hemiSky);
      hemi.groundColor.copy(P.hemiGround);
      hemi.intensity = P.hemiI;
      sky.userData.recolor(P.top, P.bot, under.clone().lerp(P.fog, 0.4));
      scene.fog.color.copy(P.fog);
      stars.material.opacity = Math.max(0, info.night - 0.15);
      moon.position.copy(sunDir).multiplyScalar(-200);
      moon.material.opacity = smooth(0.1, 0.6, info.night);
      sunGlow.position.copy(sunDir).multiplyScalar(200);
      sunGlow.material.opacity = smooth(-0.1, 0.2, info.sunH) * 0.8;
      sunGlow.material.color.copy(P.sun);
      N.win.emissiveIntensity = 0.25 + 1.6 * info.night;
      for (const h of N.halos) h.material.opacity = 0.35 + 0.55 * info.night;
      sea.material.color.copy(P.bot).multiplyScalar(0.9);
      sea2.material.color.copy(P.fog);
      renderer.toneMappingExposure = 1.05 + 0.25 * info.night;
    }
    applyDaytime(R.dayTime(dayMode));

    let running = true;
    let raf = 0;
    let last = performance.now();
    let w = 1;
    let h = 1;
    function resize() {
      w = Math.max(1, el.clientWidth);
      h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      if (inset > 0) camera.setViewOffset(w + inset, h, inset, 0, w, h);
      else camera.clearViewOffset();
      camera.updateProjectionMatrix();
      goal.rad = Math.max(goal.rad, w < 640 ? 48 : 34);
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();

    let dayTimer = 0;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!running || document.hidden) {
        last = now;
        return;
      }
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      const t = now / 1000;
      const k = 1 - Math.pow(0.0015, dt);
      cam.az += (goal.az - cam.az) * k;
      cam.pol += (goal.pol - cam.pol) * k;
      cam.rad += (goal.rad - cam.rad) * k;
      cam.target.lerp(goal.target, k);
      updateCamera();
      dayTimer += dt;
      if (dayTimer > 0.5) {
        dayTimer = 0;
        applyDaytime(R.dayTime(dayMode));
      }
      for (const s of anim.smoke) {
        for (const p of s.parts) {
          p.userData.t = (p.userData.t + dt * 0.16) % 1;
          const u = p.userData.t;
          p.position.set(s.p[0] + Math.sin(u * 6 + t) * 0.25, s.p[1] + u * 3, s.p[2]);
          p.scale.setScalar(0.5 + u * 2);
          p.material.opacity = 0.45 * (1 - u);
        }
      }
      for (const f of anim.flags) f.rotation.y = Math.sin(t * 2.2 + f.position.x * 3) * 0.3;
      if (anim.beam) {
        anim.beam.rotation.y += dt * 0.6;
        anim.beam.children[0].material.opacity = 0.01 + 0.025 * info.night;
      }
      if (anim.portal) anim.portal.rotation.z -= dt * 1.2;
      if (anim.runes)
        anim.runes.forEach((r, i) => {
          const a = t * 0.7 + (i * PI) / 2;
          r.position.set(Math.cos(a) * 2.1, 2.2 + Math.sin(t * 2 + i) * 0.3, Math.sin(a) * 0.8 + 0.5);
          r.rotation.y = -a;
        });
      if (anim.float) {
        anim.float.position.y = 8.6 + Math.sin(t * 1.3) * 0.25;
        anim.float.rotation.y += dt;
      }
      if (anim.orbit) anim.orbit.rotation.y += dt * 0.5;
      if (anim.orb) {
        anim.orb.position.y = 1.4 + Math.sin(t * 1.2) * 0.12;
        anim.orb.material.emissiveIntensity = 0.9 + Math.sin(t * 2) * 0.3;
      }
      if (anim.water) anim.water.emissiveIntensity = 0.45 + Math.sin(t * 1.6) * 0.15 + info.night * 0.4;
      if (anim.swing) anim.swing.rotation.x = Math.sin(t * 1.5) * 0.15;
      if (anim.griffin) {
        anim.griffin.userData.head.rotation.y = Math.sin(t * 0.5) * 0.6;
        anim.griffin.position.y = Math.max(0, Math.sin(t * 0.8)) * 0.03;
      }
      if (anim.homeFlag) anim.homeFlag.rotation.y = Math.sin(t * 2.6) * 0.25;
      if (anim.sparks.length && Math.random() < dt * 6) {
        const s = anim.sparks[0];
        const sp = new T.Sprite(new T.SpriteMaterial({ map: dot(), color: col("#ffb050"), transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
        sp.scale.setScalar(0.12);
        sp.position.set(s.p[0] + (Math.random() - 0.5) * 0.3, s.p[1], s.p[2]);
        sp.userData.v = new T.Vector3((Math.random() - 0.5) * 1.5, 1.5 + Math.random(), (Math.random() - 0.5) * 1.5);
        sp.userData.life = 0.7;
        s.b.add(sp);
        anim.sparkList = anim.sparkList || [];
        anim.sparkList.push(sp);
      }
      if (anim.sparkList)
        for (let i = anim.sparkList.length - 1; i >= 0; i--) {
          const sp = anim.sparkList[i];
          sp.userData.life -= dt;
          sp.userData.v.y -= dt * 4;
          sp.position.addScaledVector(sp.userData.v, dt);
          if (sp.userData.life <= 0) {
            sp.parent.remove(sp);
            anim.sparkList.splice(i, 1);
          }
        }
      for (const is of islets) is.g.position.y = is.y + Math.sin(t * 0.4 + is.ph) * 0.5;
      const wa = t * 0.025;
      whale.position.set(Math.cos(wa) * 48, 10 + Math.sin(t * 0.3) * 2, Math.sin(wa) * 48);
      whale.rotation.y = -wa + PI;
      whale.userData.tail.rotation.y = Math.sin(t * 0.9) * 0.25;
      for (const rv of ravens) {
        const a = t * rv.sp + rv.ph;
        rv.b.position.set(Math.cos(a) * rv.r, rv.h + Math.sin(t + rv.ph) * 0.6, Math.sin(a) * rv.r);
        rv.b.rotation.y = -a;
        for (const wg of rv.b.userData.wings) wg.w.rotation.z = wg.s * (0.2 + Math.sin(t * 7 + rv.ph) * 0.45);
      }
      sea.userData.tex.offset.x += dt * 0.004;
      sea2.userData.tex.offset.y += dt * 0.006;
      fallTex.offset.y += dt * 0.8;
      flies.userData.update(t, 0.15 + 0.85 * info.night);
      wisps.userData.update(dt, scene.fog.color, 0.08 + 0.1 * info.day + 0.06 * info.dusk);
      aur.userData.update(t, smooth(0.5, 0.95, info.night) * 0.8);
      for (const id in buildings) {
        const b = buildings[id];
        const target = id === hover ? 1.05 : 1;
        const s = b.scale.x + (target - b.scale.x) * Math.min(1, dt * 10);
        b.scale.setScalar(s);
      }
      if (heroModel) heroModel.update(dt);
      for (const v of villagers) v.update(dt);
      renderer.render(scene, camera);
      updateLabels(w, h);
    }
    raf = requestAnimationFrame(frame);

    return {
      setHero(desc) {
        if (heroModel) world.remove(heroModel.obj);
        heroModel = R.buildHero(desc);
        heroModel.obj.position.set(2.6, 0, 3.4);
        heroModel.obj.rotation.y = 0.15;
        heroModel.obj.scale.multiplyScalar(0.82);
        world.add(heroModel.obj);
        if (desc.realm && desc.realm !== realm) {
          realm = desc.realm;
          placeBuilding("heim");
          rebuildPickables();
        }
      },
      setHome(tier, realmId) {
        if (tier === homeTier && (!realmId || realmId === realm)) return;
        homeTier = tier;
        if (realmId) realm = realmId;
        placeBuilding("heim");
        rebuildPickables();
      },
      setGuildColors(c1, c2) {
        if (!anim.guildBanners) return;
        anim.guildBanners[0].material = pm("cloth", c1 || "#6a2a2a", { ds: true });
        anim.guildBanners[1].material = pm("cloth", c2 || c1 || "#2a3a6a", { ds: true });
      },
      setDayCycle(mode) {
        dayMode = mode || "zyklus";
        applyDaytime(R.dayTime(dayMode));
      },
      dayInfo: () => info,
      cheer() {
        if (heroModel) heroModel.play("victory", 1.2);
      },
      setBadges(map) {
        for (const id in labels) {
          const b = labels[id].querySelector(".hl-badge");
          const v = map && map[id];
          b.hidden = !v;
          b.textContent = v || "";
          labels[id].classList.toggle("ready", !!v);
        }
      },
      focus(id) {
        if (id && buildings[id]) {
          const p = buildings[id].position;
          goal.target.set(p.x * 0.85, 1.4, p.z * 0.85);
          goal.rad = 20;
          goal.az = Math.atan2(p.x, p.z + 12) * 0.6;
          goal.pol = 1.0;
        } else {
          goal.target.set(0, 0.2, 0);
          goal.rad = w < 640 ? 48 : 40;
          goal.pol = 1.04;
        }
      },
      setInset(px) {
        inset = Math.max(0, Math.round(px || 0));
        resize();
      },
      pause() {
        running = false;
      },
      resume() {
        running = true;
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        labelLayer.remove();
        killRenderer(renderer);
      },
    };
  };

  /* ---------- Heldenansicht ---------- */
  function runePedestal(color) {
    const ped = grp();
    ped.add(mesh(G.cyl(1.1, 1.25, 0.3, 10), pm("stone", "#3a3a44", { flat: true }), { p: [0, -0.15, 0] }));
    ped.add(mesh(G.torus(1.0, 0.025, PI * 2, 4, 48), glow(color, 0.8), { p: [0, 0.01, 0], r: [PI / 2, 0, 0] }));
    const runes = grp([0, 0.012, 0]);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * PI * 2;
      runes.add(mesh(G.box(0.05, 0.003, 0.14), glow(color, 0.9), { p: [Math.cos(a) * 0.85, 0, Math.sin(a) * 0.85], r: [0, -a, (i % 2 ? 0.4 : -0.4)] }));
    }
    ped.add(runes);
    ped.add(R.haloSprite(color, 2.6, 0.25, [0, 0.1, 0]));
    ped.userData.runes = runes;
    return ped;
  }
  R.createHeroView = function (el, opts) {
    init();
    opts = opts || {};
    const renderer = makeRenderer(el, { alpha: true, maxDpr: 2, exposure: 1.1 });
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(30, 1, 0.1, 100);
    const dist = opts.distance || 7.2;
    camera.position.set(0, 1.5 + (dist - 7.2) * 0.08, dist);
    camera.lookAt(0, opts.lookY || 1.15, 0);
    scene.add(new T.HemisphereLight("#dfe6ff", "#3a3028", 1.2));
    const key = new T.DirectionalLight("#fff0d8", 2.4);
    key.position.set(3, 5, 4);
    scene.add(key);
    const rim = new T.DirectionalLight("#8fb8ff", 1.8);
    rim.position.set(-4, 3, -3);
    scene.add(rim);
    let ped = runePedestal(opts.color || "#bfd8ff");
    scene.add(ped);
    const motes = fireflies(R.rng(3), 26, 1.6, 0.2, 2.6, opts.color || "#bfd8ff");
    motes.material.size = 0.12;
    scene.add(motes);
    let model = null;
    let rotY = 0.35;
    let goalY = 0.35;
    let dragX = null;
    const canvas = renderer.domElement;
    canvas.addEventListener("pointerdown", (e) => {
      dragX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (dragX == null) return;
      goalY += (e.clientX - dragX) * 0.012;
      dragX = e.clientX;
    });
    canvas.addEventListener("pointerup", () => (dragX = null));
    canvas.addEventListener("pointercancel", () => (dragX = null));
    let raf = 0;
    let last = performance.now();
    function resize() {
      const w = Math.max(1, el.clientWidth);
      const h = Math.max(1, el.clientHeight);
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = w + "px";
      renderer.domElement.style.height = h + "px";
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      rotY += (goalY - rotY) * Math.min(1, dt * 8);
      if (model) {
        model.obj.rotation.y = rotY;
        model.update(dt);
      }
      ped.userData.runes.rotation.y += dt * 0.3;
      motes.userData.update(now / 1000, 0.8);
      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);
    return {
      set(desc, celebrate) {
        if (model) scene.remove(model.obj);
        model = R.buildFighter(desc);
        scene.add(model.obj);
        const box3 = new T.Box3().setFromObject(model.obj);
        const hgt = box3.max.y - box3.min.y;
        const s = hgt > 2.6 ? 2.6 / hgt : 1;
        model.obj.scale.multiplyScalar(s);
        if (desc.realm && SB.data.REALMS[desc.realm]) {
          const c = SB.data.REALMS[desc.realm].accent;
          scene.remove(ped);
          ped = runePedestal(c);
          scene.add(ped);
          motes.material.color.set(c);
        }
        if (celebrate) model.play("victory", 1.1);
      },
      play(name, dur) {
        if (model) model.play(name, dur);
      },
      dispose() {
        cancelAnimationFrame(raf);
        ro.disconnect();
        killRenderer(renderer);
      },
    };
  };

  const HOME_SPOTS = { lager: [-2.0, -1.4, 0], herd: [0.2, -2.3, 0], truhe: [-2.3, 0.9, PI / 2], staender: [2.3, -1.6, -0.4], altar: [2.4, 0.6, -PI / 2], kessel: [1.4, 1.4, 0], trophaeen: [-2.8, 0.5, PI / 2] };

    function build() {

      const floorM = tier === 0 ? pm("fur", "#4a5a3a") : tier === 3 ? pm("stone", "#5a564e") : pm("wood", "#5a4130");
      room.add(mesh(G.cyl(4.2, 4.4, 0.3, tier === 3 ? 12 : 4), floorM, { p: [0, -0.15, 0], r: [0, tier === 3 ? 0 : PI / 4, 0], s: tier === 3 ? 1 : [1.0, 1, 0.8] }));
